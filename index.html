.muted { color: var(--ink-2); }

/* ---------- Grundlayout ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 52px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 600; white-space: nowrap; min-width: 0; }
.brand svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.brand .light { font-weight: 500; color: var(--ink-2); }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.sidebar {
  position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); height: calc(100vh - 52px - env(safe-area-inset-top, 0px)); overflow: auto;
  display: flex; flex-direction: column; gap: 12px; padding: 14px;
  background: var(--surface); border-right: 1px solid var(--line);
}
.main { padding: 24px clamp(16px, 3vw, 36px) 72px; min-width: 0; }
/* Vergleich nutzt die volle Breite (breite Tabelle), Einzelansicht bleibt lesbar begrenzt und mittig */
.view { max-width: 1600px; margin-inline: auto; }
.view-compare { max-width: none; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--surface);
  font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; font-size: 13px; }
.linkbtn:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
body.hosted .needs-print, body.hosted .needs-theme, body.no-downloads .needs-download { display: none !important; }

/* ---------- Sidebar ---------- */
.side-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.side-actions .btn { padding: 0 6px; }
.navitem {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: 8px; border: 0; background: transparent;
  text-align: left; cursor: pointer; font-weight: 600;
}
.navitem .count { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface-3); border-radius: 999px; padding: 0 8px; }
.navitem:hover { background: var(--surface-2); }
.navitem.active { background: var(--accent-wash); color: var(--accent-ink); }
.navitem.sub { padding: 6px 10px; font-weight: 500; font-size: 13.5px; }
.navitem .vdot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--vc); }
.menue-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Menü links: Gruppen zum Auf- und Zuklappen */
.menue-gruppe { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.menue-gruppe:last-child { border-bottom: 0; }
.menue-gruppe > summary { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 8px; font-size: 13px; font-weight: 650; cursor: pointer; list-style: none; user-select: none; }
.menue-gruppe > summary::-webkit-details-marker { display: none; }
.menue-gruppe > summary svg { width: 17px; height: 17px; flex: none; color: var(--accent); }
.menue-gruppe > summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
.menue-gruppe[open] > summary::after { transform: rotate(45deg); }
.menue-gruppe > summary:hover { background: var(--surface-2); }
.menue-gruppe > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.menue-inhalt { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 0 4px; }
.menue-nav { display: flex; flex-direction: column; gap: 1px; }
.menue-label { margin: 6px 10px 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.menue-knopf { padding: 0 8px; margin-left: -6px; }
.menue-zu .layout { grid-template-columns: minmax(0, 1fr); }
.menue-zu .sidebar { display: none; }
.icon-btn { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.side-foot { padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.notice { font-size: 12px; color: var(--crit-ink); }

/* ---------- Chips, Tags, Badges ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
}
button.tag { cursor: pointer; }
.tag-crit { border-color: color-mix(in srgb, var(--s-crit) 45%, transparent); color: var(--crit-ink); background: color-mix(in srgb, var(--s-crit) 9%, var(--surface)); }
.tag-warn { border-color: color-mix(in srgb, var(--s-warn) 60%, transparent); color: var(--warn-ink); background: color-mix(in srgb, var(--s-warn) 12%, var(--surface)); }
.tag-good { border-color: color-mix(in srgb, var(--s-good) 45%, transparent); color: var(--good-ink); background: color-mix(in srgb, var(--s-good) 9%, var(--surface)); }
.st {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; vertical-align: 1px;
}
.st:hover { border-color: var(--line-2); color: var(--ink); }
.st i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--st); }
.st.compact { width: 18px; padding: 0; justify-content: center; border-color: transparent; background: transparent; }
.st.compact:hover { background: var(--surface-3); }
.st-inseratsangabe { --st: var(--c-yellow); }
.st-dokumentiert { --st: var(--c-blue); }
.st-unabhaengig_bestaetigt { --st: var(--c-green); }
.st-berechnet { --st: var(--c-violet); }
.st-annahme { --st: var(--c-orange); }
.st-widerspruechlich { --st: var(--s-crit); }
.st-nicht_anwendbar { --st: var(--line-2); }
.st-unbekannt i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.ref {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink);
  font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace; cursor: pointer;
}
.ref:hover { border-color: var(--accent); }
.ref.broken { color: var(--crit-ink); border-color: color-mix(in srgb, var(--s-crit) 50%, transparent); text-decoration: line-through; }
.refs { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; }
.id { font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-2); background: var(--surface-3); padding: 3px 6px; border-radius: 5px; }

.verdict { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.verdict .vi { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--vc); color: #fff; font-size: 12px; font-weight: 700; }
.verdict.big { font-size: 22px; gap: 10px; line-height: 1.25; }
.verdict.big .vi { width: 32px; height: 32px; font-size: 17px; }
.verdict.sm { font-size: 12.5px; font-weight: 500; gap: 6px; }
.verdict.sm .vi { width: 16px; height: 16px; font-size: 10px; }
.v-good { --vc: var(--s-good); }
.v-warn { --vc: var(--s-warn); }
.v-warn .vi { color: #3a2a00; }
.v-serious { --vc: var(--s-serious); }
.v-crit { --vc: var(--s-crit); }
.v-none { --vc: var(--muted); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.sev i { width: 9px; height: 9px; border-radius: 2px; background: var(--vc); }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; vertical-align: -1px; }
.meter i { width: 4px; border-radius: 1px; background: var(--surface-3); }
.meter i:nth-child(1) { height: 6px; }
.meter i:nth-child(2) { height: 9px; }
.meter i:nth-child(3) { height: 12px; }
.meter.m1 i:nth-child(1), .meter.m2 i:nth-child(-n+2), .meter.m3 i { background: var(--accent); }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.null { color: var(--muted); }
.scen { font-size: 12px; color: var(--ink-2); font-style: italic; border-bottom: 1px dotted var(--line-2); cursor: help; }
.neg { color: var(--crit-ink); }

/* ---------- Karten & Sektionen ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .card-sub { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-2); }
.sec { margin-top: 32px; scroll-margin-top: 112px; }
.sec > h2 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: 26px; }
.sub { margin: 2px 0 0; color: var(--ink-2); }
.eyebrow { font-size: 11.5px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.callout { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.empty { padding: 16px 18px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--ink-2); font-size: 13.5px; }
.empty b { color: var(--ink); font-weight: 600; }

/* ---------- Detail-Kopf ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.crumbs .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.dh-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 8px; }
.dh-main { min-width: 0; flex: 1 1 520px; }
.dh-main h1 { margin: 0; font-size: 25px; line-height: 1.25; }
.num { color: var(--muted); font-weight: 500; }
.dh-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.meta { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; }
.meta .muted { font-size: 11.5px; }
.revnote { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; font-size: 13px; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.subnav {
  position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 20;
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  margin: 18px calc(-1 * clamp(16px, 3vw, 36px)) 0; padding: 8px clamp(16px, 3vw, 36px);
  background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.subnav::-webkit-scrollbar { display: none; }
.subnav button { flex: none; border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.subnav button:hover { background: var(--surface-3); color: var(--ink); }

/* ---------- Urteil ---------- */
.verdict-card { border-top: 4px solid var(--vc); }
.vc-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start; }
.vc-head .eyebrow { margin-bottom: 6px; }
.lead { font-size: 15px; line-height: 1.55; margin: 14px 0 0; max-width: 78ch; }
.teil-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; margin-top: 18px; }
.teil { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.teil-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.teil-title { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.teil-urteil { font-weight: 600; line-height: 1.35; }
.teil-text { margin: 0; font-size: 13px; color: var(--ink-2); }
.open-points { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.open-points ol { margin: 6px 0 0; padding-left: 20px; }
.open-points li { margin: 3px 0; }

/* ---------- Kennzahlen-Kacheln ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 188px), 1fr)); gap: 10px; margin-top: 14px; }
.tiles.stats { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-height: 98px; box-shadow: var(--shadow); }
.tile-label { font-size: 12.5px; color: var(--ink-2); }
.tile-value { font-size: 21px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.tile-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.stat .tile-value { font-size: 28px; }

/* ---------- Schlüssel/Wert-Listen ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 0 28px; margin: 0; }
.kv-row { display: grid; grid-template-columns: minmax(110px, 44%) 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.kv-row dt { color: var(--ink-2); font-size: 13px; }
.kv-row dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.kv-row.long { grid-column: 1 / -1; grid-template-columns: 1fr; gap: 3px; }
.kv-row.long dd { display: block; }
.kv-row.long dd p { margin: 0 0 4px; max-width: 90ch; }
.kv-row.long dd ul { margin: 0; padding-left: 18px; }
.kv-title { font-size: 13px; font-weight: 600; margin: 18px 0 2px; color: var(--ink); }
.kv-title:first-child { margin-top: 0; }

/* ---------- Tabellen ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th, .t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.t thead th { font-weight: 600; color: var(--ink-2); font-size: 12px; background: var(--surface-2); white-space: nowrap; }
.t tbody tr:last-child td { border-bottom: 0; }
.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t .nowrap { white-space: nowrap; }
.t tr.clickable { cursor: pointer; }
.t tr.clickable:hover td { background: var(--accent-wash); }
.t tr.excluded td { color: var(--muted); }
.t tr.strong td { font-weight: 600; }
.t th.sortable { cursor: pointer; user-select: none; }
.t th.sortable:hover { color: var(--ink); }
.t th .arrow { color: var(--accent); }
/* Tabellen mit festem Kopf: eigener Scrollbereich in Fensterhöhe, Kopfzeile bleibt oben stehen */
.table-wrap.fest { max-height: calc(100vh - 52px - 32px); overflow: auto; overscroll-behavior: contain; }
.table-wrap.fest .t thead th { position: sticky; top: 0; z-index: 2; box-shadow: inset 0 -1px 0 var(--line); }
.table-wrap.fest .cmp-table thead th:nth-child(3) { z-index: 3; box-shadow: inset 0 -1px 0 var(--line), 1px 0 0 var(--line); }
/* Überschriften der Vergleichstabelle: Beschriftung sortiert, Trichter öffnet das Spaltenmenü (src/oberflaeche/spaltenfilter.js) */
.cmp-table th.sortable { cursor: default; }
.cmp-table .th-kopf { display: flex; align-items: flex-end; gap: 3px; }
.cmp-table th.num .th-kopf { justify-content: flex-end; }
.th-sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: inherit; line-height: inherit; cursor: pointer; }
.th-sort:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.th-filter { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; margin: 0 -2px -3px 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
.th-filter:hover, .th-filter[aria-expanded="true"] { background: var(--surface-3); color: var(--ink); }
.th-filter.aktiv { background: var(--accent); color: #fff; }
.th-filter.aktiv svg path { fill: currentColor; }
.cmp-table th.gefiltert .th-sort { color: var(--accent-ink); }
.th-sort:focus-visible, .th-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.spaltenmenue:not([hidden]) { position: fixed; z-index: 250; width: min(320px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); box-shadow: 0 8px 28px rgba(0, 0, 0, .2); font-size: 13px; }
.sm-kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.sm-titel { margin-bottom: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.sm-sort { display: flex; flex-wrap: wrap; gap: 6px; }
.sm-sort .btn.on { border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); }
.sm-bereich { display: flex; align-items: flex-end; gap: 8px; }
.sm-feld { display: flex; flex: 1; flex-direction: column; gap: 3px; min-width: 0; font-size: 12px; color: var(--ink-2); }
.sm-feld input { width: 100%; min-width: 0; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 13.5px; }
.sm-feld input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.sm-feld input:disabled { opacity: .5; }
.sm-einheit { padding-bottom: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sm-hinweis { margin: 6px 0 0; font-size: 12px; color: var(--ink-2); }
.sm-werte { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; border: 0; }
.sm-werte legend { width: 100%; margin-bottom: 4px; padding: 0; font-size: 12px; color: var(--ink-2); }
.sm-liste { display: flex; flex-direction: column; gap: 7px; max-height: 240px; overflow: auto; }
.sm-liste .check { display: flex; }
.sm-liste .n { margin-left: auto; padding-left: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sm-links { display: flex; gap: 14px; margin-top: 8px; }
.sm-fuss { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.sm-anzahl { font-size: 12.5px; color: var(--ink-2); }
.sf-leiste { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 12px; }
.sf-leiste .lbl { margin-right: 2px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.sf-chip { display: inline-flex; align-items: stretch; max-width: 100%; min-height: 30px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-wash); color: var(--accent-ink); font-size: 12.5px; overflow: hidden; }
.sf-chip-text { padding: 4px 4px 4px 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.sf-chip-x { width: 28px; flex: none; border: 0; background: none; color: inherit; font-size: 15px; cursor: pointer; }
.sf-chip-text:hover, .sf-chip-x:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.t td.cell-obj { min-width: 200px; }
.t .obj-title { font-weight: 600; line-height: 1.35; }
.t .obj-sub { font-size: 12px; color: var(--ink-2); }
.t .scen { display: block; font-size: 11.5px; }
.cmp-table th:first-child, .cmp-table td:first-child { width: 34px; padding-right: 0; }
.cmp-table thead th, .cmp-table thead th.num { white-space: normal; vertical-align: bottom; line-height: 1.3; }
.cmp-table td.cell-urteil { min-width: 150px; }
.cmp-table th, .cmp-table td { padding-left: 8px; padding-right: 8px; }
/* Zusätze wie „strittig · W1“ oder Szenariowerte brechen in eine zweite Zeile um, statt die Spalte zu verbreitern */
.cmp-table td.num { white-space: normal; }
.cmp-table td.num .val { white-space: nowrap; }
.cmp-table .scen { white-space: normal; }
/* Objektspalte bleibt beim seitlichen Scrollen auf schmaleren Bildschirmen stehen */
.cmp-table td.cell-obj, .cmp-table thead th:nth-child(3) { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
.cmp-table td.cell-obj { background: var(--surface); }
.cmp-table thead th:nth-child(3) { background: var(--surface-2); }
.cmp-table tr.clickable:hover td.cell-obj { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.cmp-table .verdict.sm { align-items: flex-start; }
.cmp-table .verdict.sm .vi { margin-top: 1px; }

/* Gegenüberstellung */
.matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.matrix th, .matrix td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 190px; }
.matrix thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; vertical-align: bottom; }
.matrix th.rowhead { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 170px; max-width: 220px; font-weight: 500; color: var(--ink-2); }
.matrix thead th.rowhead { background: var(--surface-2); z-index: 3; }
.matrix tr.group th { background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.matrix tr.diff th.rowhead::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--s-warn); margin-right: 6px; vertical-align: 2px; }
.matrix td .val { font-variant-numeric: tabular-nums; }
.mh-title { font-weight: 600; color: var(--ink); line-height: 1.3; }
.mh-title button { text-align: left; }

/* ---------- Listen: Widersprüche, Risiken, Schritte ---------- */
.item { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface); box-shadow: var(--shadow); scroll-margin-top: 120px; }
.item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.item-head .title { font-weight: 600; }
details.item > summary { cursor: pointer; list-style: none; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::before { content: "▸"; color: var(--muted); display: inline-block; width: 12px; transition: transform .15s; }
details.item[open] > summary::before { transform: rotate(90deg); }
details.item .kr { margin-left: auto; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.callout.warn { background: color-mix(in srgb, var(--s-warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--s-warn) 55%, transparent); }
.item p { margin: 8px 0 0; max-width: 95ch; }
.item .lbl { color: var(--ink-2); font-size: 12.5px; }
.item .t { margin-top: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.step-prio { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-weight: 700; }
.step-prio.p2 { background: var(--ink-2); }
.step-prio.p3, .step-prio.p4, .step-prio.p5 { background: var(--surface-3); color: var(--ink); }
.step dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 13px; }
.step dt { color: var(--ink-2); }
.step dd { margin: 0; }

/* Energieskala */
.escale { margin-top: 14px; }
.escale-bar { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; position: relative; }
.escale-bar span { height: 26px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--fg); background: var(--bg); border-radius: 3px; opacity: .55; }
.escale-bar span:first-child { border-radius: 6px 3px 3px 6px; }
.escale-bar span:last-child { border-radius: 3px 6px 6px 3px; }
.escale-bar span.on { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
.escale-marker { position: relative; height: 26px; margin-top: 4px; font-size: 11.5px; color: var(--ink-2); }
.escale-marker i { position: absolute; top: 0; width: 2px; height: 9px; background: var(--ink); transform: translateX(-1px); }
.escale-marker b { position: absolute; top: 10px; transform: translateX(-50%); white-space: nowrap; font-weight: 500; }
.escale-ticks { display: grid; grid-template-columns: repeat(9, 1fr); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* Prüfung */
.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issue { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: baseline; font-size: 13px; }
.issue .ico { font-weight: 700; text-align: center; }
.issue.error .ico { color: var(--crit-ink); }
.issue.warn .ico { color: var(--warn-ink); }
.issue.info .ico { color: var(--accent-ink); }
.issue code { margin-right: 6px; }
.flags { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.flag { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
.flag b { width: 20px; text-align: center; }
.issue-btn.error { color: var(--crit-ink); }
.issue-btn.warn { color: var(--warn-ink); }
.issue-btn.ok { color: var(--good-ink); }

/* Rohdaten */
details.raw summary { cursor: pointer; font-weight: 600; }
details.raw pre { margin: 12px 0 0; padding: 14px; max-height: 560px; overflow: auto; background: var(--surface-2); border-radius: 8px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; }

/* Vergleich: Reiter, Ortsfilter, Preisübersicht, Auswahl */
.cmp-tabs { display: flex; gap: 2px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.cmp-tabs::-webkit-scrollbar { display: none; }
.cmp-tab { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.cmp-tab:hover { color: var(--ink); }
.cmp-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.cmp-tab .count { font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface-3); border-radius: 999px; padding: 0 7px; }
.ort-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 14px; }
.ort-filter .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-right: 4px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; cursor: pointer; }
.chip-btn:hover { background: var(--surface-2); }
.chip-btn .n { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip-btn.on .n { color: rgba(255, 255, 255, .8); }
.price-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(380px, 2fr); gap: 14px; align-items: start; }
.card-pad { padding: 16px 18px 4px; }
.t.vals td.num { white-space: normal; }
.t.vals td.num .val { white-space: nowrap; }
.t.vals .scen { white-space: normal; }
.pick-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 8px; }
.pick-item { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 13px; }
.pick-item:hover { background: var(--surface-2); }
.pick-item.on { border-color: var(--accent); background: var(--accent-wash); }
.pick-item input { margin-top: 2px; }
.pick-text { display: flex; flex-direction: column; min-width: 0; }
.pick-title { font-weight: 600; line-height: 1.35; }
.pick-sub { font-size: 12px; color: var(--ink-2); }
@media (max-width: 1300px) { .price-grid { grid-template-columns: minmax(0, 1fr); } }

/* Filter */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 12px; }
.filters input[type="search"], .filters select { height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 10px; font-size: 13.5px; }
.filters input[type="search"] { flex: 1 1 260px; min-width: 0; }

/* ---------- Diagramme ---------- */
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--ink-2); font-size: 11.5px; }
.chart .lbl { fill: var(--ink); font-size: 12px; }
.chart .lbl2 { fill: var(--ink-2); font-size: 11.5px; }
.chart .val { fill: var(--ink); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chart .dot { fill: var(--c-blue); stroke: var(--surface); stroke-width: 2; }
.chart .dot.hollow { fill: var(--surface); stroke: var(--c-blue); stroke-width: 2; }
.chart .dot.excl { fill: var(--muted); opacity: .7; }
.chart .subject { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.chart .rangeline { stroke: var(--c-blue); stroke-width: 2; stroke-linecap: round; opacity: .55; }
.chart .rangeline.ink { stroke: var(--ink); }
.chart .rangebox { fill: var(--accent-wash); }
.chart .range-bar { fill: var(--range); }
.chart .marker { stroke: var(--ink); stroke-width: 1.5; }
.chart .refline { stroke: var(--ink); stroke-width: 1; opacity: .3; }
.chart .dot.limit { fill: var(--c-orange); }
.chart .bar-pos { fill: var(--pos); }
.chart .bar-neg { fill: var(--neg); }
.chart .hit { fill: transparent; stroke: transparent; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend svg { flex: none; }
.chart-note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }

/* ---------- Startseite ---------- */
.start { max-width: 920px; margin: 4vh auto 0; }
.drop { text-align: center; padding: 44px 24px; border: 2px dashed var(--line-2); border-radius: 18px; background: var(--surface); cursor: pointer; }
.drop:hover { border-color: var(--accent); }
.drop svg { width: 46px; height: 46px; color: var(--accent); }
.drop h1 { font-size: 24px; margin: 12px 0 6px; }
.drop p { margin: 0 auto; max-width: 60ch; color: var(--ink-2); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0 14px; }
.fine { font-size: 12.5px; color: var(--ink-2); }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; margin-top: 18px; }
.feature { padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.feature b { display: block; margin-bottom: 4px; }
.feature p { margin: 0; font-size: 13px; color: var(--ink-2); }
.flow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; font-size: 13px; color: var(--ink-2); }
.flow span.box { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }

/* ---------- Overlays ---------- */
.drop-overlay { position: fixed; inset: 0; z-index: 200; display: none; place-items: center; background: color-mix(in srgb, var(--accent) 12%, transparent); backdrop-filter: blur(2px); }
body.dragging .drop-overlay { display: grid; }
.drop-overlay div { padding: 28px 40px; border: 2px dashed var(--accent); border-radius: 16px; background: var(--surface); font-weight: 600; font-size: 18px; pointer-events: none; }
.tooltip { position: fixed; z-index: 300; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 7px; max-width: 340px; white-space: pre-line; opacity: 0; transition: opacity .08s; }
.tooltip.show { opacity: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(680px, calc(100vw - 32px)); max-height: min(84vh, 800px); box-shadow: 0 24px 70px rgba(0, 0, 0, .28); }
dialog::backdrop { background: rgba(10, 10, 10, .38); }
.dlg { padding: 20px 22px 22px; }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.dlg-head h3 { margin: 0; font-size: 17px; }
.dlg dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
.dlg dt { color: var(--ink-2); }
.dlg dd { margin: 0; overflow-wrap: anywhere; }
.dlg textarea { width: 100%; min-height: 260px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; }
.dlg .sublist { margin: 0; padding-left: 18px; }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* ---------- Persönliche Profile und Berechnung mit dem Profil ---------- */
.side-ordner { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.side-ordner > .btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; }
.side-ordner .fine { margin: 0; }
.side-ordner-kopf { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
.side-ordner-kopf b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-ordner-aktionen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.side-profil { display: flex; flex-direction: column; gap: 4px; padding: 8px 0 4px; border-bottom: 1px solid var(--line); }
.side-profil-aktiv { font-size: 12px; color: var(--ink-2); margin: 0 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.feld-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px 16px; margin: 12px 0; }
.feld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feld.breit { grid-column: 1 / -1; }
.feld > label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.feld input[type="text"], .feld select, .p-inline select, .p-anp input, .p-begr, .p-var-name, .p-inline input {
  height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 10px; font-size: 13.5px; min-width: 0; width: 100%; }
.feld input:focus-visible, .feld select:focus-visible, .p-anp input:focus-visible, .p-inline input:focus-visible, .p-inline select:focus-visible, .p-begr:focus-visible, .p-var-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.inp-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.inp-wrap input.mit-einheit { padding-right: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.inp-einheit { position: absolute; right: 10px; font-size: 12px; color: var(--muted); pointer-events: none; white-space: nowrap; }
.feld-hilfe { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.feld-fehler { font-size: 12px; color: var(--crit-ink); font-weight: 600; line-height: 1.4; }
.hat-fehler input, .hat-fehler select, input.fehlerhaft, [aria-invalid="true"] { border-color: var(--s-crit) !important; background: color-mix(in srgb, var(--s-crit) 6%, var(--surface)) !important; }
.feld .check { font-weight: 500; color: var(--ink); align-items: flex-start; }
.feld .check input { margin-top: 3px; }
.feld-mit-aktion { display: flex; align-items: flex-end; gap: 6px; }
.feld-mit-aktion .feld { flex: 1; }
.feld-mit-aktion .icon-btn { margin-bottom: 4px; }
.p-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; margin-bottom: 16px; }
.p-karte { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.p-karte.aktiv { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.p-karte-kopf { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.p-karte-sub { font-size: 12.5px; color: var(--ink-2); min-height: 0; }
.p-karte-sub:empty { display: none; }
.p-karte-aktionen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.p-editor-kopf { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.p-editor-kopf > .feld { flex: 1 1 320px; max-width: 520px; }
.p-editor-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.p-editor .cmp-tabs { margin-top: 16px; }
.p-editor-raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 20px; margin-top: 8px; align-items: start; }
.p-editor-seite { position: sticky; top: 120px; display: flex; flex-direction: column; gap: 12px; }
.p-seite-block { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
.p-seite-block .eyebrow { margin-bottom: 6px; }
.p-zeile-kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.p-zeile-kv:last-child { border-bottom: 0; }
.p-zeile-kv > span:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.p-zeile-kv.summe { border-top: 1px solid var(--line-2); border-bottom: 0; margin-top: 4px; padding-top: 6px; }
.p-zeile-kv.standard > span:first-child::after { content: " · Standardwert"; color: var(--muted); font-size: 11.5px; }
.p-zwischen { font-weight: 600; margin-top: 6px; }
.p-luecken { margin-top: 8px; font-size: 12px; color: var(--warn-ink); display: flex; flex-direction: column; gap: 2px; }
.p-person { border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px 2px; margin: 12px 0; }
.p-person legend { font-weight: 600; font-size: 13.5px; padding: 0 6px; }
.p-zwischentitel { font-size: 14px; margin: 20px 0 4px; }
.p-zeile { align-items: end; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.modus-karten { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; margin: 12px 0; }
.modus-karte { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; cursor: pointer; background: var(--surface); }
.modus-karte:hover { background: var(--surface-2); }
.modus-karte.aktiv { border-color: var(--accent); background: var(--accent-wash); }
.modus-karte input { margin-top: 3px; flex: none; }
.modus-karte > span { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.p-persistenz { margin-top: 16px; }
.p-persistenz .fine { margin: 6px 0 10px; }
.modus-schalter { display: inline-flex; margin: 14px 0 4px; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--line); max-width: 100%; }
.modus-schalter button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.modus-schalter button.aktiv { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.modus-schalter button:focus-visible, .modus-karte:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.p-banner { margin-top: 12px; border-left: 3px solid var(--accent); }
.p-banner-zeile { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 8px 0 10px; }
.p-inline { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); flex-wrap: wrap; }
.p-inline select { width: auto; max-width: 320px; font-weight: 500; color: var(--ink); }
.p-inline .inp-wrap { width: 130px; }
.p-kein-profil { margin-top: 14px; }
.p-einordnung { margin-top: 12px; }
.p-einordnung ul { margin: 8px 0 0; padding-left: 18px; }
.p-offen { margin-top: 14px; }
.p-offen-gruppe { margin-top: 6px; line-height: 1.7; }

<script>/* src/rechenkern/basis.js */
/*
 * ImmoInvest Rechenkern – Grundfunktionen
 * Geldrundung, Prozentumrechnung, Zahlenprüfung, Monatsrechnung, Prüfsumme.
 *
 * Alle Dateien unter src/rechenkern/ sind zugleich klassische Browser-Skripte (auch per file://)
 * und CommonJS-Module für die Node-Tests. Sie greifen weder auf das DOM noch auf das Netz zu.
 */
(function (root) {
  'use strict';

  const istZahl = v => typeof v === 'number' && Number.isFinite(v);

  /** Kaufmännisch auf Cent runden (halber Cent vom Nullpunkt weg); toPrecision fängt Binärfehler wie 1.005 ab. */
  function cent(x) {
    if (!istZahl(x)) return x;
    const r = Math.round(Number((Math.abs(x) * 100).toPrecision(15))) / 100;
    return x < 0 && r !== 0 ? -r : r;
  }

  /** Prozentwert aus dem Dateiformat (4.5 = 4,5 %) in einen Dezimalwert (0.045) umrechnen. */
  const dezimal = prozent => prozent / 100;

  const summe = liste => liste.reduce((a, b) => a + (istZahl(b) ? b : 0), 0);

  /** „YYYY-MM“ prüfen und in einen fortlaufenden Monatsindex umrechnen (Jahr · 12 + Monat − 1). */
  function monatIndex(text) {
    const m = /^(\d{4})-(0[1-9]|1[0-2])$/.exec(String(text ?? ''));
    return m ? Number(m[1]) * 12 + Number(m[2]) - 1 : null;
  }
  const monatAusIndex = i => ({ jahr: Math.floor(i / 12), monat: (i % 12) + 1 });
  const monatText = i => { const { jahr, monat } = monatAusIndex(i); return `${jahr}-${String(monat).padStart(2, '0')}`; };

  /** Nicht negative Zahl oder null? Liefert eine verständliche Fehlermeldung oder null. */
  function pruefeBetrag(v, { min = 0, max = Infinity, erlaubeNull = true } = {}) {
    if (v === null || v === undefined) return erlaubeNull ? null : 'Angabe fehlt.';
    if (!istZahl(v)) return 'Bitte eine Zahl eingeben.';
    if (v < min) return min === 0 ? 'Der Wert darf nicht negativ sein.' : `Der Wert muss mindestens ${min} betragen.`;
    if (v > max) return `Der Wert darf höchstens ${max} betragen.`;
    return null;
  }

  /* SHA-256 für Inhaltsfingerabdrücke (FIPS 180-4), ohne externe Abhängigkeit und ohne Secure Context. */
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  function sha256(text) {
    const bytes = new TextEncoder().encode(text);
    const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total);
    buf.set(bytes);
    buf[len] = 0x80;
    const bits = len * 8;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 8, Math.floor(bits / 0x100000000));
    dv.setUint32(total - 4, bits >>> 0);
    const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Uint32Array(64);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }

      h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
    }

  }

  /** Kanonisches JSON (Schlüssel sortiert) – Grundlage für reproduzierbare Fingerabdrücke. */
  function kanonisch(wert) {
    if (Array.isArray(wert)) return '[' + wert.map(kanonisch).join(',') + ']';
    if (wert && typeof wert === 'object') return '{' + Object.keys(wert).sort().map(k => JSON.stringify(k) + ':' + kanonisch(wert[k])).join(',') + '}';
    return JSON.stringify(wert === undefined ? null : wert);
  }
  const fingerabdruck = wert => 'sha256:' + sha256(kanonisch(wert));

  function neueId(praefix) {
    const zufall = typeof crypto !== 'undefined' && crypto.getRandomValues
      ? Array.from(crypto.getRandomValues(new Uint32Array(2)), n => n.toString(36)).join('')
      : Math.random().toString(36).slice(2) + Date.now().toString(36);
    return `${praefix}-${zufall.slice(0, 10)}`;
  }

  /** Geldbetrag als deutscher Anzeigetext für Hinweise: 5.000 € bzw. 539,20 €. */
  const DE_GANZ = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
  const DE_CENT = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      return { regel: R.TARIFE[juengstes], fortgeschrieben: true, hinweis: `Tarif ${juengstes} für ${jahr} unverändert fortgeschrieben – Annahme, keine Aussage über künftiges Recht.` };

        const gewinn = p.gewinn_selbststaendig_eur || 0;

      gemeinsam.push({ posten: sonder !== null ? 'Sonderausgaben (Eingabe, je Person zur Hälfte)' : 'Sonderausgaben-Pauschbetrag je Person (§ 10c EStG)', betrag: -(sonder !== null ? sonder : sonderPauschal * anzahl), art: 'abzug', herkunft: sonder !== null ? 'eingabe' : 'gesetzlicher_standard' });

/*
 * ImmoInvest Rechenkern – Annuitätendarlehen und Tilgungsplan
 *
 * Rundungsstrategie: Die konstante Monatsrate wird einmal je Konditionsphase kaufmännisch auf Cent gerundet.
 * Zinsen, Tilgung und Restschuld werden intern ungerundet geführt; erst ausgewiesene Ergebnisse werden gerundet.
 * Zahlung jeweils am Monatsende: Zins = Restschuld zu Monatsbeginn × Sollzins / 12.
 * Sondertilgungen werden zum Ende jedes vollen Darlehensjahres (Monat 12, 24, …) nach der Rate verrechnet.
 * Ohne Anschlussannahme endet die modellierte Konditionsphase mit der Zinsbindung.

  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;

  /** Anfängliche Monatsrate = Darlehen × (Sollzins + anfängliche Tilgung) / 12, auf Cent gerundet. */
  function monatsrate(darlehen, sollzinsProzent, tilgungProzent) {
    return B.cent(darlehen * (B.dezimal(sollzinsProzent) + B.dezimal(tilgungProzent)) / 12);
  }

  /** Prüft eine Kondition fachlich; liefert Fehlermeldungen je Feld. */
  function pruefeKondition(k) {
    const f = {};
    if (!B.istZahl(k.sollzins_prozent)) f.sollzins_prozent = 'Sollzins fehlt.';
    else if (k.sollzins_prozent < 0 || k.sollzins_prozent > 30) f.sollzins_prozent = 'Sollzins muss zwischen 0 und 30 % liegen.';
    const hatTilgung = B.istZahl(k.tilgung_prozent), hatRate = B.istZahl(k.monatsrate_eur);
    if (!hatTilgung && !hatRate) f.tilgung_prozent = 'Anfängliche Tilgung oder feste Monatsrate angeben.';
    if (hatTilgung && (k.tilgung_prozent < 0 || k.tilgung_prozent > 100)) f.tilgung_prozent = 'Tilgung muss zwischen 0 und 100 % liegen.';
    if (hatRate && k.monatsrate_eur < 0) f.monatsrate_eur = 'Monatsrate darf nicht negativ sein.';
    if (!B.istZahl(k.zinsbindung_jahre) || k.zinsbindung_jahre <= 0 || k.zinsbindung_jahre > 40) f.zinsbindung_jahre = 'Zinsbindung in Jahren (größer 0, höchstens 40) angeben.';
    if (B.monatIndex(k.beginn) === null) f.beginn = 'Beginn als Monat (JJJJ-MM) angeben.';
    if (B.istZahl(k.sondertilgung_jahr_eur) && k.sondertilgung_jahr_eur < 0) f.sondertilgung_jahr_eur = 'Sondertilgung darf nicht negativ sein.';
    if (k.anschluss) {
      if (!B.istZahl(k.anschluss.sollzins_prozent) || k.anschluss.sollzins_prozent < 0) f['anschluss.sollzins_prozent'] = 'Anschlusszins angeben oder Anschluss entfernen.';
      if (k.anschluss.regel === 'neue_tilgung' && !B.istZahl(k.anschluss.tilgung_prozent)) f['anschluss.tilgung_prozent'] = 'Neue Tilgung für die Anschlussphase angeben.';
    }
    if (B.istZahl(k.gebuehren_eur) && k.gebuehren_eur < 0) f.gebuehren_eur = 'Gebühren dürfen nicht negativ sein.';
    return f;
  }

  /**
   * Monatlicher Tilgungsplan.
   * @param {object} p darlehen, sollzins_prozent, tilgung_prozent | monatsrate_eur, zinsbindung_monate,
   *                   horizont_monate, sondertilgung_jahr_eur, anschluss {sollzins_prozent, regel, tilgung_prozent}
   * @returns {{monate: object[], rate: number, rate_anschluss: number|null, modelliert_bis: number, getilgt_im_monat: number|null, hinweise: string[]}}

    const hinweise = [];

    if (!p.anschluss && horizont > bindung) hinweise.push('Nach Ende der Zinsbindung ist keine Anschlusskondition festgelegt; spätere Jahre sind nicht modelliert.');
    const res = { monate: [], rate: 0, rate_anschluss: null, modelliert_bis: ende, getilgt_im_monat: null, hinweise };
    if (!(L > 0)) {
      for (let m = 1; m <= ende; m++) res.monate.push({ monat: m, zins: 0, tilgung: 0, sondertilgung: 0, zahlung: 0, restschuld: 0, phase: m <= bindung ? 'bindung' : 'anschluss' });
      if (L === 0) hinweise.push('Kein Darlehen erforderlich.');

    }
    let i = B.dezimal(p.sollzins_prozent) / 12;
    let rate = B.istZahl(p.monatsrate_eur) ? B.cent(p.monatsrate_eur) : monatsrate(L, p.sollzins_prozent, p.tilgung_prozent);
    res.rate = rate;
    if (B.istZahl(p.tilgung_prozent) && p.tilgung_prozent === 0 && !B.istZahl(p.monatsrate_eur)) hinweise.push('Tilgungsfrei: Die Rate deckt nur die Zinsen, die Restschuld sinkt nicht.');

<script>/* src/rechenkern/afa.js */
/*
 * ImmoInvest Rechenkern – Gebäude-AfA (Privatvermögen, Vermietung)
 *
 * Bemessungsgrundlage = Gebäudeanteil × (Kaufpreis + Zusatzkäufe + Anschaffungsnebenkosten) + Herstellungskosten.
 * Der Grundstücksanteil wird nie abgeschrieben, ein Darlehen ebenfalls nicht.
 * Satz nach Fertigstellung (§ 7 Abs. 4 EStG); im Erwerbsjahr wird je vollem Vormonat um 1/12 gekürzt (§ 7 Abs. 1 Satz 4).
 * Die Käufer-AfA beginnt mit den eigenen Anschaffungskosten; Jahre seit Fertigstellung verkürzen sie nicht.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;
  const R = nodeModul ? require('./steuerregeln.js') : root.ImmoRechenkern.steuerregeln;

  /** Regulärer Satz nach Fertigstellungsjahr; null bei unbekanntem Jahr. */
  function regelsatz(fertigstellungJahr) {
    if (!B.istZahl(fertigstellungJahr)) return null;
    const stufe = R.AFA.stufen.find(s => (s.ab === null || fertigstellungJahr >= s.ab) && (s.bis === null || fertigstellungJahr <= s.bis));
    return { satz_prozent: stufe.satz, regel: `§ 7 Abs. 4 Satz 1 Nr. 2 Buchst. ${stufe.buchstabe} EStG`, text: stufe.text };
  }

  /**
   * Bemessungsgrundlage. Liefert null-Werte, wenn der Gebäudeanteil unbekannt ist.
   * @param {object} p kaufpreis, zusatzkaeufe, anschaffungsnebenkosten, gebaeudeanteil_prozent, herstellungskosten
   */
  function bemessung(p) {
    const ak = (p.kaufpreis || 0) + (p.zusatzkaeufe || 0) + (p.anschaffungsnebenkosten || 0);
    if (!B.istZahl(p.gebaeudeanteil_prozent)) return { anschaffungskosten: B.cent(ak), gebaeude: null, grundstueck: null, bemessung: null, fehlt: 'Gebäudeanteil unbekannt – bitte als begründete Szenarioannahme setzen.' };
    const gebaeude = ak * B.dezimal(p.gebaeudeanteil_prozent);
    return { anschaffungskosten: B.cent(ak), gebaeude: B.cent(gebaeude), grundstueck: B.cent(ak - gebaeude), bemessung: B.cent(gebaeude + (p.herstellungskosten || 0)), fehlt: null };
  }

  /**
   * AfA je Kalenderjahr ab Beginn bis zur vollen Absetzung.
   * @param {object} p bemessung, satz_prozent, beginn ("YYYY-MM"), bis_jahr
   * @returns {Object<number, number>} Kalenderjahr → AfA (auf Cent)
   */
  function verlauf(p) {
    const out = {};
    const start = B.monatIndex(p.beginn);
    if (!B.istZahl(p.bemessung) || !B.istZahl(p.satz_prozent) || start === null) return out;
    const { jahr: j0, monat: m0 } = B.monatAusIndex(start);
    const voll = p.bemessung * B.dezimal(p.satz_prozent);
    let rest = p.bemessung;
    for (let jahr = j0; jahr <= p.bis_jahr && rest > 1e-9; jahr++) {
      const betrag = Math.min(rest, jahr === j0 ? voll * (13 - m0) / 12 : voll);
      out[jahr] = B.cent(betrag);
      rest -= betrag;
    }
    return out;
  }

  /**
   * Prüfung anschaffungsnaher Herstellungskosten (§ 6 Abs. 1 Nr. 1a): Instandsetzung innerhalb von
   * drei Jahren nach Anschaffung über 15 % der Gebäude-Anschaffungskosten (netto).
   * @param {{betrag: number, monat_nach_erwerb: number}[]} massnahmen
   */
  function anschaffungsnah(massnahmen, gebaeudeAk) {
    const summeDreiJahre = massnahmen.filter(m => m.monat_nach_erwerb < R.ANSCHAFFUNGSNAH.jahre * 12).reduce((a, m) => a + m.betrag, 0);
    if (!B.istZahl(gebaeudeAk)) return { geprueft: false, summe: B.cent(summeDreiJahre), grenze: null, ausgeloest: null };
    const grenze = gebaeudeAk * B.dezimal(R.ANSCHAFFUNGSNAH.quote);
    return { geprueft: true, summe: B.cent(summeDreiJahre), grenze: B.cent(grenze), ausgeloest: summeDreiJahre > grenze };
  }

  const api = { regelsatz, bemessung, verlauf, anschaffungsnah };
  if (nodeModul) module.exports = api;
  else (root.ImmoRechenkern = root.ImmoRechenkern || {}).afa = api;

</script>
<script>/* src/rechenkern/haushalt.js */
/*
 * ImmoInvest Rechenkern – Haushaltsrechnung, Budgeteinordnung und Modellfinanzierungsrahmen
 *
 * Grundlage ist das tatsächlich eingetragene Monatsnetto. Fehlende Ausgaben führen nicht zu einem großen
 * freien Budget: Der Haushalt gilt dann als unvollständig, die Tragbarkeit bleibt ungeklärt.
 * Die betrachtete Wohnung wird genau einmal (über ihren Objekt-Cashflow) ergänzt; ihre Miete und Rate
 * gehören nicht in die Haushaltsangaben.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;

  const AUSGABEN = [
    ['wohnkosten_monat_eur', 'Eigene Wohnkosten'],
    ['lebenshaltung_monat_eur', 'Lebenshaltung'],
    ['versicherungen_monat_eur', 'Versicherungen (nicht schon vom Netto abgezogen)'],
    ['weitere_ausgaben_monat_eur', 'Weitere regelmäßige Ausgaben'],
    ['kredite_monat_eur', 'Bestehende Kreditraten'],
    ['leasing_monat_eur', 'Leasing'],
    ['unterhalt_monat_eur', 'Unterhaltszahlungen'],
    ['sparen_monat_eur', 'Regelmäßiges Sparen / gewünschte Reserve'],
    ['sicherheitspuffer_monat_eur', 'Zusätzlicher Sicherheitspuffer'],
  ];

  /** Monatlicher Haushaltsüberschuss vor der betrachteten Investition. */
  function haushaltsrechnung(profil) {
    const budget = profil.budget || {};
    const einnahmen = [], ausgaben = [], fehlend = [];
    for (const p of profil.personen || []) {
      const name = p.bezeichnung || p.id;
      if (B.istZahl(p.monatsnetto_eur)) einnahmen.push({ posten: `Monatsnetto ${name}`, betrag: p.monatsnetto_eur });
      else fehlend.push({ feld: `personen.${p.id}.monatsnetto_eur`, text: `Monatsnetto ${name}` });
    }
    for (const e of budget.weitere_einnahmen || []) {
      if (!B.istZahl(e.betrag_monat_eur)) { fehlend.push({ feld: 'budget.weitere_einnahmen', text: `Betrag „${e.bezeichnung || 'weitere Einnahme'}“` }); continue; }
      if (e.im_netto_enthalten === true) continue;
      if (e.im_netto_enthalten !== false) { fehlend.push({ feld: 'budget.weitere_einnahmen', text: `Angabe, ob „${e.bezeichnung || 'weitere Einnahme'}“ schon im Netto enthalten ist` }); continue; }
      einnahmen.push({ posten: e.bezeichnung || 'Weitere Einnahme', betrag: e.betrag_monat_eur });
    }
    for (const [feld, text] of AUSGABEN) {
      const v = budget[feld];
      if (B.istZahl(v)) ausgaben.push({ posten: text, betrag: v });
      else fehlend.push({ feld: `budget.${feld}`, text });
    }
    const summeEin = B.summe(einnahmen.map(e => e.betrag)), summeAus = B.summe(ausgaben.map(a => a.betrag));
    const vollstaendig = fehlend.length === 0 && einnahmen.length > 0;
    return { einnahmen, ausgaben, einnahmen_summe: B.cent(summeEin), ausgaben_summe: B.cent(summeAus), ueberschuss: vollstaendig ? B.cent(summeEin - summeAus) : null, ueberschuss_teilweise: B.cent(summeEin - summeAus), vollstaendig, fehlend };
  }

  /**
   * Persönliche Budgeteinordnung einer Kaufalternative.
   * @param {object} p haushalt (Ergebnis haushaltsrechnung), grenze {betrag, bezug: 'vor_steuer'|'nach_steuer'|'beide'},
   *   zuzahlung_vor_steuer, zuzahlung_nach_steuer (Monatsdurchschnitt), steuer_vollstaendig, vorfinanzierung_jahr,
   *   schlechtestes {vor_steuer, nach_steuer, jahr}
   * Zuzahlungen sind positive Beträge (Geldbedarf), negative Werte bedeuten Überschuss.
   */
  function einordnung(p) {
    const gruende = [];
    const h = p.haushalt;
    const g = p.grenze || {};
    const vor = p.zuzahlung_vor_steuer, nach = p.zuzahlung_nach_steuer;
    // Wunschgrenze
    let wunsch = 'nicht_beurteilbar';
    if (!B.istZahl(g.betrag)) gruende.push('Keine persönliche Zuzahlungsgrenze festgelegt.');
    else if (!B.istZahl(vor)) gruende.push('Zuzahlung der Wohnung nicht berechenbar (fehlende Objekt- oder Finanzierungsangaben).');
    else {
      const pruefeNach = g.bezug === 'nach_steuer' || g.bezug === 'beide';
      const pruefeVor = g.bezug === 'vor_steuer' || g.bezug === 'beide' || !g.bezug;
      if (pruefeNach && !B.istZahl(nach)) { gruende.push('Steuerwirkung nicht berechenbar – Grenze nach Steuer nicht prüfbar.'); }
      else {
        const ueber = (pruefeVor && vor > g.betrag) || (pruefeNach && nach > g.betrag);
        wunsch = ueber ? 'oberhalb' : 'innerhalb';
      }
    }
    // Tragbarkeit gegenüber dem Haushaltsüberschuss (immer vor Steuer: die Zahlungen fallen laufend an)
    let tragbar = 'ungeklaert';
    let verbleibend = null;
    if (!h || !h.vollstaendig) gruende.push('Haushaltsangaben unvollständig – finanzielle Tragbarkeit ungeklärt, nur Vergleich mit der Wunschgrenze möglich.');
    else if (B.istZahl(vor)) {
      verbleibend = B.cent(h.ueberschuss - vor);
      tragbar = verbleibend >= 0 ? 'tragbar' : 'nicht_tragbar';
      if (tragbar === 'nicht_tragbar') gruende.push(`Die Zuzahlung vor Steuer übersteigt den Haushaltsüberschuss um ${B.euro(-verbleibend)} im Monat.`);
    }
    if (B.istZahl(vor) && B.istZahl(nach) && nach < vor) gruende.push(`Bis zur Steuerwirkung sind monatlich ${B.euro(vor)} aufzubringen; die Entlastung von Ø ${B.euro(vor - nach)} im Monat kommt erst mit Veranlagung oder angepassten Vorauszahlungen.`);
    if (p.schlechtestes && B.istZahl(p.schlechtestes.vor_steuer) && B.istZahl(vor) && p.schlechtestes.vor_steuer > vor + 0.005) gruende.push(`Im Jahr ${p.schlechtestes.jahr} steigt die Zuzahlung vor Steuer auf Ø ${B.euro(p.schlechtestes.vor_steuer)} im Monat – die Einordnung gilt nicht automatisch für alle Jahre.`);
    let gesamt;
    if (wunsch === 'oberhalb' || tragbar === 'nicht_tragbar') gesamt = 'passt_nicht';
    else if (wunsch === 'innerhalb' && tragbar === 'tragbar') gesamt = 'passt';
    else gesamt = 'nicht_beurteilbar';
    return { wunschgrenze: wunsch, tragbarkeit: tragbar, gesamt, verbleibend_haushalt: verbleibend, gruende };
  }

  /**
   * Rechnerischer Modellfinanzierungsrahmen (keine Kreditentscheidung):
   * verfügbarer laufender Zuschuss + Objektüberschuss vor Kapitaldienst (mit optionalem Mietabschlag) trägt die Rate.
   * @param {object} p verfuegbar_monat (bereits min(Wunschgrenze, positiver Überschuss)), objekt_ueberschuss_monat,
   *   sollzins_prozent, tilgung_prozent, eigenkapital, nebenkostenquote_prozent
   */
  function finanzierungsrahmen(p) {
    const hinweise = ['Rechnerischer Rahmen aus Budget und Konditionen – keine Kreditentscheidung einer Bank.'];
    const verfuegbar = Math.max(0, p.verfuegbar_monat || 0);
    const objekt = p.objekt_ueberschuss_monat || 0;
    const fuerRate = verfuegbar + objekt;
    const annuitaet = B.dezimal(p.sollzins_prozent) + B.dezimal(p.tilgung_prozent);
    if (!(annuitaet > 0)) return { darlehen_max: null, kaufpreis_max: null, rate_tragbar: B.cent(fuerRate), hinweise: hinweise.concat('Sollzins und Tilgung zusammen müssen größer 0 sein.') };
    const darlehen = Math.max(0, fuerRate * 12 / annuitaet);
    const kaufpreis = B.istZahl(p.nebenkostenquote_prozent) ? (darlehen + (p.eigenkapital || 0)) / (1 + B.dezimal(p.nebenkostenquote_prozent)) : null;
    if (objekt) hinweise.push('Enthält den Überschuss der betrachteten Wohnung vor Zins und Tilgung; ändern sich Miete oder Kosten, ändert sich der Rahmen.');
    return { darlehen_max: B.cent(darlehen), kaufpreis_max: kaufpreis === null ? null : B.cent(kaufpreis), rate_tragbar: B.cent(fuerRate), hinweise };
  }

  const api = { AUSGABEN, haushaltsrechnung, einordnung, finanzierungsrahmen };
  if (nodeModul) module.exports = api;
  else (root.ImmoRechenkern = root.ImmoRechenkern || {}).haushalt = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* src/rechenkern/objekt.js */
/*
 * ImmoInvest Rechenkern – Immobilienanalyse (Schema 1.0) in Recheneingaben übersetzen
 *
 * Die importierte Analyse wird nur gelesen, nie verändert. Jeder Wert trägt Pfad, Belegstatus und
 * gegebenenfalls einen offenen Widerspruch. Unbekannte oder widersprüchliche Werte bleiben null und
 * müssen im persönlichen Objektszenario bewusst angenommen werden.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;

  const FELDER = {
    kaufpreis_eur: '/objekt/kaufpreis_eur',
    verpflichtende_zusatzkaeufe_eur: '/objekt/verpflichtende_zusatzkaeufe_eur',
    grunderwerbsteuer_prozent: '/ist_kosten_und_ertraege/grunderwerbsteuer_prozent',
    kaeuferprovision_prozent: '/ist_kosten_und_ertraege/kaeuferprovision_prozent',
    notar_grundbuch_eur: '/ist_kosten_und_ertraege/notar_grundbuch_eur',
    anfaengliche_massnahmen_eur: '/ist_kosten_und_ertraege/anfaengliche_massnahmen_eur',
    kaltmiete_monat_eur: '/ist_kosten_und_ertraege/nettokaltmiete_monat_eur',
    bk_vorauszahlung_monat_eur: '/ist_kosten_und_ertraege/betriebskostenvorauszahlung_monat_eur',
    hausgeld_monat_eur: '/ist_kosten_und_ertraege/hausgeld_monat_eur',
    umlagefaehig_monat_eur: '/ist_kosten_und_ertraege/hausgeld_umlagefaehig_monat_eur',
    nicht_umlagefaehig_monat_eur: '/ist_kosten_und_ertraege/hausgeld_nicht_umlagefaehig_ohne_ruecklage_monat_eur',
    ruecklage_monat_eur: '/weg/ruecklagenzufuehrung_wohnung_monat_eur',
    fertigstellung_jahr: '/objekt/baujahr',
  };

  /**
   * Modellannahmen der Analyse (Abschnitt „annahmen“), die als Vorschlag für offene Rechenwerte taugen.
   * Die Parameternamen der KI-Exporte schwanken („Basis: …: gebaeudeanteil_prozent“); gelesen wird der Teil
   * nach dem letzten Doppelpunkt. Sensitivitätswerte (niedrig/hoch, hypothetisch) sind bewusst nicht zugeordnet.
   */
  const ANNAHME_PARAMETER = {
    gebaeudeanteil_prozent: { namen: ['gebaeudeanteil_prozent'], einheit: 'prozent' },
    anfaengliche_massnahmen_eur: { namen: ['anfaengliche_massnahmen_modell_eur', 'anfaengliche_massnahmen_eur'], einheit: 'eur' },
    verpflichtende_zusatzkaeufe_eur: { namen: ['zusatzkauf_modell_eur', 'zusatzkaeufe_modell_eur', 'verpflichtende_zusatzkaeufe_eur'], einheit: 'eur' },
    nicht_umlagefaehig_monat_eur: { namen: ['laufende_abziehbare_kosten_monat_eur', 'laufende_abziehbare_eigentuemeraufwendungen_monat_eur', 'nicht_umlagefaehig_monat_eur'], einheit: 'eur_monat' },
    ruecklage_monat_eur: { namen: ['weg_reserve_modell_monat_eur', 'weg_ruecklage_modell_monat_eur', 'ruecklage_monat_eur'], einheit: 'eur_monat' },
    notar_grundbuch_prozent: { namen: ['notar_grundbuch_prozent'], einheit: 'prozent' },
  };
  const UNGEKLAERT = ['weitere_ungeklaerte_kosten_monat_eur'];

  function einheitPasst(einheit, soll) {
    const e = String(einheit ?? '').toLowerCase();
    if (soll === 'prozent') return e === '' || /prozent|%/.test(e);

  /** Liefert je Rechenwert den häufigsten Wert (Basisszenario bevorzugt) samt Alternativen und Belegen. */
  function annahmeVorschlaege(daten) {
    const kandidaten = {};
    let ungeklaert = null;
    for (const a of Array.isArray(daten.annahmen) ? daten.annahmen : []) {
      if (!a || typeof a.parameter !== 'string' || !B.istZahl(a.wert) || a.wert < 0) continue;
      const teile = a.parameter.split(':');

      const basis = teile.length === 1 || /basis/i.test(teile.slice(0, -1).join(':'));
      if (UNGEKLAERT.includes(name) && a.wert > 0 && basis) ungeklaert = Math.max(ungeklaert || 0, a.wert);
      for (const [key, def] of Object.entries(ANNAHME_PARAMETER)) {
        if (!def.namen.includes(name) || !einheitPasst(a.einheit, def.einheit) || (def.einheit === 'prozent' && a.wert > 100)) continue;
        (kandidaten[key] = kandidaten[key] || []).push({ wert: a.wert, basis, id: a.id ?? null, begruendung: typeof a.begruendung === 'string' ? a.begruendung : null, parameter: a.parameter });
      }

    const out = {};
    for (const [key, liste] of Object.entries(kandidaten)) {
      const auswahl = liste.some(k => k.basis) ? liste.filter(k => k.basis) : liste;
      const haeufigkeit = new Map();
      for (const k of auswahl) haeufigkeit.set(k.wert, (haeufigkeit.get(k.wert) || 0) + 1);
      const wert = [...haeufigkeit].sort((x, y) => y[1] - x[1])[0][0];
      const treffer = auswahl.filter(k => k.wert === wert);
      out[key] = {
        wert,
        alternativen: [...new Set(liste.map(k => k.wert).filter(w => w !== wert))],
        annahme_ids: [...new Set(treffer.map(k => k.id).filter(Boolean))],
        begruendung: (treffer.find(k => k.begruendung) || {}).begruendung || null,

    { key: 'anfaengliche_massnahmen_eur', label: 'Anfängliche Maßnahmen', einheit: 'eur', gruppe: 'erwerb', objekt: true, komponente: 'finanzierung' },

    { key: 'kaltmiete_monat_eur', label: 'Nettokaltmiete', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'bk_vorauszahlung_monat_eur', label: 'Betriebskostenvorauszahlung des Mieters', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'umlagefaehig_monat_eur', label: 'Umlagefähige Kosten (tatsächlich)', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'nicht_umlagefaehig_monat_eur', label: 'Nicht umlagefähige Eigentümerkosten (ohne Rücklage)', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },

  /** Wirksame Werte mit Herkunft, Status und den Vergleichswerten aus Objekt und Profil. */
  function wirksameEingaben(objekt, profil, os) {

    const out = {};

      const basis = { key: def.key, label: def.label, einheit: def.einheit, gruppe: def.gruppe, komponente: def.komponente || null, objekt_wert: f ? f.wert : undefined, objekt_status: f ? f.belegstatus : undefined, objekt_pfad: f ? f.pfad : undefined, widerspruch: f ? f.widerspruch : null, profil_wert: profilWert, hinweis: f ? f.hinweis : null };

  /** Alle Konditionen: allgemeine aus dem Profil, objektspezifische Angebote aus dem Szenario. */

    const p = (profil.finanzierung && profil.finanzierung.konditionen) || [];
    const o = (os && os.konditionen_objekt) || [];
    return p.map(k => ({ ...k, quelle: 'profil' })).concat(o.map(k => ({ ...k, quelle: 'objekt' })));
  }

  const KATEGORIE = { erhaltung: 'Erhaltungsaufwand, sofort abziehbar', herstellung: 'Herstellungskosten, über AfA', nicht_abziehbar: 'nicht abziehbar' };

  const VARIANTEN = {
    zins: { label: 'Anderer Sollzins', feld: 'sollzins_prozent' },
    tilgung: { label: 'Andere anfängliche Tilgung', feld: 'tilgung_prozent' },
    eigenkapital: { label: 'Anderes Eigenkapital', feld: 'eigenkapital_einsatz_eur' },

    leerstand: { label: 'Vollständiger Leerstand', feld: 'monate' },
    sonderumlage: { label: 'Einmalige Sonderumlage oder Reparatur', feld: 'betrag_eur' },

  /** Wendet eine Variante an und dokumentiert jede Änderung gegenüber dem Ausgangsfall. */

    const setze = (key, wert, label) => { aenderungen.push({ feld: label, vorher: e[key].wert, nachher: wert }); e[key] = { ...e[key], wert, herkunft: 'variante', status: 'annahme' }; };

        aenderungen.push({ feld: variante.typ === 'leerstand' ? 'Leerstand (Kaltmiete und Vorauszahlungen entfallen)' : 'Kaltmietausfall (Vorauszahlungen laufen weiter)', vorher: null, nachher: `${p.monate || 0} Monate im Modelljahr ${p.modelljahr || 1}` });
        break;
      case 'sonderumlage':
        ereignisse.push({ art: 'sonderumlage', modelljahr: p.modelljahr || 1, betrag: p.betrag_eur || 0, kategorie: p.kategorie || 'erhaltung' });
        aenderungen.push({ feld: 'Einmalige Zahlung', vorher: null, nachher: `${B.euro(p.betrag_eur || 0)} im Modelljahr ${p.modelljahr || 1} (${KATEGORIE[p.kategorie || 'erhaltung'] || p.kategorie})` });
        break;
      case 'anschluss': if (k) { aenderungen.push({ feld: 'Anschlusszins (%)', vorher: k.anschluss ? k.anschluss.sollzins_prozent : null, nachher: p.sollzins_prozent }); k.anschluss = { regel: (k.anschluss && k.anschluss.regel) || 'rate_beibehalten', tilgung_prozent: k.anschluss ? k.anschluss.tilgung_prozent : null, sollzins_prozent: p.sollzins_prozent }; } break;
      case 'miete': setze('kaltmiete_monat_eur', p.kaltmiete_monat_eur, 'Nettokaltmiete (€/Monat, hypothetisch)'); break;
      case 'kaufpreis': setze('kaufpreis_eur', p.kaufpreis_eur, 'Kaufpreis (€, hypothetisch)'); break;

  /** Eigentums- bzw. Ergebnisanteile für die getrennte Veranlagung; null bei ungeklärter Zuordnung. */

   * Hauptrechnung.

  function berechne(eingang) {

    // 1. Kapitalbedarf und Darlehen
    const kp = w('kaufpreis_eur');
    const offenFin = res.offen.filter(o => o.komponente === 'finanzierung');
    const posten = [];
    const add = (bezeichnung, betrag, art) => { posten.push({ bezeichnung, betrag: B.istZahl(betrag) ? B.cent(betrag) : null, art }); return betrag; };
    add('Kaufpreis', kp, 'kaufpreis');
    const grest = add('Grunderwerbsteuer', B.istZahl(kp) && B.istZahl(w('grunderwerbsteuer_prozent')) ? kp * B.dezimal(w('grunderwerbsteuer_prozent')) : null, 'nebenkosten');
    const notar = add('Notar und Grundbuch', B.istZahl(eingaben.notar_grundbuch_prozent.betrag_eur) ? eingaben.notar_grundbuch_prozent.betrag_eur : B.istZahl(kp) && B.istZahl(w('notar_grundbuch_prozent')) ? kp * B.dezimal(w('notar_grundbuch_prozent')) : null, 'nebenkosten');
    const prov = add('Käuferprovision', B.istZahl(kp) && B.istZahl(w('kaeuferprovision_prozent')) ? kp * B.dezimal(w('kaeuferprovision_prozent')) : null, 'nebenkosten');
    const zusatz = add('Verpflichtende Zusatzkäufe', w('verpflichtende_zusatzkaeufe_eur'), 'zusatz');
    const massnahmen = add('Anfängliche Maßnahmen', w('anfaengliche_massnahmen_eur'), 'massnahmen');
    const gebuehren = kondition && B.istZahl(kondition.gebuehren_eur) ? kondition.gebuehren_eur : 0;
    if (gebuehren) add('Finanzierungsgebühren', gebuehren, 'gebuehren');
    const kapitalVollstaendig = posten.every(p => p.betrag !== null);
    const kapitalbedarf = kapitalVollstaendig ? B.cent(B.summe(posten.map(p => p.betrag))) : null;
    const ek = w('eigenkapital_einsatz_eur');
    res.kapital = { posten, kapitalbedarf, eigenkapital_verfuegbar: ek, notfallreserve: holen(profil, 'kapital.notfallreserve_eur') ?? null, hinweise: [] };
    let darlehen = null;
    if (kapitalbedarf !== null && B.istZahl(ek)) {
      const bedarf = Math.max(0, kapitalbedarf - ek);
      res.kapital.eigenkapital_eingesetzt = B.cent(Math.min(ek, kapitalbedarf));
      res.kapital.darlehensbedarf = B.cent(bedarf);
      if (ek > kapitalbedarf) res.kapital.hinweise.push(`Das eingesetzte Eigenkapital übersteigt den Kapitalbedarf; ${B.euro(ek - kapitalbedarf)} werden nicht benötigt.`);

      if (kondition && B.istZahl(kondition.darlehensbetrag_eur)) {

    if (res.kapital.finanzierungsluecke) res.hinweise.push(`Finanzierungslücke: ${B.euro(res.kapital.finanzierungsluecke)} sind weder durch Eigenkapital noch durch das Darlehen gedeckt.`);
    let konditionFehler = {};
    if (darlehen > 0) {

      for (const [feld, text] of Object.entries(konditionFehler)) res.offen.push({ feld: `kondition.${feld}`, label: text, komponente: 'finanzierung', grund: 'Kondition unvollständig' });

    // 2. Tilgungsplan

    const betrachtung = holen(profil, 'kapital.betrachtung_jahre');

    const plan = darlehen > 0
      ? D.tilgungsplan({ darlehen, sollzins_prozent: kondition.sollzins_prozent, tilgung_prozent: kondition.tilgung_prozent, monatsrate_eur: kondition.monatsrate_eur, zinsbindung_monate: bindungJahre * 12, horizont_monate: horizontJahre * 12, sondertilgung_jahr_eur: kondition.sondertilgung_jahr_eur, anschluss: kondition.anschluss || null })

    } else { res.plan.restschuld_ende_bindung = 0; res.plan.zinsen_bindung = 0; res.plan.tilgung_bindung = 0; }

    // 3. Cashflow-Eingaben prüfen
    const offenCf = res.offen.filter(o => o.komponente === 'cashflow');

    // 4. AfA
    const gebaeudeanteil = w('gebaeudeanteil_prozent');
    const fertig = w('fertigstellung_jahr');
    const afaBeginn = os.afa_beginn || beginn;

    res.annahmen.push('Notar- und Grundbuchkosten vollständig als Anschaffungsnebenkosten behandelt (Grundschuldkosten wären sofort abziehbar – vorsichtige Vereinfachung).');

    const startIdx = B.monatIndex(beginn);

    const vorlaeufig = A.bemessung({ kaufpreis: kp, zusatzkaeufe: zusatz, anschaffungsnebenkosten, gebaeudeanteil_prozent: gebaeudeanteil, herstellungskosten: 0 });
    const pruefung = A.anschaffungsnah(erhaltung, vorlaeufig.gebaeude);
    let herstellung = massnahmenKategorie === 'herstellung' ? massnahmen : 0;
    if (pruefung.ausgeloest) {
      herstellung += pruefung.summe;
      res.hinweise.push(`Anschaffungsnahe Herstellungskosten: ${B.euro(pruefung.summe)} Instandsetzung in den ersten drei Jahren übersteigen 15 % der Gebäude-Anschaffungskosten (${B.euro(pruefung.grenze)}) – sie werden über die AfA statt sofort abgezogen (${R.ANSCHAFFUNGSNAH.fundstelle}; vereinfachend ab Erwerb).`);
    }
    const bem = A.bemessung({ kaufpreis: kp, zusatzkaeufe: zusatz, anschaffungsnebenkosten, gebaeudeanteil_prozent: gebaeudeanteil, herstellungskosten: herstellung });
    const regel = A.regelsatz(fertig);
    let satz = regel ? regel.satz_prozent : null;
    const abw = os.afa_abweichend;
    if (abw && B.istZahl(abw.satz_prozent)) {

      else res.hinweise.push('Abweichender AfA-Satz ohne Begründung wird nicht verwendet.');
    }
    const startJahr = B.monatAusIndex(startIdx).jahr;
    const endIdx = startIdx + Math.max(plan.modelliert_bis, 1) - 1;
    const endJahr = B.monatAusIndex(endIdx).jahr;
    const afaVerlauf = bem.bemessung !== null && satz !== null ? A.verlauf({ bemessung: bem.bemessung, satz_prozent: satz, beginn: afaBeginn, bis_jahr: endJahr }) : null;
    res.afa = { ...bem, satz_prozent: satz, regel: regel ? regel.regel : null, regel_text: regel ? regel.text : null, beginn: afaBeginn, voll_jahr: bem.bemessung !== null && satz !== null ? B.cent(bem.bemessung * B.dezimal(satz)) : null, verlauf: afaVerlauf, anschaffungsnah: pruefung };

    // 5. Monatsrechnung
    const g = key => B.dezimal(w(key) || 0);
    const jahre = new Map();
    const monate = plan.modelliert_bis;
    let kumTilgung = 0;
    const gebuehrenAbzug = gebuehren;
    const sofortErhaltung = !pruefung.ausgeloest && massnahmenKategorie === 'erhaltung' ? massnahmen : 0;
    for (let m = 1; m <= monate; m++) {
      const idx = startIdx + m - 1;
      const { jahr } = B.monatAusIndex(idx);
      const modelljahr = Math.ceil(m / 12), monatImModelljahr = (m - 1) % 12 + 1;
      const fMiete = Math.pow(1 + g('mietsteigerung_prozent'), modelljahr - 1), fKosten = Math.pow(1 + g('kostensteigerung_prozent'), modelljahr - 1);
      const leer = ereignisse.some(e => e.art === 'leerstand' && e.modelljahr === modelljahr && monatImModelljahr <= e.monate);
      const ausfall = leer || ereignisse.some(e => e.art === 'kaltmietausfall' && e.modelljahr === modelljahr && monatImModelljahr <= e.monate);
      const kaltmiete = ausfall ? 0 : w('kaltmiete_monat_eur') * fMiete * (1 - g('mietausfall_prozent'));
      const bk = leer ? 0 : w('bk_vorauszahlung_monat_eur') * fKosten;
      const umlage = w('umlagefaehig_monat_eur') * fKosten, nicht = w('nicht_umlagefaehig_monat_eur') * fKosten, ruecklage = w('ruecklage_monat_eur') * fKosten;
      const pm = plan.monate[m - 1] || { zins: 0, tilgung: 0, sondertilgung: 0, zahlung: 0, restschuld: 0 };

      if (m === 1) einmaligAbzug += gebuehrenAbzug + sofortErhaltung;
