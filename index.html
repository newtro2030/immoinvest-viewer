<script>/* src/rechenkern/darlehen.js */
/*
 * ImmoInvest Rechenkern – Annuitätendarlehen und Tilgungsplan
 *
 * Rundungsstrategie: Die konstante Monatsrate wird einmal je Konditionsphase kaufmännisch auf Cent gerundet.
 * Zinsen, Tilgung und Restschuld werden intern ungerundet geführt; erst ausgewiesene Ergebnisse werden gerundet.
 * Zahlung jeweils am Monatsende: Zins = Restschuld zu Monatsbeginn × Sollzins / 12.
 * Sondertilgungen werden zum Ende jedes vollen Darlehensjahres (Monat 12, 24, …) nach der Rate verrechnet.
 * Ohne Anschlussannahme endet die modellierte Konditionsphase mit der Zinsbindung.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;

  /** Anfängliche Monatsrate = Darlehen × (Sollzins + anfängliche Tilgung) / 12, auf Cent gerundet. */
  function monatsrate(darlehen, sollzinsProzent, tilgungProzent) {
    return B.cent(darlehen * (B.dezimal(sollzinsProzent) + B.dezimal(tilgungProzent)) / 12);
  }

  /** Prüft eine Kondition fachlich; liefert Fehlermeldungen je Feld. */
  function pruefeKondition(k) {
    const f = {};
    if (!B.istZahl(k.sollzins_prozent)) f.sollzins_prozent = 'Sollzins fehlt.';
    else if (k.sollzins_prozent < 0 || k.sollzins_prozent > 30) f.sollzins_prozent = 'Sollzins muss zwischen 0 und 30 % liegen.';
    const hatTilgung = B.istZahl(k.tilgung_prozent), hatRate = B.istZahl(k.monatsrate_eur);
    if (!hatTilgung && !hatRate) f.tilgung_prozent = 'Anfängliche Tilgung oder feste Monatsrate angeben.';
    if (hatTilgung && (k.tilgung_prozent < 0 || k.tilgung_prozent > 100)) f.tilgung_prozent = 'Tilgung muss zwischen 0 und 100 % liegen.';
    if (hatRate && k.monatsrate_eur < 0) f.monatsrate_eur = 'Monatsrate darf nicht negativ sein.';
    if (!B.istZahl(k.zinsbindung_jahre) || k.zinsbindung_jahre <= 0 || k.zinsbindung_jahre > 40) f.zinsbindung_jahre = 'Zinsbindung in Jahren (größer 0, höchstens 40) angeben.';
    if (B.monatIndex(k.beginn) === null) f.beginn = 'Beginn als Monat (JJJJ-MM) angeben.';
    if (B.istZahl(k.sondertilgung_jahr_eur) && k.sondertilgung_jahr_eur < 0) f.sondertilgung_jahr_eur = 'Sondertilgung darf nicht negativ sein.';
    if (k.anschluss) {
      if (!B.istZahl(k.anschluss.sollzins_prozent) || k.anschluss.sollzins_prozent < 0) f['anschluss.sollzins_prozent'] = 'Anschlusszins angeben oder Anschluss entfernen.';
      if (k.anschluss.regel === 'neue_tilgung' && !B.istZahl(k.anschluss.tilgung_prozent)) f['anschluss.tilgung_prozent'] = 'Neue Tilgung für die Anschlussphase angeben.';
    }
    if (B.istZahl(k.gebuehren_eur) && k.gebuehren_eur < 0) f.gebuehren_eur = 'Gebühren dürfen nicht negativ sein.';
    return f;
  }

  /**
   * Monatlicher Tilgungsplan.
   * @param {object} p darlehen, sollzins_prozent, tilgung_prozent | monatsrate_eur, zinsbindung_monate,
   *                   horizont_monate, sondertilgung_jahr_eur, anschluss {sollzins_prozent, regel, tilgung_prozent}
   * @returns {{monate: object[], rate: number, rate_anschluss: number|null, modelliert_bis: number, getilgt_im_monat: number|null, hinweise: string[]}}
   */
  function tilgungsplan(p) {
    const hinweise = [];
    const L = p.darlehen;
    const horizont = Math.max(0, p.horizont_monate | 0);
    const bindung = Math.max(0, p.zinsbindung_monate | 0);
    const ende = p.anschluss ? horizont : Math.min(horizont, bindung);
    if (!p.anschluss && horizont > bindung) hinweise.push('Nach Ende der Zinsbindung ist keine Anschlusskondition festgelegt; spätere Jahre sind nicht modelliert.');
    const res = { monate: [], rate: 0, rate_anschluss: null, modelliert_bis: ende, getilgt_im_monat: null, hinweise };
    if (!(L > 0)) {
      for (let m = 1; m <= ende; m++) res.monate.push({ monat: m, zins: 0, tilgung: 0, sondertilgung: 0, zahlung: 0, restschuld: 0, phase: m <= bindung ? 'bindung' : 'anschluss' });
      if (L === 0) hinweise.push('Kein Darlehen erforderlich.');
      return res;
    }
    let i = B.dezimal(p.sollzins_prozent) / 12;
    let rate = B.istZahl(p.monatsrate_eur) ? B.cent(p.monatsrate_eur) : monatsrate(L, p.sollzins_prozent, p.tilgung_prozent);
    res.rate = rate;
    if (B.istZahl(p.tilgung_prozent) && p.tilgung_prozent === 0 && !B.istZahl(p.monatsrate_eur)) hinweise.push('Tilgungsfrei: Die Rate deckt nur die Zinsen, die Restschuld sinkt nicht.');
    let rest = L, warnungRate = false;
    for (let m = 1; m <= ende; m++) {
      if (m === bindung + 1 && p.anschluss) {
        i = B.dezimal(p.anschluss.sollzins_prozent) / 12;
        if (p.anschluss.regel === 'neue_tilgung') rate = B.cent(rest * (B.dezimal(p.anschluss.sollzins_prozent) + B.dezimal(p.anschluss.tilgung_prozent)) / 12);
        res.rate_anschluss = rate;
      }
      const phase = m <= bindung ? 'bindung' : 'anschluss';
      if (rest <= 1e-9) { res.monate.push({ monat: m, zins: 0, tilgung: 0, sondertilgung: 0, zahlung: 0, restschuld: 0, phase }); continue; }
      const zins = rest * i;
      let tilgung, zahlung;
      if (rate >= rest + zins) { tilgung = rest; zahlung = rest + zins; rest = 0; res.getilgt_im_monat = m; }
      else {
        tilgung = rate - zins; zahlung = rate; rest -= tilgung;
        if (tilgung < 0 && !warnungRate) { warnungRate = true; hinweise.push(`Die Rate von ${B.euro(rate)} deckt im Monat ${m} die Zinsen nicht – die Restschuld steigt.`); }
      }
      let sondertilgung = 0;
      if (B.istZahl(p.sondertilgung_jahr_eur) && p.sondertilgung_jahr_eur > 0 && m % 12 === 0 && rest > 0) {
        sondertilgung = Math.min(p.sondertilgung_jahr_eur, rest);
        rest -= sondertilgung;
        if (rest <= 1e-9) { rest = 0; res.getilgt_im_monat = m; }
      }
      res.monate.push({ monat: m, zins, tilgung, sondertilgung, zahlung, restschuld: rest, phase });
    }
    if (res.getilgt_im_monat) hinweise.push(`Das Darlehen ist im Monat ${res.getilgt_im_monat} vollständig zurückgezahlt (Schlussrate berücksichtigt).`);
    return res;
  }

  /** Summen über einen Monatsbereich [von, bis] (1-basiert, inklusive), gerundet auf Cent. */
  function summen(plan, von, bis) {
    let zins = 0, tilgung = 0, sonder = 0, zahlung = 0, rest = null;
    for (const m of plan.monate) {
      if (m.monat < von || m.monat > bis) continue;
      zins += m.zins; tilgung += m.tilgung; sonder += m.sondertilgung; zahlung += m.zahlung; rest = m.restschuld;
    }
    return { zins: B.cent(zins), tilgung: B.cent(tilgung), sondertilgung: B.cent(sonder), zahlung: B.cent(zahlung + sonder), restschuld: rest === null ? null : B.cent(rest) };
  }

  const api = { monatsrate, pruefeKondition, tilgungsplan, summen };
  if (nodeModul) module.exports = api;
  else (root.ImmoRechenkern = root.ImmoRechenkern || {}).darlehen = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* src/rechenkern/afa.js */
/*
 * ImmoInvest Rechenkern – Gebäude-AfA (Privatvermögen, Vermietung)
 *
 * Bemessungsgrundlage = Gebäudeanteil × (Kaufpreis + Zusatzkäufe + Anschaffungsnebenkosten) + Herstellungskosten.
 * Der Grundstücksanteil wird nie abgeschrieben, ein Darlehen ebenfalls nicht.
 * Satz nach Fertigstellung (§ 7 Abs. 4 EStG); im Erwerbsjahr wird je vollem Vormonat um 1/12 gekürzt (§ 7 Abs. 1 Satz 4).
 * Die Käufer-AfA beginnt mit den eigenen Anschaffungskosten; Jahre seit Fertigstellung verkürzen sie nicht.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;
  const R = nodeModul ? require('./steuerregeln.js') : root.ImmoRechenkern.steuerregeln;

  /** Regulärer Satz nach Fertigstellungsjahr; null bei unbekanntem Jahr. */
  function regelsatz(fertigstellungJahr) {
    if (!B.istZahl(fertigstellungJahr)) return null;
    const stufe = R.AFA.stufen.find(s => (s.ab === null || fertigstellungJahr >= s.ab) && (s.bis === null || fertigstellungJahr <= s.bis));
    return { satz_prozent: stufe.satz, regel: `§ 7 Abs. 4 Satz 1 Nr. 2 Buchst. ${stufe.buchstabe} EStG`, text: stufe.text };
  }

  /**
   * Bemessungsgrundlage. Liefert null-Werte, wenn der Gebäudeanteil unbekannt ist.
   * @param {object} p kaufpreis, zusatzkaeufe, anschaffungsnebenkosten, gebaeudeanteil_prozent, herstellungskosten
   */
  function bemessung(p) {
    const ak = (p.kaufpreis || 0) + (p.zusatzkaeufe || 0) + (p.anschaffungsnebenkosten || 0);
    if (!B.istZahl(p.gebaeudeanteil_prozent)) return { anschaffungskosten: B.cent(ak), gebaeude: null, grundstueck: null, bemessung: null, fehlt: 'Gebäudeanteil unbekannt – bitte als begründete Szenarioannahme setzen.' };
    const gebaeude = ak * B.dezimal(p.gebaeudeanteil_prozent);
    return { anschaffungskosten: B.cent(ak), gebaeude: B.cent(gebaeude), grundstueck: B.cent(ak - gebaeude), bemessung: B.cent(gebaeude + (p.herstellungskosten || 0)), fehlt: null };
  }

  /**
   * AfA je Kalenderjahr ab Beginn bis zur vollen Absetzung.
   * @param {object} p bemessung, satz_prozent, beginn ("YYYY-MM"), bis_jahr
   * @returns {Object<number, number>} Kalenderjahr → AfA (auf Cent)
   */
  function verlauf(p) {
    const out = {};
    const start = B.monatIndex(p.beginn);
    if (!B.istZahl(p.bemessung) || !B.istZahl(p.satz_prozent) || start === null) return out;
    const { jahr: j0, monat: m0 } = B.monatAusIndex(start);
    const voll = p.bemessung * B.dezimal(p.satz_prozent);
    let rest = p.bemessung;
    for (let jahr = j0; jahr <= p.bis_jahr && rest > 1e-9; jahr++) {
      const betrag = Math.min(rest, jahr === j0 ? voll * (13 - m0) / 12 : voll);
      out[jahr] = B.cent(betrag);
      rest -= betrag;
    }
    return out;
  }

  /**
   * Prüfung anschaffungsnaher Herstellungskosten (§ 6 Abs. 1 Nr. 1a): Instandsetzung innerhalb von
   * drei Jahren nach Anschaffung über 15 % der Gebäude-Anschaffungskosten (netto).
   * @param {{betrag: number, monat_nach_erwerb: number}[]} massnahmen
   */
  function anschaffungsnah(massnahmen, gebaeudeAk) {
    const summeDreiJahre = massnahmen.filter(m => m.monat_nach_erwerb < R.ANSCHAFFUNGSNAH.jahre * 12).reduce((a, m) => a + m.betrag, 0);
    if (!B.istZahl(gebaeudeAk)) return { geprueft: false, summe: B.cent(summeDreiJahre), grenze: null, ausgeloest: null };
    const grenze = gebaeudeAk * B.dezimal(R.ANSCHAFFUNGSNAH.quote);
    return { geprueft: true, summe: B.cent(summeDreiJahre), grenze: B.cent(grenze), ausgeloest: summeDreiJahre > grenze };
  }

  const api = { regelsatz, bemessung, verlauf, anschaffungsnah };
  if (nodeModul) module.exports = api;
  else (root.ImmoRechenkern = root.ImmoRechenkern || {}).afa = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* src/rechenkern/haushalt.js */
/*
 * ImmoInvest Rechenkern – Haushaltsrechnung, Budgeteinordnung und Modellfinanzierungsrahmen
 *
 * Grundlage ist das tatsächlich eingetragene Monatsnetto. Fehlende Ausgaben führen nicht zu einem großen
 * freien Budget: Der Haushalt gilt dann als unvollständig, die Tragbarkeit bleibt ungeklärt.
 * Die betrachtete Wohnung wird genau einmal (über ihren Objekt-Cashflow) ergänzt; ihre Miete und Rate
 * gehören nicht in die Haushaltsangaben.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;

  const AUSGABEN = [
    ['wohnkosten_monat_eur', 'Eigene Wohnkosten'],
    ['lebenshaltung_monat_eur', 'Lebenshaltung'],
    ['versicherungen_monat_eur', 'Versicherungen (nicht schon vom Netto abgezogen)'],
    ['weitere_ausgaben_monat_eur', 'Weitere regelmäßige Ausgaben'],
    ['kredite_monat_eur', 'Bestehende Kreditraten'],
    ['leasing_monat_eur', 'Leasing'],
    ['unterhalt_monat_eur', 'Unterhaltszahlungen'],
    ['sparen_monat_eur', 'Regelmäßiges Sparen / gewünschte Reserve'],
    ['sicherheitspuffer_monat_eur', 'Zusätzlicher Sicherheitspuffer'],
  ];

  /** Monatlicher Haushaltsüberschuss vor der betrachteten Investition. */
  function haushaltsrechnung(profil) {
    const budget = profil.budget || {};
    const einnahmen = [], ausgaben = [], fehlend = [];
    for (const p of profil.personen || []) {
      const name = p.bezeichnung || p.id;
      if (B.istZahl(p.monatsnetto_eur)) einnahmen.push({ posten: `Monatsnetto ${name}`, betrag: p.monatsnetto_eur });
      else fehlend.push({ feld: `personen.${p.id}.monatsnetto_eur`, text: `Monatsnetto ${name}` });
    }
    for (const e of budget.weitere_einnahmen || []) {
      if (!B.istZahl(e.betrag_monat_eur)) { fehlend.push({ feld: 'budget.weitere_einnahmen', text: `Betrag „${e.bezeichnung || 'weitere Einnahme'}“` }); continue; }
      if (e.im_netto_enthalten === true) continue;
      if (e.im_netto_enthalten !== false) { fehlend.push({ feld: 'budget.weitere_einnahmen', text: `Angabe, ob „${e.bezeichnung || 'weitere Einnahme'}“ schon im Netto enthalten ist` }); continue; }
      einnahmen.push({ posten: e.bezeichnung || 'Weitere Einnahme', betrag: e.betrag_monat_eur });
    }
    for (const [feld, text] of AUSGABEN) {
      const v = budget[feld];
      if (B.istZahl(v)) ausgaben.push({ posten: text, betrag: v });
      else fehlend.push({ feld: `budget.${feld}`, text });
    }
    const summeEin = B.summe(einnahmen.map(e => e.betrag)), summeAus = B.summe(ausgaben.map(a => a.betrag));
    const vollstaendig = fehlend.length === 0 && einnahmen.length > 0;
    return { einnahmen, ausgaben, einnahmen_summe: B.cent(summeEin), ausgaben_summe: B.cent(summeAus), ueberschuss: vollstaendig ? B.cent(summeEin - summeAus) : null, ueberschuss_teilweise: B.cent(summeEin - summeAus), vollstaendig, fehlend };
  }

  /**
   * Persönliche Budgeteinordnung einer Kaufalternative.
   * @param {object} p haushalt (Ergebnis haushaltsrechnung), grenze {betrag, bezug: 'vor_steuer'|'nach_steuer'|'beide'},
   *   zuzahlung_vor_steuer, zuzahlung_nach_steuer (Monatsdurchschnitt), steuer_vollstaendig, vorfinanzierung_jahr,
   *   schlechtestes {vor_steuer, nach_steuer, jahr}
   * Zuzahlungen sind positive Beträge (Geldbedarf), negative Werte bedeuten Überschuss.
   */
  function einordnung(p) {
    const gruende = [];
    const h = p.haushalt;
    const g = p.grenze || {};
    const vor = p.zuzahlung_vor_steuer, nach = p.zuzahlung_nach_steuer;
    // Wunschgrenze
    let wunsch = 'nicht_beurteilbar';
    if (!B.istZahl(g.betrag)) gruende.push('Keine persönliche Zuzahlungsgrenze festgelegt.');
    else if (!B.istZahl(vor)) gruende.push('Zuzahlung der Wohnung nicht berechenbar (fehlende Objekt- oder Finanzierungsangaben).');
    else {
      const pruefeNach = g.bezug === 'nach_steuer' || g.bezug === 'beide';
      const pruefeVor = g.bezug === 'vor_steuer' || g.bezug === 'beide' || !g.bezug;
      if (pruefeNach && !B.istZahl(nach)) { gruende.push('Steuerwirkung nicht berechenbar – Grenze nach Steuer nicht prüfbar.'); }
      else {
        const ueber = (pruefeVor && vor > g.betrag) || (pruefeNach && nach > g.betrag);
        wunsch = ueber ? 'oberhalb' : 'innerhalb';
      }
    }
    // Tragbarkeit gegenüber dem Haushaltsüberschuss (immer vor Steuer: die Zahlungen fallen laufend an)
    let tragbar = 'ungeklaert';
    let verbleibend = null;
    if (!h || !h.vollstaendig) gruende.push('Haushaltsangaben unvollständig – finanzielle Tragbarkeit ungeklärt, nur Vergleich mit der Wunschgrenze möglich.');
    else if (B.istZahl(vor)) {
      verbleibend = B.cent(h.ueberschuss - vor);
      tragbar = verbleibend >= 0 ? 'tragbar' : 'nicht_tragbar';
      if (tragbar === 'nicht_tragbar') gruende.push(`Die Zuzahlung vor Steuer übersteigt den Haushaltsüberschuss um ${B.euro(-verbleibend)} im Monat.`);
    }
    if (B.istZahl(vor) && B.istZahl(nach) && nach < vor) gruende.push(`Bis zur Steuerwirkung sind monatlich ${B.euro(vor)} aufzubringen; die Entlastung von Ø ${B.euro(vor - nach)} im Monat kommt erst mit Veranlagung oder angepassten Vorauszahlungen.`);
    if (p.schlechtestes && B.istZahl(p.schlechtestes.vor_steuer) && B.istZahl(vor) && p.schlechtestes.vor_steuer > vor + 0.005) gruende.push(`Im Jahr ${p.schlechtestes.jahr} steigt die Zuzahlung vor Steuer auf Ø ${B.euro(p.schlechtestes.vor_steuer)} im Monat – die Einordnung gilt nicht automatisch für alle Jahre.`);
    let gesamt;
    if (wunsch === 'oberhalb' || tragbar === 'nicht_tragbar') gesamt = 'passt_nicht';
    else if (wunsch === 'innerhalb' && tragbar === 'tragbar') gesamt = 'passt';
    else gesamt = 'nicht_beurteilbar';
    return { wunschgrenze: wunsch, tragbarkeit: tragbar, gesamt, verbleibend_haushalt: verbleibend, gruende };
  }

  /**
   * Rechnerischer Modellfinanzierungsrahmen (keine Kreditentscheidung):
   * verfügbarer laufender Zuschuss + Objektüberschuss vor Kapitaldienst (mit optionalem Mietabschlag) trägt die Rate.
   * @param {object} p verfuegbar_monat (bereits min(Wunschgrenze, positiver Überschuss)), objekt_ueberschuss_monat,
   *   sollzins_prozent, tilgung_prozent, eigenkapital, nebenkostenquote_prozent
   */
  function finanzierungsrahmen(p) {
    const hinweise = ['Rechnerischer Rahmen aus Budget und Konditionen – keine Kreditentscheidung einer Bank.'];
    const verfuegbar = Math.max(0, p.verfuegbar_monat || 0);
    const objekt = p.objekt_ueberschuss_monat || 0;
    const fuerRate = verfuegbar + objekt;
    const annuitaet = B.dezimal(p.sollzins_prozent) + B.dezimal(p.tilgung_prozent);
    if (!(annuitaet > 0)) return { darlehen_max: null, kaufpreis_max: null, rate_tragbar: B.cent(fuerRate), hinweise: hinweise.concat('Sollzins und Tilgung zusammen müssen größer 0 sein.') };
    const darlehen = Math.max(0, fuerRate * 12 / annuitaet);
    const kaufpreis = B.istZahl(p.nebenkostenquote_prozent) ? (darlehen + (p.eigenkapital || 0)) / (1 + B.dezimal(p.nebenkostenquote_prozent)) : null;
    if (objekt) hinweise.push('Enthält den Überschuss der betrachteten Wohnung vor Zins und Tilgung; ändern sich Miete oder Kosten, ändert sich der Rahmen.');
    return { darlehen_max: B.cent(darlehen), kaufpreis_max: kaufpreis === null ? null : B.cent(kaufpreis), rate_tragbar: B.cent(fuerRate), hinweise };
  }

  const api = { AUSGABEN, haushaltsrechnung, einordnung, finanzierungsrahmen };
  if (nodeModul) module.exports = api;
  else (root.ImmoRechenkern = root.ImmoRechenkern || {}).haushalt = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* src/rechenkern/objekt.js */
/*
 * ImmoInvest Rechenkern – Immobilienanalyse (Schema 1.0) in Recheneingaben übersetzen
 *
 * Die importierte Analyse wird nur gelesen, nie verändert. Jeder Wert trägt Pfad, Belegstatus und
 * gegebenenfalls einen offenen Widerspruch. Unbekannte oder widersprüchliche Werte bleiben null und
 * müssen im persönlichen Objektszenario bewusst angenommen werden.
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const B = nodeModul ? require('./basis.js') : root.ImmoRechenkern.basis;

  const FELDER = {
    kaufpreis_eur: '/objekt/kaufpreis_eur',
    verpflichtende_zusatzkaeufe_eur: '/objekt/verpflichtende_zusatzkaeufe_eur',
    grunderwerbsteuer_prozent: '/ist_kosten_und_ertraege/grunderwerbsteuer_prozent',
    kaeuferprovision_prozent: '/ist_kosten_und_ertraege/kaeuferprovision_prozent',
    notar_grundbuch_eur: '/ist_kosten_und_ertraege/notar_grundbuch_eur',
    anfaengliche_massnahmen_eur: '/ist_kosten_und_ertraege/anfaengliche_massnahmen_eur',
    kaltmiete_monat_eur: '/ist_kosten_und_ertraege/nettokaltmiete_monat_eur',
    bk_vorauszahlung_monat_eur: '/ist_kosten_und_ertraege/betriebskostenvorauszahlung_monat_eur',
    hausgeld_monat_eur: '/ist_kosten_und_ertraege/hausgeld_monat_eur',
    umlagefaehig_monat_eur: '/ist_kosten_und_ertraege/hausgeld_umlagefaehig_monat_eur',
    nicht_umlagefaehig_monat_eur: '/ist_kosten_und_ertraege/hausgeld_nicht_umlagefaehig_ohne_ruecklage_monat_eur',
    ruecklage_monat_eur: '/weg/ruecklagenzufuehrung_wohnung_monat_eur',
    fertigstellung_jahr: '/objekt/baujahr',
  };

  /**
   * Modellannahmen der Analyse (Abschnitt „annahmen“), die als Vorschlag für offene Rechenwerte taugen.
   * Die Parameternamen der KI-Exporte schwanken („Basis: …: gebaeudeanteil_prozent“); gelesen wird der Teil
   * nach dem letzten Doppelpunkt. Sensitivitätswerte (niedrig/hoch, hypothetisch) sind bewusst nicht zugeordnet.
   */
  const ANNAHME_PARAMETER = {
    gebaeudeanteil_prozent: { namen: ['gebaeudeanteil_prozent'], einheit: 'prozent' },
    anfaengliche_massnahmen_eur: { namen: ['anfaengliche_massnahmen_modell_eur', 'anfaengliche_massnahmen_eur'], einheit: 'eur' },
    verpflichtende_zusatzkaeufe_eur: { namen: ['zusatzkauf_modell_eur', 'zusatzkaeufe_modell_eur', 'verpflichtende_zusatzkaeufe_eur'], einheit: 'eur' },
    nicht_umlagefaehig_monat_eur: { namen: ['laufende_abziehbare_kosten_monat_eur', 'laufende_abziehbare_eigentuemeraufwendungen_monat_eur', 'nicht_umlagefaehig_monat_eur'], einheit: 'eur_monat' },
    ruecklage_monat_eur: { namen: ['weg_reserve_modell_monat_eur', 'weg_ruecklage_modell_monat_eur', 'ruecklage_monat_eur'], einheit: 'eur_monat' },
    notar_grundbuch_prozent: { namen: ['notar_grundbuch_prozent'], einheit: 'prozent' },
  };
  const UNGEKLAERT = ['weitere_ungeklaerte_kosten_monat_eur'];

  function einheitPasst(einheit, soll) {
    const e = String(einheit ?? '').toLowerCase();
    if (soll === 'prozent') return e === '' || /prozent|%/.test(e);
    if (/jahr/.test(e)) return false;
    return e === '' || /eur|€/.test(e);
  }

  /** Liefert je Rechenwert den häufigsten Wert (Basisszenario bevorzugt) samt Alternativen und Belegen. */
  function annahmeVorschlaege(daten) {
    const kandidaten = {};
    let ungeklaert = null;
    for (const a of Array.isArray(daten.annahmen) ? daten.annahmen : []) {
      if (!a || typeof a.parameter !== 'string' || !B.istZahl(a.wert) || a.wert < 0) continue;
      const teile = a.parameter.split(':');
      const name = teile[teile.length - 1].trim().toLowerCase();
      const basis = teile.length === 1 || /basis/i.test(teile.slice(0, -1).join(':'));
      if (UNGEKLAERT.includes(name) && a.wert > 0 && basis) ungeklaert = Math.max(ungeklaert || 0, a.wert);
      for (const [key, def] of Object.entries(ANNAHME_PARAMETER)) {
        if (!def.namen.includes(name) || !einheitPasst(a.einheit, def.einheit) || (def.einheit === 'prozent' && a.wert > 100)) continue;
        (kandidaten[key] = kandidaten[key] || []).push({ wert: a.wert, basis, id: a.id ?? null, begruendung: typeof a.begruendung === 'string' ? a.begruendung : null, parameter: a.parameter });
      }
    }
    const out = {};
    for (const [key, liste] of Object.entries(kandidaten)) {
      const auswahl = liste.some(k => k.basis) ? liste.filter(k => k.basis) : liste;
      const haeufigkeit = new Map();
      for (const k of auswahl) haeufigkeit.set(k.wert, (haeufigkeit.get(k.wert) || 0) + 1);
      const wert = [...haeufigkeit].sort((x, y) => y[1] - x[1])[0][0];
      const treffer = auswahl.filter(k => k.wert === wert);
      out[key] = {
        wert,
        alternativen: [...new Set(liste.map(k => k.wert).filter(w => w !== wert))],
        annahme_ids: [...new Set(treffer.map(k => k.id).filter(Boolean))],
        begruendung: (treffer.find(k => k.begruendung) || {}).begruendung || null,
      };
    }
    return { werte: out, ungeklaert_monat_eur: ungeklaert };
  }

  function lesen(daten, pfad) {
    let cur = daten;
    for (const teil of pfad.slice(1).split('/')) {
      if (cur === null || typeof cur !== 'object' || !(teil in cur)) return undefined;
      cur = cur[teil];
    }
    return cur;
  }

  /** Objektschlüssel wie im Viewer: Plattform und Plattform-ID, sonst Objektnummer oder URL. */
  function schluessel(daten) {
    const a = (daten && daten.angebot) || {};
    if (a.plattform_id != null) return `${String(a.plattform || '').toLowerCase()}|${a.plattform_id}`;
    if (a.anbieter_objektnummer) return `obj|${a.anbieter_objektnummer}`;
    if (a.url) return `url|${a.url}`;
    return null;
  }

  function ausImmobilie(daten) {
    const belege = new Map();
    for (const b of Array.isArray(daten.datenbelege) ? daten.datenbelege : []) if (b && typeof b.feldpfad === 'string' && !belege.has(b.feldpfad)) belege.set(b.feldpfad, b);
    const offen = new Map();
    for (const w of Array.isArray(daten.widersprueche) ? daten.widersprueche : []) if (w && w.status !== 'aufgeloest' && typeof w.feldpfad === 'string') offen.set(w.feldpfad, w);
    const felder = {};
    for (const [key, pfad] of Object.entries(FELDER)) {
      const roh = lesen(daten, pfad);
      const beleg = belege.get(pfad);
      const w = offen.get(pfad);
      const wert = !w && B.istZahl(roh) ? roh : null;
      felder[key] = {
        wert, pfad,
        belegstatus: w ? 'widerspruechlich' : wert === null ? (beleg?.status === 'nicht_anwendbar' ? 'nicht_anwendbar' : 'unbekannt') : (beleg?.status || 'ohne_beleg'),
        widerspruch: w ? { id: w.id, varianten: (w.varianten || []).map(v => ({ wert: v.wert, einheit: v.einheit ?? null, hinweis: v.hinweis ?? null })) } : null,
        hinweis: beleg?.hinweis ?? null,
      };
    }
    if (felder.fertigstellung_jahr.wert !== null) felder.fertigstellung_jahr.hinweis = 'Baujahr laut Analyse als Fertigstellungsjahr übernommen (für den AfA-Satz maßgeblich).';
    const hinweise = [];
    const a = daten.angebot || {};
    const anwendbar = a.angebotsart === 'kauf';
    if (!anwendbar) hinweise.push(`Kein Kaufangebot (Angebotsart „${a.angebotsart ?? 'unbekannt'}“) – eine persönliche Finanzierungsrechnung ist nicht anwendbar.`);
    if (/erbbau/i.test(String(a.objektart || '') + ' ' + String(a.titel || ''))) hinweise.push('Erbbaurecht: Erbbauzins und Grundstücksanteil sind gesondert zu prüfen; der Gebäudeanteil für die AfA weicht vom Normalfall ab.');
    const hg = felder.hausgeld_monat_eur.wert, u = felder.umlagefaehig_monat_eur.wert, n = felder.nicht_umlagefaehig_monat_eur.wert, r = felder.ruecklage_monat_eur.wert;
    if ([hg, u, n, r].every(B.istZahl) && Math.abs(u + n + r - hg) > 1) hinweise.push(`Hausgeldaufteilung passt nicht zum Gesamtbetrag (${B.euro(u + n + r)} statt ${B.euro(hg)}) – bitte klären.`);
    const s = daten.standort || {};
    return { anwendbar, felder, hinweise, vorschlaege: annahmeVorschlaege(daten), schluessel: schluessel(daten), titel: a.titel || [a.objektart, s.ort].filter(Boolean).join(' in ') || 'Objekt', ort: s.ort || null };
  }

  const api = { FELDER, ANNAHME_PARAMETER, lesen, schluessel, annahmeVorschlaege, ausImmobilie };
  if (nodeModul) module.exports = api;
  else (root.ImmoRechenkern = root.ImmoRechenkern || {}).objekt = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* src/rechenkern/szenario.js */
/*
 * ImmoInvest Rechenkern – persönliches Objektszenario: Kapitalbedarf, Cashflow, Steuerwirkung, Jahresverlauf
 *
 * Priorität der Eingaben: ausdrückliche Objektanpassung > belegter Objektwert > Profilwert > sichtbare Standardannahme.
 * Unbekannte oder widersprüchliche Pflichtwerte bleiben null; die betroffene Teilrechnung gilt dann als unvollständig,
 * statt mit stillschweigenden Nullwerten weiterzurechnen.
 *
 * Steuerliche Kategorien (jede Zahlung genau eine):
 *   Einnahmen: Nettokaltmiete, Betriebskostenvorauszahlungen.
 *   Sofort abziehbar: umlagefähige Kosten, nicht umlagefähige Eigentümerkosten, Schuldzinsen, Finanzierungsgebühren
 *                     (Geldbeschaffungskosten), Erhaltungsaufwand (sofern nicht anschaffungsnah).
 *   AfA: Gebäudeanteil der Anschaffungskosten inkl. Nebenkosten, Herstellungskosten, anschaffungsnahe Aufwendungen.
 *   Nicht abziehbar: Tilgung, Sondertilgung, WEG-Rücklagenzuführung (erst bei Verausgabung, BFH IX R 19/24),
 *                    eigene Vorsorge (Umbuchung auf ein eigenes Konto).
 */
(function (root) {
  'use strict';
  const nodeModul = typeof module === 'object' && module.exports;
  const RK = nodeModul ? null : root.ImmoRechenkern;
  const B = nodeModul ? require('./basis.js') : RK.basis;
  const R = nodeModul ? require('./steuerregeln.js') : RK.steuerregeln;
  const S = nodeModul ? require('./steuer.js') : RK.steuer;
  const D = nodeModul ? require('./darlehen.js') : RK.darlehen;
  const A = nodeModul ? require('./afa.js') : RK.afa;
  const H = nodeModul ? require('./haushalt.js') : RK.haushalt;
  const O = nodeModul ? require('./objekt.js') : RK.objekt;

  const EINGABEN = [
    { key: 'kaufpreis_eur', label: 'Kaufpreis', einheit: 'eur', gruppe: 'erwerb', objekt: true, komponente: 'finanzierung' },
    { key: 'verpflichtende_zusatzkaeufe_eur', label: 'Verpflichtende Zusatzkäufe', einheit: 'eur', gruppe: 'erwerb', objekt: true, komponente: 'finanzierung' },
    { key: 'grunderwerbsteuer_prozent', label: 'Grunderwerbsteuer (Standort der Immobilie)', einheit: 'prozent', gruppe: 'erwerb', objekt: true, komponente: 'finanzierung' },
    { key: 'kaeuferprovision_prozent', label: 'Käuferprovision inkl. USt', einheit: 'prozent', gruppe: 'erwerb', objekt: true, komponente: 'finanzierung' },
    { key: 'notar_grundbuch_prozent', label: 'Notar und Grundbuch', einheit: 'prozent', gruppe: 'erwerb', profil: 'finanzierung.notar_grundbuch_prozent', komponente: 'finanzierung' },
    { key: 'anfaengliche_massnahmen_eur', label: 'Anfängliche Maßnahmen', einheit: 'eur', gruppe: 'erwerb', objekt: true, komponente: 'finanzierung' },

    { key: 'bk_vorauszahlung_monat_eur', label: 'Betriebskostenvorauszahlung des Mieters', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'umlagefaehig_monat_eur', label: 'Umlagefähige Kosten (tatsächlich)', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'nicht_umlagefaehig_monat_eur', label: 'Nicht umlagefähige Eigentümerkosten (ohne Rücklage)', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'ruecklage_monat_eur', label: 'WEG-Erhaltungsrücklage', einheit: 'eur_monat', gruppe: 'miete', objekt: true, komponente: 'cashflow' },
    { key: 'vorsorge_monat_eur', label: 'Eigene zusätzliche Vorsorge', einheit: 'eur_monat', gruppe: 'miete', profil: 'kapital.vorsorge_monat_eur', standard: 0 },
    { key: 'mietausfall_prozent', label: 'Pauschaler Kaltmietausfall', einheit: 'prozent', gruppe: 'miete', standard: 0 },

    { key: 'kostensteigerung_prozent', label: 'Kostensteigerung pro Jahr (Annahme)', einheit: 'prozent', gruppe: 'miete', standard: 0 },
    { key: 'gebaeudeanteil_prozent', label: 'Gebäudeanteil an den Anschaffungskosten', einheit: 'prozent', gruppe: 'steuer', komponente: 'steuer' },
    { key: 'fertigstellung_jahr', label: 'Fertigstellungsjahr des Gebäudes', einheit: 'jahr', gruppe: 'steuer', objekt: true, komponente: 'steuer' },

  const EINGABE = Object.fromEntries(EINGABEN.map(e => [e.key, e]));

  const holen = (obj, pfad) => pfad.split('.').reduce((a, k) => (a == null ? undefined : a[k]), obj);

  /** Wirksame Werte mit Herkunft, Status und den Vergleichswerten aus Objekt und Profil. */
  function wirksameEingaben(objekt, profil, os) {
    const anp = (os && os.anpassungen) || {};
    const out = {};
    for (const def of EINGABEN) {
      const f = def.objekt ? objekt.felder[def.key] : null;
      const profilWert = def.profil ? holen(profil, def.profil) : undefined;
      const basis = { key: def.key, label: def.label, einheit: def.einheit, gruppe: def.gruppe, komponente: def.komponente || null, objekt_wert: f ? f.wert : undefined, objekt_status: f ? f.belegstatus : undefined, objekt_pfad: f ? f.pfad : undefined, widerspruch: f ? f.widerspruch : null, profil_wert: profilWert, hinweis: f ? f.hinweis : null };
      const a = anp[def.key];
      if (a && a.wert !== undefined && a.wert !== null) out[def.key] = { ...basis, wert: a.wert, herkunft: 'anpassung', status: 'annahme', begruendung: a.begruendung || null, anpassung_quelle: a.quelle || null, annahme_id: a.annahme_id || null };
      else if (f && f.wert !== null) out[def.key] = { ...basis, wert: f.wert, herkunft: 'objekt', status: f.belegstatus };
      else if (def.profil && B.istZahl(profilWert)) out[def.key] = { ...basis, wert: profilWert, herkunft: 'profil', status: 'profilangabe' };
      else if (def.standard !== undefined) out[def.key] = { ...basis, wert: def.standard, herkunft: 'standard', status: 'annahme', hinweis: 'Standardannahme, änderbar.' };
      else out[def.key] = { ...basis, wert: null, herkunft: f ? 'objekt' : def.profil ? 'profil' : 'szenario', status: f ? f.belegstatus : profilWert === null ? 'unbekannt' : 'nicht_angegeben' };
    }
    // Ein in der Analyse belegter Eurobetrag für Notar/Grundbuch geht der Prozentannahme des Profils vor.
    const notarEur = objekt.felder.notar_grundbuch_eur;
    if (out.notar_grundbuch_prozent.herkunft !== 'anpassung' && notarEur && notarEur.wert !== null) {
      out.notar_grundbuch_prozent = { ...out.notar_grundbuch_prozent, wert: null, betrag_eur: notarEur.wert, herkunft: 'objekt', status: notarEur.belegstatus, objekt_pfad: notarEur.pfad };
    }
    return out;
  }

  /** Alle Konditionen: allgemeine aus dem Profil, objektspezifische Angebote aus dem Szenario. */
  function alleKonditionen(profil, os) {
    const p = (profil.finanzierung && profil.finanzierung.konditionen) || [];
    const o = (os && os.konditionen_objekt) || [];
    return p.map(k => ({ ...k, quelle: 'profil' })).concat(o.map(k => ({ ...k, quelle: 'objekt' })));
  }

  const KATEGORIE = { erhaltung: 'Erhaltungsaufwand, sofort abziehbar', herstellung: 'Herstellungskosten, über AfA', nicht_abziehbar: 'nicht abziehbar' };

  const VARIANTEN = {
    zins: { label: 'Anderer Sollzins', feld: 'sollzins_prozent' },
    tilgung: { label: 'Andere anfängliche Tilgung', feld: 'tilgung_prozent' },
    eigenkapital: { label: 'Anderes Eigenkapital', feld: 'eigenkapital_einsatz_eur' },
    kosten: { label: 'Höhere Eigentümerkosten', feld: 'aufschlag_prozent' },
    kaltmietausfall: { label: 'Kaltmietausfall', feld: 'monate' },
    leerstand: { label: 'Vollständiger Leerstand', feld: 'monate' },
    sonderumlage: { label: 'Einmalige Sonderumlage oder Reparatur', feld: 'betrag_eur' },
    anschluss: { label: 'Anschlussfinanzierung', feld: 'sollzins_prozent' },
    miete: { label: 'Hypothetische Miete', feld: 'kaltmiete_monat_eur' },
    kaufpreis: { label: 'Hypothetischer Kaufpreis', feld: 'kaufpreis_eur' },
    steuersatz: { label: 'Anderer manueller Steuersatz', feld: 'satz_prozent' },
  };

  /** Wendet eine Variante an und dokumentiert jede Änderung gegenüber dem Ausgangsfall. */
  function wendeVarianteAn(eingaben, kondition, variante) {
    const e = Object.fromEntries(Object.entries(eingaben).map(([k, v]) => [k, { ...v }]));
    const k = kondition ? { ...kondition, anschluss: kondition.anschluss ? { ...kondition.anschluss } : null } : null;
    const p = variante.parameter || {};
    const aenderungen = [], ereignisse = [];
    let steuersaetze = null;
    const setze = (key, wert, label) => { aenderungen.push({ feld: label, vorher: e[key].wert, nachher: wert }); e[key] = { ...e[key], wert, herkunft: 'variante', status: 'annahme' }; };
    switch (variante.typ) {
      case 'zins': if (k) { aenderungen.push({ feld: 'Sollzins (%)', vorher: k.sollzins_prozent, nachher: p.sollzins_prozent }); k.sollzins_prozent = p.sollzins_prozent; } break;
      case 'tilgung': if (k) { aenderungen.push({ feld: 'Anfängliche Tilgung (%)', vorher: k.tilgung_prozent, nachher: p.tilgung_prozent }); k.tilgung_prozent = p.tilgung_prozent; k.monatsrate_eur = null; } break;
      case 'eigenkapital': setze('eigenkapital_einsatz_eur', p.eigenkapital_einsatz_eur, 'Eingesetztes Eigenkapital (€)'); break;
      case 'kosten': {
        const f = 1 + B.dezimal(p.aufschlag_prozent || 0);
        for (const key of ['nicht_umlagefaehig_monat_eur', 'ruecklage_monat_eur']) if (B.istZahl(e[key].wert)) setze(key, B.cent(e[key].wert * f), `${EINGABE[key].label} (€/Monat)`);
        break;
      }
      case 'kaltmietausfall': case 'leerstand':
        ereignisse.push({ art: variante.typ, modelljahr: p.modelljahr || 1, monate: Math.min(12, Math.max(0, p.monate || 0)) });
        aenderungen.push({ feld: variante.typ === 'leerstand' ? 'Leerstand (Kaltmiete und Vorauszahlungen entfallen)' : 'Kaltmietausfall (Vorauszahlungen laufen weiter)', vorher: null, nachher: `${p.monate || 0} Monate im Modelljahr ${p.modelljahr || 1}` });
        break;
      case 'sonderumlage':
        ereignisse.push({ art: 'sonderumlage', modelljahr: p.modelljahr || 1, betrag: p.betrag_eur || 0, kategorie: p.kategorie || 'erhaltung' });
        aenderungen.push({ feld: 'Einmalige Zahlung', vorher: null, nachher: `${B.euro(p.betrag_eur || 0)} im Modelljahr ${p.modelljahr || 1} (${KATEGORIE[p.kategorie || 'erhaltung'] || p.kategorie})` });
        break;
      case 'anschluss': if (k) { aenderungen.push({ feld: 'Anschlusszins (%)', vorher: k.anschluss ? k.anschluss.sollzins_prozent : null, nachher: p.sollzins_prozent }); k.anschluss = { regel: (k.anschluss && k.anschluss.regel) || 'rate_beibehalten', tilgung_prozent: k.anschluss ? k.anschluss.tilgung_prozent : null, sollzins_prozent: p.sollzins_prozent }; } break;
      case 'miete': setze('kaltmiete_monat_eur', p.kaltmiete_monat_eur, 'Nettokaltmiete (€/Monat, hypothetisch)'); break;
      case 'kaufpreis': setze('kaufpreis_eur', p.kaufpreis_eur, 'Kaufpreis (€, hypothetisch)'); break;
      case 'steuersatz': steuersaetze = [p.satz_prozent]; aenderungen.push({ feld: 'Manueller Steuersatz (%)', vorher: null, nachher: p.satz_prozent }); break;
      default: aenderungen.push({ feld: 'Unbekannter Variantentyp', vorher: null, nachher: variante.typ });
    }
    return { eingaben: e, kondition: k, ereignisse, aenderungen, steuersaetze };
  }

  /** Eigentums- bzw. Ergebnisanteile für die getrennte Veranlagung; null bei ungeklärter Zuordnung. */
  function anteileFuerSteuer(profil, os) {
    const ids = (profil.personen || []).map(p => p.id);
    const e = (os && os.eigentum) || {};
    const pruefe = anteile => anteile && ids.every(id => B.istZahl(anteile[id]) && anteile[id] >= 0) && Math.abs(ids.reduce((a, id) => a + anteile[id], 0) - 100) < 1e-6;
    if (!pruefe(e.anteile_prozent)) return { anteile: null, grund: 'Eigentumsanteile fehlen oder ergeben nicht 100 %.' };
    if (!e.bestaetigt) return { anteile: null, grund: 'Eigentumsanteile sind noch nicht ausdrücklich bestätigt.' };
    if (e.kostentraeger_abweichend) {
      if (!pruefe(e.ergebnisanteile_prozent) || !String(e.zuordnung_dokumentation || '').trim()) return { anteile: null, grund: 'Eigentümer, Darlehensnehmer oder Kostenträger weichen ab – gesonderte, dokumentierte Ergebniszuordnung erforderlich.' };
      return { anteile: e.ergebnisanteile_prozent, hinweis: 'Dokumentierte abweichende Ergebniszuordnung verwendet – steuerliche Anerkennung nicht geprüft.' };
    }
    return { anteile: e.anteile_prozent };
  }

  /**
   * Hauptrechnung.
   * @param {{immobilie: object, profil: object, objektszenario?: object, kondition_id?: string, variante?: object}} eingang
   */
  function berechne(eingang) {
    return ebeneDerOffenenAngaben(rechne(eingang));
  }

  function rechne(eingang) {
    const profil = eingang.profil || {};
    const os = eingang.objektszenario || {};
    const objekt = O.ausImmobilie(eingang.immobilie || {});
    const res = { rechenkern_version: R.RECHENKERN_VERSION, anwendbar: objekt.anwendbar, objekt: { titel: objekt.titel, schluessel: objekt.schluessel, ort: objekt.ort }, hinweise: objekt.hinweise.slice(), annahmen: [], offen: [], status: { finanzierung: 'unvollstaendig', cashflow: 'unvollstaendig', steuer: 'unvollstaendig', haushalt: 'unvollstaendig' } };
    res.haushalt = H.haushaltsrechnung(profil);
    res.status.haushalt = res.haushalt.vollstaendig ? 'vollstaendig' : 'unvollstaendig';
    if (!objekt.anwendbar) return res;

    const konditionen = alleKonditionen(profil, os);
    const gewuenscht = eingang.kondition_id || os.aktive_kondition_id || (profil.finanzierung && profil.finanzierung.standard_kondition_id);
    let kondition = konditionen.find(k => k.id === gewuenscht) || konditionen[0] || null;
    let eingaben = wirksameEingaben(objekt, profil, os);
    let ereignisse = [], steuersaetzeVariante = null;
    if (eingang.variante) {
      const v = wendeVarianteAn(eingaben, kondition, eingang.variante);
      eingaben = v.eingaben; kondition = v.kondition; ereignisse = v.ereignisse; steuersaetzeVariante = v.steuersaetze;
      res.variante = { id: eingang.variante.id || null, typ: eingang.variante.typ, bezeichnung: eingang.variante.bezeichnung || (VARIANTEN[eingang.variante.typ] || {}).label || eingang.variante.typ, aenderungen: v.aenderungen };
    }
    res.eingaben = eingaben;
    res.kondition = kondition;
    const w = key => eingaben[key].wert;
    for (const e of Object.values(eingaben)) {
      if (e.komponente && e.wert === null && !(e.key === 'notar_grundbuch_prozent' && B.istZahl(e.betrag_eur))) {
        res.offen.push({ feld: e.key, label: e.label, komponente: e.komponente, grund: e.status === 'widerspruechlich' ? 'in der Analyse widersprüchlich' : e.status === 'nicht_anwendbar' ? 'in der Analyse nicht anwendbar (z. B. Leerstand) – Szenarioannahme setzen' : 'unbekannt' });
      }
      if (e.herkunft === 'standard') res.annahmen.push(`${e.label}: ${e.wert} (Standardannahme)`);
      if (e.herkunft === 'anpassung') res.annahmen.push(e.anpassung_quelle === 'analyse' || e.anpassung_quelle === 'annahme' ? `${e.label}: ${e.wert} (${e.begruendung || 'übernommene Annahme'})` : `${e.label}: ${e.wert} (Objektanpassung${e.begruendung ? ' – ' + e.begruendung : ''})`);
    }
    if (eingaben.notar_grundbuch_prozent.herkunft === 'profil') res.annahmen.push(`Notar und Grundbuch: ${w('notar_grundbuch_prozent')} % des Kaufpreises (Profilannahme, keine Gebührenberechnung).`);
    res.vorschlaege = vorschlaege(objekt, eingaben);

    // 1. Kapitalbedarf und Darlehen
    const kp = w('kaufpreis_eur');
    const offenFin = res.offen.filter(o => o.komponente === 'finanzierung');
    const posten = [];
    const add = (bezeichnung, betrag, art) => { posten.push({ bezeichnung, betrag: B.istZahl(betrag) ? B.cent(betrag) : null, art }); return betrag; };
    add('Kaufpreis', kp, 'kaufpreis');
    const grest = add('Grunderwerbsteuer', B.istZahl(kp) && B.istZahl(w('grunderwerbsteuer_prozent')) ? kp * B.dezimal(w('grunderwerbsteuer_prozent')) : null, 'nebenkosten');
    const notar = add('Notar und Grundbuch', B.istZahl(eingaben.notar_grundbuch_prozent.betrag_eur) ? eingaben.notar_grundbuch_prozent.betrag_eur : B.istZahl(kp) && B.istZahl(w('notar_grundbuch_prozent')) ? kp * B.dezimal(w('notar_grundbuch_prozent')) : null, 'nebenkosten');
    const prov = add('Käuferprovision', B.istZahl(kp) && B.istZahl(w('kaeuferprovision_prozent')) ? kp * B.dezimal(w('kaeuferprovision_prozent')) : null, 'nebenkosten');
    const zusatz = add('Verpflichtende Zusatzkäufe', w('verpflichtende_zusatzkaeufe_eur'), 'zusatz');
    const massnahmen = add('Anfängliche Maßnahmen', w('anfaengliche_massnahmen_eur'), 'massnahmen');
    const gebuehren = kondition && B.istZahl(kondition.gebuehren_eur) ? kondition.gebuehren_eur : 0;
    if (gebuehren) add('Finanzierungsgebühren', gebuehren, 'gebuehren');
    const kapitalVollstaendig = posten.every(p => p.betrag !== null);
    const kapitalbedarf = kapitalVollstaendig ? B.cent(B.summe(posten.map(p => p.betrag))) : null;
    const ek = w('eigenkapital_einsatz_eur');
    res.kapital = { posten, kapitalbedarf, eigenkapital_verfuegbar: ek, notfallreserve: holen(profil, 'kapital.notfallreserve_eur') ?? null, hinweise: [] };
    let darlehen = null;
    if (kapitalbedarf !== null && B.istZahl(ek)) {
      const bedarf = Math.max(0, kapitalbedarf - ek);
      res.kapital.eigenkapital_eingesetzt = B.cent(Math.min(ek, kapitalbedarf));
      res.kapital.darlehensbedarf = B.cent(bedarf);
      if (ek > kapitalbedarf) res.kapital.hinweise.push(`Das eingesetzte Eigenkapital übersteigt den Kapitalbedarf; ${B.euro(ek - kapitalbedarf)} werden nicht benötigt.`);
      darlehen = bedarf;
      if (kondition && B.istZahl(kondition.darlehensbetrag_eur)) {
        darlehen = kondition.darlehensbetrag_eur;
        if (darlehen < bedarf) res.kapital.finanzierungsluecke = B.cent(bedarf - darlehen);
        if (darlehen > bedarf) res.kapital.ueberfinanzierung = B.cent(darlehen - bedarf);
      }
      res.kapital.darlehen = B.cent(darlehen);
    }
    if (res.kapital.finanzierungsluecke) res.hinweise.push(`Finanzierungslücke: ${B.euro(res.kapital.finanzierungsluecke)} sind weder durch Eigenkapital noch durch das Darlehen gedeckt.`);
    let konditionFehler = {};
    if (darlehen > 0) {
      if (!kondition) konditionFehler = { kondition: 'Keine Finanzierungskondition vorhanden.' };
      else konditionFehler = D.pruefeKondition(kondition);
      for (const [feld, text] of Object.entries(konditionFehler)) res.offen.push({ feld: `kondition.${feld}`, label: text, komponente: 'finanzierung', grund: 'Kondition unvollständig' });
    }
    const finanzierungOk = offenFin.length === 0 && darlehen !== null && Object.keys(konditionFehler).length === 0;
    const beginn = (kondition && kondition.beginn) || os.beginn || null;
    if (finanzierungOk && B.monatIndex(beginn) === null) res.offen.push({ feld: 'beginn', label: 'Beginn (Monat des Erwerbs bzw. der ersten Rate)', komponente: 'finanzierung', grund: 'fehlt' });
    res.status.finanzierung = finanzierungOk && B.monatIndex(beginn) !== null ? 'vollstaendig' : 'unvollstaendig';
    if (res.status.finanzierung !== 'vollstaendig') return res;

    // 2. Tilgungsplan
    const bindungJahre = darlehen > 0 ? kondition.zinsbindung_jahre : 0;
    const betrachtung = holen(profil, 'kapital.betrachtung_jahre');
    const horizontJahre = Math.min(30, Math.max(B.istZahl(betrachtung) ? betrachtung : 0, bindungJahre || 0, 1));
    const plan = darlehen > 0
      ? D.tilgungsplan({ darlehen, sollzins_prozent: kondition.sollzins_prozent, tilgung_prozent: kondition.tilgung_prozent, monatsrate_eur: kondition.monatsrate_eur, zinsbindung_monate: bindungJahre * 12, horizont_monate: horizontJahre * 12, sondertilgung_jahr_eur: kondition.sondertilgung_jahr_eur, anschluss: kondition.anschluss || null })
      : D.tilgungsplan({ darlehen: 0, zinsbindung_monate: horizontJahre * 12, horizont_monate: horizontJahre * 12 });
    res.plan = { rate: plan.rate, rate_anschluss: plan.rate_anschluss, zinsbindung_monate: bindungJahre * 12, modelliert_bis: plan.modelliert_bis, getilgt_im_monat: plan.getilgt_im_monat, hinweise: plan.hinweise, horizont_jahre: horizontJahre };
    if (darlehen > 0) {
      const ende = plan.monate[bindungJahre * 12 - 1];
      res.plan.restschuld_ende_bindung = ende ? B.cent(ende.restschuld) : null;
      const s = D.summen(plan, 1, bindungJahre * 12);
      res.plan.zinsen_bindung = s.zins; res.plan.tilgung_bindung = B.cent(s.tilgung + s.sondertilgung);
      if (kondition.art !== 'angebot') res.annahmen.push(`Kondition „${kondition.bezeichnung || kondition.id}“ ist eine Modellannahme, kein Angebot.`);
    } else { res.plan.restschuld_ende_bindung = 0; res.plan.zinsen_bindung = 0; res.plan.tilgung_bindung = 0; }

    // 3. Cashflow-Eingaben prüfen
    const offenCf = res.offen.filter(o => o.komponente === 'cashflow');
    res.status.cashflow = offenCf.length === 0 ? 'vollstaendig' : 'unvollstaendig';
    if (res.status.cashflow !== 'vollstaendig') return res;

    // 4. AfA
    const gebaeudeanteil = w('gebaeudeanteil_prozent');
    const fertig = w('fertigstellung_jahr');
    const afaBeginn = os.afa_beginn || beginn;
    if (!os.afa_beginn) res.annahmen.push('AfA-Beginn = Beginn der Finanzierung (Übergang von Besitz, Nutzen und Lasten angenommen).');
    const anschaffungsnebenkosten = grest + notar + prov;
    res.annahmen.push('Notar- und Grundbuchkosten vollständig als Anschaffungsnebenkosten behandelt (Grundschuldkosten wären sofort abziehbar – vorsichtige Vereinfachung).');
    const massnahmenKategorie = os.massnahmen_kategorie || 'erhaltung';
    const startIdx = B.monatIndex(beginn);
    const erhaltung = [];
    if (massnahmen > 0 && massnahmenKategorie === 'erhaltung') erhaltung.push({ betrag: massnahmen, monat_nach_erwerb: 0, quelle: 'anfaenglich' });
    for (const ev of ereignisse) if (ev.art === 'sonderumlage' && ev.kategorie === 'erhaltung' && ev.betrag > 0) erhaltung.push({ betrag: ev.betrag, monat_nach_erwerb: (ev.modelljahr - 1) * 12, quelle: 'sonderumlage' });
    const vorlaeufig = A.bemessung({ kaufpreis: kp, zusatzkaeufe: zusatz, anschaffungsnebenkosten, gebaeudeanteil_prozent: gebaeudeanteil, herstellungskosten: 0 });
    const pruefung = A.anschaffungsnah(erhaltung, vorlaeufig.gebaeude);
    let herstellung = massnahmenKategorie === 'herstellung' ? massnahmen : 0;
    if (pruefung.ausgeloest) {
      herstellung += pruefung.summe;
      res.hinweise.push(`Anschaffungsnahe Herstellungskosten: ${B.euro(pruefung.summe)} Instandsetzung in den ersten drei Jahren übersteigen 15 % der Gebäude-Anschaffungskosten (${B.euro(pruefung.grenze)}) – sie werden über die AfA statt sofort abgezogen (${R.ANSCHAFFUNGSNAH.fundstelle}; vereinfachend ab Erwerb).`);
    }
    const bem = A.bemessung({ kaufpreis: kp, zusatzkaeufe: zusatz, anschaffungsnebenkosten, gebaeudeanteil_prozent: gebaeudeanteil, herstellungskosten: herstellung });
    const regel = A.regelsatz(fertig);
    let satz = regel ? regel.satz_prozent : null;
    const abw = os.afa_abweichend;
    if (abw && B.istZahl(abw.satz_prozent)) {
      if (String(abw.begruendung || '').trim()) { satz = abw.satz_prozent; res.annahmen.push(`Abweichender AfA-Satz ${abw.satz_prozent} % (${abw.begruendung}) – Voraussetzungen und Nachweis nicht geprüft.`); }
      else res.hinweise.push('Abweichender AfA-Satz ohne Begründung wird nicht verwendet.');
    }
    const startJahr = B.monatAusIndex(startIdx).jahr;
    const endIdx = startIdx + Math.max(plan.modelliert_bis, 1) - 1;
    const endJahr = B.monatAusIndex(endIdx).jahr;
    const afaVerlauf = bem.bemessung !== null && satz !== null ? A.verlauf({ bemessung: bem.bemessung, satz_prozent: satz, beginn: afaBeginn, bis_jahr: endJahr }) : null;
    res.afa = { ...bem, satz_prozent: satz, regel: regel ? regel.regel : null, regel_text: regel ? regel.text : null, beginn: afaBeginn, voll_jahr: bem.bemessung !== null && satz !== null ? B.cent(bem.bemessung * B.dezimal(satz)) : null, verlauf: afaVerlauf, anschaffungsnah: pruefung };

    // 5. Monatsrechnung
    const g = key => B.dezimal(w(key) || 0);
    const jahre = new Map();
    const monate = plan.modelliert_bis;
    let kumTilgung = 0;
    const gebuehrenAbzug = gebuehren;
    const sofortErhaltung = !pruefung.ausgeloest && massnahmenKategorie === 'erhaltung' ? massnahmen : 0;
    for (let m = 1; m <= monate; m++) {
      const idx = startIdx + m - 1;
      const { jahr } = B.monatAusIndex(idx);
      const modelljahr = Math.ceil(m / 12), monatImModelljahr = (m - 1) % 12 + 1;
      const fMiete = Math.pow(1 + g('mietsteigerung_prozent'), modelljahr - 1), fKosten = Math.pow(1 + g('kostensteigerung_prozent'), modelljahr - 1);
      const leer = ereignisse.some(e => e.art === 'leerstand' && e.modelljahr === modelljahr && monatImModelljahr <= e.monate);
      const ausfall = leer || ereignisse.some(e => e.art === 'kaltmietausfall' && e.modelljahr === modelljahr && monatImModelljahr <= e.monate);
      const kaltmiete = ausfall ? 0 : w('kaltmiete_monat_eur') * fMiete * (1 - g('mietausfall_prozent'));
      const bk = leer ? 0 : w('bk_vorauszahlung_monat_eur') * fKosten;
      const umlage = w('umlagefaehig_monat_eur') * fKosten, nicht = w('nicht_umlagefaehig_monat_eur') * fKosten, ruecklage = w('ruecklage_monat_eur') * fKosten;
      const pm = plan.monate[m - 1] || { zins: 0, tilgung: 0, sondertilgung: 0, zahlung: 0, restschuld: 0 };
      let einmalig = 0, einmaligAbzug = 0;
      for (const ev of ereignisse) if (ev.art === 'sonderumlage' && ev.modelljahr === modelljahr && monatImModelljahr === 1) {
        einmalig += ev.betrag;
        if (ev.kategorie === 'erhaltung' && !pruefung.ausgeloest) einmaligAbzug += ev.betrag;
      }
      if (m === 1) einmaligAbzug += gebuehrenAbzug + sofortErhaltung;
      const vorsorge = w('vorsorge_monat_eur') || 0;
      kumTilgung += pm.tilgung + pm.sondertilgung;
      if (!jahre.has(jahr)) jahre.set(jahr, { jahr, monate: 0, kaltmiete: 0, bk: 0, umlagefaehig: 0, nicht_umlagefaehig: 0, ruecklage: 0, zins: 0, tilgung: 0, sondertilgung: 0, einmalig: 0, einmalig_abziehbar: 0, vorsorge: 0, restschuld: 0, kum_tilgung: 0, erster_modellmonat: m });
      const j = jahre.get(jahr);
      j.monate++; j.kaltmiete += kaltmiete; j.bk += bk; j.umlagefaehig += umlage; j.nicht_umlagefaehig += nicht; j.ruecklage += ruecklage;
      j.zins += pm.zins; j.tilgung += pm.tilgung; j.sondertilgung += pm.sondertilgung; j.einmalig += einmalig; j.einmalig_abziehbar += einmaligAbzug; j.vorsorge += vorsorge;
      j.restschuld = pm.restschuld; j.kum_tilgung = kumTilgung;
    }

    // 6. Steuer je Kalenderjahr
    const steuer = profil.steuer || {};
    const modus = steuer.modus || null;
    const veranlagung = holen(profil, 'haushalt.veranlagung');
    const steuerOffen = res.offen.filter(o => o.komponente === 'steuer');
    const steuerInfo = { modus, hinweise: [], nicht_beruecksichtigt: S.NICHT_BERUECKSICHTIGT, saetze: null, zve_basis: null, schaetzung: null, anteile: null };
    let steuerBereit = steuerOffen.length === 0 && afaVerlauf !== null;
    if (!modus) { steuerBereit = false; res.offen.push({ feld: 'steuer.modus', label: 'Steuermodus im Profil', komponente: 'steuer', grund: 'fehlt' }); }
    let saetze = null, zveBasis = null, anteile = null;
    if (modus === 'manuell') {
      saetze = (steuersaetzeVariante || steuer.manuelle_saetze_prozent || []).filter(s => B.istZahl(s) && s >= 0 && s <= 100);
      if (!saetze.length) { steuerBereit = false; res.offen.push({ feld: 'steuer.manuelle_saetze_prozent', label: 'Manueller Grenzsteuersatz', komponente: 'steuer', grund: 'fehlt' }); }
      steuerInfo.saetze = saetze;
      steuerInfo.hinweise.push('Vereinfachtes Modell: Das Vermietungsergebnis wird mit dem gewählten Satz bewertet; ein Verlust gilt als voll verrechenbar (Modellannahme). Der Satz ist nicht aus dem Einkommen nachgewiesen.');
    } else if (modus === 'zve' || modus === 'brutto_schaetzung') {
      const fehlerVeranlagung = S.pruefeVeranlagung(veranlagung, (profil.personen || []).length);
      if (fehlerVeranlagung) { steuerBereit = false; res.offen.push({ feld: 'haushalt.veranlagung', label: fehlerVeranlagung, komponente: 'steuer', grund: 'ungültig' }); }
      if (modus === 'zve') {
        zveBasis = veranlagung === 'einzeln_getrennt' ? steuer.zve_personen_eur : steuer.zve_ohne_investition_eur;
        const ok = veranlagung === 'einzeln_getrennt' ? (profil.personen || []).every(p => B.istZahl(zveBasis && zveBasis[p.id]) && zveBasis[p.id] >= 0) : B.istZahl(zveBasis) && zveBasis >= 0;
        if (!ok) { steuerBereit = false; res.offen.push({ feld: 'steuer.zve', label: 'Zu versteuerndes Einkommen ohne diese Investition', komponente: 'steuer', grund: 'fehlt' }); }
        steuerInfo.hinweise.push('Das zu versteuernde Einkommen ohne diese Investition wird für alle Jahre als unverändert angenommen.');
      } else {
        const sch = S.schaetzeZve(profil, holen(profil, 'haushalt.steuerjahr') || 2026);
        steuerInfo.schaetzung = sch;
        zveBasis = sch.zve;
        if (!sch.vollstaendig) { steuerBereit = false; for (const l of sch.luecken) res.offen.push({ feld: l.feld, label: l.text, komponente: 'steuer', grund: 'Schätzung unvollständig' }); }
        steuerInfo.hinweise.push('Geschätztes zu versteuerndes Einkommen aus Bruttoangaben – kein Steuerbescheid und keine Lohnabrechnung; für alle Jahre konstant angenommen.');
        for (const a of sch.annahmen) res.annahmen.push(a);
      }
      if (veranlagung === 'einzeln_getrennt') {
        const z = anteileFuerSteuer(profil, os);
        if (!z.anteile) { steuerBereit = false; res.offen.push({ feld: 'eigentum', label: z.grund, komponente: 'steuer', grund: 'Zuordnung ungeklärt' }); }
        else { anteile = z.anteile; if (z.hinweis) steuerInfo.hinweise.push(z.hinweis); }
      } else if (veranlagung === 'einzel') anteile = null;
      steuerInfo.zve_basis = zveBasis; steuerInfo.anteile = anteile;
    }
    const klaerung = os.steuerliche_klaerung || {};
    const eingeschraenkt = [];
    if (klaerung.verbilligte_vermietung) eingeschraenkt.push('verbilligte Vermietung bzw. Vermietung an Angehörige');
    if (klaerung.teilweise_eigennutzung) eingeschraenkt.push('teilweise Eigennutzung');
    if (klaerung.einkuenfteerzielungsabsicht_unklar) eingeschraenkt.push('ungeklärte Einkünfteerzielungsabsicht');
    if (eingeschraenkt.length) steuerInfo.hinweise.push(`Steuerberechnung eingeschränkt: ${eingeschraenkt.join(', ')}. Der Werbungskostenabzug kann gekürzt sein oder entfallen – steuerliche Behandlung klären.`);
    if (afaVerlauf === null && res.offen.every(o => o.komponente !== 'steuer' || o.feld === 'steuer.modus')) {
      if (bem.fehlt) res.offen.push({ feld: 'gebaeudeanteil_prozent', label: bem.fehlt, komponente: 'steuer', grund: 'fehlt' });
    }
    const fortschreibung = steuer.fortschreibung_tarif !== false;
    const jahresliste = [];
    let steuerVollstaendig = steuerBereit;
    for (const j of jahre.values()) {
      const afaJahr = afaVerlauf ? (afaVerlauf[j.jahr] || 0) : null;
      const einnahmen = j.kaltmiete + j.bk;
      const faellig = j.umlagefaehig + j.nicht_umlagefaehig + j.ruecklage + j.zins + j.tilgung + j.sondertilgung + j.einmalig;
      const cfVor = einnahmen - faellig;
      const abzug = j.umlagefaehig + j.nicht_umlagefaehig + j.zins + j.einmalig_abziehbar;
      const ergebnis = afaJahr === null ? null : einnahmen - abzug - afaJahr;
      let entlastung = null, entlastungen = null, steuerDetail = null, steuerHinweis = null;
      if (steuerBereit && ergebnis !== null) {
        if (modus === 'manuell') {
          entlastungen = saetze.map(s => S.wirkungManuell(ergebnis, s));
          entlastung = entlastungen[0].entlastung;
        } else {
          const rf = S.regelFuer(j.jahr, { fortschreibung });
          if (!rf.regel) { steuerHinweis = rf.fehler; steuerVollstaendig = false; }
          else {
            if (rf.fortgeschrieben) steuerHinweis = rf.hinweis;
            steuerDetail = S.wirkungTarif({ zve: zveBasis, ergebnis, veranlagung, regel: rf.regel, anteile });
            entlastung = steuerDetail.entlastung;
          }
        }
      }
      const r2 = B.cent;
      jahresliste.push({
        jahr: j.jahr, monate: j.monate, teiljahr: j.monate < 12,
        kaltmiete: r2(j.kaltmiete), bk_vorauszahlung: r2(j.bk), einnahmen: r2(einnahmen),
        umlagefaehig: r2(j.umlagefaehig), nicht_umlagefaehig: r2(j.nicht_umlagefaehig), ruecklage: r2(j.ruecklage),
        zins: r2(j.zins), tilgung: r2(j.tilgung), sondertilgung: r2(j.sondertilgung), kreditrate: r2(j.zins + j.tilgung + j.sondertilgung),
        einmalig: r2(j.einmalig), ausgaben_faellig: r2(faellig), cf_vor_steuer: r2(cfVor),
        abzugsfaehig_ohne_afa: r2(abzug), afa: afaJahr === null ? null : r2(afaJahr), steuer_ergebnis: ergebnis === null ? null : r2(ergebnis),
        entlastung: entlastung === null ? null : r2(entlastung), entlastungen, steuer_detail: steuerDetail, steuer_hinweis: steuerHinweis,
        cf_nach_steuer: entlastung === null ? null : r2(cfVor + entlastung),
        vorsorge: r2(j.vorsorge), cf_nach_vorsorge: r2(cfVor - j.vorsorge), cf_nach_vorsorge_und_steuer: entlastung === null ? null : r2(cfVor - j.vorsorge + entlastung),
        restschuld: r2(j.restschuld), kum_tilgung: r2(j.kum_tilgung),
      });
    }
    res.jahre = jahresliste;
    res.status.steuer = !steuerVollstaendig ? 'unvollstaendig' : eingeschraenkt.length ? 'eingeschraenkt' : 'vollstaendig';
    if (fortschreibung && jahresliste.some(j => j.steuer_hinweis && /fortgeschrieben/.test(j.steuer_hinweis))) res.annahmen.push('Einkommensteuertarif 2026 für spätere Steuerjahre unverändert fortgeschrieben.');
    res.annahmen.push('Steuerwirkung wird dem jeweiligen Veranlagungsjahr zugeordnet und als Monatsdurchschnitt gezeigt; die tatsächliche Erstattung erfolgt später.');
    res.annahmen.push('WEG-Rücklage mindert die Liquidität, ist aber erst bei Verausgabung durch die WEG abziehbar; Zeitpunkt und Höhe der Verwendung sind nicht modelliert.');
    if (B.istZahl(w('bk_vorauszahlung_monat_eur')) && B.istZahl(w('umlagefaehig_monat_eur')) && Math.abs(w('bk_vorauszahlung_monat_eur') - w('umlagefaehig_monat_eur')) < 0.005) res.annahmen.push('Betriebskostenvorauszahlungen decken die umlagefähigen Kosten genau (Neutralitätsannahme); Abrechnungssalden sind nicht modelliert.');
    res.steuer = steuerInfo;

    // 7. Kennzahlen für die Übersicht (Bezugsjahr = erstes volles Kalenderjahr)
    const bezug = jahresliste.find(j => j.monate === 12) || jahresliste[0];
    const vorsorgeImLimit = holen(profil, 'kapital.vorsorge_in_grenze') !== false;
    const monatlich = j => {
      const cfVor = j.cf_vor_steuer / j.monate, vorsorge = j.vorsorge / j.monate;
      const zuVor = -(cfVor - (vorsorgeImLimit ? vorsorge : 0));
      const ent = j.entlastung === null ? null : j.entlastung / j.monate;
      return { cf_vor_steuer: B.cent(cfVor), vorsorge: B.cent(vorsorge), zuzahlung_vor_steuer: B.cent(zuVor), entlastung: ent === null ? null : B.cent(ent), zuzahlung_nach_steuer: ent === null ? null : B.cent(zuVor - ent) };
    };
    const mb = monatlich(bezug);
    const volle = jahresliste.filter(j => j.monate === 12);
    const schlechtest = volle.reduce((s, j) => { const m = monatlich(j); return !s || m.zuzahlung_vor_steuer > s.vor_steuer ? { jahr: j.jahr, vor_steuer: m.zuzahlung_vor_steuer, nach_steuer: m.zuzahlung_nach_steuer } : s; }, null);
    res.kpi = {
      bezugsjahr: bezug.jahr, bezugsmonate: bezug.monate,
      darlehen: res.kapital.darlehen, monatsrate: plan.rate, monatsrate_anschluss: plan.rate_anschluss,
      cf_vor_steuer_monat: mb.cf_vor_steuer, zuzahlung_vor_steuer_monat: mb.zuzahlung_vor_steuer, zuzahlung_nach_steuer_monat: mb.zuzahlung_nach_steuer,
      steuerwirkung_monat_durchschnitt: mb.entlastung, vorsorge_monat: mb.vorsorge, vorsorge_enthalten: vorsorgeImLimit,
      restschuld_ende_bindung: res.plan.restschuld_ende_bindung,
      vorfinanzierung_bezugsjahr: B.cent(Math.max(0, -(bezug.cf_vor_steuer - (vorsorgeImLimit ? bezug.vorsorge : 0)))),
      schlechtestes_jahr: schlechtest,
    };
    // Kumuliert über alle modellierten Jahre: macht spätere Ereignisse (Leerstand, Sonderumlage, Anschluss) vergleichbar
    const kum = jahresliste.reduce((s, j) => {
      const zu = -(j.cf_vor_steuer - (vorsorgeImLimit ? j.vorsorge : 0));

    }, { vor: 0, nach: 0, vollstaendig: true });
    res.kpi.kumuliert_vor_steuer = B.cent(kum.vor);
    res.kpi.kumuliert_nach_steuer = kum.vollstaendig ? B.cent(kum.nach) : null;
    res.kpi.modelliert_von_jahr = jahresliste[0].jahr;
    res.kpi.modelliert_bis_jahr = jahresliste[jahresliste.length - 1].jahr;
    if (modus === 'manuell' && saetze && saetze.length > 1) res.kpi.saetze = saetze.map((s, i) => ({ satz_prozent: s, zuzahlung_nach_steuer_monat: B.cent(mb.zuzahlung_vor_steuer - bezug.entlastungen[i].entlastung / bezug.monate) }));

    // 8. Haushalt, Einordnung und Modellfinanzierungsrahmen
    const grenze = { betrag: holen(profil, 'kapital.max_zuzahlung_monat_eur'), bezug: holen(profil, 'kapital.grenze_bezug') || 'vor_steuer' };
    res.einordnung = H.einordnung({ haushalt: res.haushalt, grenze, zuzahlung_vor_steuer: mb.zuzahlung_vor_steuer, zuzahlung_nach_steuer: mb.zuzahlung_nach_steuer, schlechtestes: schlechtest });
    res.kpi.verbleibendes_haushaltsbudget = res.einordnung.verbleibend_haushalt;
    const wunsch = B.istZahl(grenze.betrag) ? grenze.betrag : null;
    const ueber = res.haushalt.vollstaendig ? Math.max(0, res.haushalt.ueberschuss) : null;
    const verfuegbar = wunsch !== null && ueber !== null ? Math.min(wunsch, ueber) : ueber !== null ? ueber : wunsch;
    if (verfuegbar !== null && darlehen > 0 && B.istZahl(kondition.tilgung_prozent)) {
      const abschlag = holen(profil, 'kapital.mietabschlag_prozent') || 0;
      const objektUeberschuss = w('kaltmiete_monat_eur') * (1 - B.dezimal(abschlag)) * (1 - g('mietausfall_prozent')) + w('bk_vorauszahlung_monat_eur') - w('umlagefaehig_monat_eur') - w('nicht_umlagefaehig_monat_eur') - w('ruecklage_monat_eur') - (vorsorgeImLimit ? (w('vorsorge_monat_eur') || 0) : 0);
      const nkQuote = B.istZahl(kp) && kp > 0 ? (grest + notar + prov) / kp * 100 : null;
      res.finanzierungsrahmen = { ...H.finanzierungsrahmen({ verfuegbar_monat: verfuegbar, objekt_ueberschuss_monat: objektUeberschuss, sollzins_prozent: kondition.sollzins_prozent, tilgung_prozent: kondition.tilgung_prozent, eigenkapital: ek, nebenkostenquote_prozent: nkQuote }), verfuegbar_monat: B.cent(verfuegbar), mietabschlag_prozent: abschlag, nur_wunschgrenze: ueber === null };
      if (ueber === null) res.finanzierungsrahmen.hinweise.push('Haushaltsangaben unvollständig – Rahmen nur aus der Wunschgrenze, Tragbarkeit ungeklärt.');
      if (abschlag) res.finanzierungsrahmen.hinweise.push(`Sicherheitsabschlag von ${abschlag} % auf die Kaltmiete angesetzt (Annahme).`);
    }
    return res;
  }

  /**
   * Vorschläge für offene Rechenwerte – nie automatisch übernommen:
   *  - Modellannahmen der importierten Analyse (z. B. Gebäudeanteil, Maßnahmen-Modell, WEG-Reserve-Modell),
   *  - das Kaltmietenmodell: Betriebskostenvorauszahlung des Mieters deckt die umlagefähigen Kosten.
   */
  function vorschlaege(objekt, eingaben) {
    const liste = [];
    const va = objekt.vorschlaege || { werte: {}, ungeklaert_monat_eur: null };
    const offen = key => eingaben[key].wert === null && !(key === 'notar_grundbuch_prozent' && B.istZahl(eingaben[key].betrag_eur));
    for (const [key, v] of Object.entries(va.werte)) {
      if (!eingaben[key] || !offen(key)) continue;
      const ids = v.annahme_ids.length ? ` (${v.annahme_ids.join(', ')})` : '';
      liste.push({
        id: `analyse:${key}`, quelle: 'analyse', komponente: EINGABE[key].komponente, label: EINGABE[key].label, einheit: EINGABE[key].einheit,
        setzt: { [key]: v.wert }, alternativen: v.alternativen, annahme_id: v.annahme_ids[0] || null, hinweise: [],
        begruendung: `Annahme der Analyse${ids}${v.begruendung ? ': ' + v.begruendung : ''}`.slice(0, 300),
      });
    }
    if (offen('verpflichtende_zusatzkaeufe_eur') && !va.werte.verpflichtende_zusatzkaeufe_eur) {
      liste.push({
        id: 'annahme:verpflichtende_zusatzkaeufe_eur', quelle: 'annahme', komponente: 'finanzierung', label: EINGABE.verpflichtende_zusatzkaeufe_eur.label, einheit: 'eur',
        setzt: { verpflichtende_zusatzkaeufe_eur: 0 }, alternativen: [], annahme_id: null, hinweise: [],
        begruendung: 'Annahme: keine verpflichtenden Zusatzkäufe (z. B. Stellplatz, Küche) – in der Analyse nicht belegt, vor dem Kauf prüfen.',
      });
    }
    const bk = eingaben.bk_vorauszahlung_monat_eur.wert, um = eingaben.umlagefaehig_monat_eur.wert;
    if (bk === null || um === null) {
      const hinweise = [];
      let setzt;
      if (bk !== null) setzt = { umlagefaehig_monat_eur: bk };
      else if (um !== null) setzt = { bk_vorauszahlung_monat_eur: um };
      else {
        const wertOderVorschlag = key => eingaben[key].wert ?? (va.werte[key] ? va.werte[key].wert : null);
        const hg = objekt.felder.hausgeld_monat_eur.wert, nicht = wertOderVorschlag('nicht_umlagefaehig_monat_eur'), rl = wertOderVorschlag('ruecklage_monat_eur');
        let x = 0;
        if ([hg, nicht, rl].every(B.istZahl)) {
          x = B.cent(hg - nicht - rl);
          if (x < 0) { hinweise.push('Hausgeld ist kleiner als nicht umlagefähige Kosten plus Rücklage – umlagefähiger Anteil mit 0 € angesetzt.'); x = 0; }
          else hinweise.push(`Höhe = Hausgeld ${B.euro(hg)} − nicht umlagefähig ${B.euro(nicht)} − Rücklage ${B.euro(rl)}.`);
        } else hinweise.push('Höhe unbekannt, beide mit 0 € angesetzt: wirkt im Normalfall neutral, fehlt aber in Leerstandsszenarien (dann zahlt der Eigentümer die umlagefähigen Kosten).');
        setzt = { bk_vorauszahlung_monat_eur: x, umlagefaehig_monat_eur: x };
      }
      if (B.istZahl(va.ungeklaert_monat_eur)) hinweise.push(`Die Analyse rechnet zusätzlich ${B.euro(va.ungeklaert_monat_eur)} im Monat ungeklärte Kosten ohne Steuerabzug; das Kaltmietenmodell enthält sie nicht. Vorsichtiger: nicht umlagefähige Kosten erhöhen oder Variante „Eigentümerkosten“ rechnen.`);
      liste.push({
        id: 'kaltmietenmodell', quelle: 'annahme', komponente: 'cashflow', label: 'Kaltmietenmodell: Vorauszahlung des Mieters deckt die umlagefähigen Kosten', einheit: 'eur_monat',
        setzt, alternativen: [], annahme_id: null, hinweise,
        begruendung: 'Kaltmietenmodell (Annahme): Betriebskostenvorauszahlung = umlagefähige Kosten; Abrechnungssalden nicht modelliert.',
      });
    }
    return liste;
  }

  /** Übernimmt Vorschläge (alle oder die genannten IDs) als gekennzeichnete Objektanpassungen; vorhandene Anpassungen bleiben. */
  function wendeVorschlaegeAn(eingang, ids) {
    const os = JSON.parse(JSON.stringify(eingang.objektszenario || {}));
    const r = berechne({ ...eingang, objektszenario: os, variante: null });
    const anp = os.anpassungen = os.anpassungen || {};
    let n = 0;
    for (const v of r.vorschlaege || []) {
      if (ids && !ids.includes(v.id)) continue;
      for (const [key, wert] of Object.entries(v.setzt)) {
        if (anp[key] && anp[key].wert !== null && anp[key].wert !== undefined) continue;
        anp[key] = { wert, begruendung: v.begruendung, quelle: v.quelle, ...(v.annahme_id ? { annahme_id: v.annahme_id } : {}) };
        n++;
      }
    }
    return { objektszenario: os, uebernommen: n };
  }

  /** Ordnet jede offene Angabe dem Profil oder dem Objekt zu, damit die Oberfläche zeigen kann, wo sie fehlt. */
  function ebeneDerOffenenAngaben(res) {
    for (const o of res.offen) {
      const def = EINGABE[o.feld];
      if (def) o.ebene = def.profil ? 'profil' : 'objekt';
      else if (o.feld === 'beginn' || o.feld.startsWith('kondition')) o.ebene = res.kondition && res.kondition.quelle === 'objekt' ? 'objekt' : 'profil';
      else o.ebene = o.feld === 'eigentum' ? 'objekt' : 'profil';
    }
    return res;
  }

  /**
   * Was im Profil für die Objektrechnung noch fehlt – unabhängig von einer bestimmten Immobilie.
   * fuer: welche Ergebnisse ohne die Angabe leer bleiben; tab: Bereich im Profil-Editor.
   */
  function profilLuecken(profil) {
    const l = [];
    const add = (fuer, tab, text) => l.push({ fuer, tab, text });
    const kap = profil.kapital || {};
    if (!B.istZahl(kap.eigenkapital_einsetzbar_eur)) add('finanzierung', 'kapital', 'Einsetzbares Eigenkapital (0 € ist erlaubt)');
    const konditionen = (profil.finanzierung && profil.finanzierung.konditionen) || [];
    const standard = konditionen.find(k => k.id === (profil.finanzierung || {}).standard_kondition_id) || konditionen[0];
    if (!standard) add('finanzierung', 'finanzierung', 'Mindestens eine Finanzierungskondition');
    else for (const text of Object.values(D.pruefeKondition(standard))) add('finanzierung', 'finanzierung', `Kondition „${standard.bezeichnung || standard.id}“: ${text}`);
    if (!B.istZahl(holen(profil, 'finanzierung.notar_grundbuch_prozent'))) add('finanzierung', 'finanzierung', 'Annahme Notar und Grundbuch in % (falls die Analyse keinen Betrag nennt)');
    const st = profil.steuer || {};
    const veranlagung = holen(profil, 'haushalt.veranlagung');
    if (!st.modus) add('steuer', 'steuer', 'Steuermodus');
    else if (st.modus === 'manuell') { if (!(st.manuelle_saetze_prozent || []).some(B.istZahl)) add('steuer', 'steuer', 'Grenzsteuersatz'); }
    else {
      const fehler = S.pruefeVeranlagung(veranlagung, (profil.personen || []).length);
      if (fehler) add('steuer', 'haushalt', fehler);
      if (st.modus === 'zve') {
        const ok = veranlagung === 'einzeln_getrennt' ? (profil.personen || []).every(p => B.istZahl((st.zve_personen_eur || {})[p.id])) : B.istZahl(st.zve_ohne_investition_eur);
        if (!ok) add('steuer', 'steuer', 'Zu versteuerndes Einkommen ohne diese Investition');
      } else {
        for (const lu of S.schaetzeZve(profil, holen(profil, 'haushalt.steuerjahr') || 2026).luecken) add('steuer', /vorsorge|steuer\./.test(lu.feld) ? 'steuer' : 'haushalt', lu.text);
      }
    }
    const h = H.haushaltsrechnung(profil);
    for (const f of h.fehlend) add('haushalt', f.feld.startsWith('budget') ? 'budget' : 'haushalt', f.text);

    return l;
  }

  /** Vergleicht alle Konditionen für dieselbe Immobilie und dasselbe Profil. */
  function vergleicheKonditionen(eingang) {
    return alleKonditionen(eingang.profil || {}, eingang.objektszenario || {}).map(k => {
      const r = berechne({ ...eingang, kondition_id: k.id, variante: null });
      return { id: k.id, bezeichnung: k.bezeichnung || k.id, art: k.art || 'annahme', quelle: k.quelle, ergebnis: r };

  /** Ausgangsfall plus alle Varianten des Objektszenarios. */
  function vergleicheVarianten(eingang) {
    const basis = berechne({ ...eingang, variante: null });
    const liste = ((eingang.objektszenario || {}).varianten || []).map(v => ({ variante: v, ergebnis: berechne({ ...eingang, variante: v }) }));
    return { basis, varianten: liste };
  }

  const api = { EINGABEN, VARIANTEN, wirksameEingaben, alleKonditionen, wendeVarianteAn, anteileFuerSteuer, berechne, vorschlaege, wendeVorschlaegeAn, profilLuecken, vergleicheKonditionen, vergleicheVarianten };

<script>/* src/rechenkern/formate.js */

(function (root) {

  const FORMAT_PROFIL = { typ: 'household_profile', version: '1.0', major: 1 };

  /* ---------- Feldbeschreibung ---------- */
  const zahl = (o = {}) => ({ typ: 'zahl', null: true, ...o });

    sondertilgung_jahr_eur: betrag({ beschreibung: 'jährlich zum Ende jedes Darlehensjahres' }),
    anschluss: objekt({

  const PROFIL_FELDER = {
    dokumenttyp: { typ: 'const', wert: FORMAT_PROFIL.typ, pflicht: true },

    id: text({ null: false, muster: '^prof-[0-9a-z-]{4,40}$', pflicht: true }),

    erstellt_am: text({ null: false, format: 'date-time', pflicht: true }),

    haushalt: objekt({

      familienstand: wahl(['ledig', 'verheiratet', 'eingetragene_partnerschaft', 'geschieden', 'verwitwet']),

      steuerjahr: zahl({ min: 2026, max: 2100, ganz: true }),

    }),
    personen: liste(objekt({
      id: text({ null: false, muster: '^P[0-9]+$', pflicht: true }),
      bezeichnung: text({ max: 40 }),
      beschaeftigung: wahl(['angestellt', 'verbeamtet', 'selbststaendig', 'ohne', 'sonstige']),
      jahresbrutto_eur: betrag(),
      sonderzahlungen_eur: betrag({ beschreibung: 'nur, falls nicht im Jahresbrutto enthalten' }),
      gewinn_selbststaendig_eur: zahl({ einheit: 'EUR', beschreibung: 'steuerlicher Gewinn, nicht Umsatz' }),
      weitere_einkuenfte_eur: zahl({ einheit: 'EUR pro Jahr' }),
      monatsnetto_eur: betrag({ beschreibung: 'tatsächliches regelmäßiges Netto für die Haushaltsrechnung' }),
    }), { max: 2 }),
    steuer: objekt({
      modus: wahl(['manuell', 'zve', 'brutto_schaetzung']),
      manuelle_saetze_prozent: liste(zahl({ null: false, min: 0, max: 100 }), { max: 5 }),
      zve_ohne_investition_eur: betrag(),
      zve_personen_eur: karte(betrag()),
      fortschreibung_tarif: bool({ beschreibung: 'Tarif des jüngsten Jahres für spätere Steuerjahre fortschreiben (Annahme)' }),
      schaetzung: objekt({
        werbungskosten_eur: karte(betrag({ beschreibung: 'null = Arbeitnehmer-Pauschbetrag' })),
        vorsorgeaufwendungen_eur: karte(betrag()),
        sonderausgaben_eur: betrag({ beschreibung: 'null = Sonderausgaben-Pauschbetrag' }),
        weitere_abzuege_eur: betrag(),
      }),
    }),
    budget: objekt({
      weitere_einnahmen: liste(objekt({ bezeichnung: text({ max: 80 }), betrag_monat_eur: betrag(), im_netto_enthalten: bool() }), { max: 10 }),
      wohnkosten_monat_eur: betrag(), lebenshaltung_monat_eur: betrag(), versicherungen_monat_eur: betrag(), weitere_ausgaben_monat_eur: betrag(),
      kredite_monat_eur: betrag(), leasing_monat_eur: betrag(), unterhalt_monat_eur: betrag(), sparen_monat_eur: betrag(), sicherheitspuffer_monat_eur: betrag(),
    }),
    kapital: objekt({
      eigenkapital_einsetzbar_eur: betrag(), notfallreserve_eur: betrag(), max_zuzahlung_monat_eur: betrag(),
      grenze_bezug: wahl(['vor_steuer', 'nach_steuer', 'beide']), vorsorge_monat_eur: betrag(), vorsorge_in_grenze: bool(),
      betrachtung_jahre: zahl({ min: 1, max: 30, ganz: true }), mietabschlag_prozent: prozent(),
    }),
    finanzierung: objekt({

      konditionen: liste(KONDITION, { max: 10 }),
    }),
    erweiterungen: { typ: 'frei' },
  };

  const ANPASSUNG = objekt({ wert: zahl(), begruendung: text({ max: 300 }), quelle: wahl(['analyse', 'annahme'], { beschreibung: 'analyse = übernommene Modellannahme der Immobilienanalyse, annahme = vom Viewer vorgeschlagene Modellannahme; fehlt = eigene Eingabe' }), annahme_id: text({ max: 40 }) });
  const OBJEKTSZENARIO = objekt({
    objekt_schluessel: text({ max: 200 }),

    massnahmen_kategorie: wahl(['erhaltung', 'herstellung']),
    afa_abweichend: objekt({ satz_prozent: zahl({ min: 0, max: 100 }), begruendung: text({ max: 300 }), gueltig_bis_jahr: zahl({ min: 2000, max: 2200, ganz: true }) }, { null: true }),
    eigentum: objekt({ anteile_prozent: karte(prozent()), bestaetigt: bool(), kostentraeger_abweichend: bool(), ergebnisanteile_prozent: karte(prozent()), zuordnung_dokumentation: text({ max: 500 }) }),
    steuerliche_klaerung: objekt({ verbilligte_vermietung: bool(), teilweise_eigennutzung: bool(), einkuenfteerzielungsabsicht_unklar: bool() }),
    konditionen_objekt: liste(KONDITION, { max: 10 }),
    aktive_kondition_id: text(),
    varianten: liste(objekt({
      id: text({ null: false, muster: '^V[0-9A-Za-z_-]*$', pflicht: true }),
      typ: wahl(['zins', 'tilgung', 'eigenkapital', 'kosten', 'kaltmietausfall', 'leerstand', 'sonderumlage', 'anschluss', 'miete', 'kaufpreis', 'steuersatz'], { null: false, pflicht: true }),
      bezeichnung: text({ max: 120 }),
      parameter: objekt({ sollzins_prozent: zahl(), tilgung_prozent: zahl(), eigenkapital_einsatz_eur: betrag(), aufschlag_prozent: zahl({ min: -100, max: 1000 }), monate: zahl({ min: 0, max: 12, ganz: true }), modelljahr: zahl({ min: 1, max: 30, ganz: true }), betrag_eur: betrag(), kategorie: wahl(['erhaltung', 'herstellung', 'nicht_abziehbar']), kaltmiete_monat_eur: betrag(), kaufpreis_eur: betrag(), satz_prozent: prozent() }),
    }), { max: 20 }),
  }, { null: true });

  const SZENARIO_FELDER = {
    dokumenttyp: { typ: 'const', wert: FORMAT_SZENARIO.typ, pflicht: true },
    formatversion: text({ null: false, muster: '^1\\.[0-9]+$', pflicht: true }),
    id: text({ null: false, muster: '^szen-[0-9a-z-]{4,40}$', pflicht: true }),
    erstellt_am: text({ null: false, format: 'date-time', pflicht: true }),
    umfang: wahl(['vollstaendig', 'zusammenfassung'], { null: false, pflicht: true }),
    immobilie: objekt({ fingerabdruck: text({ null: false, muster: '^sha256:[0-9a-f]{64}$', pflicht: true }), schluessel: text(), bericht_id: text(), plattform: text(), plattform_id: text(), titel: text(), snapshot: { typ: 'frei' } }, { pflicht: true }),
    profil: objekt({ id: text(), revision: zahl({ min: 1, ganz: true }), bezeichnung: text(), daten: { typ: 'frei' } }, { pflicht: true }),
