    for (const p of punkte) { if (!p) { offen = false; continue; } d += `${offen ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`; offen = true; }
    s += `<path d="${d}" style="fill:none;stroke:${farbe};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
    reihen.forEach((x, i) => { if (pIstZahl(x[feld])) s += `<circle cx="${sx(i)}" cy="${sy(x[feld])}" r="3.5" style="fill:${farbe};stroke:var(--surface);stroke-width:1.5"/><circle class="hit" cx="${sx(i)}" cy="${sy(x[feld])}" r="10" data-tip="${esc(`${x.jahr}${x.teil ? ' (Teiljahr)' : ''}\n${feld === 'vor' ? 'vor Steuer' : 'nach Steuer'}: ${fmtNum(x[feld], 'eur')} / Monat`)}"/>`; });
  }
  return s + '</svg>';
}
function pSvgBalken(w, reihen) {
  const h = 260, m = { l: 64, r: 16, t: 14, b: 32 };
  const max = Math.max(1, ...reihen.map(x => x.rest));
  const yt = niceTicks(0, max, 5);
  const iw = w - m.l - m.r, ih = h - m.t - m.b, n = reihen.length;
  const band = iw / n, breite = Math.min(24, band * 0.7);
  const sy = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let s = svgOpen(w, h);
  for (const t of yt.ticks) s += `<line class="grid" x1="${m.l}" x2="${w - m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="tick" x="${m.l - 8}" y="${sy(t) + 4}" text-anchor="end">${fmtAxis(t)}</text>`;
  const schritt = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 48))));
  reihen.forEach((x, i) => {
    const cx = m.l + band * (i + 0.5), y = sy(x.rest), r = Math.min(4, breite / 2, Math.max(0, sy(0) - y));
    if (x.rest > 0) s += `<path d="M${cx - breite / 2},${sy(0)}V${y + r}Q${cx - breite / 2},${y} ${cx - breite / 2 + r},${y}H${cx + breite / 2 - r}Q${cx + breite / 2},${y} ${cx + breite / 2},${y + r}V${sy(0)}Z" style="fill:var(--c-blue)"/>`;
    s += `<rect class="hit" x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih}" data-tip="${esc(`${x.jahr}: Restschuld ${fmtNum(x.rest, 'eur')}`)}"/>`;
    if (i % schritt === 0 || i === n - 1) s += `<text class="tick" x="${cx}" y="${h - 10}" text-anchor="middle">${x.jahr}</text>`;
  });
  s += `<line class="axis" x1="${m.l}" x2="${w - m.r}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  return s + '</svg>';
}

function pSzenarien(doc, eingang, r, os, p) {
  const varianten = os.varianten || [];
  const vergleich = varianten.length ? RK.szenario.vergleicheVarianten(eingang) : null;
  const zeile = (titel, aenderungen, x, cls) => {
    const k = x.kpi, ok = x.status.cashflow === 'vollstaendig';
    const e = x.einordnung ? EINORDNUNG[x.einordnung.gesamt] : null;
    return `<tr class="${cls || ''}"><td>${esc(titel)}</td><td class="small">${aenderungen.length ? aenderungen.map(a => `${esc(a.feld)}: ${a.vorher === null || a.vorher === undefined ? '' : esc(String(a.vorher).replace('.', ',')) + ' → '}${esc(String(a.nachher).replace('.', ','))}`).join('<br>') : '<span class="muted">Ausgangsfall</span>'}</td>
      <td class="num">${ok && x.plan ? pEur(x.plan.rate) : '—'}</td><td class="num">${ok ? pZuzahlung(k.zuzahlung_vor_steuer_monat) : '—'}</td><td class="num">${ok && pIstZahl(k.zuzahlung_nach_steuer_monat) ? pZuzahlung(k.zuzahlung_nach_steuer_monat) : '—'}</td>
      <td class="num">${ok && k.schlechtestes_jahr ? `${pZuzahlung(k.schlechtestes_jahr.vor_steuer)} <span class="muted small">(${esc(k.schlechtestes_jahr.jahr)})</span>` : '—'}</td>
      <td class="num">${ok && pIstZahl(k.kumuliert_nach_steuer) ? pZuzahlung(k.kumuliert_nach_steuer) : '—'}</td><td class="num">${ok && x.plan ? pEur(x.plan.restschuld_ende_bindung) : '—'}</td>
      <td>${e ? `<span class="verdict sm ${e[1]}"><span class="vi" aria-hidden="true">${e[0]}</span><span>${esc(e[2].replace(' zum persönlichen Budget', ''))}</span></span>` : '—'}</td></tr>`;
  };
  const editor = v => {
    const vf = (feld, label, einheit, typ) => {
      const key = `v:${v.id}:${feld}`;
      if (typ === 'wahl') return `<label class="p-inline">${esc(label)} <select data-var="${esc(v.id)}:${esc(feld)}" data-fkey="${esc(key)}">${[['erhaltung', 'Erhaltung (abziehbar)'], ['herstellung', 'Herstellung (nicht sofort)'], ['nicht_abziehbar', 'nicht abziehbar']].map(([w, t]) => `<option value="${w}"${(v.parameter || {})[feld] === w ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`;
      const fehler = state.feldFehler[key];
      return `<label class="p-inline">${esc(label)} <span class="inp-wrap"><input type="text" inputmode="decimal" class="mit-einheit${fehler ? ' fehlerhaft' : ''}" data-var="${esc(v.id)}:${esc(feld)}" data-einheit="${esc(einheit)}" data-fkey="${esc(key)}" value="${esc(fehler && state.feldRoh[key] !== undefined ? state.feldRoh[key] : pAnzeige((v.parameter || {})[feld], einheit))}" size="8">${einheit ? `<span class="inp-einheit">${esc(einheit)}</span>` : ''}</span></label>${fehler ? `<span class="feld-fehler">${esc(fehler)}</span>` : ''}`;
    };
    const felder = { zins: [['sollzins_prozent', 'Sollzins', '%']], tilgung: [['tilgung_prozent', 'Tilgung', '%']], eigenkapital: [['eigenkapital_einsatz_eur', 'Eigenkapital', '€']], kosten: [['aufschlag_prozent', 'Aufschlag', '%']], kaltmietausfall: [['monate', 'Monate', ''], ['modelljahr', 'im Modelljahr', '']], leerstand: [['monate', 'Monate', ''], ['modelljahr', 'im Modelljahr', '']], sonderumlage: [['betrag_eur', 'Betrag', '€'], ['modelljahr', 'im Modelljahr', ''], ['kategorie', 'steuerlich', '', 'wahl']], anschluss: [['sollzins_prozent', 'Anschlusszins', '%']], miete: [['kaltmiete_monat_eur', 'Kaltmiete', '€']], kaufpreis: [['kaufpreis_eur', 'Kaufpreis', '€']], steuersatz: [['satz_prozent', 'Satz', '%']] }[v.typ] || [];
    return `<div class="p-variante"><span class="id">${esc(v.id)}</span><input type="text" class="p-var-name" data-var="${esc(v.id)}:bezeichnung" data-fkey="v:${esc(v.id)}:bezeichnung" value="${esc(v.bezeichnung || '')}" aria-label="Bezeichnung der Variante">${felder.map(f => vf(...f)).join('')}<button class="icon-btn" data-action="p-var-weg" data-vid="${esc(v.id)}" aria-label="Variante entfernen">×</button></div>`;
  };
  const steuerManuell = (p.steuer || {}).modus === 'manuell';
  return `<section class="sec" id="p-szenarien"><h2>Szenarien</h2>
    <p class="card-sub">Jede Variante ändert nur die genannten Werte gegenüber dem Ausgangsfall. Miete und Kaufpreis sind ausdrücklich hypothetisch. Die Einordnung gilt je Variante.</p>
    <div class="btn-row" style="justify-content:flex-start">${VARIANTEN_VORLAGEN.filter(([typ]) => typ !== 'steuersatz' || steuerManuell).map(([typ, t]) => `<button class="btn sm" data-action="p-var-neu" data-typ="${typ}">+ ${esc(t)}</button>`).join('')}</div>
    ${varianten.map(editor).join('')}
    ${vergleich ? `<div class="card flush p-ergebnis" style="margin-top:12px"><div class="table-wrap"><table class="t"><thead><tr><th>Fall</th><th>Änderungen</th><th class="num">Rate</th><th class="num">Zuzahlung vor Steuer</th><th class="num">Ø nach Steuer</th><th class="num">Ungünstigstes Jahr (vor Steuer)</th><th class="num">Kumuliert nach Steuer</th><th class="num">Restschuld</th><th>Einordnung</th></tr></thead><tbody>
      ${zeile('Ausgangsfall', [], vergleich.basis, 'strong')}${vergleich.varianten.map(x => zeile(x.variante.bezeichnung || x.variante.id, x.ergebnis.variante ? x.ergebnis.variante.aenderungen : [], x.ergebnis)).join('')}
    </tbody></table></div></div>` : '<div class="empty"><b>Noch keine Variante.</b> Füge oben eine Variante hinzu, um sie neben dem Ausgangsfall zu sehen.</div>'}
  </section>`;
}

function pAnnahmen(r) {
  const liste = r.annahmen.concat(r.hinweise);
  if (!liste.length) return '';
  return `<section class="sec" id="p-annahmen"><h2>Annahmen und Hinweise</h2><div class="card"><ul class="small" style="margin:0;padding-left:18px">${liste.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div></section>`;
}

function pExportBereich() {
  return `<section class="sec" id="p-export"><h2>Export</h2><div class="grid-2">
    <div class="card"><h3>Berechnungspaket</h3><p class="card-sub">Reproduzierbar: Fingerabdruck der Immobilienanalyse, vollständiges Profil, Objektanpassungen, Konditionen, Varianten, Regelversionen, Annahmen und Ergebnisse. <b>Enthält persönliche Finanzdaten.</b></p><button class="btn sm" data-action="p-paket-export" data-umfang="vollstaendig">Berechnungspaket exportieren</button></div>
    <div class="card"><h3>Ergebniszusammenfassung</h3><p class="card-sub">Nur Kennzahlen, Status und Annahmen – ohne Einkommen, Haushaltsausgaben und Profildetails. Zum Weitergeben geeignet; nicht neu berechenbar.</p><button class="btn sm" data-action="p-paket-export" data-umfang="zusammenfassung">Ergebniszusammenfassung exportieren</button></div>
  </div><p class="fine">Der Export der ursprünglichen Immobilienanalyse (Ansicht „Importierte Analyse“ → Rohdaten) enthält nie persönliche Daten.</p></section>`;
}

function pPaketExportFragen(doc, umfang) {
  const voll = umfang === 'vollstaendig';
  openDialog(dlgHead(voll ? 'Berechnungspaket exportieren' : 'Ergebniszusammenfassung exportieren') + `<p style="margin-top:0">${voll ? 'Enthält: Fingerabdruck und Kennung der Immobilie (nicht die Analyse selbst), das vollständige Profil mit Einkommen, Steuerangaben und Haushaltsausgaben, alle Objektanpassungen, Konditionen, Varianten, Regelversionen, Annahmen, offenen Angaben und Ergebnisse.' : 'Enthält: Kennung der Immobilie, Profilbezeichnung und Revision, Regelversionen, Status, Kennzahlen, Einordnung und Annahmen. Nicht enthalten: Einkommen, Haushaltsausgaben, Steuerangaben, Objektanpassungen und das verbleibende Haushaltsbudget.'}</p>
    <div class="btn-row" style="justify-content:flex-end;margin-bottom:0"><button class="btn" data-action="close-dlg">Abbrechen</button><button class="btn primary" data-action="p-paket-export-ok" data-umfang="${esc(umfang)}">Datei speichern</button></div>`);
}
function pPaketExport(doc, umfang) {
  const p = aktivesProfil();
  if (!doc || !p) return;
  const voll = umfang === 'vollstaendig';
  pRevisionFestschreiben(p);
  const paket = RK.formate.erstelleSzenarioPaket({ immobilie: doc.data, profil: p, objektszenario: pOS(doc), umfang });
  const name = `${voll ? 'berechnungspaket' : 'ergebnis'}_${pSlug(docTitle(doc))}_${voll ? pSlug(p.bezeichnung) + '_' : ''}${today()}.json`;
  download(name, JSON.stringify(paket, null, 2), 'application/json');
  $('#dlg').close();
  render();
}

/* =====================================================================
   Vergleich mehrerer Immobilien mit demselben Profil
   ===================================================================== */
function vergleichPersoenlich(rows) {
  const p = aktivesProfil();
  if (!p) return pKeinProfil();
  const ergebnisse = rows.map(d => ({ d, r: RK.szenario.berechne({ immobilie: d.data, profil: p, objektszenario: pOS(d) }) }));
  const mitVorschlaegen = ergebnisse.filter(x => x.r.anwendbar && x.r.vorschlaege.length);
  const zeilen = ergebnisse.map(({ d, r }) => {
    const k = r.kpi || {}, ok = r.status.cashflow === 'vollstaendig';
    const e = r.einordnung ? EINORDNUNG[r.einordnung.gesamt] : null;
    return `<tr class="clickable" data-action="p-oeffnen" data-uid="${d.uid}"><td class="cell-obj"><div class="obj-title"><button class="linkbtn" data-action="p-oeffnen" data-uid="${d.uid}">${esc(docTitle(d))}</button> ${offerTag(d.data)}</div><div class="obj-sub">${esc(docPlace(d))}</div>${r.anwendbar ? pFehltImObjekt(r, d) : ''}</td>
      <td class="num">${r.eingaben ? pWert(r.eingaben.kaufpreis_eur.wert, 'eur') : '—'}</td><td class="num">${r.kapital && pIstZahl(r.kapital.darlehen) ? pEur(r.kapital.darlehen) : '—'}</td>
      <td class="num">${r.plan ? pEur(r.plan.rate) : '—'}</td><td class="num">${ok ? pZuzahlung(k.zuzahlung_vor_steuer_monat) : '—'}</td><td class="num">${ok && pIstZahl(k.zuzahlung_nach_steuer_monat) ? pZuzahlung(k.zuzahlung_nach_steuer_monat) : '—'}</td>
      <td class="num">${ok && pIstZahl(k.verbleibendes_haushaltsbudget) ? pEur(k.verbleibendes_haushaltsbudget) : '—'}</td><td class="num">${r.plan ? pEur(r.plan.restschuld_ende_bindung) : '—'}</td>
      <td>${!r.anwendbar ? '<span class="tag">nicht anwendbar</span>' : e && ok ? `<span class="verdict sm ${e[1]}"><span class="vi" aria-hidden="true">${e[0]}</span><span>${esc(e[2].replace(' zum persönlichen Budget', ''))}</span></span>` : '—'}</td>
</tr>`;
  }).join('');
  return `${pProfilLuecken(p)}
    <div class="callout"><b>Alternative Einzelkäufe mit Profil „${esc(p.bezeichnung)}“</b> – jede Zeile nutzt das volle Eigenkapital und das volle Haushaltsbudget. Werte werden nicht addiert; eine gemeinsame Portfoliorechnung ist nicht Teil dieser Ansicht.</div>
    ${mitVorschlaegen.length > 1 ? `<div class="btn-row p-schnell" style="justify-content:flex-start;margin-top:12px"><button class="btn sm" data-action="p-vorschlaege-alle">Vorschläge für alle ${mitVorschlaegen.length} Objekte prüfen und übernehmen</button></div>` : ''}
    <div class="card flush" style="margin-top:12px"><div class="table-wrap"><table class="t p-vergleich-tabelle"><thead><tr><th>Objekt</th><th class="num">Kaufpreis</th><th class="num">Darlehen</th><th class="num">Rate</th><th class="num">Zuzahlung vor Steuer</th><th class="num">Ø nach Steuer</th><th class="num">Verbleibendes Budget</th><th class="num">Restschuld</th><th>Einordnung</th></tr></thead><tbody>${zeilen || `<tr><td colspan="9" class="muted">Keine Treffer.</td></tr>`}</tbody></table></div></div>
    <p class="chart-note">Objekt anklicken, um die Berechnung mit deinem Profil zu öffnen und einzelne Werte anzupassen. Vorschläge kommen aus den Modellannahmen der jeweiligen Analyse und werden als solche gekennzeichnet.</p>`;
}

const FEHLT_KURZ = { kaufpreis_eur: 'Kaufpreis', verpflichtende_zusatzkaeufe_eur: 'Zusatzkäufe', grunderwerbsteuer_prozent: 'Grunderwerbsteuer', kaeuferprovision_prozent: 'Provision', anfaengliche_massnahmen_eur: 'Maßnahmen', kaltmiete_monat_eur: 'Kaltmiete', bk_vorauszahlung_monat_eur: 'BK-Vorauszahlung', umlagefaehig_monat_eur: 'umlagefähige Kosten', nicht_umlagefaehig_monat_eur: 'nicht umlagefähige Kosten', ruecklage_monat_eur: 'Rücklage', gebaeudeanteil_prozent: 'Gebäudeanteil', fertigstellung_jahr: 'Baujahr', eigentum: 'Eigentumsanteile', beginn: 'Beginn' };
const KOMPONENTE_NAME = { finanzierung: 'Finanzierung', cashflow: 'Cashflow', steuer: 'Steuer' };

/** Kurzliste der objektbezogenen Lücken je Teilrechnung plus Knopf für die Vorschläge. */
function pFehltImObjekt(r, d) {
  const offen = r.offen.filter(o => o.ebene === 'objekt');
  const nach = {};
  for (const o of offen) (nach[o.komponente] = nach[o.komponente] || []).push(FEHLT_KURZ[o.feld] || o.label);
  const liste = Object.entries(nach).map(([k, l]) => `<div><span class="p-fehlt-k">${esc(KOMPONENTE_NAME[k] || k)}</span> ${esc([...new Set(l)].join(', '))}</div>`).join('');
  const vs = r.vorschlaege || [];
  const tip = vs.map(v => `• ${v.label}: ${pVorschlagWert(v)}`).join('\n');
  if (!liste && !vs.length) return '';
  return `${liste ? `<div class="p-fehlt"><div class="p-fehlt-titel">Fehlt für dieses Objekt</div>${liste}</div>` : ''}${vs.length ? `<button class="btn sm p-vorschlag-btn" data-action="p-vorschlaege" data-uid="${d.uid}" data-tip="${esc(tip)}">${vs.length} Vorschl${vs.length === 1 ? 'ag' : 'äge'} prüfen</button>` : ''}`;
}

const LUECKE_FUER = { finanzierung: 'Für Darlehen und Rate', steuer: 'Für die Zuzahlung nach Steuer', haushalt: 'Für Budget und Einordnung' };
const PROFIL_TAB_NAME = { haushalt: 'Haushalt & Einkommen', steuer: 'Steuer', budget: 'Ausgaben & Budget', kapital: 'Kapital & Grenzen', finanzierung: 'Finanzierung' };

/** Was im Profil für die Objektrechnung fehlt; gruppiert nach Wirkung, je Editor-Bereich ein Sprunglink. */
function pProfilLuecken(p, art) {
  const kompakt = art === 'seite' || art === true;
  const l = RK.szenario.profilLuecken(p);
  if (art === 'inline' && !l.length) return '';
  if (!l.length) return kompakt ? '<div class="p-seite-block p-profil-ok">✓ Für die Objektrechnung vollständig.</div>' : `<div class="callout p-profil-ok">✓ Das Profil „${esc(p.bezeichnung)}“ ist für die Objektrechnung vollständig. Fehlen trotzdem Zahlen, liegt es an Werten der jeweiligen Analyse (unter dem Objektnamen aufgeführt).</div>`;
  const gruppen = {};
  for (const x of l) ((gruppen[x.fuer] = gruppen[x.fuer] || {})[x.tab] = gruppen[x.fuer][x.tab] || []).push(x.text);
  const block = ([fuer, tabs]) => `<div class="p-luecken-gruppe"><div class="eyebrow">${esc(LUECKE_FUER[fuer] || fuer)}</div><ul>${Object.entries(tabs).map(([tab, texte]) => `<li><button class="linkbtn" data-action="p-profil-tab" data-tab="${esc(tab)}">${esc(PROFIL_TAB_NAME[tab] || tab)}</button>: ${esc(texte.slice(0, 4).join(', '))}${texte.length > 4 ? ` und ${texte.length - 4} weitere` : ''}</li>`).join('')}</ul></div>`;
  const reihenfolge = ['finanzierung', 'steuer', 'haushalt'].filter(f => gruppen[f]).map(f => [f, gruppen[f]]);
  if (art === 'inline') return `<div class="p-luecken-raster p-luecken-inline">${reihenfolge.map(block).join('')}</div>`;
  if (kompakt) return `<div class="p-seite-block p-luecken-kompakt"><div class="eyebrow">Für die Objektrechnung fehlt noch</div>${reihenfolge.map(block).join('')}</div>`;
  return `<div class="card p-luecken-karte"><h3>Was im Profil „${esc(p.bezeichnung)}“ noch fehlt</h3><p class="card-sub">Ohne diese Angaben bleiben die genannten Spalten bei allen Objekten leer. Ein Klick öffnet den passenden Bereich im Profil.</p><div class="p-luecken-raster">${reihenfolge.map(block).join('')}</div></div>`;
}

const EINHEIT_VON = key => (RK.szenario.EINGABEN.find(e => e.key === key) || {}).einheit;
function pVorschlagWert(v) {
  const eintraege = Object.entries(v.setzt);
  if (eintraege.length === 2 && v.id === 'kaltmietenmodell') return `Vorauszahlung = umlagefähige Kosten = ${pWert(eintraege[0][1], 'eur_monat')}`;
  return eintraege.map(([key, wert]) => pWert(wert, EINHEIT_VON(key))).join(', ');
}

/** Dialog zum Prüfen der Vorschläge eines Objekts; alles ist vorausgewählt und abwählbar. */
function pVorschlaegeDialog(doc) {
  const p = aktivesProfil();
  if (!doc || !p) return;
  const r = RK.szenario.berechne({ immobilie: doc.data, profil: p, objektszenario: pOS(doc) });
  if (!r.vorschlaege.length) return toast('Keine Vorschläge für offene Werte.');
  const zeile = v => `<label class="p-vorschlag"><input type="checkbox" data-vorschlag="${esc(v.id)}" checked><span><b>${esc(v.label)}</b>: ${esc(pVorschlagWert(v))} <span class="tag ${v.quelle === 'analyse' ? 'tag-good' : ''}">${v.quelle === 'analyse' ? 'Annahme der Analyse' : 'Modellannahme'}</span>
      <span class="feld-hilfe">${esc(v.begruendung.replace(/^Annahme der Analyse \(([^)]*)\): ?/, '$1: ').replace(/^Annahme der Analyse: ?/, ''))}${v.alternativen.length ? ` Weitere Werte in der Analyse: ${esc(v.alternativen.map(w => pWert(w, EINHEIT_VON(Object.keys(v.setzt)[0]))).join(', '))}.` : ''}${v.hinweise.length ? ' ' + esc(v.hinweise.join(' ')) : ''}</span></span></label>`;
  openDialog(dlgHead('Vorschläge für offene Werte') + `<p style="margin-top:0">„${esc(docTitle(doc))}“. Die Werte werden als Anpassung für dieses Objekt übernommen und bleiben als Annahme gekennzeichnet; in „Eingaben und Herkunft“ lassen sie sich ändern oder entfernen. Die importierte Analyse bleibt unverändert.</p>
    <div class="p-vorschlag-liste">${r.vorschlaege.map(zeile).join('')}</div>
    <div class="btn-row" style="justify-content:flex-end;margin-bottom:0"><button class="btn" data-action="close-dlg">Abbrechen</button><button class="btn primary" data-action="p-vorschlaege-ok" data-uid="${esc(doc.uid)}">Ausgewählte übernehmen</button></div>`);
}

function pVorschlaegeUebernehmen(doc, ids) {
  const p = aktivesProfil(), k = pOSKey(doc);
  if (!doc || !p || !k) return 0;
  const { objektszenario, uebernommen } = RK.szenario.wendeVorschlaegeAn({ immobilie: doc.data, profil: p, objektszenario: pOS(doc) }, ids);
  state.objektszenarien[k] = objektszenario;
  return uebernommen;
}

function pVorschlaegeAlleDialog() {
  const p = aktivesProfil();
  if (!p) return;
  const ziel = filteredDocs().map(d => ({ d, r: RK.szenario.berechne({ immobilie: d.data, profil: p, objektszenario: pOS(d) }) })).filter(x => x.r.anwendbar && x.r.vorschlaege.length);
  if (!ziel.length) return toast('Keine Vorschläge für offene Werte.');
  state.pVorschlagUids = ziel.map(x => x.d.uid);
  const arten = {};
  for (const { r } of ziel) for (const v of r.vorschlaege) arten[v.label] = (arten[v.label] || 0) + 1;
  openDialog(dlgHead('Vorschläge für alle Objekte übernehmen?') + `<p style="margin-top:0">Für ${ziel.length} Objekte werden offene Werte aus den Modellannahmen der jeweiligen Analyse bzw. als gekennzeichnete Modellannahme übernommen. Eigene Anpassungen bleiben unverändert; jede Übernahme lässt sich je Objekt in „Eingaben und Herkunft“ ändern oder entfernen.</p>
    <div class="table-wrap"><table class="t"><thead><tr><th>Vorschlag</th><th class="num">Objekte</th></tr></thead><tbody>${Object.entries(arten).map(([l, n]) => `<tr><td>${esc(l)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div>
    <p class="fine">Einzeln prüfen: „Vorschläge prüfen“ in der jeweiligen Zeile.</p>
    <div class="btn-row" style="justify-content:flex-end;margin-bottom:0"><button class="btn" data-action="close-dlg">Abbrechen</button><button class="btn primary" data-action="p-vorschlaege-alle-ok">Für ${ziel.length} Objekte übernehmen</button></div>`);
}
</script>
<script>/* src/oberflaeche/ordner.js */
/*
 * ImmoInvest Viewer – Ablageordner verbinden, z. B. einen von „Google Drive für Desktop“ synchronisierten Ordner
 *
 * Nutzt die File System Access API (Chrome, Edge): Der Ordner wird einmal ausgewählt, der Zugriff im Browser
 * (IndexedDB) gemerkt und beim Öffnen, beim Zurückkehren in den Tab und alle 30 Sekunden neu eingelesen.
 * Gelesen wird ausschließlich lokal – keine Verbindung zu Google oder anderen Servern, keine Anmeldung.
 * Der Ordner ist die Quelle: neue Dateien kommen hinzu, geänderte werden ersetzt, gelöschte verschwinden.
 * Automatisch geladen werden nur Bewertungs-Exporte. Profile und Berechnungspakete enthalten persönliche
 * Finanzdaten und werden weiterhin bewusst über „+ Dateien“ importiert.
 *
 * Klassisches Skript; nutzt state, addTexts, render … des Hauptskripts erst zur Laufzeit (ordnerStart()).
 */
'use strict';

const ORDNER_UNTERSTUETZT = typeof window.showDirectoryPicker === 'function';
const ORDNER_INTERVALL_MS = 30000;
const ORDNER_MAX_DATEIEN = 1000;
const ORDNER_TIEFE = 3;
const LS_ORDNER_AUTO = 'immoviewer.v1.ordner_auto';
const LS_ORDNER_HASHES = 'immoviewer.v1.ordner_hashes';

function ordnerZustand() {
  return { handle: null, name: null, status: ORDNER_UNTERSTUETZT ? 'getrennt' : 'nicht_unterstuetzt', auto: true, bekannt: {}, letzte: null, dateien: 0, uebersprungen: 0, fehler: null, laeuft: false };
}

/* ---------- Ordner-Handle in IndexedDB (localStorage kann keine Handles speichern) ---------- */
function ordnerIdb(modus, aktion) {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open('immoviewer', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onerror = () => resolve(undefined);
      req.onsuccess = () => {
        const db = req.result;
        try {
          const tx = db.transaction('kv', modus);
          const anfrage = aktion(tx.objectStore('kv'));
          tx.oncomplete = () => { db.close(); resolve(anfrage ? anfrage.result : undefined); };
          tx.onerror = tx.onabort = () => { db.close(); resolve(undefined); };
        } catch { db.close(); resolve(undefined); }
      };
    } catch { resolve(undefined); }
  });
}
const ordnerHandleLesen = () => ordnerIdb('readonly', st => st.get('ordner'));
const ordnerHandleSpeichern = h => ordnerIdb('readwrite', st => st.put(h, 'ordner'));
const ordnerHandleLoeschen = () => ordnerIdb('readwrite', st => st.delete('ordner'));

/* ---------- Start, Verbinden, Freigeben, Trennen ---------- */
async function ordnerStart() {
  if (state.ordner.status === 'nicht_unterstuetzt') return;
  state.ordner.auto = lsGet(LS_ORDNER_AUTO) !== '0';
  ordnerTakt();
  const h = await ordnerHandleLesen();
  if (!h || typeof h.queryPermission !== 'function') return;
  state.ordner.handle = h;
  state.ordner.name = h.name;
  let recht = 'prompt';
  try { recht = await h.queryPermission({ mode: 'read' }); } catch { /* bleibt prompt */ }
  if (recht === 'granted') { state.ordner.status = 'verbunden'; await ordnerEinlesen({ erst: true }); }
  else { state.ordner.status = 'freigabe'; renderSidebar(); }
}

async function ordnerVerbinden() {
  let h;
  try { h = await window.showDirectoryPicker({ id: 'immoinvest-ablage', mode: 'read' }); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('Ordner konnte nicht verbunden werden' + (e && e.message ? `: ${e.message}` : '.')); return; }
  Object.assign(state.ordner, { handle: h, name: h.name, status: 'verbunden', bekannt: {}, fehler: null });
  await ordnerHandleSpeichern(h);
  await ordnerEinlesen({ erst: true });
}

/** Nach einem Neustart verlangt der Browser je nach Einstellung einen Klick, bevor er den Ordner wieder freigibt. */
async function ordnerFreigeben() {
  const h = state.ordner.handle;
  if (!h) return;
  let recht = 'denied';
  try { recht = await h.requestPermission({ mode: 'read' }); } catch { /* bleibt denied */ }
  if (recht !== 'granted') return toast('Kein Zugriff auf den Ordner erteilt.');
  state.ordner.status = 'verbunden';
  await ordnerEinlesen({ erst: true });
}

async function ordnerTrennen() {
  await ordnerHandleLoeschen();
  for (const d of state.docs) delete d.ordnerPfad;
  lsDel(LS_ORDNER_HASHES);
  const name = state.ordner.name;
  state.ordner = Object.assign(ordnerZustand(), { auto: state.ordner.auto });
  renderSidebar();
  toast(`Verbindung zu „${name}“ getrennt. Bereits geladene Dateien bleiben in der Ansicht.`);
}

/* ---------- Einlesen ---------- */
async function ordnerDateien(verzeichnis, pfad, tiefe, out) {
  for await (const eintrag of verzeichnis.values()) {
    if (out.length >= ORDNER_MAX_DATEIEN) break;
    if (eintrag.name.startsWith('.') || eintrag.name.startsWith('~$')) continue;
    const p = pfad ? `${pfad}/${eintrag.name}` : eintrag.name;
    if (eintrag.kind === 'directory') { if (tiefe < ORDNER_TIEFE) await ordnerDateien(eintrag, p, tiefe + 1, out); }
    else if (/\.json$/i.test(eintrag.name)) out.push({ pfad: p, eintrag });
  }
  return out;
}

function ordnerIstPersoenlich(text) {
  try {
    const j = JSON.parse(text.replace(/^﻿/, ''));
    return !!j && (j.dokumenttyp === 'household_profile' || j.dokumenttyp === 'investment_scenario');
  } catch { return false; }
}

/**
 * Liest den Ordner und gleicht die Ansicht ab. Unveränderte Dateien (gleiche Änderungszeit und Größe) werden
 * nicht erneut gelesen; Dateien, die Google Drive noch nicht lokal bereitgestellt hat, beim nächsten Mal.
 */
async function ordnerEinlesen({ erst = false, manuell = false } = {}) {
  const o = state.ordner;
  if (!o.handle || o.laeuft || o.status !== 'verbunden') return;
  o.laeuft = true;
  try {
    const liste = await ordnerDateien(o.handle, '', 1, []);
    const gesehen = new Set(), neu = [], geaendert = [];
    for (const { pfad, eintrag } of liste) {
      gesehen.add(pfad);
      let datei;
      try { datei = await eintrag.getFile(); } catch { continue; }
      const stempel = `${datei.lastModified}|${datei.size}`;
      const alt = o.bekannt[pfad];
      if (alt && alt.stempel === stempel) continue;
      let text;
      try { text = await datei.text(); } catch { continue; }
      const persoenlich = ordnerIstPersoenlich(text);
      o.bekannt[pfad] = { stempel, persoenlich };
      if (!persoenlich) (alt && !alt.persoenlich ? geaendert : neu).push({ pfad, name: eintrag.name, text });
    }
    const entfernt = Object.keys(o.bekannt).filter(p => !gesehen.has(p));
    for (const p of entfernt) delete o.bekannt[p];

    // Ersetzte und gelöschte Dateien aus der Ansicht nehmen; eine offene Einzelansicht folgt der neuen Fassung
    const wegPfade = new Set(entfernt.concat(geaendert.map(x => x.pfad)));
    const offenerPfad = state.view === 'detail' ? (getDoc(state.current) || {}).ordnerPfad : null;
    const weg = new Set(state.docs.filter(d => d.ordnerPfad && wegPfade.has(d.ordnerPfad)).map(d => d.uid));
    const items = neu.concat(geaendert);
    const leerVorher = !immoDocs().length;
    if (weg.size) { state.docs = state.docs.filter(d => !weg.has(d.uid)); for (const u of weg) state.selected.delete(u); }
    if (items.length) {
      addTexts(items.map(x => ({ name: x.name, text: x.text })), { silent: true });
      for (const x of items) { const h = hashStr(x.text); const d = state.docs.find(doc => doc.hash === h); if (d) d.ordnerPfad = x.pfad; }
    }
    // Beim ersten Einlesen: früher aus dem Ordner gemerkte Dateien entfernen, die dort nicht mehr liegen
    let altEntfernt = 0;
    if (erst) {
      let alteHashes = [];
      try { alteHashes = JSON.parse(lsGet(LS_ORDNER_HASHES) || '[]'); } catch { /* leer */ }
      const alt = new Set(Array.isArray(alteHashes) ? alteHashes : []);
      const vorher = state.docs.length;
      state.docs = state.docs.filter(d => d.ordnerPfad || !alt.has(d.hash));
      altEntfernt = vorher - state.docs.length;
    }
    lsSet(LS_ORDNER_HASHES, JSON.stringify(state.docs.filter(d => d.ordnerPfad).map(d => d.hash)));
    computeGroups();

    o.letzte = new Date();
    o.dateien = state.docs.filter(d => d.ordnerPfad).length;
    o.uebersprungen = Object.values(o.bekannt).filter(b => b.persoenlich).length;
    o.fehler = null;
    const veraendert = items.length || weg.size || altEntfernt;
    if (veraendert) {
      save();
      if (offenerPfad && wegPfade.has(offenerPfad)) { const ersatz = state.docs.find(d => d.ordnerPfad === offenerPfad); if (ersatz) state.current = ersatz.uid; }
      if ((erst && (state.view === 'start' || leerVorher)) || !state.docs.length) {
        state.view = immoDocs().length > 1 ? 'compare' : state.docs.length ? 'detail' : 'start';
        state.current = (immoDocs()[0] || state.docs[0] || {}).uid;
        render();
        window.scrollTo(0, 0);
      } else renderMitFokus();
      const teile = [neu.length && `${neu.length} neu`, geaendert.length && `${geaendert.length} geändert`, (entfernt.length || altEntfernt) && `${entfernt.length + altEntfernt} entfernt`].filter(Boolean);
      toast(erst ? `${o.dateien} Bewertung${o.dateien === 1 ? '' : 'en'} aus „${o.name}“ eingelesen.` : `Aus „${o.name}“: ${teile.join(', ')}.`);
    } else {

async function addFiles(files) {
  const items = [];
  for (const f of files) {
    if (!/\.json$/i.test(f.name) && f.type !== 'application/json') continue;
    try { items.push({ name: f.name, text: await f.text() }); }
    catch (e) { items.push({ name: f.name, text: '', error: 'Datei konnte nicht gelesen werden: ' + e.message }); }
  }
  if (!items.length) { toast('Keine JSON-Dateien gefunden.'); return; }
  addTexts(items);
}

function addTexts(items, { silent = false } = {}) {
  const added = [];
  let persoenlich = 0;
  for (const it of items) {
    if (it.error) { added.push(addDoc(it.name, it.text, null, it.error)); continue; }
    let parsed, err = null;
    try { parsed = JSON.parse(it.text.replace(/^﻿/, '')); } catch (e) { err = 'JSON-Syntaxfehler: ' + e.message; }
    // Profile und Berechnungspakete sind keine Immobiliendateien: eigener Import, nie in der Dateiliste gespeichert
    if (!err && pImportiereDokument(parsed, it.name)) { persoenlich++; continue; }
    if (!err && Array.isArray(parsed) && parsed.length && parsed.every(x => isObj(x) && ('schema_version' in x || 'metadaten' in x))) {
      parsed.forEach((x, i) => added.push(addDoc(`${it.name} [${i + 1}]`, JSON.stringify(x, null, 2), x, null)));
      continue;
    }
    added.push(addDoc(it.name, it.text, parsed, err));
  }
  const fresh = added.filter(Boolean);
  computeGroups();
  if (!silent) {
    if (persoenlich && !fresh.length && persoenlich === items.length) return fresh;
    const immo = fresh.filter(d => d.isImmo);
    if (fresh.length === 1) { state.view = 'detail'; state.current = fresh[0].uid; }
    else if (immoDocs().length > 1) state.view = 'compare';
    else if (fresh.length) { state.view = 'detail'; state.current = (immo[0] || fresh[0]).uid; }
    const dup = items.length - persoenlich - fresh.length;
    toast(`${fresh.length} Datei${fresh.length === 1 ? '' : 'en'} geladen${dup > 0 ? ` · ${dup} bereits vorhanden` : ''}`);
    save();
    render();
    window.scrollTo(0, 0);
  }
  return fresh;
}

function addDoc(name, text, data, err) {
  const hash = hashStr(text || name);
  if (state.docs.some(d => d.hash === hash)) return null;
  const doc = { uid: 'd' + (++uidCounter), fileName: name, text: text || '', hash, data: err ? null : data, parseError: err };
  analyze(doc);
  if (doc.isImmo) doc.num = ++numCounter;
  state.docs.push(doc);
  return doc;
}

function analyze(doc) {
  doc.isImmo = false;
  if (doc.parseError) { doc.issues = [{ lvl: 'error', path: '', msg: doc.parseError }]; return; }
  const d = doc.data;
  if (!isObj(d) || (!('schema_version' in d) && !('metadaten' in d) && !('angebot' in d))) {
    doc.issues = [{ lvl: 'error', path: '', msg: 'Keine Immobilienbewertung nach Schema 1.0 (weder schema_version noch metadaten/angebot gefunden).' }];
    return;
  }
  doc.isImmo = true;
  doc.ctx = buildCtx(d);
  doc.issues = validate(d, doc.ctx);
  doc.key = objectKey(d) || doc.uid;
}

function computeGroups() {
  const groups = new Map();
  for (const d of immoDocs()) {
    if (!groups.has(d.key)) groups.set(d.key, []);
    groups.get(d.key).push(d);
  }
  const stamp = d => { const m = obj(d.data.metadaten); return `${m.exportdatum || ''}|${m.pruefdatum || ''}|${d.fileName}`; };
  for (const list of groups.values()) {
    list.sort((a, b) => stamp(b).localeCompare(stamp(a)));
    list.forEach((d, i) => { d.rev = { index: list.length - i, total: list.length, latest: i === 0, group: list }; });
  }
  const valid = new Set(immoDocs().map(d => d.uid));
  for (const u of [...state.selected]) if (!valid.has(u)) state.selected.delete(u);
}

function removeDoc(uid) {
  state.docs = state.docs.filter(d => d.uid !== uid);
  state.selected.delete(uid);
  computeGroups();
  if (!state.docs.length) state.view = 'start';
  else if (state.view === 'detail' && state.current === uid) state.view = immoDocs().length > 1 ? 'compare' : 'detail', state.current = (immoDocs()[0] || state.docs[0]).uid;
  save();
  render();
}

function save() {
  if (!state.persist) { lsDel(LS.docs); state.saveError = null; return; }
  const ok = lsSet(LS.docs, JSON.stringify(state.docs.filter(d => d.text).map(d => ({ name: d.fileName, text: d.text }))));
  state.saveError = ok ? null : 'Speichern im Browser nicht möglich (Speicher voll oder gesperrt).';
}

function restore() {
  state.persist = lsGet(LS.persist) !== '0';
  state.cmpTab = lsGet(LS.cmpTab) || 'tabelle';
  pLadenAusBrowser();
  const raw = lsGet(LS.docs);
  if (!raw || !state.persist) return;
  try {
    const items = JSON.parse(raw);
    if (Array.isArray(items) && items.length) {
      addTexts(items.filter(x => x && typeof x.text === 'string'), { silent: true });
      state.view = immoDocs().length > 1 ? 'compare' : 'detail';
      state.current = (immoDocs()[0] || state.docs[0] || {}).uid;
      if (!state.docs.length) state.view = 'start';
    }
  } catch { /* defekter Speicherinhalt wird ignoriert */ }
}

async function loadFromQuery() {
  const srcs = new URLSearchParams(location.search).getAll('src');
  if (!srcs.length || location.protocol === 'file:') return;
  const items = [];
  for (const s of srcs) {
    const name = decodeURIComponent(s.split('/').pop() || s);
    try {
      const r = await fetch(s);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      items.push({ name, text: await r.text() });
    } catch (e) { items.push({ name, text: '', error: `Laden von ${s} fehlgeschlagen: ${e.message}` }); }
  }
  addTexts(items);
}

  if (!items.length) { toast('Beispiele nicht erreichbar. Dateien aus dem Ordner beispiele/ hineinziehen.'); return; }
  addTexts(items);
}

async function filesFromDataTransfer(dt) {
  const entries = [...(dt.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...(dt.files || [])];
  const out = [];
  async function walkEntry(en) {
    if (en.isFile) out.push(await new Promise((res, rej) => en.file(res, rej)));
    else if (en.isDirectory) {
      const reader = en.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const c of batch) await walkEntry(c);
      } while (batch.length);
    }
  }
  for (const en of entries) await walkEntry(en);
  return out;
}

function buildCtx(data) {
  const list = k => arr(data[k]).filter(isObj);
  const byId = k => new Map(list(k).filter(x => typeof x.id === 'string').map(x => [x.id, x]));
  const belege = new Map();
  for (const b of list('datenbelege')) if (typeof b.feldpfad === 'string' && !belege.has(b.feldpfad)) belege.set(b.feldpfad, b);
  const conflicts = new Map();
  for (const w of list('widersprueche')) if (w.status !== 'aufgeloest' && typeof w.feldpfad === 'string') conflicts.set(w.feldpfad, w);
  const scen = new Map();
  arr(data.szenarien).forEach((s, si) => {
    if (!isObj(s)) return;
    arr(s.rechnung).forEach((r, ri) => {
      if (!isObj(r) || !isNum(r.wert) || typeof r.kennzahl !== 'string') return;
      const kz = canonKz(r.kennzahl);
      if (!scen.has(kz)) scen.set(kz, []);
      scen.get(kz).push({ value: r.wert, unit: r.einheit, s, path: `/szenarien/${si}/rechnung/${ri}/wert` });
    });
  });
  return { list, quellen: byId('quellen'), annahmen: byId('annahmen'), risiken: byId('risiken'), unterlagen: byId('fehlende_unterlagen'), szenarien: byId('szenarien'), widersprueche: byId('widersprueche'), belege, conflicts, scen };
}

function walk(node, path, fn) {
  if (Array.isArray(node)) node.forEach((v, i) => { const p = `${path}/${i}`; fn(null, v, p, node); walk(v, p, fn); });
  else if (isObj(node)) for (const [k, v] of Object.entries(node)) { const p = `${path}/${ptrKey(k)}`; fn(k, v, p, node); walk(v, p, fn); }
}

function validate(data, ctx) {
  const out = [];
  const E = (path, msg) => out.push({ lvl: 'error', path, msg });
  const W = (path, msg) => out.push({ lvl: 'warn', path, msg });
  const I = (path, msg) => out.push({ lvl: 'info', path, msg });
  const ids = { quellen: new Set(ctx.quellen.keys()), annahmen: new Set(ctx.annahmen.keys()), risiken: new Set(ctx.risiken.keys()), fehlende_unterlagen: new Set(ctx.unterlagen.keys()) };
  let refErrors = 0;

  // Struktur
  if (data.schema_version !== '1.0') W('/schema_version', `Schema-Version ${JSON.stringify(data.schema_version ?? null)} statt "1.0".`);
  for (const k of TOP_KEYS) if (!(k in data)) E('/' + k, 'Hauptschlüssel fehlt.');
  for (const k of Object.keys(data)) if (!TOP_KEYS.includes(k)) I('/' + ptrKey(k), 'Zusätzlicher Schlüssel außerhalb des Datenvertrags.');
  for (const [sec, keys] of Object.entries(CORE)) {
    if (!(sec in data)) continue;
    if (!isObj(data[sec])) { E('/' + sec, 'Muss ein Objekt sein.'); continue; }
    for (const k of keys) if (!(k in data[sec])) W(`/${sec}/${k}`, 'Schlüssel der Kernstruktur fehlt.');
  }
  for (const [k] of TEILURTEILE) {
    const t = obj(data.bewertung)[k];
    if (t !== undefined && !isObj(t)) E(`/bewertung/${k}`, 'Teilurteil muss ein Objekt {urteil, begruendung, belegsicherheit} sein.');
    else if (isObj(t)) for (const kk of ['urteil', 'begruendung', 'belegsicherheit']) if (!(kk in t)) W(`/bewertung/${k}/${kk}`, 'Schlüssel fehlt.');
  }
  for (const [p, allowed] of Object.entries(ENUM_PATHS)) {
    const r = resolvePointer(data, p);
    if (!r.found) continue;
    if (!allowed.includes(r.value)) E(p, `Unzulässiger Wert ${JSON.stringify(r.value)}. Erlaubt: ${allowed.map(v => v === null ? 'null' : v).join(' | ')}.`);
  }

  // Arrays
  for (const [name, spec] of Object.entries(ARRAYS)) {
    if (!(name in data)) continue;
    if (!Array.isArray(data[name])) { E('/' + name, 'Muss ein Array sein.'); continue; }
    const seen = new Set();
    data[name].forEach((it, i) => {
      const p = `/${name}/${i}`;
      if (!isObj(it)) { E(p, 'Eintrag muss ein Objekt sein.'); return; }
      for (const k of spec.keys) if (!(k in it)) W(`${p}/${k}`, 'Pflichtschlüssel des Eintrags fehlt.');
      if (spec.prefix) {
        if (typeof it.id !== 'string' || !new RegExp(`^${spec.prefix}[0-9]+$`).test(it.id)) E(`${p}/id`, `ID ${JSON.stringify(it.id)} entspricht nicht dem Muster ${spec.prefix}1, ${spec.prefix}2 …`);
        else if (seen.has(it.id)) E(`${p}/id`, `ID ${it.id} ist doppelt vergeben.`);
        seen.add(it.id);
      } else if (name === 'datenbelege' && typeof it.feldpfad === 'string') {
        if (seen.has(it.feldpfad)) W(`${p}/feldpfad`, `Mehrere Datenbelege für ${it.feldpfad} – höchstens ein zusammengeführter Eintrag pro Feld.`);
        seen.add(it.feldpfad);
      }
      for (const [k, allowed] of Object.entries(spec.enums || {})) if (k in it && !allowed.includes(it[k])) E(`${p}/${k}`, `Unzulässiger Wert ${JSON.stringify(it[k])}. Erlaubt: ${allowed.join(' | ')}.`);
      for (const [nk, ns] of Object.entries(NESTED)) {
        if (!(nk in it)) continue;
        if (!Array.isArray(it[nk])) { E(`${p}/${nk}`, 'Muss ein Array sein.'); continue; }
        it[nk].forEach((sub, j) => {
          const sp = `${p}/${nk}/${j}`;
          if (!isObj(sub)) { E(sp, 'Eintrag muss ein Objekt sein.'); return; }
          for (const k of ns.keys) if (!(k in sub)) W(`${sp}/${k}`, 'Pflichtschlüssel fehlt.');
          for (const [k, allowed] of Object.entries(ns.enums || {})) if (k in sub && !allowed.includes(sub[k])) E(`${sp}/${k}`, `Unzulässiger Wert ${JSON.stringify(sub[k])}.`);
          if (nk === 'rechnung') {
            if (sub.wert !== null && sub.wert !== undefined && !isNum(sub.wert)) E(`${sp}/wert`, `Zahl oder null erwartet, gefunden ${JSON.stringify(sub.wert)}.`);
            if (sub.rolle === 'ergebnis' && !sub.formel) I(`${sp}/formel`, 'Ergebnis ohne Formel.');
            if (typeof sub.kennzahl === 'string' && /_prozent$/.test(sub.kennzahl) && isNum(sub.wert) && sub.wert !== 0 && Math.abs(sub.wert) < 0.2) W(`${sp}/wert`, 'Prozentwert sehr klein – evtl. als Anteil (0,045) statt Prozent (4,5) gespeichert?');
          }
        });
      }
    });
  }

  // Feldweise Typ-, Datums-, Verweis- und Pfadprüfung
  walk(data, '', (k, v, p, parent) => {
    if (k === null) return;
    const inArrayItem = /\/\d+\/[^/]+$/.test(p);
    if ((NUM_RE.test(k) || NUM_KEYS.has(k)) && !RANGE_RE.test(k)) {
      if (v !== null && !isNum(v)) {
        const hint = typeof v === 'string' && /^(null|unbekannt|-|–|n\/a|k\.?\s?a\.?)$/i.test(v.trim()) ? ' Platzhaltertext statt null.' : typeof v === 'string' && /\d/.test(v) ? ' Formatierte Zahl als Text (ohne Währungszeichen, Tausenderpunkte, Prozentzeichen speichern).' : '';
        E(p, `Zahl oder null erwartet, gefunden ${JSON.stringify(v)}.${hint}`);
      } else if (/_prozent$/.test(k) && isNum(v) && v !== 0 && Math.abs(v) < 0.2) {
        W(p, `Prozentwert ${String(v).replace('.', ',')} sehr klein – evtl. als Anteil statt Prozent gespeichert (4,5 bedeutet 4,5 %)?`);
      }
    }
    if (k === 'prioritaet' && v !== null && !Number.isInteger(v)) E(p, 'Ganzzahl erwartet (1 = höchste Priorität).');
    if (STRING_ID_KEYS.has(k) && typeof v === 'number') E(p, `Identifikator muss Zeichenkette sein, gefunden Zahl ${v}.`);
    if (DATE_RE.test(k) && v !== null && v !== undefined && !isValidDate(v)) E(p, `Datum im Format YYYY-MM-DD oder null erwartet, gefunden ${JSON.stringify(v)}.`);
    if (BOOL_KEYS.has(k) && v !== null && typeof v !== 'boolean') E(p, `true, false oder null erwartet, gefunden ${JSON.stringify(v)}.`);
    if (RANGE_RE.test(k) && v !== null && v !== undefined) {
      if (!isRange(v)) E(p, 'Spanne als Objekt {"min": Zahl, "max": Zahl} oder null erwartet.');
      else if (v.min > v.max) E(p, `Spanne ungültig: min (${fmtNum(v.min, 'eur')}) ist größer als max (${fmtNum(v.max, 'eur')}).`);
    }
    if (REF_KEYS[k]) {
      if (!Array.isArray(v)) E(p, 'Array von IDs erwartet.');
      else v.forEach((id, i) => { if (!ids[REF_KEYS[k]].has(id)) { refErrors++; E(`${p}/${i}`, `Verweis ${JSON.stringify(id)} zeigt ins Leere (kein Eintrag in ${REF_KEYS[k]}).`); } });
    }
    if (k === 'feldpfad' && inArrayItem) {
      if (typeof v !== 'string' || v[0] !== '/') E(p, 'JSON-Pointer muss mit "/" beginnen.');
      else if (!resolvePointer(data, v).found) { refErrors++; E(p, `Feldpfad ${v} existiert im Export nicht.`); }
    }
    if (k === 'eingabe_pfade' && Array.isArray(v)) v.forEach((ep, i) => {
      if (typeof ep !== 'string' || !resolvePointer(data, ep).found) { refErrors++; E(`${p}/${i}`, `Eingabepfad ${JSON.stringify(ep)} existiert im Export nicht.`); }
    });
    if (k === 'url' && v !== null && v !== undefined && !safeUrl(v)) E(p, `Keine gültige http(s)-URL: ${JSON.stringify(trunc(v, 60))} (z. B. Chat-interner Zitationsmarker?).`);
  });

  // Inhaltliche Regeln des Prompts
  const m = obj(data.metadaten), o = obj(data.objekt), ist = obj(data.ist_kosten_und_ertraege), kz = obj(data.kennzahlen), pb = obj(data.preisbewertung), b = obj(data.bewertung), a = obj(data.angebot);
  if (m.analysestatus === 'vorlage') W('/metadaten/analysestatus', 'Status „vorlage“ – leere Strukturvorlage, keine Bewertung.');
  if (isValidDate(m.pruefdatum) && isValidDate(m.exportdatum) && m.exportdatum < m.pruefdatum) W('/metadaten/exportdatum', 'Exportdatum liegt vor dem Prüfdatum.');
  if (arr(data.naechste_schritte).length > 5) W('/naechste_schritte', `${arr(data.naechste_schritte).length} nächste Schritte – maximal fünf vorgesehen.`);
  if (arr(b.entscheidende_offene_punkte).length > 3) W('/bewertung/entscheidende_offene_punkte', 'Mehr als drei entscheidende offene Punkte.');
  for (const w of ctx.list('widersprueche')) {
    if (w.status === 'offen' && typeof w.feldpfad === 'string') {
      const r = resolvePointer(data, w.feldpfad);
      if (r.found && r.value !== null) W(w.feldpfad, `Offener Widerspruch ${w.id ?? ''}: Hauptwert sollte null bleiben, ist aber ${JSON.stringify(r.value)}.`);
    }
    if (w.status === 'aufgeloest' && !w.aufloesung) W(`/widersprueche`, `Widerspruch ${w.id ?? ''} ist aufgelöst, aber ohne Auflösungsgrund.`);
  }
  if (pb.marktwertspanne_eur && pb.aussagebasis === 'unzureichend') W('/preisbewertung/marktwertspanne_eur', 'Marktwertspanne angegeben, obwohl Aussagebasis „unzureichend“ ist.');
  if (pb.marktwertspanne_eur && pb.aussagebasis === 'angebotsvergleich') I('/preisbewertung/marktwertspanne_eur', 'Marktwertspanne nur auf Angebotsvergleich gestützt – darf nicht allein auf einem unbereinigten Angebotsdurchschnitt beruhen.');
  if (isNum(kz.wirtschaftliche_nettorendite_vor_finanzierung_steuern_prozent) && ist.hausgeld_nicht_umlagefaehig_ohne_ruecklage_monat_eur == null) W('/kennzahlen/wirtschaftliche_nettorendite_vor_finanzierung_steuern_prozent', 'Konkrete Nettorendite ohne bekannte Hausgeldaufteilung – sollte null bleiben.');
  if (a.angebotsart === 'miete' && (isNum(kz.bruttomietrendite_prozent) || isNum(kz.kaufpreisfaktor_jahre))) W('/kennzahlen', 'Mietangebot mit Kaufkennzahlen.');
  for (const [p, bl] of ctx.belege) {
    const sec = p.split('/')[1];
    if (bl.status === 'annahme' && FACT_SECTIONS.includes(sec)) W(p, 'Datenbeleg „annahme“ in einem Ist-Abschnitt – Modellannahmen gehören in annahmen/szenarien.');
    const rechnung = /^\/szenarien\/\d+\/rechnung\/\d+\/wert$/.test(p) ? obj(resolvePointer(data, p.replace(/\/wert$/, '')).value) : {};
    if (bl.status === 'berechnet' && !bl.formel && !rechnung.formel) I(p, 'Berechneter Wert ohne Formel im Datenbeleg.');
    for (const qid of arr(bl.quellen_ids)) {
      const q = ctx.quellen.get(qid);
      if (q && q.zugriff === 'nicht_erreichbar' && ['dokumentiert', 'unabhaengig_bestaetigt'].includes(bl.status)) W(p, `Als „${L(bl.status)}“ belegt mit nicht erreichbarer Quelle ${qid}.`);
    }
  }
  for (const q of ctx.list('quellen')) if (q.url == null && !q.fundstelle) W(`/quellen`, `Quelle ${q.id ?? ''} ohne URL und ohne Fundstelle.`);
  const e = obj(data.energie);
  if (isNum(e.kennwert_kwh_m2_a) && ENERGY_CLASSES.includes(e.effizienzklasse)) {
    const k = klasseFromKennwert(e.kennwert_kwh_m2_a);
    if (k !== e.effizienzklasse) I('/energie/effizienzklasse', `Klasse ${e.effizienzklasse} passt nicht zur GEG-Klassengrenze für ${fmtNum(e.kennwert_kwh_m2_a, 'kwh')} (wäre ${k}) – Bezugsgröße/Ausweisart prüfen.`);
  }

  // Nachrechnen
  const calc = (path, actual, expectedList, tol, label) => {
    if (!isNum(actual)) return;
    const exp = expectedList.filter(isNum);
    if (!exp.length || exp.some(x => near(actual, x, tol))) return;
    W(path, `${label}: gespeichert ${minus(nfA.format(actual))}, nachgerechnet ${exp.map(x => minus(nfA.format(Math.round(x * 100) / 100))).join(' bzw. ')}.`);
  };
  const kp = isNum(o.kaufpreis_eur) ? o.kaufpreis_eur : null;
  const kpList = kp == null ? [] : [kp, isNum(o.verpflichtende_zusatzkaeufe_eur) && o.verpflichtende_zusatzkaeufe_eur > 0 ? kp + o.verpflichtende_zusatzkaeufe_eur : null];
  const fl = isNum(o.wohnflaeche_m2) && o.wohnflaeche_m2 > 0 ? o.wohnflaeche_m2 : null;
  const mm = isNum(ist.nettokaltmiete_monat_eur) ? ist.nettokaltmiete_monat_eur : null;
  const mj = isNum(ist.nettokaltmiete_jahr_eur) ? ist.nettokaltmiete_jahr_eur : mm != null ? mm * 12 : null;
  if (mm != null) calc(`/ist_kosten_und_ertraege/nettokaltmiete_jahr_eur`, ist.nettokaltmiete_jahr_eur, [mm * 12], 0.011, 'Jahresnettokaltmiete');
  if (fl) calc('/kennzahlen/kaufpreis_pro_m2_eur', kz.kaufpreis_pro_m2_eur, kpList.map(x => x == null ? null : x / fl), 0.011, 'Kaufpreis pro m²');
  if (fl && mm != null) calc('/kennzahlen/nettokaltmiete_pro_m2_eur', kz.nettokaltmiete_pro_m2_eur, [mm / fl], 0.011, 'Nettokaltmiete pro m²');
  if (mj) {
    calc('/kennzahlen/bruttomietrendite_prozent', kz.bruttomietrendite_prozent, kpList.map(x => x == null ? null : mj / x * 100), 0.011, 'Bruttomietrendite');
    calc('/kennzahlen/kaufpreisfaktor_jahre', kz.kaufpreisfaktor_jahre, kpList.map(x => x == null ? null : x / mj), 0.011, 'Kaufpreisfaktor');
    if (isNum(kz.gesamtinvestition_eur)) calc('/kennzahlen/bruttorendite_auf_gesamtinvestition_prozent', kz.bruttorendite_auf_gesamtinvestition_prozent, [mj / kz.gesamtinvestition_eur * 100], 0.011, 'Bruttorendite auf Gesamtinvestition');
  }
  arr(data.vergleichsobjekte).forEach((v, i) => {
    if (isObj(v) && isNum(v.preis_eur) && isNum(v.wohnflaeche_m2) && v.wohnflaeche_m2 > 0) calc(`/vergleichsobjekte/${i}/preis_pro_m2_eur`, v.preis_pro_m2_eur, [v.preis_eur / v.wohnflaeche_m2], 0.011, `Vergleichsobjekt ${v.id ?? i + 1}: Preis pro m²`);
  });

  // Unzulässige Synonyme einmal je Name melden (das JSON-Schema lehnt sie ab, der Viewer führt sie zusammen)
  const aliasUse = new Map();
  arr(data.szenarien).forEach((s, si) => arr(obj(s).rechnung).forEach((r, ri) => {
    const k = obj(r).kennzahl;
    if (ALIAS_TO_STABLE[k] && !aliasUse.has(k)) aliasUse.set(k, `/szenarien/${si}/rechnung/${ri}/kennzahl`);
  }));
  arr(data.annahmen).forEach((a, i) => {
    const k = obj(a).parameter;
    if (ALIAS_TO_STABLE[k] && !aliasUse.has(k)) aliasUse.set(k, `/annahmen/${i}/parameter`);
  });
  for (const [k, p] of aliasUse) I(p, `„${k}“ statt der stabilen ID „${ALIAS_TO_STABLE[k]}“ (Prompt V3.1) – im Viewer zusammengeführt, vom JSON-Schema abgelehnt.`);

  // Selbstauskunft des Exports gegen Befunde
  const ep = obj(data.exportpruefung);
  if (ep.referenzen_geprueft === true && refErrors) W('/exportpruefung/referenzen_geprueft', `Export meldet „Referenzen geprüft“, der Viewer findet aber ${refErrors} Verweis-/Pfadfehler.`);
  const typeErrors = out.filter(x => x.lvl === 'error').length - refErrors;
  if (ep.schema_geprueft === true && typeErrors > 0) W('/exportpruefung/schema_geprueft', `Export meldet „Schema geprüft“, der Viewer findet aber ${typeErrors} Struktur-/Typfehler.`);

  const order = { error: 0, warn: 1, info: 2 };
  return out.sort((x, y) => order[x.lvl] - order[y.lvl]);
}

function klasseFromKennwert(k) {
  for (let i = 0; i < ENERGY_CLASSES.length; i++) if (k < ENERGY_BOUNDS[i + 1] || i === ENERGY_CLASSES.length - 1) return ENERGY_CLASSES[i];
  return 'H';
}
const countIssues = d => ({ error: d.issues.filter(x => x.lvl === 'error').length, warn: d.issues.filter(x => x.lvl === 'warn').length, info: d.issues.filter(x => x.lvl === 'info').length });

/* =====================================================================
   Bausteine

function verdictBadge(v, size = '') {

const vcls = v => (VERDICT[v] || ['', 'v-none'])[1];
function meter(level, withLabel = true) {

function belegChip(doc, path, compact = false) {

}
function refTags(doc, ids) {

    const target = lookupRef(doc, id);

}
function lookupRef(doc, id) {
  const c = doc.ctx, p = String(id)[0];

    || (p === 'V' ? c.list('vergleichsobjekte').find(x => x.id === id) : p === 'N' ? c.list('naechste_schritte').find(x => x.id === id) : undefined);

function scenRange(doc, key) {
  const list = doc.ctx.scen.get(key);
  if (!list || !list.length) return null;
  const vals = list.map(x => x.value);
  const min = Math.min(...vals), max = Math.max(...vals);

}

function valueCell(doc, path, { unit, chip = true, compact = false, scenario = true } = {}) {
  const key = lastKey(path);
  const r = resolvePointer(doc.data, path);
  const v = r.found ? r.value : undefined;
  let html;
  if (v === null || v === undefined) {
    html = `<span class="null" title="${r.found ? 'null – nicht verlässlich bestimmbar' : 'Feld fehlt im Export'}">—</span>`;
    const w = doc.ctx.conflicts.get(path);
    if (w) html += ` <button class="tag tag-crit" data-action="ref" data-uid="${doc.uid}" data-id="${esc(w.id)}">strittig · ${esc(w.id)}</button>`;
    if (scenario) { const sc = scenRange(doc, key); if (sc) html += ` <span class="scen" data-tip="${esc(sc.tip)}">Szenario: ${esc(sc.text)}</span>`; }
  } else if (Array.isArray(v) && v.every(x => typeof x === 'string')) {
    html = v.length ? `<span class="val">${esc(v.join(' · '))}</span>` : '<span class="null">leer</span>';
  } else {
    const txt = fmtValue(key, v, unit);
    html = `<span class="val${typeof v === 'number' && v < 0 ? ' neg' : ''}">${esc(txt)}</span>`;
    if (key === 'url' && safeUrl(v)) html = `<a href="${esc(safeUrl(v))}" target="_blank" rel="noopener noreferrer">${esc(trunc(v, 48))} ↗</a>`;
  }
  if (chip) html += belegChip(doc, path, compact);
  return html;
}

const LONG_KEYS = new Set(['lageeinschaetzung', 'zustandseinschaetzung', 'sanierungsplanung', 'einschaetzung', 'nutzungsfokus_grundlage', 'einschraenkungen', 'titel']);
function kvList(doc, sec, keys, { skip = [] } = {}) {

/* =====================================================================
   Diagramme (inline SVG, ohne Bibliotheken)
   ===================================================================== */
const chartFns = new Map();
let chartSeq = 0;
function chartSlot(fn, label) {
  const id = 'c' + (++chartSeq);
  chartFns.set(id, fn);
  return `<div class="chart" data-chart="${id}" role="img" aria-label="${esc(label)}"></div>`;

function drawCharts() {
  for (const el of document.querySelectorAll('[data-chart]')) {
    const fn = chartFns.get(el.dataset.chart);
    if (fn) el.innerHTML = fn(Math.max(280, el.clientWidth));

function niceTicks(a, b, n = 5) {
  if (!(b > a)) { const d = Math.abs(a) * 0.1 || 1; a -= d; b += d; }
  const raw = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f >= 7.5 ? 10 : f >= 3.5 ? 5 : f >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(a / step) * step, hi = Math.ceil(b / step) * step;
  const ticks = [];
  for (let i = 0; lo + i * step <= hi + step * 1e-6; i++) ticks.push(Math.round((lo + i * step) / step) * step);
  return { lo, hi, step, ticks };
}
/** Anzahl Achsenwerte nach verfügbarer Breite, damit Beschriftungen nicht kollidieren. */
const tickCount = (px, labelPx = 72) => Math.max(2, Math.min(6, Math.floor(px / labelPx)));
const pad = (a, b, f = 0.08) => { const s = (b - a) || Math.abs(a) * 0.1 || 1; return [a - s * f, b + s * f]; };
const svgOpen = (w, h) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
function hbarPath(x0, x1, y, h, r = 4) {
  const len = Math.abs(x1 - x0); r = Math.min(r, len / 2, h / 2);
  if (len < 0.5) return '';
  if (x1 >= x0) return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
  return `M${x0},${y}H${x1 + r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 + r},${y + h}H${x0}Z`;
}

/** Streudiagramm Kaufpreis/m² gegen Bruttomietrendite (Vergleich). */
function svgScatter(w, pts) {
  const h = Math.round(Math.min(480, Math.max(320, w * 0.3))), m = { l: 58, r: 34, t: 30, b: 46 };
  const xs = pts.flatMap(p => p.x), ys = pts.flatMap(p => p.y);
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const xt = niceTicks(x0, x1, tickCount(iw, 64)), yt = niceTicks(Math.max(0, y0), y1, 5);
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  const sy = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let s = svgOpen(w, h);
  s += `<text class="axis-title" x="${m.l}" y="14">Bruttomietrendite (%)</text>`;
  for (const t of yt.ticks) s += `<line class="grid" x1="${m.l}" x2="${w - m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="tick" x="${m.l - 8}" y="${sy(t) + 4}" text-anchor="end">${nf1.format(t)}</text>`;
  for (const t of xt.ticks) s += `<text class="tick" x="${sx(t)}" y="${m.t + ih + 18}" text-anchor="middle">${nf0.format(t)}</text>`;
  s += `<line class="axis" x1="${m.l}" x2="${w - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<text class="axis-title" x="${m.l + iw / 2}" y="${h - 6}" text-anchor="middle">Kaufpreis pro m² (€)</text>`;
  for (const p of pts) {
    const ax = [Math.min(...p.x), Math.max(...p.x)].map(sx), ay = [Math.min(...p.y), Math.max(...p.y)].map(sy);
    const ranged = ax[0] !== ax[1] || ay[0] !== ay[1];
    if (ranged && ax[0] !== ax[1] && ay[0] !== ay[1]) s += `<rect class="rangebox" x="${ax[0]}" y="${ay[1]}" width="${ax[1] - ax[0]}" height="${ay[0] - ay[1]}" rx="4"/>`;
    else if (ranged) s += `<line class="rangeline" x1="${ax[0]}" x2="${ax[1]}" y1="${ay[0]}" y2="${ay[1]}"/>`;
    const marks = ranged ? [[ax[0], ay[0]], [ax[1], ay[1]]] : [[ax[0], ay[0]]];
    for (const [cx, cy] of marks) s += `<circle class="dot${p.hollow ? ' hollow' : ''}" cx="${cx}" cy="${cy}" r="5.5"/>`;
    const lx = Math.max(...marks.map(mk => mk[0])), ly = Math.min(...marks.map(mk => mk[1]));
    const right = lx < w - m.r - 30;
    s += `<text class="lbl" x="${right ? lx + 9 : lx - 9}" y="${ly - 7}" text-anchor="${right ? 'start' : 'end'}">#${p.num}</text>`;
    for (const [cx, cy] of marks) s += `<circle class="hit" cx="${cx}" cy="${cy}" r="13" data-tip="${esc(p.tip)}" data-action="open" data-uid="${p.uid}" style="cursor:pointer"/>`;
  }
  return s + '</svg>';
}

/** Preis-Einordnung: Kaufpreis, Wertspannen und renditeabhängige Zahlungsgrenzen auf einer EUR-Achse. */
function svgPriceMap(w, rows, ref) {
  const rowH = 34, m = { l: Math.min(230, w * 0.38), r: w < 520 ? 84 : 128, t: 8, b: 34 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.flatMap(r => [r.min, r.max]);
  const [a, b] = pad(Math.min(...vals), Math.max(...vals), 0.08);
  const iw = w - m.l - m.r;
  const xt = niceTicks(Math.max(0, a), b, tickCount(iw, 78));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${fmtAxis(t)}</text>`;
  if (ref != null) s += `<line class="refline" x1="${sx(ref)}" x2="${sx(ref)}" y1="${m.t}" y2="${h - m.b}"/>`;
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="${r.style === 'subject' ? 'lbl' : 'lbl2'}" x="${m.l - 12}" y="${cy + 4}" text-anchor="end"${r.style === 'subject' ? ' font-weight="600"' : ''}>${esc(trunc(r.label, Math.max(16, Math.floor(m.l / 6.6))))}</text>`;
    const x0 = sx(r.min), x1 = sx(r.max);
    if (r.kind === 'range') s += `<rect class="range-bar" x="${x0}" y="${cy - 7}" width="${Math.max(4, x1 - x0)}" height="14" rx="4"/>`;
    else if (r.style === 'subject') s += `<rect class="subject" x="${x0 - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x0} ${cy})"/>`;
    else s += `<circle class="dot limit" cx="${x0}" cy="${cy}" r="5.5"/>`;
    const txt = r.kind === 'range' ? `${fmtAxis(r.min)}–${fmtAxis(r.max)}` : fmtNum(r.min, 'eur');
    s += `<text class="val" x="${x1 + 10}" y="${cy + 4}">${esc(txt)}</text>`;
    s += `<rect class="hit" x="${x0 - 10}" y="${cy - 13}" width="${Math.max(20, x1 - x0 + 20)}" height="26" data-tip="${esc(r.tip)}"/>`;
  });
  return s + '</svg>';
}

/** Punktdiagramm Preis pro m²: dieses Objekt und Vergleichsobjekte. */
function svgDots(w, rows) {
  const rowH = 30, m = { l: Math.min(190, w * 0.36), r: 70, t: 10, b: 34 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.flatMap(r => r.values);
  const [a, b] = pad(Math.min(...vals), Math.max(...vals), 0.1);
  const iw = w - m.l - m.r;
  const xt = niceTicks(a, b, tickCount(iw, 56));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${nf0.format(t)}</text>`;
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="${r.style === 'subject' ? 'lbl' : 'lbl2'}" x="${m.l - 12}" y="${cy + 4}" text-anchor="end"${r.style === 'subject' ? ' font-weight="600"' : ''}>${esc(r.label)}</text>`;
    const xs = r.values.map(sx);
    if (xs.length > 1) s += `<line class="rangeline${r.style === 'subject' ? ' ink' : ''}" x1="${Math.min(...xs)}" x2="${Math.max(...xs)}" y1="${cy}" y2="${cy}"/>`;
    for (const x of xs) {
      if (r.style === 'subject') s += `<rect class="subject" x="${x - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x} ${cy})"/>`;
      else if (r.style === 'ausgeschlossen') s += `<path class="marker" d="M${x - 4},${cy - 4}L${x + 4},${cy + 4}M${x + 4},${cy - 4}L${x - 4},${cy + 4}" style="stroke:var(--muted);stroke-width:2"/>`;
      else s += `<circle class="dot${r.style === 'eingeschraenkt' ? ' hollow' : ''}" cx="${x}" cy="${cy}" r="5.5"/>`;
    }
    const maxX = Math.max(...xs);
    s += `<text class="val" x="${maxX + 10}" y="${cy + 4}">${esc(r.values.length > 1 ? nf0.format(Math.min(...r.values)) + '–' + nf0.format(Math.max(...r.values)) : nf0.format(r.values[0]))}</text>`;
    s += `<rect class="hit" x="${Math.min(...xs) - 10}" y="${cy - 12}" width="${maxX - Math.min(...xs) + 20}" height="24" data-tip="${esc(r.tip)}"/>`;
  });
  return s + '</svg>';
}

/** Cashflow je Szenario, divergierend um 0. */
function svgCashflow(w, rows) {
  const rowH = 36, bh = 16, m = { l: Math.min(240, w * 0.42), r: 74, t: 8, b: 32 };
