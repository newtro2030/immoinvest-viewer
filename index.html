    <div class="grid-2">
      <div class="card"><h3>Standort</h3><p class="card-sub">Ohne hausgenaue Adresse keine hausgenauen Wegezeiten oder Gefahrenwerte.</p>${kvList(doc, 'standort', CORE.standort)}${karteStandortBlock(doc)}</div>
      <div class="card"><h3>Energie</h3><p class="card-sub">Energieausweis laut Export.</p>${kvList(doc, 'energie', CORE.energie)}${energyScale(e, m.pruefdatum)}</div>
    </div></section>`;
}

function secPreis(doc) {
  const d = doc.data, pb = obj(d.preisbewertung), o = obj(d.objekt), kz = obj(d.kennzahlen);
  const kp = isNum(o.kaufpreis_eur) ? o.kaufpreis_eur : null;
  const priceRows = [];
  if (kp != null) priceRows.push({ label: 'Kaufpreis', kind: 'point', style: 'subject', min: kp, max: kp, tip: `Kaufpreis: ${fmtNum(kp, 'eur')}` });
  [['Angebotsvergleichsspanne', pb.angebotsvergleichsspanne_eur], ['Marktwertspanne', pb.marktwertspanne_eur]].forEach(([label, r]) => {
    if (isRange(r)) priceRows.push({ label, kind: 'range', min: r.min, max: r.max, tip: `${label}\n${fmtNum(r.min, 'eur')} – ${fmtNum(r.max, 'eur')}` });
  });
  for (const s of arr(d.szenarien).filter(isObj)) {
    const rs = arr(s.rechnung).filter(isObj);
    const g = rs.find(r => r.kennzahl === 'zahlungsgrenze_eur' && isNum(r.wert));
    if (!g) continue;
    const ziel = rs.find(r => r.kennzahl === 'ziel_bruttomietrendite_prozent' && isNum(r.wert));
    const label = ziel ? `Zahlungsgrenze bei ${nf1.format(ziel.wert)} %` : (s.bezeichnung || 'Zahlungsgrenze');
    priceRows.push({ label, kind: 'point', style: 'limit', min: g.wert, max: g.wert, tip: `${s.id ?? ''} ${s.bezeichnung ?? ''}\nZahlungsgrenze: ${fmtNum(g.wert, 'eur')}${kp != null ? `\nAbstand zum Kaufpreis: ${fmtNum(g.wert - kp, 'eur')}` : ''}\nAnlegerannahme, kein Marktwert.` });
  }
  const hasLimit = priceRows.some(r => r.style === 'limit'), hasRange = priceRows.some(r => r.kind === 'range');
  const rangeChart = priceRows.length > 1
    ? chartSlot(w => svgPriceMap(w, priceRows, kp), 'Kaufpreis, Wertspannen und Zahlungsgrenzen')
      + `<div class="chart-legend"><span>${legendDot('', 'diamond')}Kaufpreis</span>${hasRange ? `<span><svg width="18" height="10" viewBox="0 0 18 10"><rect x="1" y="2" width="16" height="6" rx="3" style="fill:var(--range)"/></svg>Wertspanne laut Export</span>` : ''}${hasLimit ? `<span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" style="fill:var(--c-orange)"/></svg>Zahlungsgrenze (Zielrendite-Szenario)</span>` : ''}</div>`
      + `<p class="chart-note">Angebotsspannen beruhen auf Angebotspreisen, nicht auf beurkundeten Kaufpreisen. Zahlungsgrenzen sind renditeabhängige Anlegerannahmen, kein Marktwert.${hasRange ? '' : ` Keine Wertspanne ausgewiesen (Aussagebasis: ${esc(L(pb.aussagebasis || 'unzureichend'))}).`}</p>`
    : `<div class="empty"><b>Keine Wertspanne und keine Zahlungsgrenze ausgewiesen.</b><br>Aussagebasis: ${esc(L(pb.aussagebasis || 'unzureichend'))}. Bei unzureichender Grundlage bleibt die Spanne null.</div>`;
  const vs = doc.ctx.list('vergleichsobjekte');
  const rows = vs.map((v, i) => {
    const calc = isNum(v.preis_eur) && isNum(v.wohnflaeche_m2) && v.wohnflaeche_m2 > 0 ? v.preis_eur / v.wohnflaeche_m2 : null;
    const stored = isNum(v.preis_pro_m2_eur) ? v.preis_pro_m2_eur : null;
    let qm = stored != null ? esc(fmtNum(stored, 'eur_m2')) : calc != null ? `<span class="muted" title="Im Export null; vom Viewer berechnet">≈ ${esc(fmtNum(calc, 'eur_m2'))}</span>` : '<span class="null">—</span>';
    if (stored != null && calc != null && !near(stored, calc, 0.011)) qm += ` <span class="tag tag-warn" data-tip="Nachgerechnet: ${esc(fmtNum(calc, 'eur_m2'))}">⚠</span>`;
    const url = safeUrl(v.url);
    return `<tr id="ref-${doc.uid}-${esc(v.id)}" class="${v.eignung === 'ausgeschlossen' ? 'excluded' : ''}">
      <td><span class="id">${esc(v.id ?? i + 1)}</span></td><td class="nowrap">${esc(L(v.preisart || 'unbekannt'))}</td>
      <td class="num">${isNum(v.preis_eur) ? esc(fmtNum(v.preis_eur, 'eur')) : '<span class="null">—</span>'}</td>
      <td class="num">${isNum(v.wohnflaeche_m2) ? esc(fmtNum(v.wohnflaeche_m2, 'm2')) : '<span class="null">—</span>'}</td>
      <td class="num">${qm}</td>
      <td class="nowrap"><span class="tag${v.eignung === 'gut' ? ' tag-good' : v.eignung === 'ausgeschlossen' ? ' tag-crit' : ''}">${esc(L(v.eignung || 'unbekannt'))}</span></td>
      <td class="nowrap">${v.gleicher_gebaeudekomplex === true ? 'Ja' : v.gleicher_gebaeudekomplex === false ? 'Nein' : '<span class="null">—</span>'}</td>
      <td>${esc(v.unterschiede_und_begruendung ?? '')}</td>
      <td class="nowrap">${refTags(doc, v.quellen_ids)}${url ? ` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="Angebot öffnen">↗</a>` : ''}</td></tr>`;
  }).join('');

  // Punktdiagramm €/m²
  const dotRows = [];
  const subjVals = isNum(kz.kaufpreis_pro_m2_eur) ? [kz.kaufpreis_pro_m2_eur] : (scenRange(doc, 'kaufpreis_pro_m2_eur')?.values || []);
  if (subjVals.length) dotRows.push({ label: 'Dieses Objekt', values: [Math.min(...subjVals), Math.max(...subjVals)].filter((x, i, a) => a.indexOf(x) === i), style: 'subject', tip: isNum(kz.kaufpreis_pro_m2_eur) ? `Dieses Objekt: ${fmtNum(kz.kaufpreis_pro_m2_eur, 'eur_m2')}` : scenRange(doc, 'kaufpreis_pro_m2_eur').tip });
  for (const v of vs) {
    const val = isNum(v.preis_pro_m2_eur) ? v.preis_pro_m2_eur : isNum(v.preis_eur) && isNum(v.wohnflaeche_m2) && v.wohnflaeche_m2 > 0 ? v.preis_eur / v.wohnflaeche_m2 : null;
    if (val != null) dotRows.push({ label: `${v.id ?? ''} · ${L(v.eignung || 'unbekannt')}`, values: [val], style: v.eignung || 'gut', tip: `${v.id}: ${fmtNum(val, 'eur_m2')}\n${L(v.preisart || 'unbekannt')} · Eignung ${L(v.eignung || 'unbekannt')}\n${v.unterschiede_und_begruendung ?? ''}` });
  }
  const dotChart = dotRows.length > 1 ? `<div class="card"><h3>Preis pro m² im Vergleich</h3><p class="card-sub">Ausgeschlossene Vergleiche sind markiert und fließen nicht in Spannen ein.</p>${chartSlot(w => svgDots(w, dotRows), 'Preis pro m² dieses Objekts und der Vergleichsobjekte')}
    <div class="chart-legend"><span>${legendDot('', 'diamond')}Dieses Objekt${subjVals.length > 1 ? ' (Szenario-Spanne)' : ''}</span><span>${legendDot('')}Eignung gut</span><span>${legendDot('hollow')}Eingeschränkt</span><span>${legendDot('', 'x')}Ausgeschlossen</span></div></div>` : '';

  return `<section class="sec" id="sec-preis"><h2><span class="letter">D</span>Vergleichsobjekte & Preisurteil</h2>
    <div class="stack">
      <div class="grid-2">
        <div class="card"><h3>Preisbewertung</h3><p class="card-sub">Angebotspreise sind keine Transaktionspreise; kein Verkehrswertgutachten.</p>${kvList(doc, 'preisbewertung', CORE.preisbewertung)}</div>
        <div class="card"><h3>Preis-Einordnung</h3><p class="card-sub">Kaufpreis gegenüber Wertspannen und Zahlungsgrenzen aus dem Export.</p>${rangeChart}</div>
      </div>
      ${vs.length ? `<div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>ID</th><th>Preisart</th><th class="num">Preis</th><th class="num">Fläche</th><th class="num">€/m²</th><th>Eignung</th><th>Gl. Komplex</th><th>Unterschiede & Begründung</th><th>Quellen</th></tr></thead><tbody>${rows}</tbody></table></div></div>` : emptyNote('Keine Vergleichsobjekte erfasst.')}
      ${dotChart}
    </div></section>`;
}

function secKosten(doc) {
  const ctx = doc.ctx, an = ctx.list('annahmen'), sz = arr(doc.data.szenarien);
  const annTable = an.length ? `<div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>ID</th><th>Parameter</th><th class="num">Wert</th><th>Einheit</th><th>Begründung</th><th>Quellen</th></tr></thead><tbody>
    ${an.map(a => `<tr id="ref-${doc.uid}-${esc(a.id)}"><td><span class="id">${esc(a.id)}</span></td><td>${esc(a.parameter ?? '')}</td><td class="num">${esc(typeof a.wert === 'number' ? minus(nfA.format(a.wert)) : a.wert === null || a.wert === undefined ? '—' : typeof a.wert === 'boolean' ? (a.wert ? 'Ja' : 'Nein') : a.wert)}</td><td>${esc(prettyUnit(a.einheit))}</td><td>${esc(a.begruendung ?? '')}</td><td>${refTags(doc, a.quellen_ids)}</td></tr>`).join('')}
    </tbody></table></div></div>` : emptyNote('Keine Modellannahmen erfasst.');

  const cfRows = [];
  sz.forEach(s => { if (!isObj(s)) return; const r = arr(s.rechnung).find(x => isObj(x) && canonKz(x.kennzahl) === 'cashflow_monat_vor_steuern_eur' && isNum(x.wert)); if (r) cfRows.push({ label: `${s.id ?? ''} ${s.bezeichnung ?? ''}`.trim(), value: r.wert, tip: `${s.id ?? ''} ${s.bezeichnung ?? ''}\nCashflow vor Steuern: ${fmtNum(r.wert, 'eur')} pro Monat\n${s.einordnung ?? ''}` }); });

/* ---------- Vergleich ---------- */
// Spalten der Vergleichstabelle. sv = Sortierwert, filter = Typ des Spaltenfilters (src/oberflaeche/spaltenfilter.js),
// fv = Filterwert (sonst Sortierwert), optionen = Auswahlwerte mit Beschriftung, einheit = Anzeige im Zahlenfilter.
const nurZahl = v => (isNum(v) ? v : null);
const nurKey = (v, liste) => (liste.includes(v) ? v : '');
const COLS = [
  { id: 'num', label: '#', titel: 'Nummer', sv: d => d.num, filter: 'zahl' },
  { id: 'objekt', label: 'Objekt', sv: d => docTitle(d).toLowerCase(), filter: 'text', fv: d => { const a = obj(d.data.angebot); return [docTitle(d), docPlace(d), platLabel(a.plattform), a.plattform_id, a.objektart].filter(v => v != null).join(' '); } },
  { id: 'urteil', label: 'Gesamturteil', sv: d => { const i = VERDICT_ORDER.indexOf(urteilOf(d)); return i < 0 ? null : i; }, filter: 'auswahl', fv: d => nurKey(urteilOf(d), VERDICT_ORDER), optionen: () => [...VERDICT_ORDER.map(v => [v, L(v)]), ['', 'Kein Urteil']] },
  { id: 'sicherheit', label: 'Beleg­sicherheit', sv: d => { const i = SICHERHEIT.indexOf(obj(d.data.bewertung).belegsicherheit); return i < 0 ? null : i; }, filter: 'auswahl', fv: d => nurKey(obj(d.data.bewertung).belegsicherheit, SICHERHEIT), optionen: () => [...SICHERHEIT.map(v => [v, L(v)]), ['', 'Keine Angabe']] },
  { id: 'kaufpreis', label: 'Kaufpreis', path: '/objekt/kaufpreis_eur', num: true, filter: 'zahl', einheit: '€' },
  { id: 'flaeche', label: 'Wohnfläche', path: '/objekt/wohnflaeche_m2', num: true, filter: 'zahl', einheit: 'm²' },
  { id: 'qm', label: '€/m²', titel: 'Kaufpreis pro m²', path: '/kennzahlen/kaufpreis_pro_m2_eur', num: true, filter: 'zahl', einheit: '€/m²' },
  { id: 'miete', label: 'Kaltmiete / Monat', path: '/ist_kosten_und_ertraege/nettokaltmiete_monat_eur', num: true, filter: 'zahl', einheit: '€' },
  { id: 'rendite', label: 'Brutto­rendite', path: '/kennzahlen/bruttomietrendite_prozent', num: true, filter: 'zahl', einheit: '%' },
  { id: 'faktor', label: 'Faktor', titel: 'Kaufpreisfaktor', path: '/kennzahlen/kaufpreisfaktor_jahre', num: true, filter: 'zahl', einheit: 'Jahre' },
  { id: 'energie', label: 'Energie', titel: 'Energieeffizienzklasse', sv: d => { const e = obj(d.data.energie); return isNum(e.kennwert_kwh_m2_a) ? e.kennwert_kwh_m2_a : null; }, filter: 'auswahl', fv: d => nurKey(obj(d.data.energie).effizienzklasse, ENERGY_CLASSES), optionen: () => [...ENERGY_CLASSES.map(k => [k, `Klasse ${k}`]), ['', 'Ohne Klasse']] },
  { id: 'baujahr', label: 'Baujahr', path: '/objekt/baujahr', num: true, filter: 'zahl' },
  { id: 'offen', label: 'Offene Wider­sprüche', sv: d => d.ctx.conflicts.size, filter: 'zahl' },
  { id: 'risiken', label: 'Risiken hoch', sv: d => d.ctx.list('risiken').filter(r => r.schwere === 'hoch').length, filter: 'zahl' },
  { id: 'pruefdatum', label: 'Prüfdatum', path: '/metadaten/pruefdatum', filter: 'datum', fv: d => { const v = obj(d.data.metadaten).pruefdatum; return isValidDate(v) ? v : null; } },
  { id: 'export', label: 'Export­prüfung', sv: d => { const c = countIssues(d); return c.error * 1000 + c.warn; }, filter: 'auswahl', fv: d => { const c = countIssues(d); return c.error ? 'fehler' : c.warn ? 'warnung' : 'ok'; }, optionen: () => [['ok', '✓ Ohne Befund'], ['warnung', '⚠ Warnungen'], ['fehler', '✕ Fehler']] },
];
const colValue = (c, d) => (c.sv ? c.sv(d) : (() => { const r = resolvePointer(d.data, c.path); return r.found ? r.value : null; })());
/** Wert für den Spaltenfilter: eigener Filterwert, sonst Sortierwert; Zahlenfilter sehen nur echte Zahlen (null = ohne Wert). */
const colFilterValue = (c, d) => { const v = c.fv ? c.fv(d) : colValue(c, d); return c.filter === 'zahl' ? nurZahl(v) : v; };
const colTitel = c => c.titel || c.label.replace(/\u00ad/g, '');

const CMP_TABS = [['tabelle', 'Tabelle'], ['preis', 'Kaufpreis/m² &amp; Rendite'], ['karte', 'Karte'], ['gegenueberstellung', 'Gegen&shy;über&shy;stellung'], ['persoenlich', 'Mit meinem Profil']];
const ortKey = d => String(obj(obj(d.data).standort).ort ?? '').trim();
const inOrtFilter = d => !state.filter.orte.size || state.filter.orte.has(ortKey(d));

/** Objekte vor den Spaltenfiltern: Revisionen, Ort, Suche. */
function basisDocs() {
  const q = state.filter.q.trim().toLowerCase();
  return immoDocs().filter(d => (state.filter.showOld || d.rev?.latest)
    && inOrtFilter(d)
    && (!q || [docTitle(d), docPlace(d), obj(d.data.angebot).plattform, obj(d.data.angebot).plattform_id, obj(d.data.angebot).objektart, d.fileName].join(' ').toLowerCase().includes(q)));
}

function filteredDocs() {
  const list = RK.tabellenfilter.anwenden(basisDocs(), COLS.map(c => ({ id: c.id, typ: c.filter })), state.filter.spalten, (s, d) => colFilterValue(COLS.find(c => c.id === s.id), d));
  const col = COLS.find(c => c.id === state.sort.col) || COLS[0];
  return list.sort((a, b) => {
    const va = colValue(col, a), vb = colValue(col, b);
    const na = va === null || va === undefined || va === '', nb = vb === null || vb === undefined || vb === '';
    if (na || nb) return na === nb ? a.num - b.num : na ? 1 : -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * state.sort.dir || a.num - b.num;
  });
}

function viewCompare() {
  const docs = immoDocs(), latest = docs.filter(d => d.rev?.latest);
  if (!state.selectionTouched && !state.selected.size) latest.slice(0, 4).forEach(d => state.selected.add(d.uid));
  if (!CMP_TABS.some(([id]) => id === state.cmpTab)) state.cmpTab = 'tabelle';
  const filtered = state.cmpTab !== 'gegenueberstellung';
  const hasRevs = docs.length !== latest.length;
  const bad = state.docs.filter(d => !d.isImmo).length;
  // Kacheln zählen Objekte (neueste Revision); der Ortsfilter gilt überall außer in der Gegenüberstellung
  const scope = filtered ? latest.filter(inOrtFilter) : latest;
  const cnt = vs => scope.filter(d => vs.includes(urteilOf(d))).length;
  const orte = filtered ? [...state.filter.orte] : [];
  const stat = (label, n, v) => `<div class="tile stat"><div class="tile-label">${v ? verdictBadge(v, 'sm') : esc(label)}</div><div class="tile-value">${n}</div></div>`;
  return `<div class="page-head"><div><h1>Vergleich</h1><p class="sub">${latest.length} Objekt${latest.length === 1 ? '' : 'e'}${hasRevs ? ` · ${docs.length} Bewertungen inkl. älterer Revisionen` : ''}${bad ? ` · ${bad} Datei${bad === 1 ? '' : 'en'} nicht lesbar` : ''}${orte.length ? ` · Filter Ort: ${esc(orte.map(o => o || 'ohne Angabe').join(', '))}` : ''}</p></div>
      ${filtered && !['persoenlich', 'karte'].includes(state.cmpTab) ? '<div class="dh-actions"><button class="btn sm needs-download" data-action="csv">CSV exportieren</button></div>' : ''}</div>
    <div class="tiles stats">
      ${stat(orte.length ? 'Objekte im Filter' : 'Objekte', scope.length)}${stat('', cnt(['weiter_pruefen']), 'weiter_pruefen')}${stat('', cnt(['nur_zu_anderen_konditionen_interessant']), 'nur_zu_anderen_konditionen_interessant')}${stat('', cnt(['bis_zur_klaerung_zurueckstellen']), 'bis_zur_klaerung_zurueckstellen')}${stat('', cnt(['fuer_das_ziel_verwerfen', 'nicht_bewertbar']), 'fuer_das_ziel_verwerfen')}
    </div>
    <div class="cmp-tabs" role="tablist" aria-label="Bereiche des Vergleichs">${CMP_TABS.map(([id, label]) => `<button class="cmp-tab${state.cmpTab === id ? ' active' : ''}" role="tab" aria-selected="${state.cmpTab === id}" data-action="cmp-tab" data-tab="${id}">${label}${id === 'gegenueberstellung' ? ` <span class="count">${state.selected.size}</span>` : ''}</button>`).join('')}</div>
    ${filtered ? compareFilters(hasRevs) : ''}
    <div id="cmpResults">${compareResults()}</div>`;
}

/** Suche, Urteil, Revisionen und Schnellfilter nach Ort (für Tabelle und Kaufpreis/m² & Rendite). */
function compareFilters(hasRevs) {
  const base = immoDocs().filter(d => state.filter.showOld || d.rev?.latest);
  const counts = new Map();
  for (const d of base) counts.set(ortKey(d), (counts.get(ortKey(d)) || 0) + 1);
  const orte = [...counts].sort((a, b) => (a[0] === '') - (b[0] === '') || a[0].localeCompare(b[0], 'de'));
  const chips = orte.length > 1 ? `<div class="ort-filter" role="group" aria-label="Nach Ort filtern"><span class="lbl">Ort</span>
      <button class="chip-btn${state.filter.orte.size ? '' : ' on'}" data-action="filter-ort-all" aria-pressed="${!state.filter.orte.size}">Alle <span class="n">${base.length}</span></button>
      ${orte.map(([o, n]) => { const on = state.filter.orte.has(o); return `<button class="chip-btn${on ? ' on' : ''}" data-action="filter-ort" data-ort="${esc(o)}" aria-pressed="${on}">${esc(o || 'Ohne Ortsangabe')} <span class="n">${n}</span></button>`; }).join('')}
    </div>` : '';
  return `<div class="filters">
      <input type="search" id="fq" placeholder="Suchen: Titel, Ort, Plattform-ID, Datei …" value="${esc(state.filter.q)}" aria-label="Suchen">
      ${urteilAuswahl()}
      ${hasRevs ? `<label class="check"><input type="checkbox" id="fold"${state.filter.showOld ? ' checked' : ''}> Ältere Revisionen zeigen</label>` : ''}
    </div>${chips}`;
}

function compareResults() {
  if (state.cmpTab === 'gegenueberstellung') return selectionPicker() + matrixCard();
  const rows = filteredDocs();
  const leiste = spaltenfilterLeiste(rows);
  if (state.cmpTab === 'persoenlich') return leiste + vergleichPersoenlich(rows);
  if (state.cmpTab === 'karte') return leiste + karteAnsicht(rows);
  return leiste + (state.cmpTab === 'preis' ? priceOverview(rows) : compareTable(rows));
}

function compareTable(rows) {
  const allSel = rows.length > 0 && rows.every(d => state.selected.has(d.uid));
  const head = COLS.map(c => {
    const active = state.sort.col === c.id;
    return `<th class="sortable${c.num || ['num', 'offen', 'risiken'].includes(c.id) ? ' num' : ''}${state.filter.spalten[c.id] ? ' gefiltert' : ''}" aria-sort="${active ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}">${spaltenKopf(c, active)}</th>`;
  }).join('');
  const body = rows.map(d => {
    const e = obj(d.data.energie), m = obj(d.data.metadaten), a = obj(d.data.angebot), b = obj(d.data.bewertung);
    const cell = c => {
      if (c.id === 'num') return `<td class="num"><span class="num">#${d.num}</span></td>`;
      if (c.id === 'objekt') return `<td class="cell-obj"><div class="obj-title">${esc(docTitle(d))} ${offerTag(d.data)}</div><div class="obj-sub">${esc([docPlace(d), platLabel(a.plattform), a.plattform_id].filter(Boolean).join(' · '))}${d.rev && d.rev.total > 1 ? ` · Rev. ${d.rev.index}/${d.rev.total}` : ''}</div></td>`;
      if (c.id === 'urteil') return `<td class="cell-urteil">${verdictBadge(b.gesamturteil, 'sm')}</td>`;
      if (c.id === 'sicherheit') return `<td>${meter(b.belegsicherheit)}</td>`;
      if (c.id === 'energie') return `<td class="nowrap">${e.effizienzklasse ? `<b>${esc(e.effizienzklasse)}</b> ` : ''}${isNum(e.kennwert_kwh_m2_a) ? `<span class="muted small">${esc(nfA.format(e.kennwert_kwh_m2_a))}</span>` : (!e.effizienzklasse ? '<span class="null">—</span>' : '')}</td>`;
      if (c.id === 'offen') return `<td class="num">${d.ctx.conflicts.size ? `<span class="tag tag-crit">${d.ctx.conflicts.size}</span>` : '0'}</td>`;
      if (c.id === 'risiken') { const n = colValue(c, d); return `<td class="num">${n ? `<span class="tag tag-crit">${n}</span>` : '0'}</td>`; }
      if (c.id === 'pruefdatum') return `<td class="nowrap">${m.pruefdatum ? esc(fmtDate(m.pruefdatum)) : '<span class="null">—</span>'}</td>`;
      if (c.id === 'export') return `<td class="nowrap">${issueTags(d)}</td>`;
      return `<td class="num">${valueCell(d, c.path, { compact: true })}</td>`;
    };
    return `<tr class="clickable" data-action="open" data-uid="${d.uid}"><td><input type="checkbox" data-select="${d.uid}" ${state.selected.has(d.uid) ? 'checked' : ''} aria-label="Für Gegenüberstellung auswählen"></td>${COLS.map(cell).join('')}</tr>`;
  }).join('');

  return `<div class="card flush"><div class="table-wrap fest"><table class="t cmp-table"><thead><tr><th><input type="checkbox" id="selAll" ${allSel ? 'checked' : ''} aria-label="Alle sichtbaren auswählen"></th>${head}</tr></thead><tbody>${body || `<tr><td colspan="${COLS.length + 1}" class="muted">Keine Treffer.${Object.keys(state.filter.spalten).length ? ' <button class="linkbtn" data-action="spaltenfilter-alle-weg">Spaltenfilter löschen</button>' : ''}</td></tr>`}</tbody></table></div></div>
    <p class="chart-note">Überschrift anklicken = sortieren, Trichter daneben = sortieren und filtern. „—“ = null im Export (nicht verlässlich bestimmbar); Zahlenfilter zeigen solche Objekte standardmäßig weiter an. Kursive Werte stammen nur aus Szenarien und zählen beim Sortieren und Filtern nicht. Farbige Punkte zeigen den Belegstatus – anklicken für Details. Häkchen wählen Objekte für die Gegenüberstellung.</p>`;
}

/** Streudiagramm Kaufpreis/m² gegen Bruttomietrendite mit Werteliste daneben. */
function priceOverview(rows) {
  const pts = [], missing = [];
  for (const d of rows) {
    const kz = obj(d.data.kennzahlen);
    const xs = isNum(kz.kaufpreis_pro_m2_eur) ? [kz.kaufpreis_pro_m2_eur] : (scenRange(d, 'kaufpreis_pro_m2_eur')?.values || []);
    const ys = isNum(kz.bruttomietrendite_prozent) ? [kz.bruttomietrendite_prozent] : (scenRange(d, 'bruttomietrendite_prozent')?.values || []);
    if (!xs.length || !ys.length) { missing.push(d); continue; }
    const hollow = !isNum(kz.kaufpreis_pro_m2_eur) || !isNum(kz.bruttomietrendite_prozent);
    const xr = [Math.min(...xs), Math.max(...xs)], yr = [Math.min(...ys), Math.max(...ys)];
    const f = (r, u, k) => r[0] === r[1] ? fmtNum(r[0], u, k) : `${fmtNum(r[0], u, k)} – ${fmtNum(r[1], u, k)}`;
    pts.push({ num: d.num, uid: d.uid, x: xr.filter((v, i, a) => a.indexOf(v) === i), y: yr.filter((v, i, a) => a.indexOf(v) === i), hollow, tip: `#${d.num} ${docTitle(d)}\nKaufpreis pro m²: ${f(xr, 'eur_m2')}\nBruttomietrendite: ${f(yr, 'pct')}\nUrteil: ${L(urteilOf(d) || 'nicht_bewertbar')}${hollow ? '\n(enthält Szenariowerte)' : ''}\nKlicken für Details` });
  }
  const scatter = pts.length ? chartSlot(w => svgScatter(w, pts), 'Streudiagramm Kaufpreis pro m² gegen Bruttomietrendite')
    + `<div class="chart-legend"><span>${legendDot('')}Ist-Kennzahlen</span><span>${legendDot('hollow')}Mit Szenario- oder Annahmewerten</span><span>Linie / Fläche = Spanne über Szenarien</span></div>`
    + (missing.length ? `<p class="chart-note">Nicht dargestellt (Werte fehlen): ${missing.map(d => `#${d.num}`).join(', ')}</p>` : '')
    : '<div class="empty"><b>Keine Objekte mit Kaufpreis pro m² und Bruttomietrendite.</b></div>';

  const valuesList = rows.length ? `<div class="card flush"><div class="card-pad"><h3>Werte im Diagramm</h3><p class="card-sub">Reihenfolge wie in der Tabelle. Zeile anklicken für Details.</p></div>
    <div class="table-wrap"><table class="t vals"><thead><tr><th class="num">#</th><th>Objekt</th><th class="num">€/m²</th><th class="num">Brutto&shy;rendite</th></tr></thead><tbody>
    ${rows.map(d => `<tr class="clickable" data-action="open" data-uid="${d.uid}"><td class="num"><span class="num">#${d.num}</span></td><td><div class="obj-title">${esc(trunc(docTitle(d), 44))}</div><div class="obj-sub">${esc(docPlace(d) || 'ohne Ort')}</div></td>
      <td class="num">${valueCell(d, '/kennzahlen/kaufpreis_pro_m2_eur', { chip: false })}</td><td class="num">${valueCell(d, '/kennzahlen/bruttomietrendite_prozent', { chip: false })}</td></tr>`).join('')}
    </tbody></table></div></div>` : '';

  return `<div class="price-grid">
      <div class="card"><h3>Kaufpreis pro m² und Bruttomietrendite</h3><p class="card-sub">Je Objekt ein Punkt (#-Nummer wie in der Tabelle). Eine höhere Rendite ist kein Urteil über Risiko oder Objektqualität.</p>${scatter}</div>
      ${valuesList}
    </div>`;
}

/** Auswahl der Objekte direkt im Bereich Gegenüberstellung (ohne Ortsfilter). */
function selectionPicker() {
  const docs = immoDocs().filter(d => state.filter.showOld || d.rev?.latest || state.selected.has(d.uid));
  const n = state.selected.size;
  return `<div class="card pick">
      <div class="pick-head"><div><h3>Auswahl für die Gegenüberstellung</h3><p class="card-sub" style="margin:0">${n} ausgewählt${n < 2 ? ' – mindestens zwei auswählen' : ''}. Der Ortsfilter gilt hier nicht.</p></div>
        <div class="dh-actions"><button class="btn sm" data-action="select-all">Alle auswählen</button><button class="btn sm" data-action="select-none">Auswahl leeren</button></div></div>
      <div class="pick-list">${docs.map(d => { const on = state.selected.has(d.uid); return `<label class="pick-item${on ? ' on' : ''}"><input type="checkbox" data-select="${d.uid}"${on ? ' checked' : ''}><span class="num">#${d.num}</span><span class="pick-text"><span class="pick-title">${esc(trunc(docTitle(d), 60))}</span><span class="pick-sub">${esc(docPlace(d) || 'ohne Ort')}${d.rev && d.rev.total > 1 ? ` · Rev. ${d.rev.index}/${d.rev.total}` : ''}</span></span></label>`; }).join('')}</div>
    </div>`;
}

/** Führt alle Basisszenarien zusammen (Exporte trennen z. B. Erwerbskosten und Finanzierung); erste Zeile je Kennzahl gewinnt. */
function basisRechnung(d) {
  const list = arr(d.data.szenarien).filter(x => isObj(x) && x.typ === 'basis');
  const map = new Map();
  for (const s of list) for (const r of arr(s.rechnung)) if (isObj(r) && typeof r.kennzahl === 'string' && !map.has(canonKz(r.kennzahl))) map.set(canonKz(r.kennzahl), r);
  return { list, map };
}

function matrixCard() {
  const sel = immoDocs().filter(d => state.selected.has(d.uid)).sort((a, b) => a.num - b.num);
  if (sel.length < 2) return `<div class="card" style="margin-top:14px"><h3>Gegenüberstellung</h3><p class="muted" style="margin:6px 0 0">Wähle oben mindestens zwei Bewertungen aus, um sie nebeneinander zu sehen.</p></div>`;
  const P = (label, path) => ({ label, cell: d => ({ html: valueCell(d, path, { compact: true }), sig: JSON.stringify(resolvePointer(d.data, path).value ?? null) }) });
  const T = (label, fn) => ({ label, cell: d => { const v = fn(d); return { html: v == null || v === '' ? '<span class="null">—</span>' : esc(v), sig: JSON.stringify(v ?? null) }; } });
  const teil = k => ({ label: TEILURTEILE.find(t => t[0] === k)[1], cell: d => { const t = obj(obj(d.data.bewertung)[k]); return { html: `${t.urteil ? `<div>${esc(t.urteil)}</div>` : '<span class="null">Kein Urteil</span>'}<div style="margin-top:3px">${meter(t.belegsicherheit)}</div>`, sig: JSON.stringify([t.urteil, t.belegsicherheit]) }; } });
  const fin = (label, k, flag) => ({ label, flag, cell: d => { const r = basisRechnung(d).map.get(k); const u = r ? unitFromText(r.einheit) : null; return { html: r && isNum(r.wert) ? `<span class="val${r.wert < 0 ? ' neg' : ''}">${esc(fmtNum(r.wert, u === 'eur_monat' ? 'eur_monat' : unitForKey(k) || u, k))}</span>` : '<span class="null">—</span>', sig: JSON.stringify(r ? r.wert : null) }; } });

  const groups = [
    ['Bewertung', [
      { label: 'Gesamturteil', cell: d => ({ html: verdictBadge(urteilOf(d), 'sm'), sig: urteilOf(d) || '' }) },
      { label: 'Belegsicherheit', cell: d => ({ html: meter(obj(d.data.bewertung).belegsicherheit), sig: obj(d.data.bewertung).belegsicherheit || '' }) },
      teil('objektqualitaet'), teil('preisangemessenheit'), teil('wirtschaftlichkeit'), teil('persoenliche_eignung'),
      { label: 'Entscheidende offene Punkte', cell: d => { const p = arr(obj(d.data.bewertung).entscheidende_offene_punkte); return { html: p.length ? `<ol style="margin:0;padding-left:18px">${p.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '<span class="null">—</span>', sig: JSON.stringify(p) }; } },
    ]],
    ['Angebot & Lage', [
      T('Ort', docPlace), T('Objektart', d => obj(d.data.angebot).objektart), T('Plattform', d => [platLabel(obj(d.data.angebot).plattform), obj(d.data.angebot).plattform_id].filter(Boolean).join(' · ')),
      P('Verfügbarkeit', '/angebot/verfuegbarkeit'), P('Analysestatus', '/metadaten/analysestatus'), P('Zugriff', '/angebot/zugriffsstatus'), P('Nutzungsfokus', '/metadaten/nutzungsfokus'), P('Prüfdatum', '/metadaten/pruefdatum'),
    ]],
    ['Objekt', CORE.objekt.filter(k => k !== 'zustandseinschaetzung').map(k => P(L(k), `/objekt/${k}`)).concat([P('Zustand', '/objekt/zustandseinschaetzung')])],
    ['Kennzahlen', CORE.kennzahlen.map(k => P(L(k), `/kennzahlen/${k}`))],
    ['Kosten & Erträge (Ist)', CORE.ist_kosten_und_ertraege.map(k => P(L(k), `/ist_kosten_und_ertraege/${k}`))],
    ['Preisbewertung', [P('Aussagebasis', '/preisbewertung/aussagebasis'), P('Angebotsvergleichsspanne', '/preisbewertung/angebotsvergleichsspanne_eur'), P('Marktwertspanne', '/preisbewertung/marktwertspanne_eur'), T('Vergleichsobjekte (gut / gesamt)', d => { const v = d.ctx.list('vergleichsobjekte'); return `${v.filter(x => x.eignung === 'gut').length} / ${v.length}`; })]],
    ['Energie', ['ausweisart', 'effizienzklasse', 'kennwert_kwh_m2_a', 'energietraeger', 'heizungsjahr', 'gueltig_bis'].map(k => P(L(k), `/energie/${k}`))],
    ['WEG', CORE.weg.map(k => P(L(k), `/weg/${k}`))],
    ['Finanzierungsmodell (Basisszenario)', [
      T('Szenario', d => basisRechnung(d).list.map(s => `${s.id ?? ''} ${s.bezeichnung ?? ''}`.trim()).join(' · ') || null),
      fin('Sollzins', 'sollzins_prozent', true), fin('Anfängliche Tilgung', 'tilgung_prozent', true), fin('Zinsbindung', 'zinsbindung_jahre', true),
      fin('Eigenkapital', 'eigenkapital_eur'), fin('Darlehen', 'darlehen_eur'), fin('Gesamtinvestition', 'gesamtinvestition_eur'), fin('Monatsrate', 'monatsrate_eur'), fin('Cashflow / Monat vor Steuern', 'cashflow_monat_vor_steuern_eur'),
    ]],
  ];
  // Gleichnamige Annahmen abgleichen (Synonyme auf die stabile ID zusammengeführt)
  const params = new Map();
  for (const d of sel) for (const a of d.ctx.list('annahmen')) {
    const key = canonParam(a.parameter);
    if (!key) continue;
    if (!params.has(key)) params.set(key, /^[a-z0-9_]+$/.test(key) ? key : a.parameter);
  }
  const annRows = [...params].filter(([key]) => sel.filter(d => d.ctx.list('annahmen').some(a => canonParam(a.parameter) === key)).length >= 2).map(([key, label]) => ({
    label: /^[a-z0-9_]+$/.test(label) ? L(label) : label, flag: true, cell: d => {
      const found = d.ctx.list('annahmen').filter(x => canonParam(x.parameter) === key);
      if (!found.length) return { html: '<span class="null">—</span>', sig: null };
      return {
        html: found.map(a => `${esc(typeof a.wert === 'number' ? minus(nfA.format(a.wert)) : String(a.wert ?? '—'))} <span class="muted small">${esc(prettyUnit(a.einheit))}</span> <span class="ref" style="cursor:default">${esc(a.id)}</span>`).join('<br>'),
        sig: JSON.stringify(found.map(a => [a.wert, a.einheit])),
      };
    },
  }));
  if (annRows.length) groups.push(['Gleichnamige Annahmen', annRows]);
  groups.push(['Datenlage', [
    T('Offene Widersprüche', d => String(d.ctx.conflicts.size)),
    T('Risiken hoch / mittel', d => { const r = d.ctx.list('risiken'); return `${r.filter(x => x.schwere === 'hoch').length} / ${r.filter(x => x.schwere === 'mittel').length}`; }),
    T('Fehlende Unterlagen', d => String(d.ctx.list('fehlende_unterlagen').length)),
    { label: 'Exportprüfung', cell: d => ({ html: issueTags(d), sig: JSON.stringify(countIssues(d)) }) },
  ]]);

  let diffCount = 0;
  const bodyRows = groups.map(([title, rows]) => {
    const rendered = rows.map(r => {
      const cells = sel.map(d => r.cell(d));
      const sigs = cells.map(c => c.sig).filter(s => s !== null && s !== 'null');
      const differs = new Set(cells.map(c => c.sig)).size > 1;
      const flagged = r.flag && new Set(sigs).size > 1;
      if (flagged) diffCount++;
      if (state.diffOnly && !differs) return '';
      return `<tr class="${flagged ? 'diff' : ''}"><th class="rowhead" scope="row">${esc(r.label)}${flagged ? ' <span class="tag tag-warn" title="Annahmen unterscheiden sich zwischen den Objekten – Vergleich nur eingeschränkt fair">abweichend</span>' : ''}</th>${cells.map(c => `<td>${c.html}</td>`).join('')}</tr>`;
    }).join('');
    return rendered ? `<tr class="group"><th class="rowhead" colspan="${sel.length + 1}">${esc(title)}</th></tr>${rendered}` : '';
  }).join('');

  return `<div class="card flush" style="margin-top:14px">
    <div style="padding:18px 20px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end">
      <div><h3>Gegenüberstellung</h3><p class="card-sub" style="margin:0">${sel.length} ausgewählte Bewertungen. ${diffCount ? `<span class="tag tag-warn">${diffCount} abweichende Annahme${diffCount === 1 ? '' : 'n'}</span> – Ergebnisse nur eingeschränkt vergleichbar.` : 'Gemeinsame Annahmen stimmen überein oder fehlen.'}</p></div>
      <label class="check"><input type="checkbox" id="fdiff"${state.diffOnly ? ' checked' : ''}> Nur Unterschiede</label>
    </div>
    <div class="table-wrap" style="max-height:78vh"><table class="matrix"><thead><tr><th class="rowhead">Kriterium</th>${sel.map(d => `<th><div class="mh-title"><button class="linkbtn" data-action="open" data-uid="${d.uid}" style="color:var(--ink);font-weight:600"><span class="num">#${d.num}</span> ${esc(trunc(docTitle(d), 70))}</button></div><div class="obj-sub muted small" style="font-weight:400">${esc(docPlace(d))}</div></th>`).join('')}</tr></thead><tbody>${bodyRows}</tbody></table></div>
  </div>`;
}

function exportCSV() {
  const rows = filteredDocs();
  const g = (d, p) => { const r = resolvePointer(d.data, p); return r.found ? r.value : null; };
  const cols = [
    ['Nr', d => d.num], ['Datei', d => d.fileName], ['Titel', docTitle], ['Ort', d => obj(d.data.standort).ort], ['Stadtteil', d => obj(d.data.standort).stadtteil],
    ['Plattform', d => platLabel(obj(d.data.angebot).plattform)], ['Plattform-ID', d => obj(d.data.angebot).plattform_id], ['URL', d => obj(d.data.angebot).url],
    ['Gesamturteil', d => L(urteilOf(d) || 'nicht_bewertbar')], ['Belegsicherheit', d => obj(d.data.bewertung).belegsicherheit],
    ['Kaufpreis EUR', d => g(d, '/objekt/kaufpreis_eur')], ['Wohnfläche m2', d => g(d, '/objekt/wohnflaeche_m2')], ['Zimmer', d => g(d, '/objekt/zimmer')], ['Baujahr', d => g(d, '/objekt/baujahr')],
    ['Kaufpreis pro m2 EUR', d => g(d, '/kennzahlen/kaufpreis_pro_m2_eur')], ['Nettokaltmiete Monat EUR', d => g(d, '/ist_kosten_und_ertraege/nettokaltmiete_monat_eur')],
    ['Hausgeld Monat EUR', d => g(d, '/ist_kosten_und_ertraege/hausgeld_monat_eur')], ['Bruttomietrendite %', d => g(d, '/kennzahlen/bruttomietrendite_prozent')],
    ['Kaufpreisfaktor', d => g(d, '/kennzahlen/kaufpreisfaktor_jahre')], ['Gesamtinvestition EUR', d => g(d, '/kennzahlen/gesamtinvestition_eur')],
    ['Effizienzklasse', d => g(d, '/energie/effizienzklasse')], ['Energiekennwert kWh/m2a', d => g(d, '/energie/kennwert_kwh_m2_a')],
    ['Offene Widersprüche', d => d.ctx.conflicts.size], ['Risiken hoch', d => d.ctx.list('risiken').filter(r => r.schwere === 'hoch').length],
    ['Prüfdatum', d => g(d, '/metadaten/pruefdatum')], ['Exportdatum', d => g(d, '/metadaten/exportdatum')], ['Analysestatus', d => g(d, '/metadaten/analysestatus')],
    ['Prüffehler', d => countIssues(d).error], ['Prüfwarnungen', d => countIssues(d).warn],
  ];
  const fmt = v => (v === null || v === undefined ? '' : typeof v === 'number' ? String(v).replace('.', ',') : String(v));
  const q = s => (/[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);
  const csv = '﻿' + [cols.map(c => q(c[0])).join(';'), ...rows.map(d => cols.map(c => q(fmt(c[1](d)))).join(';'))].join('\r\n');
  download(`immobilien_vergleich_${today()}.csv`, csv, 'text/csv;charset=utf-8');
}

/* =====================================================================
   Dialoge
   ===================================================================== */
function openDialog(html) {
  $('#dlgBody').innerHTML = html;
  const dlg = $('#dlg');
  if (!dlg.open) dlg.showModal();
}
const dlgHead = title => `<div class="dlg-head"><h3>${title}</h3><button class="icon-btn" data-action="close-dlg" aria-label="Schließen">×</button></div>`;

function quelleDl(doc, q) {
  const u = safeUrl(q.url);
  return `<dl>
    <dt>Titel</dt><dd>${esc(q.titel ?? '—')}</dd>
    <dt>URL</dt><dd>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)} ↗</a>` : q.url ? `<span class="tag tag-crit">ungültig: ${esc(q.url)}</span>` : '<span class="null">keine</span>'}</dd>
    <dt>Typ</dt><dd>${esc(L(q.typ || 'sonstiges'))}</dd><dt>Zugriff</dt><dd>${esc(L(q.zugriff || ''))}</dd>
    <dt>Veröffentlicht</dt><dd>${q.veroeffentlicht_am ? esc(fmtDate(q.veroeffentlicht_am)) : '—'}</dd>
    <dt>Datenstand</dt><dd>${q.datenstand ? esc(fmtDate(q.datenstand)) : '—'}</dd>
    <dt>Abgerufen</dt><dd>${q.abgerufen_am ? esc(fmtDate(q.abgerufen_am)) : '—'}</dd>
    ${q.fundstelle ? `<dt>Fundstelle</dt><dd>${esc(q.fundstelle)}</dd>` : ''}${q.hinweis ? `<dt>Hinweis</dt><dd>${esc(q.hinweis)}</dd>` : ''}
  </dl>`;
}

function openBeleg(uid, path) {
  const doc = getDoc(uid); if (!doc) return;
  const b = doc.ctx.belege.get(path); if (!b) return;
  const r = resolvePointer(doc.data, path), key = lastKey(path);
  const val = r.found ? (r.value === null ? '<span class="null">null</span>' : esc(fmtAt(doc.data, path, r.value))) : '<span class="tag tag-crit">Pfad existiert nicht</span>';
  const inputs = arr(b.eingabe_pfade).map(p => { const x = resolvePointer(doc.data, p); return `<li><code>${esc(p)}</code> = ${x.found ? (x.value === null ? 'null' : esc(fmtAt(doc.data, p, x.value))) : '<span class="tag tag-crit">fehlt</span>'}</li>`; }).join('');
  const qs = arr(b.quellen_ids).map(id => { const q = doc.ctx.quellen.get(id); return q ? `<li><b>${esc(id)}</b> ${safeUrl(q.url) ? `<a href="${esc(safeUrl(q.url))}" target="_blank" rel="noopener noreferrer">${esc(q.titel ?? id)} ↗</a>` : esc(q.titel ?? '')} <span class="muted small">· ${esc(L(q.typ || ''))} · ${esc(L(q.zugriff || ''))}${q.abgerufen_am ? ' · abgerufen ' + esc(fmtDate(q.abgerufen_am)) : ''}</span></li>` : `<li><span class="tag tag-crit">${esc(id)} fehlt</span></li>`; }).join('');
  const as = arr(b.annahme_ids).map(id => { const a = doc.ctx.annahmen.get(id); return a ? `<li><b>${esc(id)}</b> ${esc(a.parameter ?? '')}: ${esc(String(a.wert ?? '—'))} ${esc(prettyUnit(a.einheit))}<div class="muted small">${esc(a.begruendung ?? '')}</div></li>` : `<li><span class="tag tag-crit">${esc(id)} fehlt</span></li>`; }).join('');
  openDialog(dlgHead('Datenbeleg') + `<dl>
    <dt>Feld</dt><dd>${esc(L(key))} <code>${esc(path)}</code></dd>
    <dt>Wert</dt><dd>${val}</dd>
    <dt>Status</dt><dd>${belegChip(doc, path)}</dd>
    ${b.datenstand ? `<dt>Datenstand</dt><dd>${esc(fmtDate(b.datenstand))}</dd>` : ''}
    ${b.formel ? `<dt>Formel</dt><dd>${esc(b.formel)}</dd>` : ''}
    ${inputs ? `<dt>Eingabepfade</dt><dd><ul class="sublist">${inputs}</ul></dd>` : ''}
    ${qs ? `<dt>Quellen</dt><dd><ul class="sublist">${qs}</ul></dd>` : ''}
    ${as ? `<dt>Annahmen</dt><dd><ul class="sublist">${as}</ul></dd>` : ''}
    ${b.hinweis ? `<dt>Hinweis</dt><dd>${esc(b.hinweis)}</dd>` : ''}
  </dl>`);
}

function openRef(uid, id) {
  const doc = getDoc(uid); if (!doc) return;
  const target = lookupRef(doc, id);
  if (String(id)[0] === 'Q' && target) return openDialog(dlgHead(`Quelle ${esc(id)}`) + quelleDl(doc, target));
  if (String(id)[0] === 'A' && target) return openDialog(dlgHead(`Annahme ${esc(id)}`) + `<dl><dt>Parameter</dt><dd>${esc(target.parameter ?? '')}</dd><dt>Wert</dt><dd>${esc(String(target.wert ?? '—'))} ${esc(prettyUnit(target.einheit))}</dd><dt>Begründung</dt><dd>${esc(target.begruendung ?? '')}</dd>${arr(target.quellen_ids).length ? `<dt>Quellen</dt><dd>${refTags(doc, target.quellen_ids)}</dd>` : ''}</dl><p class="fine" style="margin-top:14px">Modellannahme – kein beobachteter Objektwert.</p>`);
  if (!target) return toast(`Verweis ${id} zeigt ins Leere.`);
  if ($('#dlg').open) $('#dlg').close();
  const show = () => {
    const el = document.getElementById(`ref-${uid}-${id}`);
    if (!el) return;
    if (el.tagName === 'DETAILS') el.open = true;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  };
  if (state.view !== 'detail' || state.current !== uid) { state.view = 'detail'; state.current = uid; render(); requestAnimationFrame(show); }
  else show();
}

function openPaste() {
  openDialog(dlgHead('JSON einfügen') + `<p class="fine" style="margin-top:0">Inhalt einer Exportdatei einfügen – auch ein Array mehrerer Bewertungen ist möglich.</p><textarea id="pasteArea" spellcheck="false" placeholder='{ "schema_version": "1.0", … }'></textarea><div class="btn-row" style="justify-content:flex-end;margin-bottom:0"><button class="btn" data-action="close-dlg">Abbrechen</button><button class="btn primary" data-action="paste-load">Laden</button></div>`);
  setTimeout(() => $('#pasteArea')?.focus(), 30);
}

/* =====================================================================
   Sonstiges: Download, Toast, Theme
   ===================================================================== */
// In der claude.ai-Ansicht (eingebettet) sind direkte Downloads, Drucken und eigene Farbschemata gesperrt;
// Speichern läuft dort über die Plattform-Funktion „downloads“.
const HOSTED = typeof window.claude?.use === 'function';
let downloadsApi = null;
function updateHostClasses() {
  document.body.classList.toggle('hosted', HOSTED);
  document.body.classList.toggle('no-downloads', HOSTED && !downloadsApi);
}
if (HOSTED) window.claude.use('downloads').then(api => { downloadsApi = api; updateHostClasses(); }, () => {});

async function download(name, content, type) {
  if (HOSTED) {
    if (!downloadsApi) { toast('Speichern ist in dieser Ansicht nicht verfügbar.'); return; }
    try {
      await downloadsApi.save({ filename: name, data: content });
      toast(`${name} gespeichert.`);
    } catch (e) {
      if (e?.code === 'rate_limited') toast('Es ist bereits ein Speichern-Dialog offen. Bitte kurz warten.');
      else if (e?.code !== 'declined') toast('Speichern ist in dieser Ansicht nicht möglich.');
    }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  $('#themeLabel').textContent = { auto: 'Auto', light: 'Hell', dark: 'Dunkel' }[t] || 'Auto';
}

/* =====================================================================
   Ereignisse
   ===================================================================== */
document.addEventListener('click', e => {
  if (e.target.closest('a[href]') || e.target.matches('input')) return;
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, uid } = el.dataset;
  switch (action) {
    case 'pick-files': $('#fileInput').click(); break;
    case 'pick-dir': $('#dirInput').click(); break;
    case 'paste': openPaste(); break;
    case 'paste-load': {
      const text = ($('#pasteArea')?.value || '').trim();
      if (!text) return;
      $('#dlg').close();
      addTexts([{ name: `eingefuegt_${new Date().toLocaleTimeString('de-DE').replace(/:/g, '-')}.json`, text }]);
      break;
    }
    case 'close-dlg': $('#dlg').close(); break;
    case 'compare': state.view = 'compare'; render(); window.scrollTo(0, 0); break;
    case 'open': if ($('#dlg').open) $('#dlg').close(); state.view = 'detail'; state.current = uid; state.menue.mobilAuf = false; render(); window.scrollTo(0, 0); break;
    case 'remove': e.stopPropagation(); removeDoc(uid); break;
    case 'clear-all':
      openDialog(dlgHead('Alle Dateien entfernen?') + `<p style="margin:0">Alle ${state.docs.length} geladenen Dateien werden aus der Ansicht entfernt. Die Dateien auf deinem Rechner bleiben unverändert.</p><div class="btn-row" style="justify-content:flex-end;margin-bottom:0"><button class="btn" data-action="close-dlg">Abbrechen</button><button class="btn primary" data-action="clear-all-confirm">Alle entfernen</button></div>`);
      break;
    case 'clear-all-confirm': $('#dlg').close(); state.docs = []; state.selected.clear(); state.selectionTouched = false; save(); render(); break;
    case 'load-samples': loadSamples(); break;
    case 'sort': {
      const col = el.dataset.col;
      state.sort = state.sort.col === col ? { col, dir: -state.sort.dir } : { col, dir: 1 };
      renderResults();
      break;
    }
    case 'cmp-tab': state.cmpTab = el.dataset.tab; lsSet(LS.cmpTab, state.cmpTab); render(); break;
    case 'menue': menueUmschalten(); break;
    case 'menue-tab':
      if ($('#dlg').open) $('#dlg').close();
      state.view = 'compare'; state.cmpTab = el.dataset.tab; state.menue.mobilAuf = false;
      render(); window.scrollTo(0, 0);
      break;
    case 'filter-ort': {
      const o = el.dataset.ort ?? '';
      state.filter.orte.has(o) ? state.filter.orte.delete(o) : state.filter.orte.add(o);
      render();
      break;
    }
    case 'filter-ort-all': state.filter.orte.clear(); render(); break;
    case 'select-all': state.selectionTouched = true; immoDocs().filter(d => state.filter.showOld || d.rev?.latest).forEach(d => state.selected.add(d.uid)); render(); break;
    case 'select-none': state.selectionTouched = true; state.selected.clear(); render(); break;
    case 'beleg': e.stopPropagation(); openBeleg(uid, el.dataset.path); break;
    case 'ref': e.stopPropagation(); openRef(uid, el.dataset.id); break;
    case 'jump': document.getElementById(el.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'csv': exportCSV(); break;
    case 'copy-json': {
      const d = getDoc(uid);
      navigator.clipboard?.writeText(JSON.stringify(d.data, null, 2)).then(() => toast('JSON kopiert.'), () => toast('Kopieren nicht möglich.'));
      break;
    }
    case 'download-json': { const d = getDoc(uid); download(d.fileName.replace(/[^\w.\-äöüÄÖÜß]+/g, '_').replace(/(\.json)?$/i, '.json'), JSON.stringify(d.data, null, 2), 'application/json'); break; }
    case 'theme': {
      const cur = lsGet(LS.theme) || 'auto';
      const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
      lsSet(LS.theme, next);
      applyTheme(next);
      drawCharts();
      break;
    }
    case 'print': window.print(); break;
    case 'ordner-verbinden': ordnerVerbinden(); break;
    case 'ordner-freigeben': ordnerFreigeben(); break;
    case 'ordner-einlesen': ordnerEinlesen({ manuell: true }); break;
    case 'ordner-trennen': ordnerTrennen(); break;
    default: if (!karteAktion(action, el) && !spaltenAktion(action, el)) pAktion(action, el);
  }
});
// Auf- und Zuklappen der Menügruppen merken (toggle steigt nicht auf, daher in der Einfangphase)
document.addEventListener('toggle', e => {
  const g = e.target.closest?.('.menue-gruppe');
  if (!g || e.target !== g) return;
  state.menue.gruppen[g.dataset.gruppe] = g.open;
  menueSpeichern();
}, true);
addEventListener('resize', () => { if (!menueMobil() && state.menue.mobilAuf) { state.menue.mobilAuf = false; } menueKlassen(); });
function renderResults() {
  const box = $('#cmpResults');
  if (!box) return render();
  chartFns.clear();
  box.innerHTML = compareResults();
  drawCharts();
  karteEinhaengen();
  spaltenmenueAusrichten();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileInput' || t.id === 'dirInput') { addFiles([...t.files]); t.value = ''; return; }
  if (spaltenEingabe(t, 'change')) return;
  if (pAenderung(t)) return;
  if (t.id === 'ordner-auto') { state.ordner.auto = t.checked; lsSet(LS_ORDNER_AUTO, t.checked ? '1' : '0'); return; }
  if (t.dataset.select) { state.selectionTouched = true; t.checked ? state.selected.add(t.dataset.select) : state.selected.delete(t.dataset.select); render(); return; }
  if (t.id === 'selAll') { state.selectionTouched = true; for (const d of filteredDocs()) t.checked ? state.selected.add(d.uid) : state.selected.delete(d.uid); render(); return; }
  if (t.id === 'fu') { urteilAuswahlSetzen(t.value); return; }
  if (t.id === 'fold') { state.filter.showOld = t.checked; render(); return; }
  if (t.id === 'fdiff') { state.diffOnly = t.checked; renderResults(); return; }
  if (t.id === 'persist') { state.persist = t.checked; lsSet(LS.persist, t.checked ? '1' : '0'); save(); renderSidebar(); }
});
document.addEventListener('input', e => {
  if (spaltenEingabe(e.target, 'input')) return;
  if (e.target.id === 'fq') { state.filter.q = e.target.value; renderResults(); return; }
  pEingabeLaeuft(e.target);
});

// Tooltip
const tip = $('#tooltip');
document.addEventListener('pointerover', e => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) return;
  tip.textContent = el.getAttribute('data-tip');
  tip.classList.add('show');
});
document.addEventListener('pointermove', e => {
  if (!tip.classList.contains('show')) return;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
});
document.addEventListener('pointerout', e => {
  const el = e.target.closest?.('[data-tip]');
  if (el && !el.contains(e.relatedTarget)) tip.classList.remove('show');
});

// Drag & Drop
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  addFiles(await filesFromDataTransfer(e.dataTransfer));
});

addEventListener('beforeprint', () => document.querySelectorAll('details.item').forEach(el => { el.open = true; }));

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });

// Start
// Eingebettet bestimmt die Plattform das Farbschema (data-theme am Wurzelelement)
if (!HOSTED) applyTheme(lsGet(LS.theme) || 'auto');
updateHostClasses();
restore();
render();
loadFromQuery();
ordnerStart();
</script>
