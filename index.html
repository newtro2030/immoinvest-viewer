<script>/* src/oberflaeche/karte.js */
/*
 * ImmoInvest Viewer – Kartenansicht im Vergleich (Reiter „Karte“)
 *
 * Zeigt die Objekte mit Straße und Hausnummer auf einer OpenStreetMap-Karte. Die Kartenbibliothek Leaflet
 * liegt lokal unter src/fremd/leaflet/. Netzwerkzugriffe gibt es nur, solange der Reiter „Karte“ offen ist:
 * Kartenbilder von tile.openstreetmap.org und die Adresssuche über nominatim.openstreetmap.org (höchstens
 * eine Anfrage pro Sekunde, jedes Ergebnis wird gemerkt). Übertragen werden nur Kartenausschnitt und
 * Objektadressen – nie Profil- oder Finanzdaten. Die Zahlen am Pin kommen aus der Analyse bzw. dem Rechenkern.
 * Nachgetragene Adressen, selbst gesetzte Punkte und Suchergebnisse bleiben in diesem Browser, sofern
 * „Dateien in diesem Browser merken“ eingeschaltet ist; die Analyse-Dateien bleiben unverändert.
 *
 * Klassisches Skript; nutzt state, render, filteredDocs … des Hauptskripts erst zur Laufzeit.
 */
'use strict';

// Leaflet legt sich als window.L an; im Hauptskript ist L die Beschriftungsfunktion. Deshalb hier übernehmen und freigeben.
const LEAFLET = window.L && typeof window.L.noConflict === 'function' ? window.L.noConflict() : null;
const KARTE_KACHELN = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const KARTE_ABSTAND_MS = 1100;
const KARTE_MAX_GEMERKT = 400;
const LS_ADRESSEN = 'immoviewer.v1.adressen';
const LS_GEO = 'immoviewer.v1.geo';
const KARTE_START = { mitte: [51.16, 10.45], zoom: 6 };
const KARTE_NAH = 16;

let karteKarte = null;          // { el, map, ebene, marker: Map(uid → Marker), signatur }
let karteLetzteAnfrage = 0;

function karteZustand() {
  return { adressen: {}, geo: {}, warteschlange: [], laeuft: false, aktuell: null, fehler: null, setzen: null, fokus: null, kachelFehler: 0 };
}

/* ---------- Gemerkte Nachträge und Suchergebnisse ---------- */
function karteBereinigt(feld, roh) {
  const St = RK.standort, aus = {};
  for (const [k, v] of Object.entries(roh)) {
    if (!v || typeof v !== 'object') continue;
    if (feld === 'adressen') {
      const adresse = v.adresse ? St.pruefeNachtrag(v.adresse).nachtrag : null;
      const punkt = v.punkt ? St.pruefePunkt(v.punkt) : null;
      if (adresse || punkt) aus[k] = { adresse, punkt };
    } else if (v.nicht_gefunden === true) aus[k] = { nicht_gefunden: true, zeit: String(v.zeit || '') };
    else {
      const p = St.pruefePunkt(v);
      const genauigkeit = ['haus', 'strasse', 'umgebung'].includes(v.genauigkeit) ? v.genauigkeit : null;
      if (p && genauigkeit && (genauigkeit === 'umgebung') === k.startsWith('umgebung|')) aus[k] = { ...p, genauigkeit, anzeige: String(v.anzeige || '').slice(0, 200), zeit: String(v.zeit || '') };
    }
  }
  return aus;
}

function karteLaden() {
  if (!state.persist) return;
  for (const [feld, schl] of [['adressen', LS_ADRESSEN], ['geo', LS_GEO]]) {
    try {
      const v = JSON.parse(lsGet(schl) || '{}');
      if (v && typeof v === 'object' && !Array.isArray(v)) state.karte[feld] = karteBereinigt(feld, v);
    } catch { /* defekter Speicherinhalt wird ignoriert */ }
  }
}

function karteSpeichern() {
  if (!state.persist) { lsDel(LS_ADRESSEN); lsDel(LS_GEO); return; }
  const geo = state.karte.geo;
  if (Object.keys(geo).length > KARTE_MAX_GEMERKT) {
    // Nur Suchergebnisse der geladenen Objekte behalten
    const behalten = new Set();
    for (const d of immoDocs()) { const o = karteObjekt(d); behalten.add(o.schluessel); behalten.add(karteUmgebungsSchluessel(o.adr)); }
    for (const k of Object.keys(geo)) if (!behalten.has(k)) delete geo[k];
  }
  lsSet(LS_ADRESSEN, JSON.stringify(state.karte.adressen));
  lsSet(LS_GEO, JSON.stringify(geo));
}

/* ---------- Standort eines Objekts ---------- */
const karteUmgebungsSchluessel = adr => `umgebung|${String(adr.postleitzahl || adr.ort || '').toLowerCase()}`;

/** Adresse und Kartenpunkt eines Objekts; status: ohne_adresse, gesetzt, gefunden, suche, offen, nicht_gefunden. */
function karteObjekt(d) {
  const k = state.karte, eintrag = k.adressen[d.key] || {};
  const adr = RK.standort.adresse(obj(d.data).standort, eintrag.adresse);
  const schluessel = RK.standort.schluessel(adr);
  if (!adr.konkret) return { d, adr, schluessel, status: 'ohne_adresse' };
  if (eintrag.punkt) return { d, adr, schluessel, status: 'gesetzt', punkt: eintrag.punkt, genauigkeit: 'nutzer' };
  const g = k.geo[schluessel];
  if (g && g.nicht_gefunden) return { d, adr, schluessel, status: 'nicht_gefunden' };
  if (g) return { d, adr, schluessel, status: 'gefunden', punkt: g, genauigkeit: g.genauigkeit };
  const wartet = k.aktuell === schluessel || k.warteschlange.some(x => x.schluessel === schluessel);
  return { d, adr, schluessel, status: wartet ? 'suche' : 'offen' };
}

const karteSichtbar = () => state.view === 'compare' && state.cmpTab === 'karte' && document.visibilityState !== 'hidden' && !!document.getElementById('karte-platz');

/* ---------- Adresssuche (OpenStreetMap Nominatim) ---------- */
/** Höchstens eine Anfrage pro Sekunde (Nutzungsregeln von Nominatim); nur die Herkunft der Seite wird mitgeschickt. */
async function karteAbfrage(url) {
  const jetzt = Date.now(), termin = Math.max(jetzt, karteLetzteAnfrage + KARTE_ABSTAND_MS);
  karteLetzteAnfrage = termin;
  if (termin > jetzt) await new Promise(r => setTimeout(r, termin - jetzt));
  const res = await fetch(url, { credentials: 'omit', referrerPolicy: 'strict-origin-when-cross-origin' });
  if (!res.ok) { const e = new Error(`HTTP ${res.status}`); e.status = res.status; throw e; }
  return res.json();
}

const karteFehlertext = e => (e && (e.status === 429 || e.status === 403)
  ? 'Die Adresssuche von OpenStreetMap nimmt gerade keine Anfragen an. Bitte später erneut versuchen.'
  : 'Die Adresssuche ist nicht erreichbar – besteht eine Internetverbindung?');

/** Alle sichtbaren Objekte mit Adresse, aber ohne gemerktes Ergebnis, nacheinander suchen. */
function karteSuchen() {
  const k = state.karte;
  if (!karteSichtbar() || k.fehler) return;
  const vorhanden = new Set(k.warteschlange.map(x => x.schluessel));
  for (const d of filteredDocs()) {
    const o = karteObjekt(d);
    if (o.status !== 'offen' || vorhanden.has(o.schluessel)) continue;
    k.warteschlange.push({ schluessel: o.schluessel, adr: o.adr });
    vorhanden.add(o.schluessel);
  }
  if (k.warteschlange.length) karteSucheArbeiten();
}

async function karteSucheArbeiten() {
  const k = state.karte;
  if (k.laeuft) return;
  k.laeuft = true;
  try {
    while (k.warteschlange.length && karteSichtbar() && !k.fehler) {
      const { schluessel, adr } = k.warteschlange[0];
      if (k.geo[schluessel]) { k.warteschlange.shift(); continue; }
      k.aktuell = schluessel;
      karteAktualisieren();
      let treffer = null;
      try {
        for (const url of RK.standort.suchanfragen(adr)) {
          treffer = RK.standort.auswerten(await karteAbfrage(url));
          if (treffer) break;
        }
      } catch (e) {
        k.fehler = karteFehlertext(e);
        break;
      } finally { k.aktuell = null; }
      k.warteschlange.shift();
      k.geo[schluessel] = treffer ? { ...treffer, zeit: today() } : { nicht_gefunden: true, zeit: today() };
      karteSpeichern();
      karteAktualisieren();
    }
  } finally {
    k.laeuft = false;
    karteAktualisieren();
  }
}

/** Beim Setzen eines Punkts die Karte zur PLZ bzw. zum Ort bewegen (gemerkt wie die Adresssuche). */
async function karteZurUmgebung(adr) {
  const k = state.karte, schl = karteUmgebungsSchluessel(adr), url = RK.standort.umgebungsanfrage(adr);
  if (!url || !karteKarte) return;
  let g = k.geo[schl];
  if (!g) {
    try { g = RK.standort.auswerten(await karteAbfrage(url), { mindestens: 'umgebung' }); }
    catch (e) { k.fehler = karteFehlertext(e); karteAktualisieren(); return; }
    if (!g) return;
    k.geo[schl] = { ...g, genauigkeit: 'umgebung', zeit: today() };
    karteSpeichern();
  }
  if (karteKarte && k.setzen) karteKarte.map.setView([g.breite, g.laenge], 15);
}

/* ---------- Ansicht ---------- */
function karteAnsicht(rows) {
  if (HOSTED || !LEAFLET) return '<div class="callout">Die Karte ist in dieser eingebetteten Ansicht nicht verfügbar. Sie funktioniert in der Online-Fassung und in der lokal geöffneten Datei.</div>';
  const objekte = rows.map(karteObjekt);
  return `<div class="karte-kopf" id="karte-kopf">${karteKopf(objekte)}</div>
    <div class="karte-rahmen"><div class="karte-platz${state.karte.setzen ? ' setzen' : ''}" id="karte-platz"></div></div>
    <div id="karte-listen">${karteListen(objekte)}</div>`;
}

function karteKopf(objekte) {
  const k = state.karte;
  const auf = objekte.filter(o => o.punkt), suche = objekte.filter(o => o.status === 'suche').length;
  const urteile = VERDICT_ORDER.filter(v => auf.some(o => urteilOf(o.d) === v));
  const ohneUrteil = auf.some(o => !VERDICT[urteilOf(o.d)]);
  const ziel = k.setzen ? getDoc(k.setzen) : null;
  return `<div class="karte-status" aria-live="polite"><b>${auf.length} von ${objekte.length} Objekt${objekte.length === 1 ? '' : 'en'} auf der Karte</b>
      ${suche ? `<span>· Adresse wird gesucht (noch ${suche}) …</span>` : ''}
      ${k.fehler ? `<span class="notice">${esc(k.fehler)}</span><button class="linkbtn" data-action="karte-erneut">Erneut versuchen</button>` : ''}
      ${k.kachelFehler >= 4 ? '<span class="notice">Kartenbilder konnten nicht geladen werden (keine Verbindung zu OpenStreetMap?).</span>' : ''}</div>
    ${auf.length ? `<div class="karte-legende" aria-label="Legende: Farbe des Pins = Gesamturteil">${urteile.map(v => verdictBadge(v, 'sm')).join('')}${ohneUrteil ? verdictBadge(null, 'sm') : ''}${auf.some(o => o.genauigkeit === 'strasse') ? '<span class="karte-legende-ungefaehr"><i aria-hidden="true"></i>nur Straße gefunden</span>' : ''}</div>` : ''}
    ${ziel ? `<div class="karte-setzen" role="status"><span>Klicke auf der Karte auf die Stelle von <b>#${ziel.num} ${esc(docTitle(ziel))}</b>. Verschieben und Zoomen geht wie gewohnt.</span><button class="btn sm" data-action="karte-setzen-abbrechen">Abbrechen</button></div>` : ''}`;
}

const KARTE_STATUS_TEXT = { suche: 'Adresse wird gesucht …', offen: 'Noch nicht gesucht', nicht_gefunden: 'Adresse nicht gefunden' };

function karteListen(objekte) {
  const auf = objekte.filter(o => o.punkt);
  const ohnePunkt = objekte.filter(o => ['suche', 'offen', 'nicht_gefunden'].includes(o.status));
  const ohne = objekte.filter(o => o.status === 'ohne_adresse');
  const google = o => { const g = RK.standort.googleMapsLink(o.adr); return g ? `<a href="${esc(g)}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>` : ''; };
  const zeile = (o, unter, aktionen) => `<li class="karte-zeile">
      <div class="karte-zeile-haupt"><div class="obj-title"><span class="num">#${o.d.num}</span> <button class="linkbtn" data-action="open" data-uid="${o.d.uid}">${esc(docTitle(o.d))}</button></div><div class="obj-sub">${unter}</div></div>
      <div class="karte-zeile-urteil">${verdictBadge(urteilOf(o.d), 'sm')}</div>
      <div class="karte-zeile-aktionen">${aktionen}</div></li>`;
  const tags = o => (o.adr.quelle === 'nachtrag' ? ' <span class="tag">nachgetragen</span>' : '')
    + (o.genauigkeit === 'strasse' ? ' <span class="tag tag-warn">Hausnummer nicht gefunden</span>' : o.genauigkeit === 'nutzer' ? ' <span class="tag">Punkt selbst gesetzt</span>' : '');
  const abschnitt = (titel, liste, inhalt, hinweis = '') => liste.length ? `<section class="karte-abschnitt"><h3>${titel} <span class="count">${liste.length}</span></h3>${hinweis}<ul class="karte-liste">${liste.map(inhalt).join('')}</ul></section>` : '';
  return abschnitt('Auf der Karte', auf, o => zeile(o, esc(o.adr.zeile) + tags(o),
      `<button class="btn sm" data-action="karte-zeigen" data-uid="${o.d.uid}">Zeigen</button>${google(o)}<button class="linkbtn" data-action="karte-adresse" data-uid="${o.d.uid}">Adresse bearbeiten</button>`))
    + abschnitt('Adresse vorhanden, noch ohne Kartenpunkt', ohnePunkt, o => zeile(o, `${esc(o.adr.zeile)}${o.adr.quelle === 'nachtrag' ? ' <span class="tag">nachgetragen</span>' : ''} · <span class="${o.status === 'nicht_gefunden' ? 'karte-nicht' : 'muted'}">${KARTE_STATUS_TEXT[o.status]}</span>`,
      o.status === 'nicht_gefunden'
        ? `<button class="btn sm" data-action="karte-punkt" data-uid="${o.d.uid}">Punkt auf der Karte setzen</button><button class="linkbtn" data-action="karte-adresse" data-uid="${o.d.uid}">Adresse bearbeiten</button><button class="linkbtn" data-action="karte-neu-suchen" data-uid="${o.d.uid}">Erneut suchen</button>${google(o)}`
        : google(o)),
      '<p class="card-sub">Findet die Adresssuche ein Haus nicht, setzt du den Punkt selbst: Klick auf „Punkt auf der Karte setzen“ und dann auf die Stelle in der Karte.</p>')
    + abschnitt('Ohne Straße und Hausnummer', ohne, o => zeile(o, `${esc([o.adr.strasse, o.adr.grob].filter(Boolean).join(', ') || 'Keine Ortsangabe')} · <span class="muted">fehlt: ${esc(o.adr.fehlt.join(', '))}</span>`,
      `<button class="btn sm" data-action="karte-adresse" data-uid="${o.d.uid}">Adresse nachtragen</button>${google(o)}`),
      '<p class="card-sub">Diese Objekte erscheinen erst auf der Karte, wenn Straße und Hausnummer bekannt sind – etwa vom Makler oder aus der Besichtigung.</p>')
    + `<p class="chart-note">Kartenbilder und Adresssuche kommen von OpenStreetMap. Übertragen werden nur der Kartenausschnitt und die Objektadressen, keine Profil- oder Finanzdaten. Zum Zoomen mit dem Mausrad erst in die Karte klicken. Gefundene Punkte, nachgetragene Adressen und selbst gesetzte Punkte bleiben in diesem Browser (mit „Dateien in diesem Browser merken“); die Analyse-Dateien ändern sich nicht.</p>`;
}

/** Nach jedem Rendern: Karte in den Platzhalter hängen (sie wird nur einmal erzeugt), Pins abgleichen, offene Adressen suchen. */
function karteEinhaengen() {
  const platz = document.getElementById('karte-platz');
  if (!platz || !LEAFLET) return;
  if (!karteKarte) karteErzeugen(platz);
  else { platz.appendChild(karteKarte.el); karteKarte.map.invalidateSize({ pan: false }); }
  karteAbgleichen(filteredDocs().map(karteObjekt));
  karteSuchen();
}

function karteErzeugen(platz) {
  const el = document.createElement('div');
  el.className = 'karte-flaeche';
  platz.appendChild(el);
  const map = LEAFLET.map(el, { center: KARTE_START.mitte, zoom: KARTE_START.zoom, scrollWheelZoom: false });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener noreferrer">Leaflet</a>');
  LEAFLET.tileLayer(KARTE_KACHELN, {
    maxZoom: 19,
    referrerPolicy: 'strict-origin-when-cross-origin',
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>-Mitwirkende',
  }).on('tileerror', () => { if (++state.karte.kachelFehler === 4) karteAktualisieren(); })
    .on('tileload', () => { if (state.karte.kachelFehler) { const war = state.karte.kachelFehler >= 4; state.karte.kachelFehler = 0; if (war) karteAktualisieren(); } })
    .addTo(map);
  map.on('click', karteKlick);
  map.on('focus click', () => map.scrollWheelZoom.enable());
  map.on('mouseout blur', () => map.scrollWheelZoom.disable());
  karteKarte = { el, map, ebene: LEAFLET.layerGroup().addTo(map), marker: new Map(), signatur: '' };
}

function karteIcon(o) {
  const [zeichen, cls] = VERDICT[urteilOf(o.d)] || ['?', 'v-none'];
  return LEAFLET.divIcon({
    className: `karte-pin ${cls}${o.genauigkeit === 'strasse' ? ' ungefaehr' : ''}`,
    html: `<span class="karte-pin-kopf"><span>${esc(zeichen)}</span></span><span class="karte-pin-nr">${o.d.num}</span>`,
    iconSize: [30, 37], iconAnchor: [15, 36], popupAnchor: [0, -32],
  });
}

/** Pins an die sichtbaren Objekte anpassen; neue oder verschobene Pins → Ausschnitt neu wählen. */
function karteAbgleichen(objekte) {
  if (!karteKarte) return;
  const { map, ebene, marker } = karteKarte, k = state.karte;
  const sichtbar = new Map(objekte.filter(o => o.punkt).map(o => [o.d.uid, o]));
  for (const [uid, m] of marker) if (!sichtbar.has(uid)) { ebene.removeLayer(m); marker.delete(uid); }
  for (const [uid, o] of sichtbar) {
    const pos = [o.punkt.breite, o.punkt.laenge];
    const sig = `${pos}|${urteilOf(o.d)}|${o.genauigkeit}|${o.d.num}`;
    let m = marker.get(uid);
    if (!m) {
      m = LEAFLET.marker(pos, { icon: karteIcon(o), title: `#${o.d.num} ${docTitle(o.d)}`, riseOnHover: true, keyboard: true });
      m.bindPopup(() => karteInfo(uid), { maxWidth: 300, minWidth: 200, autoPanPadding: [16, 16] });
      m.addTo(ebene);
      marker.set(uid, m);
    } else if (m.sig !== sig) { m.setLatLng(pos); m.setIcon(karteIcon(o)); }
    m.sig = sig;
  }
  const signatur = [...sichtbar.keys()].sort().map(u => marker.get(u).sig).join(';');
  if (k.fokus) karteFokus(objekte);
  else if (signatur !== karteKarte.signatur && !k.setzen) karteAusschnitt({ animate: karteKarte.signatur !== '' });
  karteKarte.signatur = signatur;
}

/** Ausschnitt auf alle Pins; der erste ohne Animation, damit eine verzögerte Animation keinen späteren Sprung überschreibt. */
function karteAusschnitt({ animate = true } = {}) {
  const punkte = [...karteKarte.marker.values()].map(m => m.getLatLng());
  if (!punkte.length) return;
  if (punkte.length === 1) karteKarte.map.setView(punkte[0], KARTE_NAH, { animate });
  else karteKarte.map.fitBounds(LEAFLET.latLngBounds(punkte), { padding: [44, 44], maxZoom: KARTE_NAH, animate });
}

/** „Zeigen“: Pin heranzoomen und öffnen; wartet, solange die Adresse noch gesucht wird. */
function karteFokus(objekte) {
  const k = state.karte, o = objekte.find(x => x.d.uid === k.fokus);
  if (o && (o.status === 'suche' || o.status === 'offen') && !k.fehler) return;
  const m = karteKarte.marker.get(k.fokus);
  k.fokus = null;
  if (!o) return toast('Das Objekt ist durch Suche, Filter oder als ältere Revision ausgeblendet.');
  if (!m) return toast(o.status === 'ohne_adresse' ? 'Ohne Straße und Hausnummer steht das Objekt nicht auf der Karte.' : 'Die Adresse wurde nicht gefunden – setze den Punkt selbst.');
  // Ohne Animation, damit das Pin-Fenster beim Öffnen am fertigen Ausschnitt ausgerichtet wird
  karteKarte.map.setView(m.getLatLng(), Math.max(karteKarte.map.getZoom(), KARTE_NAH), { animate: false });
  m.openPopup();
  document.getElementById('karte-platz')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/** Status, Listen und Pins neu zeichnen, ohne die Karte selbst anzufassen. */
function karteAktualisieren() {
  if (!karteSichtbar()) return;
  const objekte = filteredDocs().map(karteObjekt);
  const kopf = document.getElementById('karte-kopf'), listen = document.getElementById('karte-listen');
  if (kopf) kopf.innerHTML = karteKopf(objekte);
  if (listen) listen.innerHTML = karteListen(objekte);
  document.getElementById('karte-platz')?.classList.toggle('setzen', !!state.karte.setzen);
  karteAbgleichen(objekte);
}

/** Inhalt des Pin-Fensters; wird bei jedem Öffnen neu erzeugt, damit Profilwerte aktuell sind. */
function karteInfo(uid) {
  const d = getDoc(uid);
  if (!d) return '';
  const o = karteObjekt(d), g = RK.standort.googleMapsLink(o.adr);
  const wert = (label, pfad) => `<dt>${label}</dt><dd>${valueCell(d, pfad, { chip: false, compact: true })}</dd>`;
  const tags = [o.genauigkeit === 'strasse' ? '<span class="tag tag-warn">Hausnummer nicht gefunden – Punkt liegt auf der Straße</span>' : '',
    o.genauigkeit === 'nutzer' ? '<span class="tag">Punkt selbst gesetzt</span>' : '',
    o.adr.quelle === 'nachtrag' ? '<span class="tag">Adresse nachgetragen</span>' : ''].join('');
  let profil = '';
  const p = aktivesProfil();
  if (p) {
    const r = RK.szenario.berechne({ immobilie: d.data, profil: p, objektszenario: pOS(d) });
    const kpi = r.kpi || {}, ok = r.anwendbar && r.status.cashflow === 'vollstaendig';
    const e = ok && r.einordnung ? EINORDNUNG[r.einordnung.gesamt] : null;
    profil = ok
      ? `<div class="karte-info-profil"><div class="karte-info-profilname">Mit Profil „${esc(p.bezeichnung)}“</div><dl class="karte-info-werte"><dt>Zuzahlung vor Steuer</dt><dd>${pZuzahlung(kpi.zuzahlung_vor_steuer_monat)} / Monat</dd>${pIstZahl(kpi.zuzahlung_nach_steuer_monat) ? `<dt>Ø nach Steuer</dt><dd>${pZuzahlung(kpi.zuzahlung_nach_steuer_monat)} / Monat</dd>` : ''}</dl>${e ? `<span class="verdict sm ${e[1]}"><span class="vi" aria-hidden="true">${e[0]}</span><span>${esc(e[2])}</span></span>` : ''}</div>`
      : `<div class="karte-info-profil fine">Mit Profil „${esc(p.bezeichnung)}“ noch nicht berechenbar – was fehlt, zeigt der Reiter „Mit meinem Profil“.</div>`;
  }
  return `<div class="karte-info">
    <div class="karte-info-titel"><span class="num">#${d.num}</span> ${esc(docTitle(d))}</div>
    <div class="karte-info-adresse">${esc(o.adr.zeile)}</div>
    ${tags ? `<div class="karte-info-tags">${tags}</div>` : ''}
    <div>${verdictBadge(urteilOf(d), 'sm')}</div>
    <dl class="karte-info-werte">${wert('Kaufpreis', '/objekt/kaufpreis_eur')}${wert('Preis pro m²', '/kennzahlen/kaufpreis_pro_m2_eur')}${wert('Kaltmiete / Monat', '/ist_kosten_und_ertraege/nettokaltmiete_monat_eur')}</dl>
    ${profil}
    <div class="karte-info-aktionen"><button class="btn sm primary" data-action="open" data-uid="${d.uid}">Objekt öffnen</button>${g ? `<a href="${esc(g)}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>` : ''}</div>
    <div class="karte-info-aktionen"><button class="linkbtn" data-action="karte-adresse" data-uid="${d.uid}">Adresse bearbeiten</button><button class="linkbtn" data-action="karte-punkt" data-uid="${d.uid}">Punkt korrigieren</button></div>
  </div>`;
}

/* ---------- Punkt selbst setzen ---------- */
function karteKlick(e) {
  const k = state.karte, d = k.setzen ? getDoc(k.setzen) : null;
  if (!d) return;
  const punkt = RK.standort.pruefePunkt({ breite: e.latlng.lat, laenge: e.latlng.lng });
  if (!punkt) return;
  k.adressen[d.key] = { adresse: (k.adressen[d.key] || {}).adresse || null, punkt };
  k.setzen = null;
  k.fokus = d.uid;
  karteSpeichern();
  toast('Punkt gesetzt.');
  karteAktualisieren();
}

function karteSetzenStarten(doc) {
  const k = state.karte;
  if (!karteKarte) return;
  k.setzen = doc.uid;
  karteKarte.map.closePopup();
  karteAktualisieren();
  document.getElementById('karte-platz')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const o = karteObjekt(doc);
  if (o.punkt) karteKarte.map.setView([o.punkt.breite, o.punkt.laenge], Math.max(karteKarte.map.getZoom(), 17));
  else karteZurUmgebung(o.adr);
}

/* ---------- Adresse nachtragen ---------- */
function karteAdresseDialog(doc, werte, fehler = {}) {
  const St = RK.standort, eintrag = state.karte.adressen[doc.key] || {};
  const analyse = St.adresse(obj(doc.data).standort, null);
  const w = werte || eintrag.adresse || analyse;
  const genau = obj(obj(doc.data).standort).adressgenauigkeit;
  const feld = (k, attrs = '') => `<div class="feld${fehler[k] ? ' hat-fehler' : ''}"><label for="ka-${k}">${St.FELDNAME[k]}</label><input type="text" id="ka-${k}" value="${esc(w[k] || '')}" maxlength="${St.LAENGE[k]}" autocomplete="off" ${fehler[k] ? 'aria-invalid="true"' : ''} ${attrs}>${fehler[k] ? `<span class="feld-fehler">${esc(fehler[k])}</span>` : ''}</div>`;
  openDialog(dlgHead(eintrag.adresse ? 'Adresse bearbeiten' : 'Adresse nachtragen') + `
    <p class="fine" style="margin-top:0"><b>#${doc.num} ${esc(docTitle(doc))}</b><br>Laut Analyse: ${esc(analyse.zeile || analyse.grob || 'keine Angabe')}${genau ? ` · Adressgenauigkeit: ${esc(L(genau))}` : ''}</p>
    <div class="karte-form" data-uid="${doc.uid}">
      <div class="karte-form-zeile">${feld('strasse')}${feld('hausnummer')}</div>
      <div class="karte-form-zeile plz">${feld('postleitzahl', 'inputmode="numeric"')}${feld('ort')}</div>
    </div>
    <p class="fine">Der Nachtrag bleibt in diesem Browser und ändert die Analyse-Datei nicht. Für die Karte wird die Adresse an die Adresssuche von OpenStreetMap geschickt.</p>
    <div class="btn-row" style="justify-content:flex-end;margin-bottom:0">
      ${eintrag.adresse ? `<button class="btn" data-action="karte-adresse-weg" data-uid="${doc.uid}" style="margin-right:auto">Nachtrag entfernen</button>` : ''}
      <button class="btn" data-action="close-dlg">Abbrechen</button>
      <button class="btn primary" data-action="karte-adresse-ok" data-uid="${doc.uid}">Speichern</button>
    </div>`);
  setTimeout(() => document.getElementById(`ka-${Object.keys(fehler)[0] || 'strasse'}`)?.focus(), 30);
}

/** Nachtrag übernehmen (oder mit null entfernen). Ein selbst gesetzter Punkt bleibt nur, wenn die Adresse gleich bleibt. */
function karteAdresseSetzen(doc, nachtrag) {
  const St = RK.standort, k = state.karte, alt = k.adressen[doc.key] || {};
  const standort = obj(doc.data).standort, analyse = St.adresse(standort, null);
  const neu = St.schluessel(St.adresse(standort, nachtrag));
  const punkt = alt.punkt && St.schluessel(St.adresse(standort, alt.adresse)) === neu ? alt.punkt : null;
  // Gleicht der Nachtrag der Analyse, ist er überflüssig
  const adresse = nachtrag && !(analyse.konkret && St.schluessel(analyse) === neu) ? nachtrag : null;
  if (adresse || punkt) k.adressen[doc.key] = { adresse, punkt };
  else delete k.adressen[doc.key];
  karteSpeichern();
}

function karteAdresseSpeichern(uid) {
  const doc = getDoc(uid);
  if (!doc) return;
  const werte = Object.fromEntries(Object.keys(RK.standort.LAENGE).map(k => [k, document.getElementById(`ka-${k}`)?.value ?? '']));
  const { nachtrag, fehler } = RK.standort.pruefeNachtrag(werte);
  if (Object.keys(fehler).length) return karteAdresseDialog(doc, werte, fehler);
  karteAdresseSetzen(doc, nachtrag);
  $('#dlg').close();
  toast(nachtrag ? 'Adresse gespeichert.' : 'Nachtrag entfernt.');
  render();
}

/* ---------- Standort in der Einzelansicht ---------- */
function karteStandortBlock(doc) {
  if (HOSTED) return '';
  const adr = karteObjekt(doc).adr, g = RK.standort.googleMapsLink(adr);
  return `<div class="karte-standort no-print">
    ${adr.konkret
      ? `<div><span class="lbl">Adresse für die Karte:</span> ${esc(adr.zeile)}${adr.quelle === 'nachtrag' ? ' <span class="tag">nachgetragen</span>' : ''}</div>`
      : `<div class="muted">Ohne Straße und Hausnummer erscheint das Objekt nicht auf der Karte (fehlt: ${esc(adr.fehlt.join(', '))}).</div>`}
    <div class="karte-standort-aktionen">
      ${adr.konkret && immoDocs().length > 1 ? `<button class="btn sm" data-action="karte-zeigen" data-uid="${doc.uid}">Auf der Karte zeigen</button>` : ''}
      <button class="btn sm" data-action="karte-adresse" data-uid="${doc.uid}">${adr.konkret ? 'Adresse bearbeiten' : 'Adresse nachtragen'}</button>
      ${g ? `<a class="btn sm" href="${esc(g)}" target="_blank" rel="noopener noreferrer">In Google Maps öffnen ↗</a>` : ''}
    </div></div>`;
}

/* ---------- Aktionen ---------- */
function karteAktion(action, el) {
  if (!action.startsWith('karte-')) return false;
  const k = state.karte, doc = el.dataset.uid ? getDoc(el.dataset.uid) : null;
  switch (action) {
    case 'karte-zeigen':
      if (!doc) break;
      k.fokus = doc.uid;
      if (karteSichtbar()) karteAktualisieren();
      else { state.view = 'compare'; state.cmpTab = 'karte'; lsSet(LS.cmpTab, 'karte'); render(); }
      break;
    case 'karte-adresse': if (doc) karteAdresseDialog(doc); break;
    case 'karte-adresse-ok': karteAdresseSpeichern(el.dataset.uid); break;
    case 'karte-adresse-weg':
      if (!doc) break;
      karteAdresseSetzen(doc, null);
      $('#dlg').close();
      toast('Nachtrag entfernt.');
      render();
      break;
    case 'karte-punkt': if (doc) karteSetzenStarten(doc); break;
    case 'karte-setzen-abbrechen': k.setzen = null; karteAktualisieren(); break;
    case 'karte-erneut': k.fehler = null; karteAktualisieren(); karteSuchen(); break;
    case 'karte-neu-suchen': {
      if (!doc) break;
      delete k.geo[karteObjekt(doc).schluessel];
      k.fehler = null;
      karteSpeichern();
      karteAktualisieren();
      karteSuchen();
      break;
    }
    default: return false;
  }
  return true;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest?.('.karte-form')) { e.preventDefault(); karteAdresseSpeichern(e.target.closest('.karte-form').dataset.uid); return; }
  if (e.key === 'Escape' && state.karte.setzen && !$('#dlg').open) { state.karte.setzen = null; karteAktualisieren(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') karteSuchen(); });
</script>
<script>/* src/oberflaeche/spaltenfilter.js */
/*
 * ImmoInvest Viewer – Sortieren und Filtern an jeder Spaltenüberschrift der Vergleichstabelle
 *
 * Jede Überschrift hat zwei Knöpfe: die Beschriftung sortiert (wie bisher), der Trichter öffnet ein Menü zum
 * Sortieren und Filtern. Filtertyp und Werte kommen aus COLS im Hauptskript (filter, fv, optionen, einheit),
 * die Prüfung aus dem Rechenkern-Modul tabellenfilter.js. Die Filter wirken über filteredDocs() in allen
 * gefilterten Reitern (Tabelle, Kaufpreis/m² & Rendite, Karte, Mit meinem Profil) und im CSV-Export; aktive
 * Filter stehen deshalb in jedem dieser Reiter als Leiste über den Ergebnissen.
 *
 * Klassisches Skript; nutzt state, COLS, renderResults … des Hauptskripts erst zur Laufzeit.
 */
'use strict';

const FILTER_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>';
const SORT_TEXTE = { zahl: ['Kleinste zuerst', 'Größte zuerst'], datum: ['Älteste zuerst', 'Neueste zuerst'], text: ['A bis Z', 'Z bis A'], auswahl: ['Aufsteigend', 'Absteigend'] };
const SORT_TEXTE_SPALTE = { urteil: ['Beste zuerst', 'Schlechteste zuerst'], sicherheit: ['Hoch zuerst', 'Niedrig zuerst'], energie: ['Sparsamste zuerst', 'Höchster Verbrauch zuerst'], export: ['Ohne Befund zuerst', 'Fehler zuerst'] };
const WERTE_TEXTE = [['alle', 'zeigen'], ['mit', 'ausblenden'], ['ohne', 'nur diese']];

// Offenes Menü: Spalte, Art des Ankers (Überschrift oder Filterleiste), Rohtext der Eingaben, Eingabefehler
let spaltenMenue = { col: null, anker: 'kopf', roh: {}, fehler: {} };

const spalteMit = id => COLS.find(c => c.id === id);
const spaltenTypen = () => COLS.map(c => ({ id: c.id, typ: c.filter }));
const spaltenWert = (s, d) => colFilterValue(spalteMit(s.id), d);
const spaltenZahl = (c, v) => `${nfA.format(v)}${c.einheit ? NB + c.einheit : ''}`;

/* ---------- Überschrift, Urteilsauswahl, Leiste der aktiven Filter ---------- */
function spaltenKopf(c, aktiv) {
  const gefiltert = !!state.filter.spalten[c.id], titel = colTitel(c);
  return `<div class="th-kopf"><button class="th-sort" data-action="sort" data-col="${c.id}" title="Nach „${esc(titel)}“ sortieren">${c.label}${aktiv ? ` <span class="arrow">${state.sort.dir > 0 ? '▲' : '▼'}</span>` : ''}</button><button class="th-filter${gefiltert ? ' aktiv' : ''}" data-action="spaltenmenue" data-col="${c.id}" aria-haspopup="dialog" aria-expanded="${spaltenMenue.col === c.id}" aria-label="${esc(titel)}: sortieren und filtern${gefiltert ? ' (Filter aktiv)' : ''}" title="Sortieren und filtern">${FILTER_ICON}</button></div>`;
}

/** Die Auswahl „Alle Urteile“ über der Tabelle zeigt denselben Filter wie die Spalte „Gesamturteil“. */
function urteilAuswahl() {
  const b = state.filter.spalten.urteil;
  const einer = b && b.werte.length === 1 && VERDICT_ORDER.includes(b.werte[0]) ? b.werte[0] : null;
  return `<select id="fu" aria-label="Nach Gesamturteil filtern"><option value=""${b ? '' : ' selected'}>Alle Urteile</option>${VERDICT_ORDER.map(v => `<option value="${v}"${einer === v ? ' selected' : ''}>${esc(L(v))}</option>`).join('')}${b && !einer ? '<option value="__mehrere" selected>Mehrere (Spaltenfilter)</option>' : ''}</select>`;
}
function urteilAuswahlSetzen(v) {
  if (v === '__mehrere') return;
  spaltenBedingungSetzen(spalteMit('urteil'), v ? { werte: [v] } : null);
  if (spaltenMenue.col === 'urteil') spaltenmenueZeichnen();
}

function spaltenBeschreibung(c, b) {
  if (c.filter === 'zahl' || c.filter === 'datum') {
    if (b.werte === 'ohne') return 'nur ohne Wert';
    const f = v => (c.filter === 'datum' ? fmtDate(v) : spaltenZahl(c, v));
    const [u, o] = c.filter === 'zahl' ? [b.min, b.max] : [b.von, b.bis];
    const bereich = u !== null && o !== null ? `${f(u)} bis ${f(o)}` : u !== null ? `ab ${f(u)}` : o !== null ? `bis ${f(o)}` : '';
    if (!bereich) return 'nur mit Wert';
    return `${bereich}${b.werte === 'mit' ? ' · ohne Wert ausgeblendet' : ' · ohne Wert sichtbar'}`;
  }
  if (c.filter === 'auswahl') {
    const namen = new Map(c.optionen()), l = b.werte.map(k => namen.get(k) ?? k);
    const ohne = c.optionen().filter(([k]) => !b.werte.includes(k)).map(([, t]) => t);
    const kurz = liste => (liste.length <= 2 ? liste.join(', ') : `${liste.slice(0, 2).join(', ')} und ${liste.length - 2} weitere`);
    // Wer nur wenig abwählt, liest lieber, was fehlt
    return !l.length ? 'nichts ausgewählt' : ohne.length < l.length ? `alle außer ${kurz(ohne)}` : kurz(l);
  }
  return `enthält „${b.text}“`;
}

function spaltenfilterLeiste(rows) {
  const aktiv = COLS.filter(c => state.filter.spalten[c.id]);
  if (!aktiv.length) return '';
  return `<div class="sf-leiste" role="group" aria-label="Aktive Spaltenfilter"><span class="lbl">Spaltenfilter · ${rows.length} von ${basisDocs().length}</span>
    ${aktiv.map(c => `<span class="sf-chip"><button class="sf-chip-text" data-action="spaltenmenue" data-col="${c.id}" aria-haspopup="dialog" title="Filter ändern">${esc(colTitel(c))}: ${esc(spaltenBeschreibung(c, state.filter.spalten[c.id]))}</button><button class="sf-chip-x" data-action="spaltenfilter-weg" data-col="${c.id}" aria-label="Filter „${esc(colTitel(c))}“ entfernen">×</button></span>`).join('')}
    <button class="linkbtn" data-action="spaltenfilter-alle-weg">Alle Spaltenfilter löschen</button></div>`;
}

/* ---------- Menü ---------- */
function spaltenmenueInhalt(c) {
  const F = RK.tabellenfilter, b = state.filter.spalten[c.id] || null, { roh, fehler } = spaltenMenue;
  const dir = state.sort.col === c.id ? state.sort.dir : 0;
  const [auf, ab] = SORT_TEXTE_SPALTE[c.id] || SORT_TEXTE[c.filter];
  const ohneDiese = F.anwenden(basisDocs(), spaltenTypen(), state.filter.spalten, spaltenWert, { ausser: c.id });
  let filter;
  if (c.filter === 'zahl' || c.filter === 'datum') {
    const werte = b ? b.werte : 'alle', [u, o] = c.filter === 'zahl' ? ['min', 'max'] : ['von', 'bis'];
    const sp = c.filter === 'zahl' ? F.spanne(ohneDiese.map(d => colFilterValue(c, d))) : null;
    const feld = (k, text) => `<label class="sm-feld"><span>${text}</span><input type="${c.filter === 'datum' ? 'date' : 'text'}"${c.filter === 'zahl' ? ' inputmode="decimal" autocomplete="off"' : ''} data-sf="${k}" value="${esc(roh[k] ?? '')}"${werte === 'ohne' ? ' disabled' : ''}${fehler[k] ? ' aria-invalid="true"' : ''}></label>`;
    filter = `<div class="sm-bereich">${feld(u, 'von')}${feld(o, 'bis')}${c.einheit ? `<span class="sm-einheit">${esc(c.einheit)}</span>` : ''}</div>
      <div class="feld-fehler" id="sm-fehler"${fehler[u] || fehler[o] ? '' : ' hidden'}>Bitte eine Zahl eingeben, z. B. 150.000 oder 4,5.</div>
      ${sp ? `<div class="sm-hinweis">In der Liste: ${esc(spaltenZahl(c, sp.min))} bis ${esc(spaltenZahl(c, sp.max))}</div>` : ''}
      <fieldset class="sm-werte"><legend>Objekte ohne Wert (—)</legend>${WERTE_TEXTE.map(([v, t]) => `<label class="check"><input type="radio" name="sm-werte" data-sf="werte" value="${v}"${werte === v ? ' checked' : ''}> ${t}</label>`).join('')}</fieldset>`;
  } else if (c.filter === 'auswahl') {
    const zahl = F.haeufigkeit(ohneDiese.map(d => colFilterValue(c, d)));
    const erlaubt = b ? new Set(b.werte) : null;
    const sichtbar = c.optionen().filter(([k]) => zahl.get(k) || (erlaubt && erlaubt.has(k)));
    filter = sichtbar.length
      ? `<div class="sm-liste">${sichtbar.map(([k, t]) => `<label class="check"><input type="checkbox" data-sf="wert" value="${esc(k)}"${!erlaubt || erlaubt.has(k) ? ' checked' : ''}><span>${esc(t)}</span><span class="n">${zahl.get(k) || 0}</span></label>`).join('')}</div>
        <div class="sm-links"><button class="linkbtn" data-action="spaltenfilter-alle" data-col="${c.id}">Alle auswählen</button><button class="linkbtn" data-action="spaltenfilter-keine" data-col="${c.id}">Keine</button></div>`
      : '<p class="sm-hinweis">Keine Werte vorhanden.</p>';
  } else {
    filter = `<label class="sm-feld"><span>enthält</span><input type="search" data-sf="text" value="${esc(roh.text ?? '')}" placeholder="z. B. Gohlis, Altbau, ImmoScout" autocomplete="off"></label>`;
  }
  return `<div class="sm-kopf"><b>${esc(colTitel(c))}</b><button class="icon-btn" data-action="spaltenmenue-zu" aria-label="Schließen">×</button></div>
    <div><div class="sm-titel">Sortieren</div><div class="sm-sort">
      <button class="btn sm${dir === 1 ? ' on' : ''}" data-action="spalte-sort" data-col="${c.id}" data-dir="1" aria-pressed="${dir === 1}">↑ ${auf}</button>
      <button class="btn sm${dir === -1 ? ' on' : ''}" data-action="spalte-sort" data-col="${c.id}" data-dir="-1" aria-pressed="${dir === -1}">↓ ${ab}</button></div></div>
    <div><div class="sm-titel">Filtern</div>${filter}</div>
    <div class="sm-fuss" id="sm-fuss">${spaltenmenueFuss(c)}</div>`;
}

function spaltenmenueFuss(c) {
  return `<span class="sm-anzahl">${filteredDocs().length} von ${basisDocs().length} Objekten</span>${state.filter.spalten[c.id] ? `<button class="linkbtn" data-action="spaltenfilter-weg" data-col="${c.id}">Filter löschen</button>` : ''}`;
}

function spaltenmenueOeffnen(c, ausLeiste) {
  const b = state.filter.spalten[c.id];
  const zahl = v => (v === null || v === undefined ? '' : nfA.format(v));
  spaltenMenue = { col: c.id, anker: ausLeiste ? 'leiste' : 'kopf', fehler: {},
    roh: !b ? {} : c.filter === 'zahl' ? { min: zahl(b.min), max: zahl(b.max) } : c.filter === 'datum' ? { von: b.von || '', bis: b.bis || '' } : c.filter === 'text' ? { text: b.text } : {} };
  const m = $('#spaltenmenue');
  m.setAttribute('aria-label', `${colTitel(c)}: sortieren und filtern`);
  m.hidden = false;
  spaltenmenueZeichnen();
  document.querySelectorAll('.th-filter').forEach(x => x.setAttribute('aria-expanded', String(x.dataset.col === c.id)));
  setTimeout(() => (m.querySelector('[data-sf]:not([disabled])') || m.querySelector('.sm-sort .btn'))?.focus(), 0);
}

function spaltenmenueZeichnen() {
  const c = spalteMit(spaltenMenue.col);
  if (!c) return spaltenmenueSchliessen();
  $('#spaltenmenue').innerHTML = spaltenmenueInhalt(c);
  spaltenmenueAusrichten();
}

function spaltenmenueAnker() {
  const sel = `[data-action="spaltenmenue"][data-col="${spaltenMenue.col}"]`;
  const kopf = document.querySelector(`.cmp-table ${sel}`), leiste = document.querySelector(`.sf-leiste ${sel}`);
  return spaltenMenue.anker === 'leiste' ? leiste || kopf : kopf || leiste;
}

/** Nach jedem Neuzeichnen und beim Scrollen: Menü unter (oder über) seinen Knopf setzen; ohne Knopf schließen. */
function spaltenmenueAusrichten() {
  const m = $('#spaltenmenue');
  if (!spaltenMenue.col || !m || m.hidden) return;
  const anker = state.view === 'compare' ? spaltenmenueAnker() : null;
  if (!anker) return spaltenmenueSchliessen({ fokus: false });
  const r = anker.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  if (r.bottom < 0 || r.top > innerHeight) return spaltenmenueSchliessen({ fokus: false });
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8 && r.top - h - 6 >= 8) top = r.top - h - 6;
  m.style.left = `${left}px`;
  m.style.top = `${Math.max(8, Math.min(top, innerHeight - h - 8))}px`;
}

function spaltenmenueSchliessen({ fokus = true } = {}) {
  const m = $('#spaltenmenue');
  if (!spaltenMenue.col) return;
  const anker = fokus ? spaltenmenueAnker() : null;
  spaltenMenue = { col: null, anker: 'kopf', roh: {}, fehler: {} };
  if (m) { m.hidden = true; m.innerHTML = ''; }
  document.querySelectorAll('.th-filter[aria-expanded="true"]').forEach(x => x.setAttribute('aria-expanded', 'false'));
  anker?.focus();
}

/** Bedingung setzen (null = Filter entfernen), Ergebnisse und Menüfuß aktualisieren. */
function spaltenBedingungSetzen(c, roh) {
  const b = roh ? RK.tabellenfilter.bereinige(c.filter, roh) : null;
  if (b) state.filter.spalten[c.id] = b;
  else delete state.filter.spalten[c.id];
  renderResults();
  if (c.id === 'urteil') { const sel = $('#fu'); if (sel) sel.outerHTML = urteilAuswahl(); }
  const fuss = document.getElementById('sm-fuss');
  if (fuss && spaltenMenue.col === c.id) fuss.innerHTML = spaltenmenueFuss(c);
}

/** Eingaben im Menü; true, wenn das Ereignis hierher gehörte. */
function spaltenEingabe(t, art) {
  const m = t.closest?.('#spaltenmenue');
  if (!m || !spaltenMenue.col) return false;
  const c = spalteMit(spaltenMenue.col), F = RK.tabellenfilter, sf = t.dataset.sf;
  if (!sf) return true;
  if (c.filter === 'zahl' || c.filter === 'datum') {
    const [u, o] = c.filter === 'zahl' ? ['min', 'max'] : ['von', 'bis'];
    const text = k => m.querySelector(`[data-sf="${k}"]`)?.value ?? '';
    const werte = m.querySelector('[data-sf="werte"]:checked')?.value || 'alle';
    m.querySelectorAll(`[data-sf="${u}"], [data-sf="${o}"]`).forEach(x => { x.disabled = werte === 'ohne'; });
    spaltenMenue.roh = { [u]: text(u), [o]: text(o) };
    if (c.filter === 'datum') {
      spaltenBedingungSetzen(c, { von: text(u) || null, bis: text(o) || null, werte });
      return true;
    }
    const unten = F.zahlLesen(text(u)), oben = F.zahlLesen(text(o));
    spaltenMenue.fehler = { min: Number.isNaN(unten), max: Number.isNaN(oben) };
    for (const k of [u, o]) m.querySelector(`[data-sf="${k}"]`)?.toggleAttribute('aria-invalid', !!spaltenMenue.fehler[k]);
    const hinweis = document.getElementById('sm-fehler');
    if (hinweis) hinweis.hidden = !(spaltenMenue.fehler.min || spaltenMenue.fehler.max);
    if (spaltenMenue.fehler.min || spaltenMenue.fehler.max) return true;
    spaltenBedingungSetzen(c, { min: unten, max: oben, werte });
    return true;
  }
  if (c.filter === 'auswahl') {
    if (art !== 'change') return true;
    const b = state.filter.spalten[c.id], erlaubt = b ? new Set(b.werte) : null;
    const angezeigt = new Map([...m.querySelectorAll('[data-sf="wert"]')].map(x => [x.value, x.checked]));
    // Nicht angezeigte Werte (gerade ohne Treffer) behalten ihren bisherigen Zustand
    const werte = c.optionen().map(([k]) => k).filter(k => (angezeigt.has(k) ? angezeigt.get(k) : !erlaubt || erlaubt.has(k)));
    spaltenBedingungSetzen(c, werte.length === c.optionen().length ? null : { werte });
    return true;
  }
  spaltenMenue.roh = { text: t.value };
  spaltenBedingungSetzen(c, { text: t.value });
  return true;
}

/* ---------- Aktionen ---------- */
function spaltenAktion(action, el) {
  const c = el.dataset.col ? spalteMit(el.dataset.col) : null;
  switch (action) {
    case 'spaltenmenue':
      if (!c) break;
      if (spaltenMenue.col === c.id) spaltenmenueSchliessen();
      else spaltenmenueOeffnen(c, !!el.closest('.sf-leiste'));
      break;
    case 'spaltenmenue-zu': spaltenmenueSchliessen(); break;
    case 'spalte-sort':
      if (!c) break;
      state.sort = { col: c.id, dir: Number(el.dataset.dir) === -1 ? -1 : 1 };
      renderResults();
      spaltenmenueZeichnen();
      break;
    case 'spaltenfilter-weg':
      if (!c) break;
      spaltenBedingungSetzen(c, null);
      if (spaltenMenue.col === c.id) { spaltenMenue.roh = {}; spaltenMenue.fehler = {}; spaltenmenueZeichnen(); }
      break;
    case 'spaltenfilter-alle-weg':
      state.filter.spalten = {};
      spaltenmenueSchliessen({ fokus: false });
      render();
      break;
    case 'spaltenfilter-alle': if (c) { spaltenBedingungSetzen(c, null); spaltenmenueZeichnen(); } break;
    case 'spaltenfilter-keine': if (c) { spaltenBedingungSetzen(c, { werte: [] }); spaltenmenueZeichnen(); } break;
    default: return false;
  }
  return true;
}

document.addEventListener('pointerdown', e => {
  if (!spaltenMenue.col || e.target.closest?.('#spaltenmenue, [data-action="spaltenmenue"]')) return;
  spaltenmenueSchliessen({ fokus: false });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && spaltenMenue.col) { e.preventDefault(); spaltenmenueSchliessen(); }
});
let spaltenmenueRahmen = 0;
const spaltenmenueNachziehen = () => { cancelAnimationFrame(spaltenmenueRahmen); spaltenmenueRahmen = requestAnimationFrame(spaltenmenueAusrichten); };
addEventListener('scroll', e => { if (spaltenMenue.col && !e.target.closest?.('#spaltenmenue')) spaltenmenueNachziehen(); }, { capture: true, passive: true });
addEventListener('resize', spaltenmenueNachziehen);
</script>
<script>
'use strict';

/* =====================================================================

const TOP_KEYS = ['schema_version', 'metadaten', 'angebot', 'standort', 'objekt', 'energie', 'weg', 'ist_kosten_und_ertraege', 'kennzahlen', 'preisbewertung', 'annahmen', 'szenarien', 'vergleichsobjekte', 'widersprueche', 'risiken', 'fehlende_unterlagen', 'naechste_schritte', 'bewertung', 'datenbelege', 'quellen', 'exportpruefung'];

const CORE = {

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36) + ':' + s.length;
}

function resolvePointer(root, ptr) {
  if (ptr === '') return { found: true, value: root };
  if (typeof ptr !== 'string' || ptr[0] !== '/') return { found: false };
  let cur = root;
  for (const raw of ptr.slice(1).split('/')) {
    const k = raw.replace(/~1/g, '/').replace(/~0/g, '~');
    if (cur !== null && typeof cur === 'object' && Object.prototype.hasOwnProperty.call(cur, k)) cur = cur[k];
    else return { found: false };
  }
  return { found: true, value: cur };
}

const DATE_VAL_RE = /^\d{4}-\d{2}-\d{2}$/;
function isValidDate(s) {
  if (typeof s !== 'string' || !DATE_VAL_RE.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
}
const fmtDate = s => (DATE_VAL_RE.test(s) ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : s);
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });

function unitForKey(k) {
  if (!k) return null;
  if (/_pro_m2_eur$/.test(k)) return 'eur_m2';
  if (/_eur$/.test(k)) return 'eur';
  if (/_kwh_m2_a$/.test(k)) return 'kwh';
  if (/_m2$/.test(k)) return 'm2';
  if (/_prozent$/.test(k)) return 'pct';
  if (/_jahre$/.test(k)) return 'jahre';
  return null;
}
function unitFromText(e) {
  if (!e) return null;
  const t = String(e).toLowerCase().replace(/\s/g, '');
  if (t === '%' || t.startsWith('prozent')) return 'pct';
  if (t.startsWith('eur') || t.startsWith('€')) {
    if (/m2|m²/.test(t)) return 'eur_m2';
    if (/monat|mtl/.test(t)) return 'eur_monat';
    if (/jahr|\/a$/.test(t)) return 'eur_jahr';
    return 'eur';
  }
  if (t === 'm2' || t === 'm²') return 'm2';
  if (t.startsWith('jahr')) return 'jahre';
  if (t.includes('kwh')) return 'kwh';
  return 'raw:' + e;
}
const prettyUnit = e => (e == null ? '' : String(e).replace(/EUR/g, '€').replace(/m2\b/g, 'm²').replace(/^Prozent$/i, '%'));

function fmtNum(v, unit, key) {
  if (key && /(^|_)(baujahr|heizungsjahr)$/.test(key)) return String(v);
  if (key === 'kaufpreisfaktor_jahre') return minus(nf2.format(v)) + '-fach';
  const eur = x => minus((Number.isInteger(x) ? nf0 : nf2).format(x));
  switch (unit) {
    case 'eur': return eur(v) + NB + '€';
    case 'eur_m2': return minus(nf2.format(v)) + NB + '€/m²';
    case 'eur_monat': return eur(v) + NB + '€/Monat';
    case 'eur_jahr': return eur(v) + NB + '€/Jahr';
    case 'm2': return minus(nfA.format(v)) + NB + 'm²';
    case 'pct': return minus(nf2.format(v)) + NB + '%';
    case 'jahre': return minus(nfA.format(v)) + NB + (v === 1 ? 'Jahr' : 'Jahre');
    case 'kwh': return minus(nfA.format(v)) + NB + 'kWh/(m²·a)';
    default:
      if (unit && unit.startsWith('raw:')) return minus(nfA.format(v)) + NB + unit.slice(4);

}
function fmtValue(key, v, unit) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'boolean') return v ? 'Ja' : 'Nein';
  if (typeof v === 'number') return fmtNum(v, unit !== undefined ? unit : unitForKey(key), key);
  if (typeof v === 'string') {
    if (DATE_VAL_RE.test(v)) return fmtDate(v);
    if (key === 'plattform') return platLabel(v);
    if (ENUM_KEYS.has(key) && ENUM[v]) return ENUM[v];
    return v;
  }
  if (isRange(v)) {
    const u = unit !== undefined ? unit : unitForKey(key);
    return fmtNum(v.min, u, key) + ' – ' + fmtNum(v.max, u, key);
  }
  if (Array.isArray(v)) return v.map(x => fmtValue(key, x) ?? '—').join(', ');
  return JSON.stringify(v);
}
/** Formatiert eine Szenario-Rechnungszeile; die Einheit der Zeile hat Vorrang vor dem Kennzahl-Suffix. */
function fmtRechnung(r) {

/** Formatiert einen Wert anhand seines JSON-Pointers; Szenariowerte nutzen die Einheit der Rechnungszeile. */

}
const KEY_RESULTS = ['cashflow_monat_vor_steuern_eur', 'zahlungsgrenze_eur', 'kaufpreis_pro_m2_eur', 'gesamtinvestition_eur'];
/** Wichtigstes Ergebnis eines Szenarios für Übersicht und Kartenkopf. */

const near = (a, b, tol) => Math.abs(a - b) <= Math.max(tol, Math.abs(b) * 0.0005);

async function addFiles(files) {
  const items = [];
  for (const f of files) {
    if (!/\.json$/i.test(f.name) && f.type !== 'application/json') continue;
    try { items.push({ name: f.name, text: await f.text() }); }
    catch (e) { items.push({ name: f.name, text: '', error: 'Datei konnte nicht gelesen werden: ' + e.message }); }
  }
  if (!items.length) { toast('Keine JSON-Dateien gefunden.'); return; }
  addTexts(items);
}

function addTexts(items, { silent = false } = {}) {
  const added = [];
  let persoenlich = 0;
  for (const it of items) {
    if (it.error) { added.push(addDoc(it.name, it.text, null, it.error)); continue; }
    let parsed, err = null;
    try { parsed = JSON.parse(it.text.replace(/^﻿/, '')); } catch (e) { err = 'JSON-Syntaxfehler: ' + e.message; }
    // Profile und Berechnungspakete sind keine Immobiliendateien: eigener Import, nie in der Dateiliste gespeichert
    if (!err && pImportiereDokument(parsed, it.name)) { persoenlich++; continue; }
    if (!err && Array.isArray(parsed) && parsed.length && parsed.every(x => isObj(x) && ('schema_version' in x || 'metadaten' in x))) {
      parsed.forEach((x, i) => added.push(addDoc(`${it.name} [${i + 1}]`, JSON.stringify(x, null, 2), x, null)));
      continue;
    }
    added.push(addDoc(it.name, it.text, parsed, err));
  }
  const fresh = added.filter(Boolean);
  computeGroups();
  if (!silent) {
    if (persoenlich && !fresh.length && persoenlich === items.length) return fresh;
    const immo = fresh.filter(d => d.isImmo);
    if (fresh.length === 1) { state.view = 'detail'; state.current = fresh[0].uid; }
    else if (immoDocs().length > 1) { state.view = 'compare'; state.cmpTab = 'tabelle'; }
    else if (fresh.length) { state.view = 'detail'; state.current = (immo[0] || fresh[0]).uid; }
    const dup = items.length - persoenlich - fresh.length;
    toast(`${fresh.length} Datei${fresh.length === 1 ? '' : 'en'} geladen${dup > 0 ? ` · ${dup} bereits vorhanden` : ''}`);
    save();
    render();
    window.scrollTo(0, 0);
  }
  return fresh;
}

function addDoc(name, text, data, err) {
  const hash = hashStr(text || name);
  if (state.docs.some(d => d.hash === hash)) return null;
  const doc = { uid: 'd' + (++uidCounter), fileName: name, text: text || '', hash, data: err ? null : data, parseError: err };
  analyze(doc);
  if (doc.isImmo) doc.num = ++numCounter;
  state.docs.push(doc);
  return doc;
}

function analyze(doc) {
  doc.isImmo = false;
  if (doc.parseError) { doc.issues = [{ lvl: 'error', path: '', msg: doc.parseError }]; return; }
  const d = doc.data;
  if (!isObj(d) || (!('schema_version' in d) && !('metadaten' in d) && !('angebot' in d))) {
    doc.issues = [{ lvl: 'error', path: '', msg: 'Keine Immobilienbewertung nach Schema 1.0 (weder schema_version noch metadaten/angebot gefunden).' }];
    return;
  }
  doc.isImmo = true;
  doc.ctx = buildCtx(d);
  doc.issues = validate(d, doc.ctx);
  doc.key = objectKey(d) || doc.uid;
}

function computeGroups() {
  const groups = new Map();
  for (const d of immoDocs()) {
    if (!groups.has(d.key)) groups.set(d.key, []);
    groups.get(d.key).push(d);
  }
  const stamp = d => { const m = obj(d.data.metadaten); return `${m.exportdatum || ''}|${m.pruefdatum || ''}|${d.fileName}`; };
  for (const list of groups.values()) {
    list.sort((a, b) => stamp(b).localeCompare(stamp(a)));
    list.forEach((d, i) => { d.rev = { index: list.length - i, total: list.length, latest: i === 0, group: list }; });
  }
  const valid = new Set(immoDocs().map(d => d.uid));
  for (const u of [...state.selected]) if (!valid.has(u)) state.selected.delete(u);
}

function removeDoc(uid) {
  state.docs = state.docs.filter(d => d.uid !== uid);
  state.selected.delete(uid);
  computeGroups();
  if (!state.docs.length) state.view = 'start';
  else if (state.view === 'detail' && state.current === uid) state.view = immoDocs().length ? 'compare' : 'detail', state.current = (immoDocs()[0] || state.docs[0]).uid;
  save();
  render();
}

function save() {
  if (!state.persist) { lsDel(LS.docs); state.saveError = null; return; }
  const ok = lsSet(LS.docs, JSON.stringify(state.docs.filter(d => d.text).map(d => ({ name: d.fileName, text: d.text }))));
  // Passt nicht alles in den Speicher, wird der alte Stand gelöscht, damit beim nächsten Öffnen kein veralteter Ausschnitt erscheint
  if (!ok) lsDel(LS.docs);
  state.saveError = ok ? null : (state.ordner.handle ? 'Zu viele Dateien für den Browser-Speicher – sie kommen beim Öffnen aus dem Ablageordner.' : 'Speichern im Browser nicht möglich (Speicher voll oder gesperrt).');
  karteSpeichern();
}

function restore() {
  state.persist = lsGet(LS.persist) !== '0';
  // Beim Öffnen immer der Vergleich mit der Tabelle; der zuletzt gewählte Reiter gilt nur innerhalb der Sitzung
  state.cmpTab = 'tabelle';
  menueLaden();
  pLadenAusBrowser();
  karteLaden();
  const raw = lsGet(LS.docs);
  if (!raw || !state.persist) return;
  try {
    const items = JSON.parse(raw);
    if (Array.isArray(items) && items.length) {
      addTexts(items.filter(x => x && typeof x.text === 'string'), { silent: true });
      state.view = immoDocs().length ? 'compare' : 'detail';
      state.current = (immoDocs()[0] || state.docs[0] || {}).uid;
      if (!state.docs.length) state.view = 'start';
    }
  } catch { /* defekter Speicherinhalt wird ignoriert */ }
}

async function loadFromQuery() {
  const srcs = new URLSearchParams(location.search).getAll('src');
  if (!srcs.length || location.protocol === 'file:') return;
  const items = [];
  for (const s of srcs) {
    const name = decodeURIComponent(s.split('/').pop() || s);
    try {
      const r = await fetch(s);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      items.push({ name, text: await r.text() });
    } catch (e) { items.push({ name, text: '', error: `Laden von ${s} fehlgeschlagen: ${e.message}` }); }
  }
  addTexts(items);
}

async function filesFromDataTransfer(dt) {
  const entries = [...(dt.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...(dt.files || [])];
  const out = [];
  async function walkEntry(en) {
    if (en.isFile) out.push(await new Promise((res, rej) => en.file(res, rej)));
    else if (en.isDirectory) {
      const reader = en.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const c of batch) await walkEntry(c);
      } while (batch.length);
    }
  }
  for (const en of entries) await walkEntry(en);
  return out;
}

   ===================================================================== */
function buildCtx(data) {
  const list = k => arr(data[k]).filter(isObj);
  const byId = k => new Map(list(k).filter(x => typeof x.id === 'string').map(x => [x.id, x]));
  const belege = new Map();
  for (const b of list('datenbelege')) if (typeof b.feldpfad === 'string' && !belege.has(b.feldpfad)) belege.set(b.feldpfad, b);
  const conflicts = new Map();
  for (const w of list('widersprueche')) if (w.status !== 'aufgeloest' && typeof w.feldpfad === 'string') conflicts.set(w.feldpfad, w);
  const scen = new Map();
  arr(data.szenarien).forEach((s, si) => {
    if (!isObj(s)) return;
    arr(s.rechnung).forEach((r, ri) => {
      if (!isObj(r) || !isNum(r.wert) || typeof r.kennzahl !== 'string') return;
      const kz = canonKz(r.kennzahl);
      if (!scen.has(kz)) scen.set(kz, []);
      scen.get(kz).push({ value: r.wert, unit: r.einheit, s, path: `/szenarien/${si}/rechnung/${ri}/wert` });
    });
  });
  return { list, quellen: byId('quellen'), annahmen: byId('annahmen'), risiken: byId('risiken'), unterlagen: byId('fehlende_unterlagen'), szenarien: byId('szenarien'), widersprueche: byId('widersprueche'), belege, conflicts, scen };
}

function walk(node, path, fn) {
  if (Array.isArray(node)) node.forEach((v, i) => { const p = `${path}/${i}`; fn(null, v, p, node); walk(v, p, fn); });
  else if (isObj(node)) for (const [k, v] of Object.entries(node)) { const p = `${path}/${ptrKey(k)}`; fn(k, v, p, node); walk(v, p, fn); }
}

function validate(data, ctx) {
  const out = [];
  const E = (path, msg) => out.push({ lvl: 'error', path, msg });
  const W = (path, msg) => out.push({ lvl: 'warn', path, msg });
  const I = (path, msg) => out.push({ lvl: 'info', path, msg });
  const ids = { quellen: new Set(ctx.quellen.keys()), annahmen: new Set(ctx.annahmen.keys()), risiken: new Set(ctx.risiken.keys()), fehlende_unterlagen: new Set(ctx.unterlagen.keys()) };
  let refErrors = 0;

  // Struktur
  if (data.schema_version !== '1.0') W('/schema_version', `Schema-Version ${JSON.stringify(data.schema_version ?? null)} statt "1.0".`);
  for (const k of TOP_KEYS) if (!(k in data)) E('/' + k, 'Hauptschlüssel fehlt.');
  for (const k of Object.keys(data)) if (!TOP_KEYS.includes(k)) I('/' + ptrKey(k), 'Zusätzlicher Schlüssel außerhalb des Datenvertrags.');
  for (const [sec, keys] of Object.entries(CORE)) {
    if (!(sec in data)) continue;
    if (!isObj(data[sec])) { E('/' + sec, 'Muss ein Objekt sein.'); continue; }
    for (const k of keys) if (!(k in data[sec])) W(`/${sec}/${k}`, 'Schlüssel der Kernstruktur fehlt.');
  }
  for (const [k] of TEILURTEILE) {
    const t = obj(data.bewertung)[k];
    if (t !== undefined && !isObj(t)) E(`/bewertung/${k}`, 'Teilurteil muss ein Objekt {urteil, begruendung, belegsicherheit} sein.');
    else if (isObj(t)) for (const kk of ['urteil', 'begruendung', 'belegsicherheit']) if (!(kk in t)) W(`/bewertung/${k}/${kk}`, 'Schlüssel fehlt.');
  }
  for (const [p, allowed] of Object.entries(ENUM_PATHS)) {
    const r = resolvePointer(data, p);
    if (!r.found) continue;
    if (!allowed.includes(r.value)) E(p, `Unzulässiger Wert ${JSON.stringify(r.value)}. Erlaubt: ${allowed.map(v => v === null ? 'null' : v).join(' | ')}.`);
  }

  // Arrays
  for (const [name, spec] of Object.entries(ARRAYS)) {
    if (!(name in data)) continue;
    if (!Array.isArray(data[name])) { E('/' + name, 'Muss ein Array sein.'); continue; }
    const seen = new Set();
    data[name].forEach((it, i) => {
      const p = `/${name}/${i}`;
      if (!isObj(it)) { E(p, 'Eintrag muss ein Objekt sein.'); return; }
      for (const k of spec.keys) if (!(k in it)) W(`${p}/${k}`, 'Pflichtschlüssel des Eintrags fehlt.');
      if (spec.prefix) {
        if (typeof it.id !== 'string' || !new RegExp(`^${spec.prefix}[0-9]+$`).test(it.id)) E(`${p}/id`, `ID ${JSON.stringify(it.id)} entspricht nicht dem Muster ${spec.prefix}1, ${spec.prefix}2 …`);
        else if (seen.has(it.id)) E(`${p}/id`, `ID ${it.id} ist doppelt vergeben.`);
        seen.add(it.id);
      } else if (name === 'datenbelege' && typeof it.feldpfad === 'string') {
        if (seen.has(it.feldpfad)) W(`${p}/feldpfad`, `Mehrere Datenbelege für ${it.feldpfad} – höchstens ein zusammengeführter Eintrag pro Feld.`);

  const len = Math.abs(x1 - x0); r = Math.min(r, len / 2, h / 2);
  if (len < 0.5) return '';
  if (x1 >= x0) return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
  return `M${x0},${y}H${x1 + r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 + r},${y + h}H${x0}Z`;
}

/** Streudiagramm Kaufpreis/m² gegen Bruttomietrendite (Vergleich). */
function svgScatter(w, pts) {
  const h = Math.round(Math.min(480, Math.max(320, w * 0.3))), m = { l: 58, r: 34, t: 30, b: 46 };
  const xs = pts.flatMap(p => p.x), ys = pts.flatMap(p => p.y);
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const xt = niceTicks(x0, x1, tickCount(iw, 64)), yt = niceTicks(Math.max(0, y0), y1, 5);
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  const sy = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let s = svgOpen(w, h);
  s += `<text class="axis-title" x="${m.l}" y="14">Bruttomietrendite (%)</text>`;
  for (const t of yt.ticks) s += `<line class="grid" x1="${m.l}" x2="${w - m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="tick" x="${m.l - 8}" y="${sy(t) + 4}" text-anchor="end">${nf1.format(t)}</text>`;
  for (const t of xt.ticks) s += `<text class="tick" x="${sx(t)}" y="${m.t + ih + 18}" text-anchor="middle">${nf0.format(t)}</text>`;
  s += `<line class="axis" x1="${m.l}" x2="${w - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<text class="axis-title" x="${m.l + iw / 2}" y="${h - 6}" text-anchor="middle">Kaufpreis pro m² (€)</text>`;
  for (const p of pts) {
    const ax = [Math.min(...p.x), Math.max(...p.x)].map(sx), ay = [Math.min(...p.y), Math.max(...p.y)].map(sy);
    const ranged = ax[0] !== ax[1] || ay[0] !== ay[1];
    if (ranged && ax[0] !== ax[1] && ay[0] !== ay[1]) s += `<rect class="rangebox" x="${ax[0]}" y="${ay[1]}" width="${ax[1] - ax[0]}" height="${ay[0] - ay[1]}" rx="4"/>`;
    else if (ranged) s += `<line class="rangeline" x1="${ax[0]}" x2="${ax[1]}" y1="${ay[0]}" y2="${ay[1]}"/>`;
    const marks = ranged ? [[ax[0], ay[0]], [ax[1], ay[1]]] : [[ax[0], ay[0]]];
    for (const [cx, cy] of marks) s += `<circle class="dot${p.hollow ? ' hollow' : ''}" cx="${cx}" cy="${cy}" r="5.5"/>`;
    const lx = Math.max(...marks.map(mk => mk[0])), ly = Math.min(...marks.map(mk => mk[1]));
    const right = lx < w - m.r - 30;
    s += `<text class="lbl" x="${right ? lx + 9 : lx - 9}" y="${ly - 7}" text-anchor="${right ? 'start' : 'end'}">#${p.num}</text>`;
    for (const [cx, cy] of marks) s += `<circle class="hit" cx="${cx}" cy="${cy}" r="13" data-tip="${esc(p.tip)}" data-action="open" data-uid="${p.uid}" style="cursor:pointer"/>`;
  }
  return s + '</svg>';
}

/** Preis-Einordnung: Kaufpreis, Wertspannen und renditeabhängige Zahlungsgrenzen auf einer EUR-Achse. */
function svgPriceMap(w, rows, ref) {
  const rowH = 34, m = { l: Math.min(230, w * 0.38), r: w < 520 ? 84 : 128, t: 8, b: 34 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.flatMap(r => [r.min, r.max]);
  const [a, b] = pad(Math.min(...vals), Math.max(...vals), 0.08);
  const iw = w - m.l - m.r;
  const xt = niceTicks(Math.max(0, a), b, tickCount(iw, 78));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${fmtAxis(t)}</text>`;
  if (ref != null) s += `<line class="refline" x1="${sx(ref)}" x2="${sx(ref)}" y1="${m.t}" y2="${h - m.b}"/>`;
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="${r.style === 'subject' ? 'lbl' : 'lbl2'}" x="${m.l - 12}" y="${cy + 4}" text-anchor="end"${r.style === 'subject' ? ' font-weight="600"' : ''}>${esc(trunc(r.label, Math.max(16, Math.floor(m.l / 6.6))))}</text>`;
    const x0 = sx(r.min), x1 = sx(r.max);
    if (r.kind === 'range') s += `<rect class="range-bar" x="${x0}" y="${cy - 7}" width="${Math.max(4, x1 - x0)}" height="14" rx="4"/>`;
    else if (r.style === 'subject') s += `<rect class="subject" x="${x0 - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x0} ${cy})"/>`;
    else s += `<circle class="dot limit" cx="${x0}" cy="${cy}" r="5.5"/>`;
    const txt = r.kind === 'range' ? `${fmtAxis(r.min)}–${fmtAxis(r.max)}` : fmtNum(r.min, 'eur');
    s += `<text class="val" x="${x1 + 10}" y="${cy + 4}">${esc(txt)}</text>`;
    s += `<rect class="hit" x="${x0 - 10}" y="${cy - 13}" width="${Math.max(20, x1 - x0 + 20)}" height="26" data-tip="${esc(r.tip)}"/>`;
  });
  return s + '</svg>';
}

/** Punktdiagramm Preis pro m²: dieses Objekt und Vergleichsobjekte. */
function svgDots(w, rows) {
  const rowH = 30, m = { l: Math.min(190, w * 0.36), r: 70, t: 10, b: 34 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.flatMap(r => r.values);
  const [a, b] = pad(Math.min(...vals), Math.max(...vals), 0.1);
  const iw = w - m.l - m.r;
  const xt = niceTicks(a, b, tickCount(iw, 56));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${nf0.format(t)}</text>`;
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="${r.style === 'subject' ? 'lbl' : 'lbl2'}" x="${m.l - 12}" y="${cy + 4}" text-anchor="end"${r.style === 'subject' ? ' font-weight="600"' : ''}>${esc(r.label)}</text>`;
    const xs = r.values.map(sx);
    if (xs.length > 1) s += `<line class="rangeline${r.style === 'subject' ? ' ink' : ''}" x1="${Math.min(...xs)}" x2="${Math.max(...xs)}" y1="${cy}" y2="${cy}"/>`;
    for (const x of xs) {
      if (r.style === 'subject') s += `<rect class="subject" x="${x - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x} ${cy})"/>`;
      else if (r.style === 'ausgeschlossen') s += `<path class="marker" d="M${x - 4},${cy - 4}L${x + 4},${cy + 4}M${x + 4},${cy - 4}L${x - 4},${cy + 4}" style="stroke:var(--muted);stroke-width:2"/>`;
      else s += `<circle class="dot${r.style === 'eingeschraenkt' ? ' hollow' : ''}" cx="${x}" cy="${cy}" r="5.5"/>`;
    }
    const maxX = Math.max(...xs);
    s += `<text class="val" x="${maxX + 10}" y="${cy + 4}">${esc(r.values.length > 1 ? nf0.format(Math.min(...r.values)) + '–' + nf0.format(Math.max(...r.values)) : nf0.format(r.values[0]))}</text>`;
    s += `<rect class="hit" x="${Math.min(...xs) - 10}" y="${cy - 12}" width="${maxX - Math.min(...xs) + 20}" height="24" data-tip="${esc(r.tip)}"/>`;
  });
  return s + '</svg>';
}

/** Cashflow je Szenario, divergierend um 0. */
function svgCashflow(w, rows) {
  const rowH = 36, bh = 16, m = { l: Math.min(240, w * 0.42), r: 74, t: 8, b: 32 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.map(r => r.value);
  const iw = w - m.l - m.r;
  const xt = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), tickCount(iw, 56));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${minus(nf0.format(t))}</text>`;
  rows.forEach((r, i) => {
    const y = m.t + i * rowH + (rowH - bh) / 2;
    s += `<text class="lbl2" x="${m.l - 12}" y="${y + 12}" text-anchor="end">${esc(trunc(r.label, Math.max(18, Math.floor(m.l / 7))))}</text>`;
    s += `<path class="${r.value < 0 ? 'bar-neg' : 'bar-pos'}" d="${hbarPath(sx(0), sx(r.value), y, bh)}"/>`;
    const x = sx(r.value), left = r.value < 0;
    s += `<text class="val" x="${left ? x - 8 : x + 8}" y="${y + 12}" text-anchor="${left ? 'end' : 'start'}">${esc(fmtNum(r.value, 'eur'))}</text>`;
    s += `<rect class="hit" x="${Math.min(sx(0), x) - 4}" y="${y - 8}" width="${Math.abs(x - sx(0)) + 8}" height="${bh + 16}" data-tip="${esc(r.tip)}"/>`;
  });
  s += `<line class="axis" x1="${sx(0)}" x2="${sx(0)}" y1="${m.t}" y2="${h - m.b}"/>`;
  return s + '</svg>';
}
const legendDot = (cls, shape = 'circle') => `<svg width="14" height="14" viewBox="0 0 14 14">${shape === 'diamond' ? '<rect x="3" y="3" width="8" height="8" transform="rotate(45 7 7)" style="fill:var(--ink)"/>' : shape === 'x' ? '<path d="M3,3L11,11M11,3L3,11" style="stroke:var(--muted);stroke-width:2"/>' : `<circle cx="7" cy="7" r="5" class="${cls}" style="${cls === 'hollow' ? 'fill:var(--surface);stroke:var(--c-blue);stroke-width:2' : 'fill:var(--c-blue)'}"/>`}</svg>`;

function detailHead(doc) {
  const d = doc.data, a = obj(d.angebot), s = obj(d.standort), m = obj(d.metadaten);
  const url = safeUrl(a.url);
  const place = [[s.postleitzahl, s.ort].filter(Boolean).join(' '), s.stadtteil].filter(Boolean).join(' – ');
  const ids = [platLabel(a.plattform), a.plattform_id != null ? `ID ${a.plattform_id}` : null, a.anbieter_objektnummer ? `Obj.-Nr. ${a.anbieter_objektnummer}` : null, a.einheit].filter(Boolean).join(' · ');
  const chip = (label, v, extra) => v == null ? '' : `<span class="meta"><span class="muted">${label}</span>${esc(fmtValue(label === 'Prüfdatum' || label === 'Export' ? 'datum' : label === 'Status' ? 'analysestatus' : 'status', v))}${extra ? ` <span class="muted">(${esc(fmtDate(extra))})</span>` : ''}</span>`;
  let rev = '';
  if (doc.rev && doc.rev.total > 1) {
    const others = doc.rev.group.filter(x => x !== doc);
    rev = `<div class="revnote no-print"><b>${doc.rev.latest ? `Neueste von ${doc.rev.total} Revisionen.` : `Ältere Revision (${doc.rev.index} von ${doc.rev.total}).`}</b>${others.map(o => `<button class="linkbtn" data-action="open" data-uid="${o.uid}">Rev. ${o.rev.index} vom ${esc(fmtDate(obj(o.data.metadaten).exportdatum || obj(o.data.metadaten).pruefdatum || ''))} öffnen</button>`).join(' · ')}</div>`;
  }
  return `<div class="detail-head">
    <div class="crumbs">${immoDocs().length > 1 ? '<button class="linkbtn" data-action="compare">← Zum Vergleich</button><span>/</span>' : ''}<span class="file" title="${esc(doc.fileName)}">${esc(doc.fileName)}</span></div>
    <div class="dh-row">
      <div class="dh-main">
        <h1><span class="num">#${doc.num}</span> ${esc(docTitle(doc))}</h1>
        <p class="sub">${esc([place, a.objektart].filter(Boolean).join(' · '))}</p>
        <p class="sub small">${esc(ids)}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Inserat öffnen ↗</a>` : ''}</p>
      </div>
      <div class="dh-actions"><button class="btn sm" data-action="jump" data-target="sec-pruefung">${issueSummary(doc)}</button><button class="btn sm needs-print" data-action="print">Drucken / PDF</button><button class="btn sm" data-action="remove" data-uid="${doc.uid}" title="Nur aus dieser Ansicht entfernen – die Datei bleibt unverändert">Entfernen</button></div>
    </div>
    <div class="meta-chips">
      ${chip('Status', m.analysestatus)}${chip('Zugriff', a.zugriffsstatus)}${chip('Verfügbarkeit', a.verfuegbarkeit, a.verfuegbarkeit_stand)}${chip('Fokus', m.nutzungsfokus)}${chip('Prüfdatum', m.pruefdatum)}${chip('Export', m.exportdatum)}
    </div>

}

function tile(doc, path, label) {
  const key = lastKey(path);
  const r = resolvePointer(doc.data, path);
  const v = r.found ? r.value : null;
  let main, sub = '';
  if (v === null || v === undefined) {
    main = '<span class="null">—</span>';
    const w = doc.ctx.conflicts.get(path), sc = scenRange(doc, key);
    const na = doc.ctx.belege.get(path)?.status === 'nicht_anwendbar';
    sub = (w ? `<button class="tag tag-crit" data-action="ref" data-uid="${doc.uid}" data-id="${esc(w.id)}">strittig · ${esc(w.id)}</button>` : sc || na ? '' : '<span class="muted">nicht bestimmt</span>')
      + (sc ? ` <span class="scen" data-tip="${esc(sc.tip)}">Szenario: ${esc(sc.text)}</span>` : '');
  } else main = `<span class="${typeof v === 'number' && v < 0 ? 'neg' : ''}">${esc(fmtValue(key, v))}</span>`;
  return `<div class="tile"><div class="tile-label">${esc(label)}</div><div class="tile-value">${main}</div><div class="tile-foot">${sub}${belegChip(doc, path)}</div></div>`;
}

  const teil = (t, title) => {

      <div class="teil-urteil">${t.urteil ? esc(t.urteil) : '<span class="null">Kein Urteil</span>'}</div>

function energyScale(e, pruefdatum) {
  const k = isNum(e.kennwert_kwh_m2_a) ? e.kennwert_kwh_m2_a : null;
  const cls = ENERGY_CLASSES.includes(e.effizienzklasse) ? e.effizienzklasse : null;
  if (k == null && !cls) return '';
  const ramp = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#6da7ec', '#3987e5', '#2a78d6', '#1c5cab', '#184f95', '#0d366b'];
  let marker = '';
  if (k != null) {
    const kc = klasseFromKennwert(k), i = ENERGY_CLASSES.indexOf(kc);
    const lo = ENERGY_BOUNDS[i], hi = ENERGY_BOUNDS[i + 1];
    const pos = (i + Math.min(1, Math.max(0, (k - lo) / (hi - lo)))) / 9 * 100;
    marker = `<div class="escale-marker"><i style="left:${pos}%"></i><b style="left:${Math.min(88, Math.max(12, pos))}%">${esc(fmtNum(k, 'kwh'))}</b></div>`;
  }
  const notes = [];
  if (isValidDate(e.gueltig_bis) && isValidDate(pruefdatum) && e.gueltig_bis < pruefdatum) notes.push(`<span class="tag tag-warn">Zum Prüfdatum abgelaufen (gültig bis ${esc(fmtDate(e.gueltig_bis))})</span>`);
  if (isValidDate(e.verbrauchszeitraum_bis) && isValidDate(pruefdatum)) {
    const years = Math.floor((new Date(pruefdatum) - new Date(e.verbrauchszeitraum_bis)) / 31557600000);
    if (years >= 3) notes.push(`<span class="tag">Verbrauchsdaten enden ${years} Jahre vor dem Prüfdatum</span>`);
  }
  if (k != null && cls && klasseFromKennwert(k) !== cls) notes.push(`<span class="tag tag-warn">Klasse ${esc(cls)} passt nicht zur Kennwertgrenze (${esc(klasseFromKennwert(k))})</span>`);
  return `<div class="escale">
    <div class="escale-bar">${ENERGY_CLASSES.map((c, i) => `<span class="${c === cls ? 'on' : ''}" style="--bg:${ramp[i]};--fg:${i < 4 ? '#0b0b0b' : '#fff'}">${c}</span>`).join('')}</div>
    ${marker}
    <div class="escale-ticks">${ENERGY_BOUNDS.slice(0, 9).map(b => `<span>${b === 0 ? '' : '≥' + b}</span>`).join('')}</div>
    <p class="chart-note">Skala nach GEG-Klassengrenzen in kWh/(m²·a). Ein gültiger Ausweis kann einen älteren energetischen Zustand abbilden.</p>
    ${notes.length ? `<div class="meta-chips" style="margin-top:6px">${notes.join('')}</div>` : ''}
  </div>`;
}

function secLage(doc) {
  const e = obj(doc.data.energie), m = obj(doc.data.metadaten);
