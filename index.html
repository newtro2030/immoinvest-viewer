    regeln: { typ: 'frei' },
    eingaben: { typ: 'frei' },
    offene_angaben: { typ: 'frei' },
    annahmen: { typ: 'frei' },
    ergebnisse: { typ: 'frei' },
    erweiterungen: { typ: 'frei' },
  };

  /* ---------- Normalisierung nach Feldbeschreibung ---------- */
  function normalisiere(spec, wert, pfad, fehler, unbekannt) {
    if (spec.typ === 'frei') return wert;
    if (wert === null) {
      if (spec.null === false) fehler.push({ pfad, meldung: 'Darf nicht null sein.' });
      return null;
    }
    switch (spec.typ) {
      case 'const': if (wert !== spec.wert) fehler.push({ pfad, meldung: `Erwartet „${spec.wert}“.` }); return spec.wert;
      case 'zahl':
        if (!B.istZahl(wert)) { fehler.push({ pfad, meldung: 'Zahl erwartet (ohne Einheit, Tausenderpunkt oder Prozentzeichen).' }); return undefined; }
        if (spec.ganz && !Number.isInteger(wert)) fehler.push({ pfad, meldung: 'Ganzzahl erwartet.' });
        if (spec.min !== undefined && wert < spec.min) fehler.push({ pfad, meldung: `Mindestens ${spec.min}.` });
        if (spec.max !== undefined && wert > spec.max) fehler.push({ pfad, meldung: `Höchstens ${spec.max}.` });
        return wert;
      case 'text':
        if (typeof wert !== 'string') { fehler.push({ pfad, meldung: 'Text erwartet.' }); return undefined; }
        if (wert.length > spec.max) fehler.push({ pfad, meldung: `Höchstens ${spec.max} Zeichen.` });
        if (spec.muster && !new RegExp(spec.muster).test(wert)) fehler.push({ pfad, meldung: `Format ungültig (${spec.muster}).` });
        if (spec.format === 'date-time' && Number.isNaN(Date.parse(wert))) fehler.push({ pfad, meldung: 'ISO-Datum mit Uhrzeit erwartet.' });
        return wert;
      case 'enum': if (!spec.werte.includes(wert)) fehler.push({ pfad, meldung: `Erlaubt: ${spec.werte.join(', ')}.` }); return wert;
      case 'bool': if (typeof wert !== 'boolean') { fehler.push({ pfad, meldung: 'true oder false erwartet.' }); return undefined; } return wert;
      case 'liste': {
        if (!Array.isArray(wert)) { fehler.push({ pfad, meldung: 'Liste erwartet.' }); return []; }
        if (wert.length > spec.max) fehler.push({ pfad, meldung: `Höchstens ${spec.max} Einträge.` });
        return wert.map((x, i) => normalisiere(spec.element, x, `${pfad}/${i}`, fehler, unbekannt));
      }
      case 'karte': {
        if (typeof wert !== 'object' || Array.isArray(wert)) { fehler.push({ pfad, meldung: 'Objekt erwartet.' }); return {}; }
        const out = {};
        const erlaubt = spec.erlaubt ? spec.erlaubt() : null;
        for (const [k, v] of Object.entries(wert)) {
          if (!new RegExp(spec.schluessel).test(k) || (erlaubt && !erlaubt.includes(k))) { unbekannt.push(`${pfad}/${k}`); continue; }
          out[k] = normalisiere(spec.wert, v, `${pfad}/${k}`, fehler, unbekannt);
        }
        return out;
      }
      case 'objekt': {
        if (typeof wert !== 'object' || Array.isArray(wert)) { fehler.push({ pfad, meldung: 'Objekt erwartet.' }); return {}; }
        const out = {};
        for (const [k, s] of Object.entries(spec.felder)) {
          if (!Object.prototype.hasOwnProperty.call(wert, k)) { if (s.pflicht) fehler.push({ pfad: `${pfad}/${k}`, meldung: 'Pflichtfeld fehlt.' }); continue; }
          const v = normalisiere(s, wert[k], `${pfad}/${k}`, fehler, unbekannt);
          if (v !== undefined) out[k] = v;
        }
        for (const k of Object.keys(wert)) if (!Object.prototype.hasOwnProperty.call(spec.felder, k)) unbekannt.push(`${pfad}/${k}`);
        return out;
      }
      default: return wert;
    }
  }

  /** Versionsprüfung: gleiche Hauptversion wird übernommen (Unterversionen ohne Strukturänderung), künftige abgelehnt. */
  function pruefeVersion(dok, format) {
    if (!dok || typeof dok !== 'object' || Array.isArray(dok)) return 'Die Datei enthält kein JSON-Objekt.';
    if (dok.dokumenttyp !== format.typ) return `Falscher Dokumenttyp: erwartet „${format.typ}“, gefunden „${dok.dokumenttyp ?? 'keiner'}“.`;
    const m = /^(\d+)\.(\d+)$/.exec(String(dok.formatversion ?? ''));
    if (!m) return 'Formatversion fehlt oder ist ungültig.';
    if (Number(m[1]) > format.major) return `Formatversion ${dok.formatversion} ist neuer als die unterstützte Version ${format.version}. Bitte den Viewer aktualisieren.`;
    if (Number(m[1]) < format.major) return `Formatversion ${dok.formatversion} wird nicht unterstützt.`;
    return null;
  }

  /** Bekannte Migrationen je Version (derzeit keine ältere Version; Unterversionen 1.x werden auf 1.0-Felder reduziert). */
  const MIGRATIONEN = {};

  function importiereProfil(dok) {
    const versionsfehler = pruefeVersion(dok, FORMAT_PROFIL);
    if (versionsfehler) return { ok: false, fehler: [{ pfad: '', meldung: versionsfehler }], warnungen: [] };
    const hinweise = [];
    if (dok.formatversion !== FORMAT_PROFIL.version) hinweise.push(`Formatversion ${dok.formatversion} wird als ${FORMAT_PROFIL.version} gelesen; unbekannte Felder werden nicht übernommen.`);
    const quelle = MIGRATIONEN[dok.formatversion] ? MIGRATIONEN[dok.formatversion](dok) : dok;
    const fehler = [], unbekannt = [];
    const profil = normalisiere(objekt(PROFIL_FELDER), quelle, '', fehler, unbekannt);
    pruefeProfilLogik(profil, fehler);
    const warnungen = hinweise.concat(unbekannt.map(p => `Unbekanntes Feld ${p} wurde nicht übernommen.`));
    if (fehler.length) return { ok: false, fehler, warnungen };
    profil.formatversion = FORMAT_PROFIL.version;
    return { ok: true, profil, fehler: [], warnungen };
  }

  /** Fachliche Prüfungen über einzelne Felder hinaus (eindeutige IDs, Personenzahl, Konditionen). */
  function pruefeProfilLogik(p, fehler) {
    const ids = (p.personen || []).map(x => x.id);
    if (new Set(ids).size !== ids.length) fehler.push({ pfad: '/personen', meldung: 'Personen-IDs müssen eindeutig sein.' });
    if (p.haushalt && B.istZahl(p.haushalt.erwachsene) && p.haushalt.erwachsene !== ids.length) fehler.push({ pfad: '/haushalt/erwachsene', meldung: 'Anzahl der Erwachsenen muss der Zahl der erfassten Personen entsprechen.' });
    const kIds = ((p.finanzierung && p.finanzierung.konditionen) || []).map(k => k.id);
    if (new Set(kIds).size !== kIds.length) fehler.push({ pfad: '/finanzierung/konditionen', meldung: 'Konditions-IDs müssen eindeutig sein.' });
  }

  /** Leeres Profil: alles nicht angegeben, nur Struktur und sichtbare Standardvorgaben. */
  function neuesProfil(bezeichnung, jetzt) {

    const ph = platzhalter || (vorhanden && wert === null ? 'unbekannt' : 'nicht angegeben');
    input = `<div class="inp-wrap"><input id="${id}" type="text" inputmode="${typ === 'text' ? 'text' : typ === 'monat' ? 'numeric' : 'decimal'}" ${attrs} data-fkey="${esc(key)}" value="${esc(anzeige)}" placeholder="${esc(ph)}" aria-describedby="${id}_h"${fehler ? ' aria-invalid="true"' : ''}${einheit ? ' class="mit-einheit"' : ''}>${einheit ? `<span class="inp-einheit" aria-hidden="true">${esc(einheit)}</span>` : ''}</div>`;
  }
  const unten = fehler ? `<div class="feld-fehler" id="${id}_h" role="alert">${esc(fehler)}</div>` : hilfe ? `<div class="feld-hilfe" id="${id}_h">${esc(hilfe)}</div>` : '';
  return `<div class="feld${breit ? ' breit' : ''}${fehler ? ' hat-fehler' : ''}"><label for="${id}">${esc(label)}</label>${input}${unten}</div>`;
}

      ${imp.warnungen.length ? `<ul class="issues">${imp.warnungen.map(w => `<li class="issue warn"><span class="ico">⚠</span><span>${esc(w)}</span></li>`).join('')}</ul>` : ''}

    if (!state.docs.length || state.view === 'start') pZuProfilen();

  return { ok: true, profil: imp.profil };
}

/* =====================================================================
   Eingaben verarbeiten
   ===================================================================== */
function pProfilFeld(t) {
  const p = aktivesProfil();
  if (!p) return;
  const pfad = t.dataset.pfad, typ = t.dataset.ptyp, key = 'p:' + pfad;
  let wert;
  if (typ === 'bool') wert = t.checked;
  else if (typ === 'radio') wert = t.value;
  else if (typ === 'wahl') wert = t.value === '' ? null : t.value === '__true' ? true : t.value === '__false' ? false : t.value;
  else if (typ === 'wahlzahl') wert = t.value === '' ? null : Number(t.value);
  else {
    const r = pParse(t.value, typ, t.dataset.einheit);
    if (!r.ok) { state.feldFehler[key] = r.fehler; state.feldRoh[key] = t.value; return pRender(); }
    if (r.leer && !pHat(p, pfad)) { delete state.feldFehler[key]; return pRender(); }
    wert = r.wert;
  }
  const spec = pSpec(pfad);
  if (spec && wert === null && spec.null === false) {
    // Listeneinträge (z. B. ein manueller Steuersatz) werden durch Leeren entfernt, Pflichttexte nicht
    const teile = pfad.split('.'), index = teile.pop(), liste = pGet(p, teile.join('.'));
    if (Array.isArray(liste) && /^\d+$/.test(index)) {
      liste.splice(Number(index), 1);
      delete state.feldFehler[key]; delete state.feldRoh[key];
      profilGeaendert(p);
      return pRender();
    }
    state.feldFehler[key] = 'Pflichtangabe – bitte ausfüllen.'; state.feldRoh[key] = t.value;
    return pRender();
  }
  if (spec && wert !== null && typ !== 'radio') {
    const f = [];
    RK.formate.normalisiere(spec, wert, '', f, []);
    if (f.length) { state.feldFehler[key] = f[0].meldung; state.feldRoh[key] = t.value; return pRender(); }
  }
  delete state.feldFehler[key]; delete state.feldRoh[key];
  pSet(p, pfad, wert);
  pNachProfilAenderung(p, pfad, wert);
  profilGeaendert(p);
  pRender();
}

/** Strukturfolgen einzelner Felder: Personenzahl ↔ Personenliste und Veranlagungsart. */
function pNachProfilAenderung(p, pfad, wert) {
  if (pfad === 'haushalt.erwachsene') {
    p.personen = p.personen || [];
    if (wert === 2 && p.personen.length === 1) p.personen.push({ id: 'P2', bezeichnung: 'Person B' });
    if (wert === 1 && p.personen.length === 2) {
      p.personen = p.personen.slice(0, 1);
      for (const pf2 of ['steuer.zve_personen_eur', 'steuer.schaetzung.werbungskosten_eur', 'steuer.schaetzung.vorsorgeaufwendungen_eur']) { const m = pGet(p, pf2); if (m) delete m.P2; }
    }
    p.haushalt.veranlagung = wert === 1 ? 'einzel' : p.haushalt.familienstand === 'verheiratet' || p.haushalt.familienstand === 'eingetragene_partnerschaft' ? 'zusammen' : 'einzeln_getrennt';
  }
}

const ANP_GRENZEN = { kaufpreis_eur: [0, 1e8], verpflichtende_zusatzkaeufe_eur: [0, 1e7], grunderwerbsteuer_prozent: [0, 10], kaeuferprovision_prozent: [0, 20], notar_grundbuch_prozent: [0, 10], anfaengliche_massnahmen_eur: [0, 1e7], eigenkapital_einsatz_eur: [0, 1e8], kaltmiete_monat_eur: [0, 1e6], bk_vorauszahlung_monat_eur: [0, 1e5], umlagefaehig_monat_eur: [0, 1e5], nicht_umlagefaehig_monat_eur: [0, 1e5], ruecklage_monat_eur: [0, 1e5], vorsorge_monat_eur: [0, 1e5], mietausfall_prozent: [0, 100], mietsteigerung_prozent: [-20, 20], kostensteigerung_prozent: [-20, 20], gebaeudeanteil_prozent: [0, 100], fertigstellung_jahr: [1500, 2100] };

function pDoc() { return state.view === 'detail' ? getDoc(state.current) : null; }
function pOSKey(doc) { const p = aktivesProfil(); return p && doc && doc.key ? `${p.id}::${doc.key}` : null; }
function pOS(doc) { return state.objektszenarien[pOSKey(doc)] || { objekt_schluessel: doc.key }; }
function pOSAendern(doc, fn) {
  const k = pOSKey(doc);
  if (!k) return;
  const os = pKopie(pOS(doc));
  fn(os);
  state.objektszenarien[k] = os;
  pSpeichern();
  pRender();
}

function pAnpassungFeld(t) {
  const doc = pDoc();
  if (!doc) return;
  const feld = t.dataset.oanp, fkey = 'o:' + feld;
  if (t.dataset.begr !== undefined) {
    return pOSAendern(doc, os => { os.anpassungen = os.anpassungen || {}; if (os.anpassungen[feld]) os.anpassungen[feld].begruendung = t.value.trim() || null; });
  }
  const r = pParse(t.value, 'zahl', t.dataset.einheit);
  if (!r.ok) { state.feldFehler[fkey] = r.fehler; state.feldRoh[fkey] = t.value; return pRender(); }
  const [min, max] = ANP_GRENZEN[feld] || [0, 1e9];
  if (!r.leer && (r.wert < min || r.wert > max)) { state.feldFehler[fkey] = `Wert zwischen ${min} und ${max} angeben.`; state.feldRoh[fkey] = t.value; return pRender(); }
  delete state.feldFehler[fkey]; delete state.feldRoh[fkey];
  pOSAendern(doc, os => {
    os.anpassungen = os.anpassungen || {};
    if (r.leer) delete os.anpassungen[feld];
    else { const alt = os.anpassungen[feld] || {}; os.anpassungen[feld] = { wert: r.wert, begruendung: alt.quelle ? null : alt.begruendung || null }; }
  });
}

function pOSFeld(t) {
  const doc = pDoc();
  if (!doc) return;
  const pfad = t.dataset.os, typ = t.dataset.ostyp || 'text', fkey = 'os:' + pfad;
  let wert;
  if (typ === 'bool') wert = t.checked;
  else if (typ === 'wahl') wert = t.value === '' ? null : t.value;
  else {
    const r = pParse(t.value, typ === 'monat' ? 'monat' : typ, t.dataset.einheit);
    if (!r.ok) { state.feldFehler[fkey] = r.fehler; state.feldRoh[fkey] = t.value; return pRender(); }
    wert = r.leer ? null : r.wert;
    if (typ === 'zahl' && wert !== null && (wert < 0 || (/prozent/.test(pfad) && wert > 100))) { state.feldFehler[fkey] = 'Wert zwischen 0 und 100 angeben.'; state.feldRoh[fkey] = t.value; return pRender(); }
  }
  delete state.feldFehler[fkey]; delete state.feldRoh[fkey];
  pOSAendern(doc, os => pSet(os, pfad, wert));
}

/** Konditionsfelder: data-kond="quelle:id:feld" (quelle profil oder objekt). */
function pKonditionFeld(t) {
  const [quelle, id, feld] = t.dataset.kond.split(':');
  const typ = t.dataset.ktyp || 'zahl';
  const fkey = 'k:' + t.dataset.kond;
  let wert;
  if (typ === 'wahl') wert = t.value === '' ? null : t.value;
  else {
    const r = pParse(t.value, typ, t.dataset.einheit);
    if (!r.ok) { state.feldFehler[fkey] = r.fehler; state.feldRoh[fkey] = t.value; return pRender(); }
    wert = r.leer ? null : r.wert;
  }
  const kspec = feld.startsWith('anschluss.') ? RK.formate.KONDITION.felder.anschluss.felder[feld.slice(10)] : RK.formate.KONDITION.felder[feld];
  if (kspec && wert !== null && feld !== 'anschluss.aktiv') {
    const f = [];
    RK.formate.normalisiere(kspec, wert, '', f, []);
    if (f.length) { state.feldFehler[fkey] = f[0].meldung; state.feldRoh[fkey] = t.value; return pRender(); }
  }
  delete state.feldFehler[fkey]; delete state.feldRoh[fkey];
  const aendere = k => {
    if (feld === 'anschluss.aktiv') { k.anschluss = wert === 'ja' ? (k.anschluss || { sollzins_prozent: null, regel: 'rate_beibehalten', tilgung_prozent: null }) : null; return; }
    if (feld.startsWith('anschluss.')) { k.anschluss = k.anschluss || { sollzins_prozent: null, regel: 'rate_beibehalten', tilgung_prozent: null }; k.anschluss[feld.slice(10)] = wert; return; }
    k[feld] = wert;
    if (feld === 'monatsrate_eur' && wert !== null) k.tilgung_prozent = null;
    if (feld === 'tilgung_prozent' && wert !== null) k.monatsrate_eur = null;
  };
  if (quelle === 'profil') {
    const p = aktivesProfil();
    const k = (p.finanzierung.konditionen || []).find(x => x.id === id);
    if (!k) return;
    aendere(k);
    profilGeaendert(p);
    pRender();
  } else {
    const doc = pDoc();
    pOSAendern(doc, os => { const k = (os.konditionen_objekt || []).find(x => x.id === id); if (k) aendere(k); });
  }
}

function pNaechsterJanuar() { return `${new Date().getFullYear() + 1}-01`; }
function pNeueKondition(liste, praefix) {
  let n = 1;
  while (liste.some(k => k.id === `${praefix}${n}`)) n++;
  return { id: `${praefix}${n}`, bezeichnung: `Kondition ${n}`, art: 'annahme', darlehensbetrag_eur: null, sollzins_prozent: null, effektivzins_prozent: null, tilgung_prozent: null, monatsrate_eur: null, zinsbindung_jahre: 10, beginn: pNaechsterJanuar(), sondertilgung_jahr_eur: 0, anschluss: null, gebuehren_eur: 0, hinweis: null };
}

function pVarianteFeld(t) {
  const doc = pDoc();
  const [id, feld] = t.dataset.var.split(':');
  const fkey = 'v:' + t.dataset.var;
  let wert;
  if (t.tagName === 'SELECT') wert = t.value;
  else if (feld === 'bezeichnung') wert = t.value.trim() || null;
  else {
    const r = pParse(t.value, 'zahl', t.dataset.einheit);
    if (!r.ok || r.leer) { state.feldFehler[fkey] = r.ok ? 'Wert angeben.' : r.fehler; state.feldRoh[fkey] = t.value; return pRender(); }
    wert = r.wert;
  }
  delete state.feldFehler[fkey]; delete state.feldRoh[fkey];
  pOSAendern(doc, os => { const v = (os.varianten || []).find(x => x.id === id); if (!v) return; if (feld === 'bezeichnung') v.bezeichnung = wert; else { v.parameter = v.parameter || {}; v.parameter[feld] = wert; } });
}

function pVarianteNeu(doc, typ, ergebnis) {
  const e = (ergebnis && ergebnis.eingaben) || {};
  const k = ergebnis && ergebnis.kondition;
  const ek = e.eigenkapital_einsatz_eur ? e.eigenkapital_einsatz_eur.wert : 0;
  const vorlage = {
    zins: { sollzins_prozent: k && pIstZahl(k.sollzins_prozent) ? Math.round((k.sollzins_prozent + 1) * 100) / 100 : 5 },
    tilgung: { tilgung_prozent: 3 },
    eigenkapital: { eigenkapital_einsatz_eur: (pIstZahl(ek) ? ek : 0) + 10000 },
    kosten: { aufschlag_prozent: 20 },
    kaltmietausfall: { monate: 3, modelljahr: 1 },
    leerstand: { monate: 3, modelljahr: 1 },
    sonderumlage: { betrag_eur: 5000, modelljahr: 2, kategorie: 'erhaltung' },
    anschluss: { sollzins_prozent: 6 },
    miete: { kaltmiete_monat_eur: e.kaltmiete_monat_eur && pIstZahl(e.kaltmiete_monat_eur.wert) ? e.kaltmiete_monat_eur.wert : 0 },
    kaufpreis: { kaufpreis_eur: e.kaufpreis_eur && pIstZahl(e.kaufpreis_eur.wert) ? Math.round(e.kaufpreis_eur.wert * 0.95) : 0 },
    steuersatz: { satz_prozent: 42 },
  }[typ];
  pOSAendern(doc, os => {
    os.varianten = os.varianten || [];
    let n = 1;
    while (os.varianten.some(v => v.id === `V${n}`)) n++;
    os.varianten.push({ id: `V${n}`, typ, bezeichnung: (VARIANTEN_VORLAGEN.find(v => v[0] === typ) || [, typ])[1], parameter: vorlage });
  });
}

/* =====================================================================
   Aktionen (vom Klick-Handler des Hauptskripts aufgerufen)
   ===================================================================== */
function pAktion(action, el) {
  const doc = pDoc();
  switch (action) {
    case 'p-neu': return pNeu();
    case 'p-waehlen': state.profile.aktivId = el.dataset.pid; pSpeichern(); return render();
    case 'p-duplizieren': return pDuplizieren(el.dataset.pid);
    case 'p-loeschen': return pLoeschenFragen(el.dataset.pid);
    case 'p-loeschen-ok': return pLoeschen(el.dataset.pid);
    case 'p-export': return pExportFragen(el.dataset.pid);
    case 'p-export-ok': return pExport(el.dataset.pid);
    case 'p-tab': state.profilTab = el.dataset.tab; return renderMitFokus();
    case 'p-oeffnen': state.view = 'detail'; state.current = el.dataset.uid; state.detailModus = 'persoenlich'; render(); return window.scrollTo(0, 0);
    case 'p-beispiele': return pBeispieleLaden();
    case 'p-imp-ersetzen': return pImportErsetzen(false);
    case 'p-imp-kopie': return pImportErsetzen(true);
    case 'p-paket-ok': return pPaketUebernehmen();
    case 'p-browser-loeschen':
      lsDel(LS_PROFILE); lsDel(LS_PROFILE_MERKEN); state.profile.merken = false;
      toast('Im Browser gespeicherte Profile gelöscht. Die geöffneten Profile bleiben bis zum Neuladen sichtbar.');
      return render();
    case 'p-einnahme-neu': { const p = aktivesProfil(); p.budget.weitere_einnahmen = p.budget.weitere_einnahmen || []; p.budget.weitere_einnahmen.push({ bezeichnung: 'Weitere Einnahme', betrag_monat_eur: null, im_netto_enthalten: null }); profilGeaendert(p); return render(); }
    case 'p-einnahme-weg': { const p = aktivesProfil(); p.budget.weitere_einnahmen.splice(Number(el.dataset.i), 1); profilGeaendert(p); return render(); }
    case 'p-satz-weg': { const p = aktivesProfil(); p.steuer.manuelle_saetze_prozent.splice(Number(el.dataset.i), 1); profilGeaendert(p); return render(); }
    case 'p-kond-neu': {
      if (el.dataset.quelle === 'profil') { const p = aktivesProfil(); const l = p.finanzierung.konditionen = p.finanzierung.konditionen || []; const k = pNeueKondition(l, 'K'); l.push(k); if (!p.finanzierung.standard_kondition_id) p.finanzierung.standard_kondition_id = k.id; profilGeaendert(p); return render(); }
      return pOSAendern(doc, os => { const l = os.konditionen_objekt = os.konditionen_objekt || []; const k = pNeueKondition(l, 'K-o'); k.art = 'angebot'; k.bezeichnung = 'Objektangebot'; l.push(k); os.aktive_kondition_id = k.id; });
    }
    case 'p-kond-weg': {
      if (el.dataset.quelle === 'profil') { const p = aktivesProfil(); p.finanzierung.konditionen = p.finanzierung.konditionen.filter(k => k.id !== el.dataset.kid); if (p.finanzierung.standard_kondition_id === el.dataset.kid) p.finanzierung.standard_kondition_id = (p.finanzierung.konditionen[0] || {}).id || null; profilGeaendert(p); return render(); }
      return pOSAendern(doc, os => { os.konditionen_objekt = (os.konditionen_objekt || []).filter(k => k.id !== el.dataset.kid); if (os.aktive_kondition_id === el.dataset.kid) os.aktive_kondition_id = null; });
    }
    case 'p-kond-aktiv': return pOSAendern(doc, os => { os.aktive_kondition_id = el.dataset.kid; });
    case 'p-anp-reset': return pOSAendern(doc, os => { if (os.anpassungen) delete os.anpassungen[el.dataset.feld]; });
    case 'p-nicht-umlage': return pOSAendern(doc, os => { os.anpassungen = os.anpassungen || {}; os.anpassungen.nicht_umlagefaehig_monat_eur = { wert: Number(el.dataset.wert), begruendung: 'Hausgeld minus umlagefähige Kosten minus Rücklage' }; });
    case 'p-anteile-5050': return pOSAendern(doc, os => { os.eigentum = { ...(os.eigentum || {}), anteile_prozent: { P1: 50, P2: 50 }, bestaetigt: true }; });
    case 'p-var-neu': return pVarianteNeu(doc, el.dataset.typ, doc ? RK.szenario.berechne({ immobilie: doc.data, profil: aktivesProfil(), objektszenario: pOS(doc) }) : null);
    case 'p-var-weg': return pOSAendern(doc, os => { os.varianten = (os.varianten || []).filter(v => v.id !== el.dataset.vid); });
    case 'p-paket-export': return pPaketExportFragen(doc, el.dataset.umfang);
    case 'p-paket-export-ok': return pPaketExport(doc, el.dataset.umfang);
    case 'detail-modus': state.detailModus = el.dataset.modus; return renderMitFokus();
    case 'profile': pZuProfilen(); render(); return window.scrollTo(0, 0);
    case 'p-profil-tab':
      pZuProfilen(); state.profilTab = el.dataset.tab; render();
      return (document.querySelector('.p-editor') || document.body).scrollIntoView({ block: 'start' });
    case 'p-vorschlaege': return pVorschlaegeDialog(getDoc(el.dataset.uid));
    case 'p-vorschlaege-ok': {
      const ids = [...document.querySelectorAll('#dlg [data-vorschlag]:checked')].map(x => x.dataset.vorschlag);
      const n = ids.length ? pVorschlaegeUebernehmen(getDoc(el.dataset.uid), ids) : 0;
      pSpeichern(); $('#dlg').close(); renderMitFokus();
      return toast(n ? `${n} Wert${n === 1 ? '' : 'e'} übernommen – als Annahme gekennzeichnet.` : 'Nichts übernommen.');
    }
    case 'p-vorschlag-eins': { const n = pVorschlaegeUebernehmen(doc, [el.dataset.vid]); pSpeichern(); renderMitFokus(); return toast(`${n} Wert${n === 1 ? '' : 'e'} übernommen.`); }
    case 'p-vorschlaege-alle': return pVorschlaegeAlleDialog();
    case 'p-vorschlaege-alle-ok': {
      let n = 0;
      const uids = state.pVorschlagUids || [];
      for (const uid of uids) n += pVorschlaegeUebernehmen(getDoc(uid));
      state.pVorschlagUids = null; pSpeichern(); $('#dlg').close(); renderMitFokus();
      return toast(`${n} Werte für ${uids.length} Objekte übernommen – als Annahme gekennzeichnet.`);
    }
    case 'p-zurueck': {
      const z = pZurueckZiel();
      if (!z) return undefined;
      state.view = z.view;
      if (z.current) state.current = z.current;
      if (z.detailModus) state.detailModus = z.detailModus;
      render();
      return window.scrollTo(0, z.y || 0);
    }
    default: return undefined;
  }
}

/** Änderungen an Formularfeldern; true = behandelt. */
function pAenderung(t) {
  if (t.id === 'p-merken') {
    state.profile.merken = t.checked;
    if (t.checked) { lsSet(LS_PROFILE_MERKEN, '1'); pSpeichern(); toast('Profile werden in diesem Browser gemerkt.'); }
    else { lsDel(LS_PROFILE_MERKEN); lsDel(LS_PROFILE); toast('Profile werden nicht mehr im Browser gespeichert.'); }
    render();
    return true;
  }
  if (t.id === 'p-aktiv-wahl') { state.profile.aktivId = t.value; pSpeichern(); pRender(); return true; }
  if (t.dataset.pfad) { pProfilFeld(t); return true; }
  if (t.dataset.oanp) { pAnpassungFeld(t); return true; }
  if (t.dataset.os) { pOSFeld(t); return true; }
  if (t.dataset.kond) { pKonditionFeld(t); return true; }
  if (t.dataset.var) { pVarianteFeld(t); return true; }
  return false;
}

/** Während der Eingabe sind Ergebnisse veraltet – sichtbar markieren, bis die Eingabe übernommen ist. */
function pEingabeLaeuft(t) {
  if (!(t.dataset.pfad || t.dataset.oanp || t.dataset.os || t.dataset.kond || t.dataset.var)) return false;
  document.querySelectorAll('.p-ergebnis').forEach(el => el.classList.add('veraltet'));
  return true;
}

/* =====================================================================
   Ansicht: Profile
   ===================================================================== */
function viewProfile() {
  const p = aktivesProfil();
  const zurueck = pZurueckZiel();
  return `<div class="page-head"><div>${zurueck ? `<div class="crumbs no-print"><button class="linkbtn" data-action="p-zurueck">← ${esc(zurueck.text)}</button></div>` : ''}<h1${zurueck ? ' style="margin-top:6px"' : ''}>Persönliche Profile</h1><p class="sub">Haushalt, Einkommen, Steuern, Kapital und Finanzierung – nur in diesem Browser. Sicherung und Austausch über die Profil-Datei (JSON).</p></div>
      <div class="dh-actions"><button class="btn sm primary" data-action="p-neu">Neues Profil</button><button class="btn sm" data-action="pick-files">Profil oder Paket importieren</button>${location.protocol !== 'file:' ? '<button class="btn sm" data-action="p-beispiele">Fiktive Beispielprofile laden</button>' : ''}</div></div>
    ${pProfilListe()}
    ${p ? pProfilEditor(p) : `<div class="empty"><b>Noch kein Profil.</b><br>Lege ein neues Profil an oder importiere eine Profil-Datei. Es sind keine persönlichen Daten voreingestellt.</div>`}
    ${pPersistenzBox()}`;
}

function pProfilListe() {
  if (!state.profile.liste.length) return '';
  return `<div class="p-liste">${state.profile.liste.map(p => {
    const aktiv = p.id === state.profile.aktivId, meta = profilMeta(p.id);
    return `<div class="p-karte${aktiv ? ' aktiv' : ''}">
      <div class="p-karte-kopf"><b>${esc(p.bezeichnung)}</b>${aktiv ? '<span class="tag tag-good">aktiv</span>' : ''}</div>
      <div class="p-karte-sub">Revision ${esc(p.revision)} · ${esc((MODI[(p.steuer || {}).modus] || {}).kurz || 'kein Steuermodus')} · ${(p.personen || []).length} Person${(p.personen || []).length === 1 ? '' : 'en'}</div>
      <div class="p-karte-sub">${meta.geaendert ? '<span class="tag tag-warn">nicht exportierte Änderungen</span>' : meta.exportiert_rev ? `<span class="tag">exportiert (Rev. ${esc(meta.exportiert_rev)})</span>` : ''}</div>
      <div class="p-karte-aktionen">${aktiv ? '' : `<button class="btn sm" data-action="p-waehlen" data-pid="${esc(p.id)}">Auswählen</button>`}<button class="btn sm" data-action="p-export" data-pid="${esc(p.id)}">Exportieren</button><button class="btn sm" data-action="p-duplizieren" data-pid="${esc(p.id)}">Duplizieren</button><button class="btn sm ghost" data-action="p-loeschen" data-pid="${esc(p.id)}">Löschen</button></div>
    </div>`;
  }).join('')}</div>`;
}

function pPersistenzBox() {
  return `<div class="card p-persistenz"><h3>Profile im Browser merken</h3>
    <label class="check"><input type="checkbox" id="p-merken"${state.profile.merken ? ' checked' : ''}> Profile und Objektszenarien in diesem Browser speichern</label>
    <p class="fine">Standardmäßig aus. Gilt nur für diesen Browser auf diesem Gerät – keine geräteübergreifende Synchronisierung und kein Ersatz für den Datei-Export. Getrennt von den gemerkten Immobiliendateien.</p>
    <button class="btn sm" data-action="p-browser-loeschen">Im Browser gespeicherte Profile löschen</button></div>`;
}

function pProfilEditor(p) {
  const meta = profilMeta(p.id);
  const tabs = [['haushalt', 'Haushalt & Einkommen'], ['steuer', 'Steuer'], ['budget', 'Ausgaben & Budget'], ['kapital', 'Kapital & Grenzen'], ['finanzierung', 'Finanzierung']];
  const tab = tabs.some(t => t[0] === state.profilTab) ? state.profilTab : 'haushalt';
  const inhalt = { haushalt: pTabHaushalt, steuer: pTabSteuer, budget: pTabBudget, kapital: pTabKapital, finanzierung: pTabFinanzierung }[tab](p);
  return `<section class="card p-editor">
    <div class="p-editor-kopf">
      ${pf('bezeichnung', 'Profilbezeichnung', { typ: 'text', hilfe: 'Eine verständliche Bezeichnung genügt; echte Namen sind nicht nötig.' })}
      <div class="p-editor-status">${meta.geaendert ? '<span class="tag tag-warn">Nicht exportierte Änderungen</span>' : '<span class="tag tag-good">Alle Änderungen exportiert</span>'}<span class="tag">Revision ${esc(p.revision)}</span><button class="btn sm primary" data-action="p-export" data-pid="${esc(p.id)}">Profil exportieren</button></div>
    </div>
    <div class="cmp-tabs" role="tablist" aria-label="Bereiche des Profils">${tabs.map(([id, t]) => `<button class="cmp-tab${tab === id ? ' active' : ''}" role="tab" aria-selected="${tab === id}" data-action="p-tab" data-tab="${id}">${t}</button>`).join('')}</div>
    ${pUngueltigHinweis()}
    <div class="p-editor-raster"><div class="p-editor-form">${inhalt}</div><aside class="p-editor-seite p-ergebnis">${pProfilSeitenleiste(p)}</aside></div>
  </section>`;
}

function pTabHaushalt(p) {
  const zwei = (p.personen || []).length === 2;
  return `<div class="feld-raster">
      ${pf('haushalt.erwachsene', 'Erwachsene (steuerpflichtige Personen)', { typ: 'wahlzahl', optionen: [['1', '1'], ['2', '2']] })}
      ${pf('haushalt.kinder', 'Kinder bzw. Unterhaltsberechtigte', { hilfe: 'Nur informativ: Kinderfreibeträge und Günstigerprüfung sind nicht berücksichtigt.' })}
      ${pf('haushalt.familienstand', 'Familienstand', { typ: 'wahl', optionen: [['', '– bitte wählen –'], ['ledig', 'ledig'], ['verheiratet', 'verheiratet'], ['eingetragene_partnerschaft', 'eingetragene Lebenspartnerschaft'], ['geschieden', 'geschieden'], ['verwitwet', 'verwitwet']] })}
      ${pf('haushalt.veranlagung', 'Tatsächlich gewählte Veranlagung', { typ: 'wahl', optionen: zwei ? [['zusammen', 'Zusammenveranlagung (Splitting)'], ['einzeln_getrennt', 'Einzeln veranlagt (zwei Personen)']] : [['einzel', 'Einzelveranlagung']], hilfe: zwei ? 'Ein gemeinsamer Haushalt allein bedeutet keine Zusammenveranlagung.' : null })}
      ${pf('haushalt.steuerjahr', 'Steuerjahr', { typ: 'wahlzahl', optionen: Object.keys(RK.steuerregeln.TARIFE).map(j => [j, j]), hilfe: 'Lokal mitgelieferte Tarife; spätere Jahre nur über die Fortschreibungsannahme.' })}
      ${pf('haushalt.bundesland', 'Wohnsitz-Bundesland (optional)', { typ: 'text', hilfe: 'Nur Information. Die Grunderwerbsteuer richtet sich nach dem Standort der Immobilie.' })}
    </div>
    ${(p.personen || []).map((pers, i) => `<fieldset class="p-person"><legend>${esc(pers.bezeichnung || pers.id)} <span class="muted small">(${esc(pers.id)})</span></legend><div class="feld-raster">
      ${pf(`personen.${i}.bezeichnung`, 'Bezeichnung', { typ: 'text' })}
      ${pf(`personen.${i}.beschaeftigung`, 'Beschäftigung', { typ: 'wahl', optionen: [['', '– bitte wählen –'], ['angestellt', 'angestellt'], ['verbeamtet', 'verbeamtet'], ['selbststaendig', 'selbstständig'], ['ohne', 'ohne Erwerbseinkommen'], ['sonstige', 'sonstige']] })}
      ${pf(`personen.${i}.monatsnetto_eur`, 'Tatsächliches Monatsnetto', { einheit: '€', hilfe: 'Für die Haushaltsrechnung: regelmäßig auf dem Konto, nach allen Abzügen.' })}
      ${pers.beschaeftigung === 'selbststaendig'
        ? pf(`personen.${i}.gewinn_selbststaendig_eur`, 'Steuerlicher Jahresgewinn', { einheit: '€', hilfe: 'Gewinn, nicht Umsatz. Nur für die Brutto-Schätzung (Modus C).' })
        : pf(`personen.${i}.jahresbrutto_eur`, 'Jahresbrutto', { einheit: '€', hilfe: 'Nur für die Brutto-Schätzung (Modus C).' })}
      ${pers.beschaeftigung === 'selbststaendig' ? '' : pf(`personen.${i}.sonderzahlungen_eur`, 'Sonderzahlungen pro Jahr', { einheit: '€', hilfe: 'Nur, falls nicht schon im Jahresbrutto enthalten.' })}
      ${pf(`personen.${i}.weitere_einkuenfte_eur`, 'Weitere steuerpflichtige Einkünfte pro Jahr', { einheit: '€', hilfe: 'z. B. bestehende Vermietung; Verluste negativ. Nur Modus C.' })}
    </div></fieldset>`).join('')}`;
}

function pTabSteuer(p) {
  const modus = (p.steuer || {}).modus;
  const ver = (p.haushalt || {}).veranlagung;
  const karten = Object.entries(MODI).map(([id, m]) => `<label class="modus-karte${modus === id ? ' aktiv' : ''}"><input type="radio" name="p-modus" value="${id}" data-pfad="steuer.modus" data-ptyp="radio" data-fkey="p:steuer.modus:${id}"${modus === id ? ' checked' : ''}><span><b>${esc(m.titel)}</b><span class="feld-hilfe">${esc(m.text)}</span></span></label>`).join('');
  let details = '';
  if (modus === 'manuell') {
    const saetze = p.steuer.manuelle_saetze_prozent || [];
    details = `<p class="fine">Trage deinen persönlichen Grenzsteuersatz ein (es gibt keine Voreinstellung). Weitere Sätze werden nebeneinander gerechnet; der erste bestimmt die Hauptkennzahlen. Ein geleertes Feld entfernt den Satz.</p><div class="feld-raster">${saetze.map((s, i) => `<div class="feld-mit-aktion">${pf(`steuer.manuelle_saetze_prozent.${i}`, `Grenzsteuersatz ${i + 1}${i === 0 ? ' (Hauptwert)' : ''}`, { einheit: '%' })}<button class="icon-btn" data-action="p-satz-weg" data-i="${i}" aria-label="Satz ${i + 1} entfernen">×</button></div>`).join('')}
      ${saetze.length < 5 ? pf(`steuer.manuelle_saetze_prozent.${saetze.length}`, saetze.length ? `Weiterer Vergleichssatz (optional)` : 'Grenzsteuersatz', { einheit: '%', platzhalter: 'z. B. 35' }) : ''}</div>`;
  } else if (modus === 'zve') {
    details = `<p class="fine">Trage das zu versteuernde Einkommen <b>ohne</b> diese neue Wohnung ein. Bereits vorhandene Vermietungsergebnisse gehören hinein, die betrachtete Wohnung nicht – sonst würde sie doppelt gezählt.</p>
      <div class="feld-raster">${ver === 'einzeln_getrennt' ? (p.personen || []).map(pers => pf(`steuer.zve_personen_eur.${pers.id}`, `zvE ${pers.bezeichnung || pers.id}`, { einheit: '€' })).join('') : pf('steuer.zve_ohne_investition_eur', ver === 'zusammen' ? 'Gemeinsames zvE (Zusammenveranlagung)' : 'zvE', { einheit: '€' })}</div>`;
  } else if (modus === 'brutto_schaetzung') {
    details = `<p class="fine">Leere Werbungskosten bedeuten den gesetzlichen Arbeitnehmer-Pauschbetrag (1.230 €), leere Sonderausgaben den Pauschbetrag (36 € bzw. 72 €). Vorsorgeaufwendungen müssen eingetragen werden – es gibt keinen pauschalen Abschlag.</p>
      ${(p.personen || []).map(pers => `<fieldset class="p-person"><legend>${esc(pers.bezeichnung || pers.id)}</legend><div class="feld-raster">
        ${pers.beschaeftigung === 'selbststaendig' ? '' : pf(`steuer.schaetzung.werbungskosten_eur.${pers.id}`, 'Werbungskosten pro Jahr', { einheit: '€', platzhalter: 'Pauschbetrag 1.230 €' })}
        ${pf(`steuer.schaetzung.vorsorgeaufwendungen_eur.${pers.id}`, 'Abzugsfähige Vorsorgeaufwendungen pro Jahr', { einheit: '€', hilfe: 'Renten-, Kranken-, Pflegeversicherung u. a., soweit abzugsfähig. 0 ist zulässig.' })}
      </div></fieldset>`).join('')}
      <div class="feld-raster">${pf('steuer.schaetzung.sonderausgaben_eur', 'Sonderausgaben pro Jahr (gesamt)', { einheit: '€', platzhalter: 'Pauschbetrag' })}${pf('steuer.schaetzung.weitere_abzuege_eur', 'Weitere Abzüge pro Jahr', { einheit: '€', hilfe: 'z. B. außergewöhnliche Belastungen; leer = keine.' })}</div>`;
  }
  return `<div class="modus-karten" role="radiogroup" aria-label="Steuermodus">${karten}</div>${details}
    <div class="feld-raster">${pf('steuer.fortschreibung_tarif', 'Tarif 2026 für spätere Steuerjahre fortschreiben (Annahme)', { typ: 'bool', hilfe: 'Ohne Fortschreibung wird für Jahre ohne hinterlegten Tarif keine Steuerwirkung gerechnet.' })}</div>
    <div class="callout"><b>Nicht berücksichtigt</b><ul>${RK.steuer.NICHT_BERUECKSICHTIGT.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

function pTabBudget(p) {
  const ein = (p.budget || {}).weitere_einnahmen || [];
  return `<h3 class="p-zwischentitel">Weitere Einnahmen</h3>
    ${ein.map((e, i) => `<div class="feld-raster p-zeile">
      ${pf(`budget.weitere_einnahmen.${i}.bezeichnung`, 'Bezeichnung', { typ: 'text' })}
      ${pf(`budget.weitere_einnahmen.${i}.betrag_monat_eur`, 'Betrag pro Monat', { einheit: '€' })}
      ${pf(`budget.weitere_einnahmen.${i}.im_netto_enthalten`, 'Schon im Monatsnetto enthalten?', { typ: 'wahl', wert: e.im_netto_enthalten === true ? '__true' : e.im_netto_enthalten === false ? '__false' : '', optionen: [['', '– bitte wählen –'], ['__true', 'ja, schon im Netto'], ['__false', 'nein, zusätzlich']] })}
      <div class="feld"><label>&nbsp;</label><button class="btn sm ghost" data-action="p-einnahme-weg" data-i="${i}">Entfernen</button></div>
    </div>`).join('')}
    <button class="btn sm" data-action="p-einnahme-neu">Einnahme hinzufügen (z. B. Kindergeld)</button>
    <h3 class="p-zwischentitel">Monatliche Ausgaben und Verpflichtungen</h3>
    <p class="fine">Nur Beträge eintragen, die nicht schon vom Netto abgezogen sind. Miete und Rate der betrachteten Wohnung gehören nicht hierher – sie kommen aus der Objektrechnung. Leere Felder machen den Haushalt unvollständig.</p>
    <div class="feld-raster">${RK.haushalt.AUSGABEN.map(([feld, text]) => pf(`budget.${feld}`, text, { einheit: '€' })).join('')}</div>`;
}

function pTabKapital() {
  return `<div class="feld-raster">
      ${pf('kapital.eigenkapital_einsetzbar_eur', 'Für den Erwerb einsetzbares Eigenkapital', { einheit: '€', hilfe: '0 € ist eine gültige Angabe.' })}
      ${pf('kapital.notfallreserve_eur', 'Notfallreserve, die erhalten bleibt', { einheit: '€', hilfe: 'Wird nie als Eigenkapital eingesetzt.' })}
      ${pf('kapital.max_zuzahlung_monat_eur', 'Maximal gewünschte monatliche Zuzahlung', { einheit: '€', hilfe: 'Deine persönliche Grenze – keine Voreinstellung.' })}
      ${pf('kapital.grenze_bezug', 'Grenze gilt', { typ: 'wahl', optionen: [['vor_steuer', 'vor Steuer'], ['nach_steuer', 'nach Steuer (Monatsdurchschnitt)'], ['beide', 'vor und nach Steuer']] })}
      ${pf('kapital.vorsorge_monat_eur', 'Eigene zusätzliche Vorsorge pro Monat', { einheit: '€', hilfe: 'Rücklage für Reparaturen auf eigenem Konto; kein steuerlicher Abzug.' })}
      ${pf('kapital.vorsorge_in_grenze', 'Eigene Vorsorge in die Zuzahlung einrechnen', { typ: 'bool' })}
      ${pf('kapital.betrachtung_jahre', 'Betrachtungsdauer', { einheit: 'Jahre', hilfe: '1 bis 30 Jahre; mindestens bis Ende der Zinsbindung.' })}
      ${pf('kapital.mietabschlag_prozent', 'Sicherheitsabschlag auf Mieten für den Finanzierungsrahmen', { einheit: '%' })}
    </div>`;
}

function pTabFinanzierung(p) {
  const kond = (p.finanzierung || {}).konditionen || [];
  return `<div class="feld-raster">
      ${pf('finanzierung.notar_grundbuch_prozent', 'Annahme Notar und Grundbuch', { einheit: '%', hilfe: 'Vom Kaufpreis. Ein in der Analyse belegter Betrag geht vor.' })}
      ${pf('finanzierung.standard_kondition_id', 'Standardkondition', { typ: 'wahl', optionen: [['', '– keine –']].concat(kond.map(k => [k.id, k.bezeichnung || k.id])) })}
    </div>
    <h3 class="p-zwischentitel">Allgemeine Konditionen</h3>
    <p class="fine">Ausgangswerte für alle Objekte. Ein konkretes Objektangebot ersetzt sie in der Objektrechnung. Sollzins ist nicht der Effektivzins.</p>
    ${kond.map(k => pKonditionEditor(k, 'profil')).join('') || '<div class="empty">Noch keine Kondition. Ohne Kondition lässt sich ein Darlehen nicht rechnen.</div>'}
    <button class="btn sm" data-action="p-kond-neu" data-quelle="profil">Kondition hinzufügen</button>`;
}

function pKonditionEditor(k, quelle) {
  const fehler = RK.darlehen.pruefeKondition(k);
  const kf = (feld, label, o = {}) => {
    const key = `k:${quelle}:${k.id}:${feld}`;
    const wert = feld.startsWith('anschluss.') ? (k.anschluss ? k.anschluss[feld.slice(10)] : null) : k[feld];
    return pFeldHtml({ key, label, wert, vorhanden: true, fehler: state.feldFehler[key] || null, attrs: `data-kond="${esc(quelle)}:${esc(k.id)}:${esc(feld)}" data-ktyp="${o.typ || 'zahl'}" data-einheit="${esc(o.einheit || '')}"`, ...o, hilfe: fehler[feld] || o.hilfe });
  };
  return `<details class="item p-kondition" open><summary class="item-head"><span class="id">${esc(k.id)}</span><span class="title">${esc(k.bezeichnung || 'Kondition')}</span><span class="tag ${k.art === 'angebot' ? 'tag-good' : ''}">${k.art === 'angebot' ? 'konkretes Angebot' : 'Modellannahme'}</span>${Object.keys(fehler).length ? `<span class="tag tag-warn">${Object.keys(fehler).length} Angabe${Object.keys(fehler).length === 1 ? '' : 'n'} fehlen</span>` : ''}</summary>
    <div class="feld-raster">
      ${kf('bezeichnung', 'Bezeichnung', { typ: 'text' })}
      ${kf('art', 'Art', { typ: 'wahl', optionen: [['annahme', 'Modellannahme'], ['angebot', 'Konkretes Angebot']] })}
      ${kf('sollzins_prozent', 'Sollzins (nominal)', { einheit: '% p. a.' })}
      ${kf('effektivzins_prozent', 'Effektivzins (nur Info)', { einheit: '% p. a.' })}
      ${kf('tilgung_prozent', 'Anfängliche Tilgung', { einheit: '%', hilfe: 'oder feste Monatsrate' })}
      ${kf('monatsrate_eur', 'Feste Monatsrate (statt Tilgung)', { einheit: '€' })}
      ${kf('zinsbindung_jahre', 'Zinsbindung', { einheit: 'Jahre' })}
      ${kf('beginn', 'Beginn (erste Rate)', { typ: 'monat', platzhalter: 'JJJJ-MM' })}
      ${kf('darlehensbetrag_eur', 'Darlehensbetrag', { einheit: '€', platzhalter: 'berechneter Bedarf' })}
      ${kf('sondertilgung_jahr_eur', 'Sondertilgung pro Jahr', { einheit: '€' })}
      ${kf('gebuehren_eur', 'Einmalige Gebühren', { einheit: '€' })}
      ${pFeldHtml({ key: `k:${quelle}:${k.id}:anschluss.aktiv`, label: 'Anschlussfinanzierung', wert: k.anschluss ? 'ja' : 'nein', optionen: [['nein', 'keine Annahme (Modell endet mit Zinsbindung)'], ['ja', 'Anschlusszins annehmen']], typ: 'wahl', attrs: `data-kond="${esc(quelle)}:${esc(k.id)}:anschluss.aktiv" data-ktyp="wahl"` })}
      ${k.anschluss ? kf('anschluss.sollzins_prozent', 'Anschlusszins', { einheit: '% p. a.' }) + kf('anschluss.regel', 'Neue Rate', { typ: 'wahl', optionen: [['rate_beibehalten', 'bisherige Rate beibehalten'], ['neue_tilgung', 'neue Tilgung auf Restschuld']] }) + (k.anschluss.regel === 'neue_tilgung' ? kf('anschluss.tilgung_prozent', 'Neue Tilgung', { einheit: '%' }) : '') : ''}
    </div>
    <button class="btn sm ghost" data-action="p-kond-weg" data-quelle="${esc(quelle)}" data-kid="${esc(k.id)}">Kondition entfernen</button>
  </details>`;
}

function pProfilSeitenleiste(p) {
  const h = RK.haushalt.haushaltsrechnung(p);
  const zeile = (t, v, cls = '') => `<div class="p-zeile-kv ${cls}"><span>${esc(t)}</span><span>${v}</span></div>`;
  let steuer = '';
  const modus = (p.steuer || {}).modus, ver = (p.haushalt || {}).veranlagung;
  const regel = RK.steuer.regelFuer((p.haushalt || {}).steuerjahr || 2026).regel;
  const tarifInfo = zve => {
    if (!regel || !pIstZahl(zve)) return '';
    const v = ver === 'zusammen' ? 'zusammen' : 'einzel';
    return zeile('Einkommensteuer (tariflich)', pEur(RK.steuer.einkommensteuer(zve, v, regel))) + zeile('Durchschnittssteuersatz', pProz(RK.steuer.durchschnittssteuersatz(zve, v, regel))) + zeile('Grenzsteuersatz (ca.)', pProz(RK.steuer.grenzsteuersatz(zve, v, regel)));
  };
  if (modus === 'manuell') steuer = zeile('Modell-Sätze', esc((p.steuer.manuelle_saetze_prozent || []).map(s => fmtNum(s, 'pct')).join(' · ') || '–'));
  else if (modus === 'zve') {
    if (ver === 'einzeln_getrennt') steuer = (p.personen || []).map(pers => { const z = pGet(p, `steuer.zve_personen_eur.${pers.id}`); return zeile(`zvE ${pers.bezeichnung || pers.id}`, pEur(z)) + (pIstZahl(z) && regel ? zeile(`ESt ${pers.bezeichnung || pers.id}`, pEur(RK.steuer.einkommensteuer(z, 'einzel', regel))) : ''); }).join('');
    else steuer = zeile('zvE ohne Investition', pEur(p.steuer.zve_ohne_investition_eur)) + tarifInfo(p.steuer.zve_ohne_investition_eur);
  } else if (modus === 'brutto_schaetzung') {
    const s = RK.steuer.schaetzeZve(p, (p.haushalt || {}).steuerjahr || 2026);
    steuer = `${s.ueberleitung.map(u => `<div class="p-zwischen">${esc(u.bezeichnung)}</div>${u.zeilen.map(z => zeile(z.posten, pEur(z.betrag), z.herkunft === 'gesetzlicher_standard' ? 'standard' : '')).join('')}`).join('')}
      ${s.gemeinsam.map(z => zeile(z.posten, pEur(z.betrag), z.herkunft === 'gesetzlicher_standard' ? 'standard' : '')).join('')}
      ${typeof s.zve === 'number' ? zeile('Geschätztes zvE', `<b>${pEur(s.zve)}</b>`) + (s.vollstaendig ? tarifInfo(s.zve) : '') : Object.entries(s.zve).map(([id, z]) => zeile(`Geschätztes zvE ${id}`, `<b>${pEur(z)}</b>`)).join('')}
      ${s.luecken.length ? `<div class="p-luecken">${s.luecken.map(l => `<div>⚠ ${esc(l.text)}</div>`).join('')}</div>` : ''}`;
  }
  return `<div class="p-seite-block"><div class="eyebrow">Haushaltsrechnung</div>
      ${h.einnahmen.map(e => zeile(e.posten, pEur(e.betrag))).join('')}${h.ausgaben.map(a => zeile(a.posten, '− ' + pEur(a.betrag))).join('')}
      ${zeile('Überschuss vor Investition', h.vollstaendig ? `<b>${pEur(h.ueberschuss)}</b>` : '<span class="tag tag-warn">unvollständig</span>', 'summe')}
      ${h.fehlend.length ? `<div class="p-luecken">Fehlt: ${h.fehlend.map(f => esc(f.text)).join(', ')}</div>` : ''}</div>
    <div class="p-seite-block"><div class="eyebrow">Steuer · ${esc((MODI[modus] || {}).kurz || 'kein Modus')}</div>${steuer || '<span class="muted small">Modus wählen.</span>'}</div>
    ${pProfilLuecken(p, true)}`;
}

/* =====================================================================
   Ansicht: Berechnung mit deinem Profil (Einzelobjekt)
   ===================================================================== */
function pModusSchalter() {
  const m = state.detailModus === 'persoenlich' ? 'persoenlich' : 'analyse';
  return `<div class="modus-schalter no-print" role="tablist" aria-label="Ansicht"><button role="tab" aria-selected="${m === 'analyse'}" class="${m === 'analyse' ? 'aktiv' : ''}" data-action="detail-modus" data-modus="analyse">Importierte Analyse</button><button role="tab" aria-selected="${m === 'persoenlich'}" class="${m === 'persoenlich' ? 'aktiv' : ''}" data-action="detail-modus" data-modus="persoenlich">Berechnung mit deinem Profil</button></div>`;
}

function pKeinProfil() {
  return `<div class="card p-kein-profil"><h3>Für die persönliche Berechnung fehlt ein Profil</h3><p class="card-sub">Ein Profil enthält Haushalt, Einkommen, Steuermodus, Eigenkapital und Konditionen. Alles bleibt in diesem Browser.</p>
    <div class="btn-row" style="justify-content:flex-start"><button class="btn primary" data-action="p-neu">Neues Profil anlegen</button><button class="btn" data-action="pick-files">Profil-Datei importieren</button>${location.protocol !== 'file:' ? '<button class="btn" data-action="p-beispiele">Fiktive Beispielprofile laden</button>' : ''}</div></div>`;
}

function viewPersoenlich(doc) {
  const p = aktivesProfil();
  if (!p) return pKeinProfil();
  if (!doc.key) return '<div class="empty"><b>Dieses Objekt hat keine Kennung (Plattform-ID).</b><br>Eine persönliche Rechnung braucht eine eindeutige Objektkennung.</div>';
  const os = pOS(doc);
  const eingang = { immobilie: doc.data, profil: p, objektszenario: os };
  const r = RK.szenario.berechne(eingang);
  if (!r.anwendbar) return pBanner(p, r, os) + `<div class="callout warn">${r.hinweise.map(h => esc(h)).join('<br>')}</div>`;
  return pBanner(p, r, os) + pUngueltigHinweis() + pKennzahlen(r, p) + pOffeneAngaben(r, doc) + pEingaben(doc, r, os, p) + pKonditionen(doc, eingang, r, os) + pHaushalt(r, p) + pSteuer(r, p) + pVerlauf(r) + pSzenarien(doc, eingang, r, os, p) + pAnnahmen(r) + pExportBereich();
}

/** Solange eine Eingabe ungültig ist, rechnet alles mit dem letzten gültigen Wert – das muss sichtbar sein. */
function pUngueltigHinweis() {
  const n = Object.keys(state.feldFehler).length;
  return n ? `<div class="callout warn p-ungueltig" role="status"><b>${n} Eingabe${n === 1 ? '' : 'n'} ungültig.</b> Die Ergebnisse beruhen bis zur Korrektur auf dem letzten gültigen Wert des betroffenen Feldes.</div>` : '';
}

function pBanner(p, r, os) {
  const meta = profilMeta(p.id);
  const k = r.kondition;
  const kond = RK.szenario.alleKonditionen(p, os);
  const status = Object.entries({ finanzierung: 'Finanzierung', cashflow: 'Cashflow', steuer: 'Steuer', haushalt: 'Haushalt' }).map(([key, t]) => { const s = r.status[key]; return `<span class="tag ${s === 'vollstaendig' ? 'tag-good' : s === 'eingeschraenkt' ? 'tag-warn' : 'tag-crit'}">${t}: ${s === 'vollstaendig' ? 'vollständig' : s === 'eingeschraenkt' ? 'eingeschränkt' : 'unvollständig'}</span>`; }).join('');
  return `<div class="card p-banner">
    <div class="eyebrow">Berechnung mit deinem Profil</div>
    <div class="p-banner-zeile">
      <label class="p-inline">Profil <select id="p-aktiv-wahl" data-fkey="p-aktiv-wahl">${state.profile.liste.map(x => `<option value="${esc(x.id)}"${x.id === p.id ? ' selected' : ''}>${esc(x.bezeichnung)}</option>`).join('')}</select></label>
      ${meta.geaendert ? '<span class="tag tag-warn">Profil nicht exportiert</span>' : ''}
      <span class="meta"><span class="muted">Steuermodus</span>${esc((MODI[(p.steuer || {}).modus] || {}).kurz || 'keiner')}</span>
      <label class="p-inline">Konditionssatz <select data-os="aktive_kondition_id" data-ostyp="wahl" data-fkey="os:aktive_kondition_id">${kond.length ? kond.map(x => `<option value="${esc(x.id)}"${k && x.id === k.id ? ' selected' : ''}>${esc(x.bezeichnung || x.id)} (${x.art === 'angebot' ? 'Angebot' : 'Annahme'}, ${x.quelle === 'objekt' ? 'Objekt' : 'Profil'})</option>`).join('') : '<option value="">keine Kondition</option>'}</select></label>
      <button class="btn sm" data-action="profile">Profil bearbeiten</button>
    </div>
    <div class="meta-chips">${status}</div>
    <p class="fine" style="margin:8px 0 0">Die importierte Analyse, ihre Belege und Urteile bleiben unverändert. Diese Rechnung nutzt dein aktives Profil und die Anpassungen unten; die Budget-Einordnung sagt nichts über Objektqualität, Zustand, Rechtsrisiken oder Preisangemessenheit.</p>
  </div>`;
}

function pKennzahlen(r) {
  const k = r.kpi || {};
  const kachel = (label, wert, fuss) => `<div class="tile"><div class="tile-label">${esc(label)}</div><div class="tile-value">${wert}</div><div class="tile-foot">${fuss || ''}</div></div>`;
  const fehlt = '<span class="null">—</span>';
  const finOk = r.status.finanzierung === 'vollstaendig', cfOk = r.status.cashflow === 'vollstaendig';
  const e = r.einordnung;
  const [icon, cls, text] = e ? EINORDNUNG[e.gesamt] : EINORDNUNG.nicht_beurteilbar;
  return `<section class="sec p-ergebnis" id="p-kennzahlen" style="margin-top:16px">
    <div class="tiles">
      ${kachel('Darlehen', finOk ? pEur(k.darlehen ?? r.kapital.darlehen) : fehlt, finOk ? `Kapitalbedarf ${pEur(r.kapital.kapitalbedarf)}` : '<span class="muted">Finanzierung unvollständig</span>')}
      ${kachel('Monatsrate', finOk && r.plan ? pEur(r.plan.rate) : fehlt, r.plan && r.plan.rate_anschluss ? `Anschluss ${pEur(r.plan.rate_anschluss)}` : r.kondition ? esc(r.kondition.bezeichnung || r.kondition.id) : '')}
      ${kachel('Zuzahlung vor Steuer', cfOk ? pZuzahlung(k.zuzahlung_vor_steuer_monat) : fehlt, cfOk ? `pro Monat, ${esc(k.bezugsjahr)}` : '<span class="muted">Cashflow unvollständig</span>')}
      ${kachel('Zuzahlung nach Steuer', cfOk && pIstZahl(k.zuzahlung_nach_steuer_monat) ? pZuzahlung(k.zuzahlung_nach_steuer_monat) : fehlt, cfOk ? (pIstZahl(k.steuerwirkung_monat_durchschnitt) ? `Ø Monat, Steuerwirkung ${pEur(k.steuerwirkung_monat_durchschnitt)} (modelliert)` : '<span class="muted">Steuer unvollständig</span>') : '')}
      ${kachel('Enthaltene Vorsorge', cfOk ? (k.vorsorge_enthalten ? pEur(k.vorsorge_monat) : 'nicht enthalten') : fehlt, cfOk ? (k.vorsorge_enthalten ? 'in beiden Zuzahlungen enthalten' : `${pEur(k.vorsorge_monat)} separat`) : '')}
      ${kachel('Verbleibendes Haushaltsbudget', cfOk && pIstZahl(k.verbleibendes_haushaltsbudget) ? `<span class="${k.verbleibendes_haushaltsbudget < 0 ? 'neg' : ''}">${pEur(k.verbleibendes_haushaltsbudget)}</span>` : fehlt, !r.haushalt.vollstaendig ? '<span class="muted">Haushalt unvollständig</span>' : cfOk ? 'pro Monat nach Zuzahlung vor Steuer' : '')}
      ${kachel('Restschuld Ende Zinsbindung', cfOk && r.plan ? pEur(r.plan.restschuld_ende_bindung) : fehlt, r.plan && r.plan.zinsbindung_monate ? `nach ${r.plan.zinsbindung_monate / 12} Jahren` : '')}
    </div>
    ${cfOk ? `<div class="card p-einordnung ${cls}"><div class="verdict ${cls}"><span class="vi" aria-hidden="true">${icon}</span><span>${esc(text)}</span></div>
      <div class="meta-chips">${e ? `<span class="tag">Wunschgrenze: ${esc({ innerhalb: 'eingehalten', oberhalb: 'überschritten', nicht_beurteilbar: 'nicht beurteilbar' }[e.wunschgrenze])}</span><span class="tag">Tragbarkeit: ${esc({ tragbar: 'tragbar', nicht_tragbar: 'nicht tragbar', ungeklaert: 'ungeklärt' }[e.tragbarkeit])}</span>` : ''}${k.kumuliert_nach_steuer !== undefined ? `<span class="tag">kumuliert ${esc(k.modelliert_von_jahr)}–${esc(k.modelliert_bis_jahr)}: ${pZuzahlung(k.kumuliert_vor_steuer)} vor, ${pIstZahl(k.kumuliert_nach_steuer) ? pZuzahlung(k.kumuliert_nach_steuer) : '—'} nach Steuer</span>` : ''}</div>
      ${e && e.gruende.length ? `<ul class="small">${e.gruende.map(g => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}</div>` : ''}
  </section>`;
}

function pOffeneAngaben(r, doc) {
  const gruppe = liste => {
    const nachKomp = {};
    for (const o of liste) (nachKomp[o.komponente] = nachKomp[o.komponente] || []).push(o);
    return Object.entries(nachKomp).map(([komp, l]) => `<div class="p-offen-gruppe"><span class="tag">${esc(KOMPONENTE_NAME[komp] || komp)}</span> ${l.map(o => `<span class="p-offen-punkt">${esc(o.label)}${o.grund && o.grund !== 'unbekannt' && o.grund !== 'fehlt' ? ` <span class="muted">(${esc(o.grund)})</span>` : ''}</span>`).join(' · ')}</div>`).join('');
  };
  const imProfil = r.offen.filter(o => o.ebene === 'profil'), imObjekt = r.offen.filter(o => o.ebene !== 'profil');
  // Für das Profil die vollständige Liste: Konditionsfehler zeigen sich in der Rechnung erst, wenn der Kapitalbedarf feststeht
  const profilListe = pProfilLuecken(aktivesProfil(), 'inline') || (imProfil.length ? gruppe(imProfil) : '');
  const n = (r.vorschlaege || []).length;
  if (!profilListe && !imObjekt.length) return '';
  return `<div class="callout warn p-offen"><b>Offene Angaben – betroffene Teilrechnungen zeigen keine Zahlen</b>
    ${profilListe ? `<div class="p-offen-ebene"><div class="eyebrow">Im Profil – ein Klick öffnet den Bereich</div>${profilListe}</div>` : ''}
    ${imObjekt.length ? `<div class="p-offen-ebene"><div class="eyebrow">Für dieses Objekt</div>${gruppe(imObjekt)}${n ? `<button class="btn sm primary" data-action="p-vorschlaege" data-uid="${esc(doc.uid)}">${n} Vorschl${n === 1 ? 'ag' : 'äge'} aus der Analyse prüfen und übernehmen</button>` : ''}<p class="fine" style="margin:6px 0 0">Oder einzeln unten in „Eingaben und Herkunft“ als Anpassung setzen.</p></div>` : ''}
  </div>`;
}

function pHerkunftChip(e) {
  const h = e.herkunft;
  if (h === 'anpassung' && e.anpassung_quelle) return `<span class="herk herk-${e.anpassung_quelle === 'analyse' ? 'analyse' : 'modell'}"><i></i>${e.anpassung_quelle === 'analyse' ? 'Annahme der Analyse' : 'Modellannahme'}${e.annahme_id ? ' · ' + esc(e.annahme_id) : ''}</span>`;
  const beleg = h === 'objekt' && e.status ? ` · ${BELEG[e.status] || e.status}` : h === 'profil' && e.status === 'unbekannt' ? ' · unbekannt' : '';
  const cls = e.wert === null && !pIstZahl(e.betrag_eur) ? 'herk-offen' : `herk-${h}`;
  return `<span class="herk ${cls}"><i></i>${esc(HERKUNFT[h] || h)}${esc(beleg)}</span>`;
}

function pEingaben(doc, r, os, p) {
  const gruppen = [['erwerb', 'Erwerb und Kapital'], ['miete', 'Miete und laufende Kosten'], ['steuer', 'Steuer und AfA']];
  const anp = os.anpassungen || {};
  const zeile = e => {
    const fkey = 'o:' + e.key;
    const fehler = state.feldFehler[fkey];
    const einheit = e.einheit === 'prozent' ? '%' : e.einheit === 'jahr' ? '' : '€';
    const wirksam = pIstZahl(e.betrag_eur) && e.wert === null ? pEur(e.betrag_eur) : pWert(e.wert, e.einheit);
    const ausgang = e.herkunft !== 'anpassung' ? '' : e.anpassung_quelle && e.begruendung ? e.begruendung.replace(/^Annahme der Analyse( \([^)]*\))?: ?/, '').slice(0, 140) : pIstZahl(e.objekt_wert) ? `Analyse: ${pWert(e.objekt_wert, e.einheit)}` : pIstZahl(e.profil_wert) ? `Profil: ${pWert(e.profil_wert, e.einheit)}` : 'ohne Ausgangswert';
    const vorschlag = e.wert === null && !pIstZahl(e.betrag_eur) ? (r.vorschlaege || []).find(v => e.key in v.setzt) : null;
    const widerspruch = e.widerspruch ? `<div class="feld-hilfe">Analyse widersprüchlich (${esc(e.widerspruch.id)}): ${e.widerspruch.varianten.map(v => esc(String(v.wert))).join(' / ')}</div>` : '';
    const anzeige = fehler && state.feldRoh[fkey] !== undefined ? state.feldRoh[fkey] : anp[e.key] ? pAnzeige(anp[e.key].wert, einheit) : '';
    return `<tr>
      <td>${esc(e.label)}${e.hinweis && e.herkunft === 'objekt' ? `<div class="feld-hilfe">${esc(e.hinweis)}</div>` : ''}${widerspruch}</td>
      <td class="num ${e.wert === null && !pIstZahl(e.betrag_eur) ? 'null' : ''}">${wirksam}</td>
      <td>${pHerkunftChip(e)}${ausgang ? `<div class="feld-hilfe">${esc(ausgang)}</div>` : ''}</td>
      <td class="p-anp"><div class="inp-wrap"><input type="text" inputmode="decimal" class="mit-einheit${fehler ? ' fehlerhaft' : ''}" data-oanp="${esc(e.key)}" data-einheit="${einheit}" data-fkey="${esc(fkey)}" value="${esc(anzeige)}" placeholder="${e.wert === null ? 'Wert setzen' : 'anpassen'}" aria-label="${esc(e.label)} anpassen"${fehler ? ' aria-invalid="true"' : ''}>${einheit ? `<span class="inp-einheit">${einheit}</span>` : ''}</div>${fehler ? `<div class="feld-fehler" role="alert">${esc(fehler)}</div>` : ''}
        ${vorschlag ? `<button class="linkbtn p-vorschlag-eins" data-action="p-vorschlag-eins" data-vid="${esc(vorschlag.id)}" data-tip="${esc(vorschlag.begruendung + (vorschlag.hinweise.length ? '\n' + vorschlag.hinweise.join('\n') : ''))}">${vorschlag.quelle === 'analyse' ? 'Annahme der Analyse' : 'Modellannahme'} übernehmen: ${esc(pWert(vorschlag.setzt[e.key], e.einheit))}</button>` : ''}
        ${anp[e.key] ? `<input type="text" class="p-begr" data-oanp="${esc(e.key)}" data-begr="" data-fkey="ob:${esc(e.key)}" value="${esc(anp[e.key].begruendung || '')}" placeholder="Begründung der Annahme" aria-label="Begründung">` : ''}</td>
      <td>${anp[e.key] ? `<button class="linkbtn" data-action="p-anp-reset" data-feld="${esc(e.key)}">${pIstZahl(e.objekt_wert) ? 'Analysewert wiederherstellen' : pIstZahl(e.profil_wert) ? 'Profilwert wiederherstellen' : 'Anpassung entfernen'}</button>` : ''}</td>
    </tr>`;
  };
  const e = r.eingaben;
  const schnell = [];
  const hg = doc.data && doc.data.ist_kosten_und_ertraege ? doc.data.ist_kosten_und_ertraege.hausgeld_monat_eur : null;
  if (pIstZahl(hg) && pIstZahl(e.umlagefaehig_monat_eur.wert) && pIstZahl(e.ruecklage_monat_eur.wert) && e.nicht_umlagefaehig_monat_eur.wert === null) {
    const rest = Math.round((hg - e.umlagefaehig_monat_eur.wert - e.ruecklage_monat_eur.wert) * 100) / 100;
    if (rest >= 0) schnell.push(`<button class="btn sm" data-action="p-nicht-umlage" data-wert="${rest}">Nicht umlagefähig = Hausgeld − umlagefähig − Rücklage (${pEur(rest)})</button>`);
  }
  const zwei = (p.personen || []).length === 2;
  const eig = os.eigentum || {};
  const osf = (pfad, label, o = {}) => { const key = 'os:' + pfad; return pFeldHtml({ key, label, wert: pGet(os, pfad), vorhanden: pHat(os, pfad), fehler: state.feldFehler[key], attrs: `data-os="${esc(pfad)}" data-ostyp="${o.typ || 'zahl'}" data-einheit="${esc(o.einheit || '')}"`, ...o }); };
  return `<section class="sec" id="p-eingaben"><h2>Eingaben und Herkunft</h2>
    <p class="card-sub">Priorität: Anpassung für dieses Objekt &gt; belegter Analysewert &gt; Profilwert &gt; Standardannahme. Ein leeres Anpassungsfeld nutzt wieder den Ausgangswert.</p>
    ${gruppen.map(([g, t]) => `<div class="card flush" style="margin-top:12px"><div class="card-pad"><h3>${t}</h3></div><div class="table-wrap"><table class="t p-tabelle"><thead><tr><th>Angabe</th><th class="num">Wirksamer Wert</th><th>Herkunft</th><th>Anpassung für dieses Objekt</th><th></th></tr></thead><tbody>${Object.values(e).filter(x => x.gruppe === g).map(zeile).join('')}</tbody></table></div></div>`).join('')}
    ${schnell.length ? `<div class="btn-row p-schnell" style="justify-content:flex-start">${schnell.join('')}</div>` : ''}
    <div class="card" style="margin-top:12px"><h3>Szenario-Einstellungen</h3>
      <div class="feld-raster">
        ${osf('afa_beginn', 'AfA-Beginn (Übergang Besitz, Nutzen, Lasten)', { typ: 'monat', platzhalter: r.kondition && r.kondition.beginn ? `wie Finanzierung (${r.kondition.beginn})` : 'JJJJ-MM' })}
        ${osf('massnahmen_kategorie', 'Anfängliche Maßnahmen steuerlich', { typ: 'wahl', optionen: [['erhaltung', 'Erhaltungsaufwand (15-%-Prüfung)'], ['herstellung', 'Herstellungskosten (AfA)']] })}
        ${osf('afa_abweichend.satz_prozent', 'Abweichender AfA-Satz (optional)', { einheit: '%', hilfe: 'Nur mit Begründung und Nachweis, z. B. kürzere Nutzungsdauer.' })}
        ${pIstZahl(pGet(os, 'afa_abweichend.satz_prozent')) ? osf('afa_abweichend.begruendung', 'Begründung abweichender AfA', { typ: 'text' }) + osf('afa_abweichend.gueltig_bis_jahr', 'Gültig bis Jahr') : ''}
      </div>
      ${zwei ? `<h3 class="p-zwischentitel">Eigentum und steuerliche Zuordnung</h3>
        <div class="feld-raster">${(p.personen || []).map(pers => osf(`eigentum.anteile_prozent.${pers.id}`, `Eigentumsanteil ${pers.bezeichnung || pers.id}`, { einheit: '%' })).join('')}
          ${osf('eigentum.bestaetigt', 'Anteile ausdrücklich bestätigt', { typ: 'bool' })}
          ${osf('eigentum.kostentraeger_abweichend', 'Darlehensnehmer oder Kostenträger weichen von den Anteilen ab', { typ: 'bool' })}</div>
        ${eig.kostentraeger_abweichend ? `<div class="feld-raster">${(p.personen || []).map(pers => osf(`eigentum.ergebnisanteile_prozent.${pers.id}`, `Ergebnisanteil ${pers.bezeichnung || pers.id}`, { einheit: '%' })).join('')}${osf('eigentum.zuordnung_dokumentation', 'Dokumentation der Zuordnung', { typ: 'text', breit: true })}</div><p class="fine">Eine dokumentierte Zuordnung ist keine steuerliche Anerkennung.</p>` : ''}
        ${!eig.anteile_prozent ? '<button class="btn sm" data-action="p-anteile-5050">Je 50 % annehmen und bestätigen</button>' : ''}` : ''}
      <h3 class="p-zwischentitel">Steuerliche Klärung</h3>
      <div class="feld-raster">${osf('steuerliche_klaerung.verbilligte_vermietung', 'Verbilligte Vermietung oder Vermietung an Angehörige', { typ: 'bool' })}${osf('steuerliche_klaerung.teilweise_eigennutzung', 'Teilweise Eigennutzung', { typ: 'bool' })}${osf('steuerliche_klaerung.einkuenfteerzielungsabsicht_unklar', 'Einkünfteerzielungsabsicht ungeklärt', { typ: 'bool' })}</div>
    </div>
    ${r.kapital ? `<div class="card flush p-ergebnis" style="margin-top:12px"><div class="card-pad"><h3>Kapitalbedarf und Darlehen</h3></div><div class="table-wrap"><table class="t"><tbody>
      ${r.kapital.posten.map(x => `<tr><td>${esc(x.bezeichnung)}</td><td class="num">${x.betrag === null ? '<span class="null">fehlt</span>' : pEur(x.betrag)}</td></tr>`).join('')}
      <tr class="strong"><td>Kapitalbedarf</td><td class="num">${pEur(r.kapital.kapitalbedarf)}</td></tr>
      <tr><td>Eingesetztes Eigenkapital</td><td class="num">${pEur(r.kapital.eigenkapital_eingesetzt ?? r.kapital.eigenkapital_verfuegbar)}</td></tr>
      <tr class="strong"><td>Darlehen</td><td class="num">${pEur(r.kapital.darlehen)}</td></tr>
      ${pIstZahl(r.kapital.notfallreserve) ? `<tr><td>Notfallreserve (bleibt unberührt)</td><td class="num">${pEur(r.kapital.notfallreserve)}</td></tr>` : ''}
      ${r.kapital.finanzierungsluecke ? `<tr><td class="neg">Finanzierungslücke</td><td class="num neg">${pEur(r.kapital.finanzierungsluecke)}</td></tr>` : ''}
    </tbody></table></div>${r.kapital.hinweise.length ? `<p class="fine card-pad">${r.kapital.hinweise.map(esc).join('<br>')}</p>` : ''}</div>` : ''}
  </section>`;
}

function pKonditionen(doc, eingang, r, os) {
  const vergleich = RK.szenario.vergleicheKonditionen(eingang);
  const aktiv = r.kondition ? r.kondition.id : null;
  const zeilen = vergleich.map(v => {
    const x = v.ergebnis, k = x.kpi, ok = x.status.cashflow === 'vollstaendig';
    return `<tr class="${v.id === aktiv ? 'strong' : ''}"><td><button class="linkbtn" data-action="p-kond-aktiv" data-kid="${esc(v.id)}" aria-pressed="${v.id === aktiv}">${v.id === aktiv ? '● ' : '○ '}${esc(v.bezeichnung)}</button><div class="obj-sub">${v.art === 'angebot' ? 'konkretes Angebot' : 'Modellannahme'} · ${v.quelle === 'objekt' ? 'nur dieses Objekt' : 'aus dem Profil'}</div></td>
      <td class="num">${x.kapital && pIstZahl(x.kapital.darlehen) ? pEur(x.kapital.darlehen) : '—'}</td>
      <td class="num">${x.plan ? pEur(x.plan.rate) : '—'}</td>
      <td class="num">${x.plan ? pEur(x.plan.zinsen_bindung) : '—'}</td>
      <td class="num">${x.plan ? pEur(x.plan.tilgung_bindung) : '—'}</td>
      <td class="num">${x.plan ? pEur(x.plan.restschuld_ende_bindung) : '—'}</td>
      <td class="num">${pEur(v.ergebnis.kondition && pIstZahl(v.ergebnis.kondition.gebuehren_eur) ? v.ergebnis.kondition.gebuehren_eur : 0)}</td>
      <td class="num">${ok ? pZuzahlung(k.zuzahlung_vor_steuer_monat) : '—'}</td>
      <td class="num">${ok && pIstZahl(k.zuzahlung_nach_steuer_monat) ? pZuzahlung(k.zuzahlung_nach_steuer_monat) : '—'}</td>
      <td>${x.status.finanzierung === 'vollstaendig' ? '' : '<span class="tag tag-crit">unvollständig</span>'}</td></tr>`;
  }).join('');
  const objektKond = os.konditionen_objekt || [];
  return `<section class="sec p-ergebnis" id="p-konditionen"><h2>Konditionen im Vergleich</h2>
    <p class="card-sub">Gleiche Immobilie, gleiches Profil. Zinsen und Tilgung bis zum Ende der jeweiligen Zinsbindung. Modellannahmen sind keine erhältlichen Finanzierungen.</p>
    ${vergleich.length ? `<div class="card flush"><div class="table-wrap"><table class="t p-kond-tabelle"><thead><tr><th>Kondition</th><th class="num">Darlehen</th><th class="num">Rate</th><th class="num">Zinsen Bindung</th><th class="num">Tilgung Bindung</th><th class="num">Restschuld</th><th class="num">Gebühren</th><th class="num">Zuzahlung vor Steuer</th><th class="num">Ø nach Steuer</th><th></th></tr></thead><tbody>${zeilen}</tbody></table></div></div>` : '<div class="empty"><b>Keine Kondition vorhanden.</b> Lege im Profil allgemeine Konditionen an oder hier ein Objektangebot.</div>'}
    <h3 class="p-zwischentitel">Angebote nur für dieses Objekt</h3>
    ${objektKond.map(k => pKonditionEditor(k, 'objekt')).join('')}
    <button class="btn sm" data-action="p-kond-neu" data-quelle="objekt">Objektangebot hinzufügen</button>
  </section>`;
}

function pHaushalt(r, p) {
  const h = r.haushalt, k = r.kpi || {}, kap = p.kapital || {};
  const bezug = { vor_steuer: 'vor Steuer', nach_steuer: 'nach Steuer', beide: 'vor und nach Steuer' }[kap.grenze_bezug || 'vor_steuer'];
  const cfOk = r.status.cashflow === 'vollstaendig';
  const box = (label, wert, fuss) => `<div class="p-kv"><div class="tile-label">${esc(label)}</div><div class="p-kv-wert">${wert}</div>${fuss ? `<div class="feld-hilfe">${fuss}</div>` : ''}</div>`;
  const fr = r.finanzierungsrahmen;
  return `<section class="sec p-ergebnis" id="p-haushalt"><h2>Haushalt und persönliches Budget</h2>
    <div class="card"><div class="p-kv-raster">
      ${box('Haushaltsüberschuss vor dieser Investition', h.vollstaendig ? pEur(h.ueberschuss) : '<span class="tag tag-warn">unvollständig</span>', h.vollstaendig ? '' : esc('Fehlt: ' + h.fehlend.map(f => f.text).join(', ')))}
      ${box('Selbst gesetzte maximale Zuzahlung', pIstZahl(kap.max_zuzahlung_monat_eur) ? pEur(kap.max_zuzahlung_monat_eur) : '<span class="null">nicht festgelegt</span>', esc(`gilt ${bezug}`))}
      ${box('Zuzahlung dieser Wohnung vor Steuer', cfOk ? pZuzahlung(k.zuzahlung_vor_steuer_monat) : '—', cfOk ? esc(`pro Monat ${k.bezugsjahr}${k.vorsorge_enthalten ? ', inkl. eigener Vorsorge' : ''}`) : '')}
      ${box('Ø Belastung nach modellierter Steuerwirkung', cfOk && pIstZahl(k.zuzahlung_nach_steuer_monat) ? pZuzahlung(k.zuzahlung_nach_steuer_monat) : '—', 'Monatsdurchschnitt; Erstattung erst nach Veranlagung')}
      ${box('Verbleibender Haushaltsüberschuss', cfOk && pIstZahl(k.verbleibendes_haushaltsbudget) ? `<span class="${k.verbleibendes_haushaltsbudget < 0 ? 'neg' : ''}">${pEur(k.verbleibendes_haushaltsbudget)}</span>` : '—', 'nach Zuzahlung vor Steuer')}
      ${box('Liquidität für unregelmäßige Ausgaben', pIstZahl(kap.notfallreserve_eur) ? `Reserve ${pEur(kap.notfallreserve_eur)}` : '<span class="null">Reserve unbekannt</span>', cfOk ? esc(`Bis zur Steuerentlastung vorzufinanzieren: ${pEur(k.vorfinanzierung_bezugsjahr)} im Jahr ${k.bezugsjahr}`) : '')}
    </div></div>
    ${fr ? `<div class="card" style="margin-top:12px"><h3>Rechnerischer Finanzierungsrahmen (Modell)</h3><p class="card-sub">Aus verfügbarem Budget (${pEur(fr.verfuegbar_monat)} / Monat) und der aktiven Kondition. Keine Kreditentscheidung einer Bank, keine Bonitätsbewertung.</p>
      <div class="p-kv-raster">${box('Tragbare Rate', pEur(fr.rate_tragbar))}${box('Rechnerisches Darlehen', pEur(fr.darlehen_max))}${box('Rechnerischer Kaufpreisrahmen', pEur(fr.kaufpreis_max), 'inkl. eingesetztem Eigenkapital und Erwerbsnebenkosten')}</div>
      <ul class="small">${fr.hinweise.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  </section>`;
}

function pSteuer(r, p) {
  if (r.status.cashflow !== 'vollstaendig') return '';
  const s = r.steuer || {};
  const j = (r.jahre || []).find(x => x.jahr === (r.kpi || {}).bezugsjahr) || (r.jahre || [])[0];
  let inhalt = '';
  if (s.modus === 'manuell' && j && j.entlastungen) {
    inhalt = `<div class="table-wrap"><table class="t"><thead><tr><th>Grenzsteuersatz (Modell)</th><th class="num">Steuerliches Ergebnis ${esc(j.jahr)}</th><th class="num">Modellierte Entlastung pro Jahr</th><th class="num">Ø pro Monat</th><th class="num">Zuzahlung nach Steuer</th></tr></thead><tbody>
      ${j.entlastungen.map((x, i) => `<tr${i === 0 ? ' class="strong"' : ''}><td>${pProz(x.satz_prozent)}${i === 0 ? ' (Hauptwert)' : ''}</td><td class="num">${pEur(j.steuer_ergebnis)}</td><td class="num">${pEur(x.entlastung)}</td><td class="num">${pEur(x.entlastung / j.monate)}</td><td class="num">${pZuzahlung(r.kpi.zuzahlung_vor_steuer_monat - x.entlastung / j.monate)}</td></tr>`).join('')}
    </tbody></table></div>`;
  } else if (j && j.steuer_detail) {
    inhalt = `<div class="table-wrap"><table class="t"><thead><tr><th>${esc(j.jahr)}</th><th class="num">zvE vorher</th><th class="num">Anteil Ergebnis</th><th class="num">zvE nachher</th><th class="num">ESt vorher</th><th class="num">ESt nachher</th><th class="num">Entlastung</th></tr></thead><tbody>
      ${j.steuer_detail.personen.map(x => `<tr><td>${esc(x.person === 'gemeinsam' ? 'Zusammenveranlagung (Splitting)' : x.person === 'einzel' ? 'Einzelveranlagung' : x.person)}</td><td class="num">${pEur(x.zve_vorher)}</td><td class="num">${pEur(x.ergebnis_anteil)}</td><td class="num">${pEur(x.zve_nachher)}</td><td class="num">${pEur(x.est_vorher)}</td><td class="num">${pEur(x.est_nachher)}</td><td class="num">${pEur(x.entlastung)}</td></tr>`).join('')}
    </tbody></table></div>${j.steuer_detail.hinweise.length ? `<ul class="small">${j.steuer_detail.hinweise.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}`;
  } else inhalt = '<div class="empty"><b>Steuerwirkung nicht berechenbar.</b> Siehe offene Angaben.</div>';
  const afa = r.afa || {};
  return `<section class="sec p-ergebnis" id="p-steuer"><h2>Steuerwirkung · ${esc((MODI[s.modus] || {}).kurz || 'kein Modus')}</h2>
    <div class="card"><h3>Ergebnis im Bezugsjahr</h3>${inhalt}</div>
    <div class="card" style="margin-top:12px"><h3>AfA</h3><div class="p-kv-raster">
      <div class="p-kv"><div class="tile-label">Anschaffungskosten gesamt</div><div class="p-kv-wert">${pEur(afa.anschaffungskosten)}</div></div>
      <div class="p-kv"><div class="tile-label">Grundstücksanteil (keine AfA)</div><div class="p-kv-wert">${pEur(afa.grundstueck)}</div></div>
      <div class="p-kv"><div class="tile-label">Bemessungsgrundlage Gebäude</div><div class="p-kv-wert">${pEur(afa.bemessung)}</div></div>
      <div class="p-kv"><div class="tile-label">Satz</div><div class="p-kv-wert">${pProz(afa.satz_prozent)}</div><div class="feld-hilfe">${esc(afa.regel || 'Fertigstellungsjahr fehlt')}</div></div>
      <div class="p-kv"><div class="tile-label">Volle Jahres-AfA</div><div class="p-kv-wert">${pEur(afa.voll_jahr)}</div><div class="feld-hilfe">Beginn ${esc(afa.beginn || '–')}, im ersten Jahr zeitanteilig</div></div>
    </div>${afa.anschaffungsnah && afa.anschaffungsnah.geprueft ? `<p class="fine">15-%-Prüfung: ${pEur(afa.anschaffungsnah.summe)} Instandsetzung in drei Jahren, Grenze ${pEur(afa.anschaffungsnah.grenze)} – ${afa.anschaffungsnah.ausgeloest ? 'überschritten (über AfA)' : 'nicht überschritten'}.</p>` : ''}</div>
    ${s.schaetzung ? `<div class="card" style="margin-top:12px"><h3>Überleitung zum geschätzten zvE</h3>${pUeberleitung(s.schaetzung)}</div>` : ''}
    <div class="callout"><b>Grenzen</b><ul>${(s.hinweise || []).map(h => `<li>${esc(h)}</li>`).join('')}<li>Nicht berücksichtigt: ${esc((s.nicht_beruecksichtigt || []).join('; '))}.</li></ul></div>
  </section>`;
}
function pUeberleitung(sch) {
  return `<div class="table-wrap"><table class="t"><tbody>${sch.ueberleitung.map(u => `<tr class="strong"><td colspan="2">${esc(u.bezeichnung)}</td></tr>${u.zeilen.map(z => `<tr><td>${esc(z.posten)}${z.herkunft === 'gesetzlicher_standard' ? ' <span class="tag">gesetzlicher Standardwert</span>' : ''}</td><td class="num">${pEur(z.betrag)}</td></tr>`).join('')}`).join('')}
    ${sch.gemeinsam.map(z => `<tr><td>${esc(z.posten)}${z.herkunft === 'gesetzlicher_standard' ? ' <span class="tag">gesetzlicher Standardwert</span>' : ''}</td><td class="num">${pEur(z.betrag)}</td></tr>`).join('')}
    <tr class="strong"><td>Geschätztes zu versteuerndes Einkommen</td><td class="num">${typeof sch.zve === 'number' ? pEur(sch.zve) : Object.entries(sch.zve).map(([id, z]) => `${esc(id)}: ${pEur(z)}`).join(' · ')}</td></tr></tbody></table></div>`;
}

function pVerlauf(r) {
  if (r.status.cashflow !== 'vollstaendig' || !r.jahre) return '';
  const jahre = r.jahre;
  const startIdx = RK.basis.monatIndex((r.kondition || {}).beginn);
  const bindungEnde = r.plan && r.plan.zinsbindung_monate && startIdx !== null ? RK.basis.monatAusIndex(startIdx + r.plan.zinsbindung_monate - 1).jahr : null;
  const vorsorgeIn = r.kpi.vorsorge_enthalten;
  const reihen = jahre.map(j => ({ jahr: j.jahr, teil: j.teiljahr, vor: -(j.cf_vor_steuer - (vorsorgeIn ? j.vorsorge : 0)) / j.monate, nach: j.entlastung === null ? null : -(j.cf_vor_steuer - (vorsorgeIn ? j.vorsorge : 0) + j.entlastung) / j.monate, rest: j.restschuld }));
  const tabelle = `<div class="table-wrap" style="max-height:70vh"><table class="t p-jahre"><thead><tr><th>Jahr</th><th class="num">Miete + Vorauszahlung</th><th class="num">Fällige Ausgaben</th><th class="num">Zinsen</th><th class="num">Tilgung</th><th class="num">AfA</th><th class="num">Steuerliches Ergebnis</th><th class="num">Steuerwirkung</th><th class="num">Cashflow vor Steuer</th><th class="num">nach Steuer</th><th class="num">Vorsorge</th><th class="num">Restschuld</th><th class="num">Tilgung kumuliert</th></tr></thead><tbody>
    ${jahre.map(j => `<tr class="${j.jahr === bindungEnde ? 'strong' : ''}"><td class="nowrap">${esc(j.jahr)}${j.teiljahr ? ` <span class="tag">${j.monate} Mon.</span>` : ''}${j.jahr === bindungEnde ? ' <span class="tag">Ende Zinsbindung</span>' : ''}</td><td class="num">${pEur(j.einnahmen)}</td><td class="num">${pEur(j.ausgaben_faellig)}</td><td class="num">${pEur(j.zins)}</td><td class="num">${pEur(j.tilgung + j.sondertilgung)}</td><td class="num">${pEur(j.afa)}</td><td class="num">${pEur(j.steuer_ergebnis)}</td><td class="num">${j.entlastung === null ? '—' : pEur(j.entlastung)}</td><td class="num ${j.cf_vor_steuer < 0 ? 'neg' : ''}">${pEur(j.cf_vor_steuer)}</td><td class="num">${j.cf_nach_steuer === null ? '—' : pEur(j.cf_nach_steuer)}</td><td class="num">${pEur(j.vorsorge)}</td><td class="num">${pEur(j.restschuld)}</td><td class="num">${pEur(j.kum_tilgung)}</td></tr>`).join('')}
  </tbody></table></div>`;
  return `<section class="sec p-ergebnis" id="p-verlauf"><h2>Entwicklung über die Jahre</h2>
    <p class="card-sub">Kalenderjahre (Steuerjahre); ein kürzeres erstes Jahr ist gekennzeichnet. Zinsen und Steuerwirkung werden jedes Jahr neu berechnet. Miet- und Kostensteigerung: ${pProz(r.eingaben.mietsteigerung_prozent.wert)} bzw. ${pProz(r.eingaben.kostensteigerung_prozent.wert)} pro Jahr (Annahme).${r.plan && r.plan.hinweise.length ? ' ' + esc(r.plan.hinweise.join(' ')) : ''}</p>
    <div class="grid-2">
      <div class="card"><h3>Monatliche Zuzahlung je Jahr</h3><p class="card-sub">Durchschnitt pro Monat${vorsorgeIn ? ', inkl. eigener Vorsorge' : ''}; positive Werte = Geldbedarf.</p>${chartSlot(w => pSvgLinien(w, reihen), 'Monatliche Zuzahlung vor und nach Steuer je Jahr')}
        <div class="chart-legend"><span><svg width="18" height="10" viewBox="0 0 18 10"><line x1="1" y1="5" x2="17" y2="5" style="stroke:var(--c-blue);stroke-width:2"/></svg>vor Steuer</span><span><svg width="18" height="10" viewBox="0 0 18 10"><line x1="1" y1="5" x2="17" y2="5" style="stroke:var(--c-orange);stroke-width:2"/></svg>nach modellierter Steuerwirkung</span></div></div>
      <div class="card"><h3>Restschuld zum Jahresende</h3><p class="card-sub">Annuitätenrechnung, keine lineare Näherung.</p>${chartSlot(w => pSvgBalken(w, reihen), 'Restschuld zum Jahresende')}</div>
    </div>
    <div class="card flush" style="margin-top:12px">${tabelle}</div>
  </section>`;
}

function pSvgLinien(w, reihen) {
  const h = 260, m = { l: 58, r: 16, t: 14, b: 32 };
  const werte = reihen.flatMap(x => [x.vor, x.nach]).filter(pIstZahl).concat(0);
  const yt = niceTicks(Math.min(...werte), Math.max(...werte), 5);
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const n = reihen.length;
  const sx = i => m.l + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  const sy = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let s = svgOpen(w, h);
  for (const t of yt.ticks) s += `<line class="grid" x1="${m.l}" x2="${w - m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="tick" x="${m.l - 8}" y="${sy(t) + 4}" text-anchor="end">${minus(nf0.format(t))}</text>`;
  s += `<line class="axis" x1="${m.l}" x2="${w - m.r}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  const schritt = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 48))));
  reihen.forEach((x, i) => { if (i % schritt === 0 || i === n - 1) s += `<text class="tick" x="${sx(i)}" y="${h - 10}" text-anchor="middle">${x.jahr}</text>`; });
  for (const [feld, farbe] of [['vor', 'var(--c-blue)'], ['nach', 'var(--c-orange)']]) {
    const punkte = reihen.map((x, i) => pIstZahl(x[feld]) ? [sx(i), sy(x[feld])] : null);
    let d = '', offen = false;
