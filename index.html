<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immobilienbewertung Viewer</title>
<meta name="description" content="Lokaler Viewer für JSON-Exporte nach Schema 1.0 (Immobilien-Linkanalyse Master-Prompt V3.1): Einzelansicht, Vergleich und Exportprüfung.">
<style>
:root {
  color-scheme: light;
  --page: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --surface-3: #e6e5df;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --line: #e1e0d9;
  --line-2: #c3c2b7;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, .10);
  --s-good: #0ca30c;
  --s-warn: #fab219;
  --s-serious: #ec835a;
  --s-crit: #d03b3b;
  --crit-ink: #b02a2a;
  --good-ink: #006300;
  --warn-ink: #7a5000;
  --c-blue: #2a78d6;
  --c-orange: #eb6834;
  --c-yellow: #eda100;
  --c-green: #008300;
  --c-violet: #6250d6;
  --pos: #2a78d6;
  --neg: #e34948;
  --range: #86b6ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 10px rgba(0, 0, 0, .035);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --surface-3: #2e2e2b;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --line: #2c2c2a;
    --line-2: #44443f;
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-wash: rgba(57, 135, 229, .16);
    --crit-ink: #f08a8a;
    --good-ink: #4cc44c;
    --warn-ink: #f5c04a;
    --c-blue: #3987e5;
    --c-orange: #d95926;
    --c-yellow: #c98500;
    --c-green: #008300;
    --c-violet: #9085e9;
    --pos: #3987e5;
    --neg: #e66767;
    --range: #1c5cab;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --surface-3: #2e2e2b;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --line: #2c2c2a;
  --line-2: #44443f;
  --accent: #3987e5;
  --accent-ink: #86b6ef;
  --accent-wash: rgba(57, 135, 229, .16);
  --crit-ink: #f08a8a;
  --good-ink: #4cc44c;
  --warn-ink: #f5c04a;
  --c-blue: #3987e5;
  --c-orange: #d95926;
  --c-yellow: #c98500;
  --c-green: #008300;
  --c-violet: #9085e9;
  --pos: #3987e5;
  --neg: #e66767;
  --range: #1c5cab;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
code { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3 { letter-spacing: -.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }

/* ---------- Grundlayout ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 52px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.brand .light { font-weight: 500; color: var(--ink-2); }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.sidebar {
  position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); height: calc(100vh - 52px - env(safe-area-inset-top, 0px)); overflow: auto;
  display: flex; flex-direction: column; gap: 12px; padding: 14px;
  background: var(--surface); border-right: 1px solid var(--line);
}
.main { padding: 24px clamp(16px, 3vw, 36px) 72px; min-width: 0; }
/* Vergleich nutzt die volle Breite (breite Tabelle), Einzelansicht bleibt lesbar begrenzt und mittig */
.view { max-width: 1600px; margin-inline: auto; }
.view-compare { max-width: none; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--surface);
  font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; font-size: 13px; }
.linkbtn:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
body.hosted .needs-print, body.hosted .needs-theme, body.no-downloads .needs-download { display: none !important; }

/* ---------- Sidebar ---------- */
.side-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.side-actions .btn { padding: 0 6px; }
.side-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 6px 4px 0; }
.doclist { display: flex; flex-direction: column; gap: 2px; }
.navitem, .docitem {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: 8px; border: 0; background: transparent;
  text-align: left; cursor: pointer;
}
.navitem { align-items: center; font-weight: 600; }
.navitem .count { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface-3); border-radius: 999px; padding: 0 8px; }
.navitem:hover, .docitem:hover { background: var(--surface-2); }
.navitem.active, .docitem.active { background: var(--accent-wash); }
.docitem .vdot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--vc); }
.docitem.old { opacity: .62; }
.di-main { min-width: 0; flex: 1; }
.di-title { font-weight: 500; font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.di-sub { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.di-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.icon-btn { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.side-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.notice { font-size: 12px; color: var(--crit-ink); }

/* ---------- Chips, Tags, Badges ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
}
button.tag { cursor: pointer; }
.tag-crit { border-color: color-mix(in srgb, var(--s-crit) 45%, transparent); color: var(--crit-ink); background: color-mix(in srgb, var(--s-crit) 9%, var(--surface)); }
.tag-warn { border-color: color-mix(in srgb, var(--s-warn) 60%, transparent); color: var(--warn-ink); background: color-mix(in srgb, var(--s-warn) 12%, var(--surface)); }
.tag-good { border-color: color-mix(in srgb, var(--s-good) 45%, transparent); color: var(--good-ink); background: color-mix(in srgb, var(--s-good) 9%, var(--surface)); }
.st {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; vertical-align: 1px;
}
.st:hover { border-color: var(--line-2); color: var(--ink); }
.st i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--st); }
.st.compact { width: 18px; padding: 0; justify-content: center; border-color: transparent; background: transparent; }
.st.compact:hover { background: var(--surface-3); }
.st-inseratsangabe { --st: var(--c-yellow); }
.st-dokumentiert { --st: var(--c-blue); }
.st-unabhaengig_bestaetigt { --st: var(--c-green); }
.st-berechnet { --st: var(--c-violet); }
.st-annahme { --st: var(--c-orange); }
.st-widerspruechlich { --st: var(--s-crit); }
.st-nicht_anwendbar { --st: var(--line-2); }
.st-unbekannt i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.ref {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink);
  font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace; cursor: pointer;
}
.ref:hover { border-color: var(--accent); }
.ref.broken { color: var(--crit-ink); border-color: color-mix(in srgb, var(--s-crit) 50%, transparent); text-decoration: line-through; }
.refs { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; }
.id { font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-2); background: var(--surface-3); padding: 3px 6px; border-radius: 5px; }

.verdict { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.verdict .vi { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--vc); color: #fff; font-size: 12px; font-weight: 700; }
.verdict.big { font-size: 22px; gap: 10px; line-height: 1.25; }
.verdict.big .vi { width: 32px; height: 32px; font-size: 17px; }
.verdict.sm { font-size: 12.5px; font-weight: 500; gap: 6px; }
.verdict.sm .vi { width: 16px; height: 16px; font-size: 10px; }
.v-good { --vc: var(--s-good); }
.v-warn { --vc: var(--s-warn); }
.v-warn .vi { color: #3a2a00; }
.v-serious { --vc: var(--s-serious); }
.v-crit { --vc: var(--s-crit); }
.v-none { --vc: var(--muted); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.sev i { width: 9px; height: 9px; border-radius: 2px; background: var(--vc); }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; vertical-align: -1px; }
.meter i { width: 4px; border-radius: 1px; background: var(--surface-3); }
.meter i:nth-child(1) { height: 6px; }
.meter i:nth-child(2) { height: 9px; }
.meter i:nth-child(3) { height: 12px; }
.meter.m1 i:nth-child(1), .meter.m2 i:nth-child(-n+2), .meter.m3 i { background: var(--accent); }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.null { color: var(--muted); }
.scen { font-size: 12px; color: var(--ink-2); font-style: italic; border-bottom: 1px dotted var(--line-2); cursor: help; }
.neg { color: var(--crit-ink); }

/* ---------- Karten & Sektionen ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .card-sub { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-2); }
.sec { margin-top: 32px; scroll-margin-top: 112px; }
.sec > h2 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: 26px; }
.sub { margin: 2px 0 0; color: var(--ink-2); }
.eyebrow { font-size: 11.5px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.callout { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.empty { padding: 16px 18px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--ink-2); font-size: 13.5px; }
.empty b { color: var(--ink); font-weight: 600; }

/* ---------- Detail-Kopf ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.crumbs .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.dh-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 8px; }
.dh-main { min-width: 0; flex: 1 1 520px; }
.dh-main h1 { margin: 0; font-size: 25px; line-height: 1.25; }
.num { color: var(--muted); font-weight: 500; }
.dh-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.meta { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; }
.meta .muted { font-size: 11.5px; }
.revnote { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; font-size: 13px; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.subnav {
  position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 20;
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  margin: 18px calc(-1 * clamp(16px, 3vw, 36px)) 0; padding: 8px clamp(16px, 3vw, 36px);
  background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.subnav::-webkit-scrollbar { display: none; }
.subnav button { flex: none; border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.subnav button:hover { background: var(--surface-3); color: var(--ink); }

/* ---------- Urteil ---------- */
.verdict-card { border-top: 4px solid var(--vc); }
.vc-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start; }
.vc-head .eyebrow { margin-bottom: 6px; }
.lead { font-size: 15px; line-height: 1.55; margin: 14px 0 0; max-width: 78ch; }
.teil-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; margin-top: 18px; }
.teil { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.teil-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.teil-title { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.teil-urteil { font-weight: 600; line-height: 1.35; }
.teil-text { margin: 0; font-size: 13px; color: var(--ink-2); }
.open-points { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.open-points ol { margin: 6px 0 0; padding-left: 20px; }
.open-points li { margin: 3px 0; }

/* ---------- Kennzahlen-Kacheln ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 188px), 1fr)); gap: 10px; margin-top: 14px; }
.tiles.stats { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-height: 98px; box-shadow: var(--shadow); }
.tile-label { font-size: 12.5px; color: var(--ink-2); }
.tile-value { font-size: 21px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.tile-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.stat .tile-value { font-size: 28px; }

/* ---------- Schlüssel/Wert-Listen ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 0 28px; margin: 0; }
.kv-row { display: grid; grid-template-columns: minmax(110px, 44%) 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.kv-row dt { color: var(--ink-2); font-size: 13px; }
.kv-row dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.kv-row.long { grid-column: 1 / -1; grid-template-columns: 1fr; gap: 3px; }
.kv-row.long dd { display: block; }
.kv-row.long dd p { margin: 0 0 4px; max-width: 90ch; }
.kv-row.long dd ul { margin: 0; padding-left: 18px; }
.kv-title { font-size: 13px; font-weight: 600; margin: 18px 0 2px; color: var(--ink); }
.kv-title:first-child { margin-top: 0; }

/* ---------- Tabellen ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th, .t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.t thead th { font-weight: 600; color: var(--ink-2); font-size: 12px; background: var(--surface-2); white-space: nowrap; }
.t tbody tr:last-child td { border-bottom: 0; }
.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t .nowrap { white-space: nowrap; }
.t tr.clickable { cursor: pointer; }
.t tr.clickable:hover td { background: var(--accent-wash); }
.t tr.excluded td { color: var(--muted); }
.t tr.strong td { font-weight: 600; }
.t th.sortable { cursor: pointer; user-select: none; }
.t th.sortable:hover { color: var(--ink); }
.t th .arrow { color: var(--accent); }
.t td.cell-obj { min-width: 200px; }
.t .obj-title { font-weight: 600; line-height: 1.35; }
.t .obj-sub { font-size: 12px; color: var(--ink-2); }
.t .scen { display: block; font-size: 11.5px; }
.cmp-table th:first-child, .cmp-table td:first-child { width: 34px; padding-right: 0; }
.cmp-table thead th, .cmp-table thead th.num { white-space: normal; vertical-align: bottom; line-height: 1.3; }
.cmp-table td.cell-urteil { min-width: 150px; }
.cmp-table th, .cmp-table td { padding-left: 8px; padding-right: 8px; }
/* Zusätze wie „strittig · W1“ oder Szenariowerte brechen in eine zweite Zeile um, statt die Spalte zu verbreitern */
.cmp-table td.num { white-space: normal; }
.cmp-table td.num .val { white-space: nowrap; }
.cmp-table .scen { white-space: normal; }
/* Objektspalte bleibt beim seitlichen Scrollen auf schmaleren Bildschirmen stehen */
.cmp-table td.cell-obj, .cmp-table thead th:nth-child(3) { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
.cmp-table td.cell-obj { background: var(--surface); }
.cmp-table thead th:nth-child(3) { background: var(--surface-2); }
.cmp-table tr.clickable:hover td.cell-obj { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.cmp-table .verdict.sm { align-items: flex-start; }
.cmp-table .verdict.sm .vi { margin-top: 1px; }

/* Gegenüberstellung */
.matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.matrix th, .matrix td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 190px; }
.matrix thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; vertical-align: bottom; }
.matrix th.rowhead { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 170px; max-width: 220px; font-weight: 500; color: var(--ink-2); }
.matrix thead th.rowhead { background: var(--surface-2); z-index: 3; }
.matrix tr.group th { background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.matrix tr.diff th.rowhead::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--s-warn); margin-right: 6px; vertical-align: 2px; }
.matrix td .val { font-variant-numeric: tabular-nums; }
.mh-title { font-weight: 600; color: var(--ink); line-height: 1.3; }
.mh-title button { text-align: left; }

/* ---------- Listen: Widersprüche, Risiken, Schritte ---------- */
.item { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface); box-shadow: var(--shadow); scroll-margin-top: 120px; }
.item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.item-head .title { font-weight: 600; }
details.item > summary { cursor: pointer; list-style: none; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::before { content: "▸"; color: var(--muted); display: inline-block; width: 12px; transition: transform .15s; }
details.item[open] > summary::before { transform: rotate(90deg); }
details.item .kr { margin-left: auto; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.callout.warn { background: color-mix(in srgb, var(--s-warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--s-warn) 55%, transparent); }
.item p { margin: 8px 0 0; max-width: 95ch; }
.item .lbl { color: var(--ink-2); font-size: 12.5px; }
.item .t { margin-top: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.step-prio { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-weight: 700; }
.step-prio.p2 { background: var(--ink-2); }
.step-prio.p3, .step-prio.p4, .step-prio.p5 { background: var(--surface-3); color: var(--ink); }
.step dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 13px; }
.step dt { color: var(--ink-2); }
.step dd { margin: 0; }

/* Energieskala */
.escale { margin-top: 14px; }
.escale-bar { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; position: relative; }
.escale-bar span { height: 26px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--fg); background: var(--bg); border-radius: 3px; opacity: .55; }
.escale-bar span:first-child { border-radius: 6px 3px 3px 6px; }
.escale-bar span:last-child { border-radius: 3px 6px 6px 3px; }
.escale-bar span.on { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
.escale-marker { position: relative; height: 26px; margin-top: 4px; font-size: 11.5px; color: var(--ink-2); }
.escale-marker i { position: absolute; top: 0; width: 2px; height: 9px; background: var(--ink); transform: translateX(-1px); }
.escale-marker b { position: absolute; top: 10px; transform: translateX(-50%); white-space: nowrap; font-weight: 500; }
.escale-ticks { display: grid; grid-template-columns: repeat(9, 1fr); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* Prüfung */
.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issue { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: baseline; font-size: 13px; }
.issue .ico { font-weight: 700; text-align: center; }
.issue.error .ico { color: var(--crit-ink); }
.issue.warn .ico { color: var(--warn-ink); }
.issue.info .ico { color: var(--accent-ink); }
.issue code { margin-right: 6px; }
.flags { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.flag { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
.flag b { width: 20px; text-align: center; }
.issue-btn.error { color: var(--crit-ink); }
.issue-btn.warn { color: var(--warn-ink); }
.issue-btn.ok { color: var(--good-ink); }

/* Rohdaten */
details.raw summary { cursor: pointer; font-weight: 600; }
details.raw pre { margin: 12px 0 0; padding: 14px; max-height: 560px; overflow: auto; background: var(--surface-2); border-radius: 8px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; }

/* Vergleich: Reiter, Ortsfilter, Preisübersicht, Auswahl */
.cmp-tabs { display: flex; gap: 2px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.cmp-tabs::-webkit-scrollbar { display: none; }
.cmp-tab { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.cmp-tab:hover { color: var(--ink); }
.cmp-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.cmp-tab .count { font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface-3); border-radius: 999px; padding: 0 7px; }
.ort-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 14px; }
.ort-filter .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-right: 4px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; cursor: pointer; }
.chip-btn:hover { background: var(--surface-2); }
.chip-btn .n { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip-btn.on .n { color: rgba(255, 255, 255, .8); }
.price-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(380px, 2fr); gap: 14px; align-items: start; }
.card-pad { padding: 16px 18px 4px; }
.t.vals td.num { white-space: normal; }
.t.vals td.num .val { white-space: nowrap; }
.t.vals .scen { white-space: normal; }
.pick-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 8px; }
.pick-item { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 13px; }
.pick-item:hover { background: var(--surface-2); }
.pick-item.on { border-color: var(--accent); background: var(--accent-wash); }
.pick-item input { margin-top: 2px; }
.pick-text { display: flex; flex-direction: column; min-width: 0; }
.pick-title { font-weight: 600; line-height: 1.35; }
.pick-sub { font-size: 12px; color: var(--ink-2); }
@media (max-width: 1300px) { .price-grid { grid-template-columns: minmax(0, 1fr); } }

/* Filter */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 12px; }
.filters input[type="search"], .filters select { height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 10px; font-size: 13.5px; }
.filters input[type="search"] { flex: 1 1 260px; min-width: 0; }

/* ---------- Diagramme ---------- */
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--ink-2); font-size: 11.5px; }
.chart .lbl { fill: var(--ink); font-size: 12px; }
.chart .lbl2 { fill: var(--ink-2); font-size: 11.5px; }
.chart .val { fill: var(--ink); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chart .dot { fill: var(--c-blue); stroke: var(--surface); stroke-width: 2; }
.chart .dot.hollow { fill: var(--surface); stroke: var(--c-blue); stroke-width: 2; }
.chart .dot.excl { fill: var(--muted); opacity: .7; }
.chart .subject { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.chart .rangeline { stroke: var(--c-blue); stroke-width: 2; stroke-linecap: round; opacity: .55; }
.chart .rangeline.ink { stroke: var(--ink); }
.chart .rangebox { fill: var(--accent-wash); }
.chart .range-bar { fill: var(--range); }
.chart .marker { stroke: var(--ink); stroke-width: 1.5; }
.chart .refline { stroke: var(--ink); stroke-width: 1; opacity: .3; }
.chart .dot.limit { fill: var(--c-orange); }
.chart .bar-pos { fill: var(--pos); }
.chart .bar-neg { fill: var(--neg); }
.chart .hit { fill: transparent; stroke: transparent; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend svg { flex: none; }
.chart-note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }

/* ---------- Startseite ---------- */
.start { max-width: 920px; margin: 4vh auto 0; }
.drop { text-align: center; padding: 44px 24px; border: 2px dashed var(--line-2); border-radius: 18px; background: var(--surface); cursor: pointer; }
.drop:hover { border-color: var(--accent); }
.drop svg { width: 46px; height: 46px; color: var(--accent); }
.drop h1 { font-size: 24px; margin: 12px 0 6px; }
.drop p { margin: 0 auto; max-width: 60ch; color: var(--ink-2); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0 14px; }
.fine { font-size: 12.5px; color: var(--ink-2); }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; margin-top: 18px; }
.feature { padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.feature b { display: block; margin-bottom: 4px; }
.feature p { margin: 0; font-size: 13px; color: var(--ink-2); }
.flow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; font-size: 13px; color: var(--ink-2); }
.flow span.box { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }

/* ---------- Overlays ---------- */
.drop-overlay { position: fixed; inset: 0; z-index: 200; display: none; place-items: center; background: color-mix(in srgb, var(--accent) 12%, transparent); backdrop-filter: blur(2px); }
body.dragging .drop-overlay { display: grid; }
.drop-overlay div { padding: 28px 40px; border: 2px dashed var(--accent); border-radius: 16px; background: var(--surface); font-weight: 600; font-size: 18px; pointer-events: none; }
.tooltip { position: fixed; z-index: 300; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 7px; max-width: 340px; white-space: pre-line; opacity: 0; transition: opacity .08s; }
.tooltip.show { opacity: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(680px, calc(100vw - 32px)); max-height: min(84vh, 800px); box-shadow: 0 24px 70px rgba(0, 0, 0, .28); }
dialog::backdrop { background: rgba(10, 10, 10, .38); }
.dlg { padding: 20px 22px 22px; }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.dlg-head h3 { margin: 0; font-size: 17px; }
.dlg dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
.dlg dt { color: var(--ink-2); }
.dlg dd { margin: 0; overflow-wrap: anywhere; }
.dlg textarea { width: 100%; min-height: 260px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; }
.dlg .sublist { margin: 0; padding-left: 18px; }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .doclist { max-height: 260px; overflow: auto; }
  .side-foot { margin-top: 0; }
  .brand .light { display: none; }
}
@media (max-width: 1000px) {
  .tiles.stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .tiles, .tiles.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tiles.stats .tile:first-child { grid-column: 1 / -1; min-height: 0; }
  .cmp-table td.cell-obj, .cmp-table thead th:nth-child(3) { position: static; box-shadow: none; }
  .cmp-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cmp-tab { justify-content: center; text-align: center; white-space: normal; padding: 9px 6px; font-size: 13px; line-height: 1.25; }
  .tile { min-height: 84px; padding: 10px 12px; }
  .tile-value { font-size: 17px; }
  .stat .tile-value { font-size: 24px; }
  .verdict.big { font-size: 19px; }
  .dh-main h1, .page-head h1 { font-size: 21px; }
}
@media print {
  .topbar, .sidebar, .subnav, .no-print, .dh-actions, details.raw { display: none !important; }
  .layout { display: block; }
  body { background: #fff; }
  .main { padding: 0; }
  .card, .item, .tile { box-shadow: none; break-inside: avoid; }
}
</style>

<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-5.5h6V21"/></svg>
    <span>Immobilienbewertung <span class="light">Viewer · Schema 1.0</span></span>
  </div>
  <button class="btn ghost sm needs-theme" data-action="theme" id="themeBtn" title="Farbschema wechseln">◐ <span id="themeLabel">Auto</span></button>
</header>
<div class="layout">

</div>
<input type="file" id="fileInput" accept=".json,application/json" multiple hidden>

<script>
'use strict';

/* =====================================================================
   Datenvertrag Schema 1.0 (Master-Prompt V3.1, Abschnitt 14)
   ===================================================================== */
const TOP_KEYS = ['schema_version', 'metadaten', 'angebot', 'standort', 'objekt', 'energie', 'weg', 'ist_kosten_und_ertraege', 'kennzahlen', 'preisbewertung', 'annahmen', 'szenarien', 'vergleichsobjekte', 'widersprueche', 'risiken', 'fehlende_unterlagen', 'naechste_schritte', 'bewertung', 'datenbelege', 'quellen', 'exportpruefung'];

const CORE = {
  metadaten: ['bericht_id', 'pruefdatum', 'exportdatum', 'zeitzone', 'waehrung', 'prueftiefe', 'analysestatus', 'nutzungsfokus', 'nutzungsfokus_grundlage', 'einschraenkungen'],
  angebot: ['url', 'plattform', 'plattform_id', 'anbieter_objektnummer', 'einheit', 'titel', 'angebotsart', 'objektart', 'zugriffsstatus', 'verfuegbarkeit', 'verfuegbarkeit_stand'],
  standort: ['land', 'bundesland', 'ort', 'stadtteil', 'postleitzahl', 'strasse', 'hausnummer', 'adressgenauigkeit', 'lageeinschaetzung'],
  objekt: ['kaufpreis_eur', 'verpflichtende_zusatzkaeufe_eur', 'wohnflaeche_m2', 'zimmer', 'etage', 'baujahr', 'aufzug', 'balkon_oder_terrasse', 'vermietungsstatus', 'innenfotos_geprueft', 'grundriss_geprueft', 'zustandseinschaetzung'],
  energie: ['ausweisart', 'ausgestellt_am', 'gueltig_bis', 'verbrauchszeitraum_von', 'verbrauchszeitraum_bis', 'kennwert_kwh_m2_a', 'effizienzklasse', 'energietraeger', 'heizungsjahr'],
  weg: ['anzahl_einheiten', 'ruecklage_gesamt_eur', 'ruecklage_gesamt_stichtag', 'ruecklage_zuordnung_wohnung_eur', 'ruecklage_zuordnung_stichtag', 'ruecklagenzufuehrung_wohnung_monat_eur', 'sonderumlage_beschlossen_wohnung_eur', 'sanierungsplanung'],
  ist_kosten_und_ertraege: ['nettokaltmiete_monat_eur', 'nettokaltmiete_jahr_eur', 'betriebskostenvorauszahlung_monat_eur', 'hausgeld_monat_eur', 'hausgeld_umlagefaehig_monat_eur', 'hausgeld_nicht_umlagefaehig_ohne_ruecklage_monat_eur', 'kaeuferprovision_prozent', 'grunderwerbsteuer_prozent', 'notar_grundbuch_eur', 'anfaengliche_massnahmen_eur'],
  kennzahlen: ['kaufpreis_pro_m2_eur', 'nettokaltmiete_pro_m2_eur', 'bruttomietrendite_prozent', 'kaufpreisfaktor_jahre', 'gesamtinvestition_eur', 'bruttorendite_auf_gesamtinvestition_prozent', 'wirtschaftliche_nettorendite_vor_finanzierung_steuern_prozent'],
  preisbewertung: ['aussagebasis', 'marktwertspanne_eur', 'angebotsvergleichsspanne_eur', 'einschaetzung'],
  bewertung: ['gesamturteil', 'begruendung', 'belegsicherheit', 'objektqualitaet', 'preisangemessenheit', 'wirtschaftlichkeit', 'persoenliche_eignung', 'entscheidende_offene_punkte'],
  exportpruefung: ['json_syntax_geprueft', 'schema_geprueft', 'referenzen_geprueft', 'berichtskonsistenz_geprueft', 'hinweise'],
};
const TEILURTEILE = [['objektqualitaet', 'Objektqualität'], ['preisangemessenheit', 'Preisangemessenheit'], ['wirtschaftlichkeit', 'Wirtschaftlichkeit'], ['persoenliche_eignung', 'Persönliche Eignung']];
const SICHERHEIT = ['hoch', 'mittel', 'niedrig', 'nicht_bewertbar'];
const VERDICT_ORDER = ['weiter_pruefen', 'nur_zu_anderen_konditionen_interessant', 'bis_zur_klaerung_zurueckstellen', 'fuer_das_ziel_verwerfen', 'nicht_bewertbar'];

const ENUM_PATHS = {
  '/metadaten/analysestatus': ['vorlage', 'vorlaeufig', 'eingeschraenkt', 'kein_zugriff'],
  '/metadaten/nutzungsfokus': ['kapitalanlage', 'eigennutzung', 'angehoerigenvermietung', 'miete', 'offen'],
  '/angebot/angebotsart': ['kauf', 'miete', 'sonstiges', 'unbekannt'],
  '/angebot/zugriffsstatus': ['vollstaendig', 'teilweise', 'nur_suchindex_oder_archiv', 'nicht_erreichbar', 'nicht_geprueft'],
  '/angebot/verfuegbarkeit': ['angeboten', 'reserviert', 'verkauft', 'vermietet', 'unklar'],
  '/standort/adressgenauigkeit': ['hausgenau', 'strasse', 'stadtteil', 'ort', 'unbekannt'],
  '/objekt/vermietungsstatus': ['vermietet', 'leer', 'eigengenutzt', 'teilweise_vermietet', 'unbekannt'],
  '/energie/ausweisart': ['bedarf', 'verbrauch', 'unbekannt'],
  '/energie/effizienzklasse': ['A+', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', null],
  '/preisbewertung/aussagebasis': ['transaktionen', 'angebotsvergleich', 'gemischt', 'unzureichend'],
  '/bewertung/gesamturteil': VERDICT_ORDER,
  '/bewertung/belegsicherheit': SICHERHEIT,
};
for (const [k] of TEILURTEILE) ENUM_PATHS[`/bewertung/${k}/belegsicherheit`] = SICHERHEIT;

const ARRAYS = {
  annahmen: { prefix: 'A', keys: ['id', 'parameter', 'wert', 'einheit', 'begruendung', 'quellen_ids'] },
  szenarien: { prefix: 'S', keys: ['id', 'bezeichnung', 'typ', 'annahme_ids', 'rechnung', 'einordnung'], enums: { typ: ['basis', 'belastung', 'guenstig', 'zielrendite', 'alternativflaeche', 'sonstiges'] } },

    case 'eur_monat': return eur(v) + NB + '€/Monat';
    case 'eur_jahr': return eur(v) + NB + '€/Jahr';
    case 'm2': return minus(nfA.format(v)) + NB + 'm²';
    case 'pct': return minus(nf2.format(v)) + NB + '%';
    case 'jahre': return minus(nfA.format(v)) + NB + (v === 1 ? 'Jahr' : 'Jahre');

const KEY_RESULTS = ['cashflow_monat_vor_steuern_eur', 'zahlungsgrenze_eur', 'kaufpreis_pro_m2_eur', 'gesamtinvestition_eur'];
/** Wichtigstes Ergebnis eines Szenarios für Übersicht und Kartenkopf. */

function offerTag(data) {

const fmtAxis = v => (Math.abs(v) >= 1e6 ? nf1.format(v / 1e6) + ' Mio.' : Math.abs(v) >= 1e4 ? nf0.format(v / 1e3) + ' Tsd.' : minus(nfA.format(v)));

/* =====================================================================
   Zustand
   ===================================================================== */
const state = {
  docs: [],
  view: 'start',
  current: null,
  selected: new Set(),
  selectionTouched: false,
  sort: { col: 'num', dir: 1 },
  filter: { q: '', urteil: '', showOld: false, orte: new Set() },
  cmpTab: 'tabelle',
  diffOnly: false,
  persist: true,
  saveError: null,
};
let uidCounter = 0;
let numCounter = 0;
const LS = { docs: 'immoviewer.v1.docs', persist: 'immoviewer.v1.persist', theme: 'immoviewer.v1.theme', cmpTab: 'immoviewer.v1.cmptab' };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch { /* ignorieren */ } };

const immoDocs = () => state.docs.filter(d => d.isImmo);
const getDoc = uid => state.docs.find(d => d.uid === uid);
const urteilOf = d => obj(obj(d.data).bewertung).gesamturteil;

function docTitle(d) {

function docPlace(d) {

function objectKey(data) {

/* =====================================================================
   Laden
   ===================================================================== */
async function addFiles(files) {
  const items = [];
  for (const f of files) {
    if (!/\.json$/i.test(f.name) && f.type !== 'application/json') continue;
    try { items.push({ name: f.name, text: await f.text() }); }
    catch (e) { items.push({ name: f.name, text: '', error: 'Datei konnte nicht gelesen werden: ' + e.message }); }
  }
  if (!items.length) { toast('Keine JSON-Dateien gefunden.'); return; }
  addTexts(items);
}

function addTexts(items, { silent = false } = {}) {
  const added = [];
  for (const it of items) {
    if (it.error) { added.push(addDoc(it.name, it.text, null, it.error)); continue; }
    let parsed, err = null;
    try { parsed = JSON.parse(it.text.replace(/^﻿/, '')); } catch (e) { err = 'JSON-Syntaxfehler: ' + e.message; }
    if (!err && Array.isArray(parsed) && parsed.length && parsed.every(x => isObj(x) && ('schema_version' in x || 'metadaten' in x))) {
      parsed.forEach((x, i) => added.push(addDoc(`${it.name} [${i + 1}]`, JSON.stringify(x, null, 2), x, null)));
      continue;
    }
    added.push(addDoc(it.name, it.text, parsed, err));
  }
  const fresh = added.filter(Boolean);
  computeGroups();
  if (!silent) {
    const immo = fresh.filter(d => d.isImmo);
    if (fresh.length === 1) { state.view = 'detail'; state.current = fresh[0].uid; }
    else if (immoDocs().length > 1) state.view = 'compare';
    else if (fresh.length) { state.view = 'detail'; state.current = (immo[0] || fresh[0]).uid; }
    const dup = items.length - fresh.length;
    toast(`${fresh.length} Datei${fresh.length === 1 ? '' : 'en'} geladen${dup > 0 ? ` · ${dup} bereits vorhanden` : ''}`);
    save();
    render();
    window.scrollTo(0, 0);
  }
  return fresh;
}

function addDoc(name, text, data, err) {
  const hash = hashStr(text || name);
  if (state.docs.some(d => d.hash === hash)) return null;
  const doc = { uid: 'd' + (++uidCounter), fileName: name, text: text || '', hash, data: err ? null : data, parseError: err };
  analyze(doc);
  if (doc.isImmo) doc.num = ++numCounter;
  state.docs.push(doc);
  return doc;
}

function analyze(doc) {
  doc.isImmo = false;
  if (doc.parseError) { doc.issues = [{ lvl: 'error', path: '', msg: doc.parseError }]; return; }
  const d = doc.data;
  if (!isObj(d) || (!('schema_version' in d) && !('metadaten' in d) && !('angebot' in d))) {
    doc.issues = [{ lvl: 'error', path: '', msg: 'Keine Immobilienbewertung nach Schema 1.0 (weder schema_version noch metadaten/angebot gefunden).' }];
    return;
  }
  doc.isImmo = true;
  doc.ctx = buildCtx(d);
  doc.issues = validate(d, doc.ctx);
  doc.key = objectKey(d) || doc.uid;
}

function computeGroups() {
  const groups = new Map();
  for (const d of immoDocs()) {
    if (!groups.has(d.key)) groups.set(d.key, []);
    groups.get(d.key).push(d);
  }
  const stamp = d => { const m = obj(d.data.metadaten); return `${m.exportdatum || ''}|${m.pruefdatum || ''}|${d.fileName}`; };
  for (const list of groups.values()) {
    list.sort((a, b) => stamp(b).localeCompare(stamp(a)));
    list.forEach((d, i) => { d.rev = { index: list.length - i, total: list.length, latest: i === 0, group: list }; });
  }
  const valid = new Set(immoDocs().map(d => d.uid));
  for (const u of [...state.selected]) if (!valid.has(u)) state.selected.delete(u);
}

function removeDoc(uid) {
  state.docs = state.docs.filter(d => d.uid !== uid);
  state.selected.delete(uid);
  computeGroups();
  if (!state.docs.length) state.view = 'start';
  else if (state.view === 'detail' && state.current === uid) state.view = immoDocs().length > 1 ? 'compare' : 'detail', state.current = (immoDocs()[0] || state.docs[0]).uid;
  save();
  render();
}

function save() {
  if (!state.persist) { lsDel(LS.docs); state.saveError = null; return; }
  const ok = lsSet(LS.docs, JSON.stringify(state.docs.filter(d => d.text).map(d => ({ name: d.fileName, text: d.text }))));
  state.saveError = ok ? null : 'Speichern im Browser nicht möglich (Speicher voll oder gesperrt).';
}

function restore() {
  state.persist = lsGet(LS.persist) !== '0';
  state.cmpTab = lsGet(LS.cmpTab) || 'tabelle';
  const raw = lsGet(LS.docs);
  if (!raw || !state.persist) return;
  try {
    const items = JSON.parse(raw);
    if (Array.isArray(items) && items.length) {
      addTexts(items.filter(x => x && typeof x.text === 'string'), { silent: true });
      state.view = immoDocs().length > 1 ? 'compare' : 'detail';
      state.current = (immoDocs()[0] || state.docs[0] || {}).uid;
      if (!state.docs.length) state.view = 'start';
    }
  } catch { /* defekter Speicherinhalt wird ignoriert */ }
}

async function loadFromQuery() {
  const srcs = new URLSearchParams(location.search).getAll('src');
  if (!srcs.length || location.protocol === 'file:') return;
  const items = [];
  for (const s of srcs) {
    const name = decodeURIComponent(s.split('/').pop() || s);
    try {
      const r = await fetch(s);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      items.push({ name, text: await r.text() });
    } catch (e) { items.push({ name, text: '', error: `Laden von ${s} fehlgeschlagen: ${e.message}` }); }
  }
  addTexts(items);
}

async function filesFromDataTransfer(dt) {
  const entries = [...(dt.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...(dt.files || [])];
  const out = [];
  async function walkEntry(en) {
    if (en.isFile) out.push(await new Promise((res, rej) => en.file(res, rej)));
    else if (en.isDirectory) {
      const reader = en.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const c of batch) await walkEntry(c);
      } while (batch.length);
    }
  }
  for (const en of entries) await walkEntry(en);
  return out;
}

/* =====================================================================
   Kontext & Prüfung
   ===================================================================== */
function buildCtx(data) {
  const list = k => arr(data[k]).filter(isObj);
  const byId = k => new Map(list(k).filter(x => typeof x.id === 'string').map(x => [x.id, x]));
  const belege = new Map();
  for (const b of list('datenbelege')) if (typeof b.feldpfad === 'string' && !belege.has(b.feldpfad)) belege.set(b.feldpfad, b);
  const conflicts = new Map();
  for (const w of list('widersprueche')) if (w.status !== 'aufgeloest' && typeof w.feldpfad === 'string') conflicts.set(w.feldpfad, w);
  const scen = new Map();
  arr(data.szenarien).forEach((s, si) => {
    if (!isObj(s)) return;
    arr(s.rechnung).forEach((r, ri) => {
      if (!isObj(r) || !isNum(r.wert) || typeof r.kennzahl !== 'string') return;
      const kz = canonKz(r.kennzahl);
      if (!scen.has(kz)) scen.set(kz, []);
      scen.get(kz).push({ value: r.wert, unit: r.einheit, s, path: `/szenarien/${si}/rechnung/${ri}/wert` });
    });
  });
  return { list, quellen: byId('quellen'), annahmen: byId('annahmen'), risiken: byId('risiken'), unterlagen: byId('fehlende_unterlagen'), szenarien: byId('szenarien'), widersprueche: byId('widersprueche'), belege, conflicts, scen };
}

function walk(node, path, fn) {
  if (Array.isArray(node)) node.forEach((v, i) => { const p = `${path}/${i}`; fn(null, v, p, node); walk(v, p, fn); });
  else if (isObj(node)) for (const [k, v] of Object.entries(node)) { const p = `${path}/${ptrKey(k)}`; fn(k, v, p, node); walk(v, p, fn); }
}

function validate(data, ctx) {
  const out = [];
  const E = (path, msg) => out.push({ lvl: 'error', path, msg });
  const W = (path, msg) => out.push({ lvl: 'warn', path, msg });
  const I = (path, msg) => out.push({ lvl: 'info', path, msg });
  const ids = { quellen: new Set(ctx.quellen.keys()), annahmen: new Set(ctx.annahmen.keys()), risiken: new Set(ctx.risiken.keys()), fehlende_unterlagen: new Set(ctx.unterlagen.keys()) };
  let refErrors = 0;

  // Struktur
  if (data.schema_version !== '1.0') W('/schema_version', `Schema-Version ${JSON.stringify(data.schema_version ?? null)} statt "1.0".`);
  for (const k of TOP_KEYS) if (!(k in data)) E('/' + k, 'Hauptschlüssel fehlt.');
  for (const k of Object.keys(data)) if (!TOP_KEYS.includes(k)) I('/' + ptrKey(k), 'Zusätzlicher Schlüssel außerhalb des Datenvertrags.');
  for (const [sec, keys] of Object.entries(CORE)) {
    if (!(sec in data)) continue;
    if (!isObj(data[sec])) { E('/' + sec, 'Muss ein Objekt sein.'); continue; }
    for (const k of keys) if (!(k in data[sec])) W(`/${sec}/${k}`, 'Schlüssel der Kernstruktur fehlt.');
  }
  for (const [k] of TEILURTEILE) {
    const t = obj(data.bewertung)[k];
    if (t !== undefined && !isObj(t)) E(`/bewertung/${k}`, 'Teilurteil muss ein Objekt {urteil, begruendung, belegsicherheit} sein.');
    else if (isObj(t)) for (const kk of ['urteil', 'begruendung', 'belegsicherheit']) if (!(kk in t)) W(`/bewertung/${k}/${kk}`, 'Schlüssel fehlt.');
  }
  for (const [p, allowed] of Object.entries(ENUM_PATHS)) {
    const r = resolvePointer(data, p);
    if (!r.found) continue;
    if (!allowed.includes(r.value)) E(p, `Unzulässiger Wert ${JSON.stringify(r.value)}. Erlaubt: ${allowed.map(v => v === null ? 'null' : v).join(' | ')}.`);
  }

  // Arrays
  for (const [name, spec] of Object.entries(ARRAYS)) {
    if (!(name in data)) continue;
    if (!Array.isArray(data[name])) { E('/' + name, 'Muss ein Array sein.'); continue; }
    const seen = new Set();
    data[name].forEach((it, i) => {
      const p = `/${name}/${i}`;
      if (!isObj(it)) { E(p, 'Eintrag muss ein Objekt sein.'); return; }
      for (const k of spec.keys) if (!(k in it)) W(`${p}/${k}`, 'Pflichtschlüssel des Eintrags fehlt.');
      if (spec.prefix) {
        if (typeof it.id !== 'string' || !new RegExp(`^${spec.prefix}[0-9]+$`).test(it.id)) E(`${p}/id`, `ID ${JSON.stringify(it.id)} entspricht nicht dem Muster ${spec.prefix}1, ${spec.prefix}2 …`);
        else if (seen.has(it.id)) E(`${p}/id`, `ID ${it.id} ist doppelt vergeben.`);
        seen.add(it.id);
      } else if (name === 'datenbelege' && typeof it.feldpfad === 'string') {
        if (seen.has(it.feldpfad)) W(`${p}/feldpfad`, `Mehrere Datenbelege für ${it.feldpfad} – höchstens ein zusammengeführter Eintrag pro Feld.`);
        seen.add(it.feldpfad);
      }
      for (const [k, allowed] of Object.entries(spec.enums || {})) if (k in it && !allowed.includes(it[k])) E(`${p}/${k}`, `Unzulässiger Wert ${JSON.stringify(it[k])}. Erlaubt: ${allowed.join(' | ')}.`);
      for (const [nk, ns] of Object.entries(NESTED)) {
        if (!(nk in it)) continue;
        if (!Array.isArray(it[nk])) { E(`${p}/${nk}`, 'Muss ein Array sein.'); continue; }
        it[nk].forEach((sub, j) => {
          const sp = `${p}/${nk}/${j}`;
          if (!isObj(sub)) { E(sp, 'Eintrag muss ein Objekt sein.'); return; }
          for (const k of ns.keys) if (!(k in sub)) W(`${sp}/${k}`, 'Pflichtschlüssel fehlt.');
          for (const [k, allowed] of Object.entries(ns.enums || {})) if (k in sub && !allowed.includes(sub[k])) E(`${sp}/${k}`, `Unzulässiger Wert ${JSON.stringify(sub[k])}.`);
          if (nk === 'rechnung') {
            if (sub.wert !== null && sub.wert !== undefined && !isNum(sub.wert)) E(`${sp}/wert`, `Zahl oder null erwartet, gefunden ${JSON.stringify(sub.wert)}.`);
            if (sub.rolle === 'ergebnis' && !sub.formel) I(`${sp}/formel`, 'Ergebnis ohne Formel.');
            if (typeof sub.kennzahl === 'string' && /_prozent$/.test(sub.kennzahl) && isNum(sub.wert) && sub.wert !== 0 && Math.abs(sub.wert) < 0.2) W(`${sp}/wert`, 'Prozentwert sehr klein – evtl. als Anteil (0,045) statt Prozent (4,5) gespeichert?');
          }
        });
      }
    });
  }

  // Feldweise Typ-, Datums-, Verweis- und Pfadprüfung
  walk(data, '', (k, v, p, parent) => {
    if (k === null) return;
    const inArrayItem = /\/\d+\/[^/]+$/.test(p);
    if ((NUM_RE.test(k) || NUM_KEYS.has(k)) && !RANGE_RE.test(k)) {
      if (v !== null && !isNum(v)) {
        const hint = typeof v === 'string' && /^(null|unbekannt|-|–|n\/a|k\.?\s?a\.?)$/i.test(v.trim()) ? ' Platzhaltertext statt null.' : typeof v === 'string' && /\d/.test(v) ? ' Formatierte Zahl als Text (ohne Währungszeichen, Tausenderpunkte, Prozentzeichen speichern).' : '';
        E(p, `Zahl oder null erwartet, gefunden ${JSON.stringify(v)}.${hint}`);
      } else if (/_prozent$/.test(k) && isNum(v) && v !== 0 && Math.abs(v) < 0.2) {
        W(p, `Prozentwert ${String(v).replace('.', ',')} sehr klein – evtl. als Anteil statt Prozent gespeichert (4,5 bedeutet 4,5 %)?`);
      }
    }
    if (k === 'prioritaet' && v !== null && !Number.isInteger(v)) E(p, 'Ganzzahl erwartet (1 = höchste Priorität).');
    if (STRING_ID_KEYS.has(k) && typeof v === 'number') E(p, `Identifikator muss Zeichenkette sein, gefunden Zahl ${v}.`);
    if (DATE_RE.test(k) && v !== null && v !== undefined && !isValidDate(v)) E(p, `Datum im Format YYYY-MM-DD oder null erwartet, gefunden ${JSON.stringify(v)}.`);
    if (BOOL_KEYS.has(k) && v !== null && typeof v !== 'boolean') E(p, `true, false oder null erwartet, gefunden ${JSON.stringify(v)}.`);
    if (RANGE_RE.test(k) && v !== null && v !== undefined) {
      if (!isRange(v)) E(p, 'Spanne als Objekt {"min": Zahl, "max": Zahl} oder null erwartet.');
      else if (v.min > v.max) E(p, `Spanne ungültig: min (${fmtNum(v.min, 'eur')}) ist größer als max (${fmtNum(v.max, 'eur')}).`);
    }
    if (REF_KEYS[k]) {
      if (!Array.isArray(v)) E(p, 'Array von IDs erwartet.');
      else v.forEach((id, i) => { if (!ids[REF_KEYS[k]].has(id)) { refErrors++; E(`${p}/${i}`, `Verweis ${JSON.stringify(id)} zeigt ins Leere (kein Eintrag in ${REF_KEYS[k]}).`); } });
    }
    if (k === 'feldpfad' && inArrayItem) {
      if (typeof v !== 'string' || v[0] !== '/') E(p, 'JSON-Pointer muss mit "/" beginnen.');
      else if (!resolvePointer(data, v).found) { refErrors++; E(p, `Feldpfad ${v} existiert im Export nicht.`); }
    }
    if (k === 'eingabe_pfade' && Array.isArray(v)) v.forEach((ep, i) => {
      if (typeof ep !== 'string' || !resolvePointer(data, ep).found) { refErrors++; E(`${p}/${i}`, `Eingabepfad ${JSON.stringify(ep)} existiert im Export nicht.`); }
    });
    if (k === 'url' && v !== null && v !== undefined && !safeUrl(v)) E(p, `Keine gültige http(s)-URL: ${JSON.stringify(trunc(v, 60))} (z. B. Chat-interner Zitationsmarker?).`);
  });

  // Inhaltliche Regeln des Prompts

  if (pb.marktwertspanne_eur && pb.aussagebasis === 'angebotsvergleich') I('/preisbewertung/marktwertspanne_eur', 'Marktwertspanne nur auf Angebotsvergleich gestützt – darf nicht allein auf einem unbereinigten Angebotsdurchschnitt beruhen.');

const chartFns = new Map();
let chartSeq = 0;

function niceTicks(a, b, n = 5) {
  if (!(b > a)) { const d = Math.abs(a) * 0.1 || 1; a -= d; b += d; }
  const raw = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f >= 7.5 ? 10 : f >= 3.5 ? 5 : f >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(a / step) * step, hi = Math.ceil(b / step) * step;
  const ticks = [];
  for (let i = 0; lo + i * step <= hi + step * 1e-6; i++) ticks.push(Math.round((lo + i * step) / step) * step);
  return { lo, hi, step, ticks };
}
/** Anzahl Achsenwerte nach verfügbarer Breite, damit Beschriftungen nicht kollidieren. */
const tickCount = (px, labelPx = 72) => Math.max(2, Math.min(6, Math.floor(px / labelPx)));
const pad = (a, b, f = 0.08) => { const s = (b - a) || Math.abs(a) * 0.1 || 1; return [a - s * f, b + s * f]; };
const svgOpen = (w, h) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
function hbarPath(x0, x1, y, h, r = 4) {
  const len = Math.abs(x1 - x0); r = Math.min(r, len / 2, h / 2);
  if (len < 0.5) return '';
  if (x1 >= x0) return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
  return `M${x0},${y}H${x1 + r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 + r},${y + h}H${x0}Z`;
}

/** Streudiagramm Kaufpreis/m² gegen Bruttomietrendite (Vergleich). */
function svgScatter(w, pts) {
  const h = Math.round(Math.min(480, Math.max(320, w * 0.3))), m = { l: 58, r: 34, t: 30, b: 46 };
  const xs = pts.flatMap(p => p.x), ys = pts.flatMap(p => p.y);
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const xt = niceTicks(x0, x1, tickCount(iw, 64)), yt = niceTicks(Math.max(0, y0), y1, 5);
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  const sy = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let s = svgOpen(w, h);
  s += `<text class="axis-title" x="${m.l}" y="14">Bruttomietrendite (%)</text>`;
  for (const t of yt.ticks) s += `<line class="grid" x1="${m.l}" x2="${w - m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="tick" x="${m.l - 8}" y="${sy(t) + 4}" text-anchor="end">${nf1.format(t)}</text>`;
  for (const t of xt.ticks) s += `<text class="tick" x="${sx(t)}" y="${m.t + ih + 18}" text-anchor="middle">${nf0.format(t)}</text>`;
  s += `<line class="axis" x1="${m.l}" x2="${w - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<text class="axis-title" x="${m.l + iw / 2}" y="${h - 6}" text-anchor="middle">Kaufpreis pro m² (€)</text>`;
  for (const p of pts) {
    const ax = [Math.min(...p.x), Math.max(...p.x)].map(sx), ay = [Math.min(...p.y), Math.max(...p.y)].map(sy);
    const ranged = ax[0] !== ax[1] || ay[0] !== ay[1];
    if (ranged && ax[0] !== ax[1] && ay[0] !== ay[1]) s += `<rect class="rangebox" x="${ax[0]}" y="${ay[1]}" width="${ax[1] - ax[0]}" height="${ay[0] - ay[1]}" rx="4"/>`;
    else if (ranged) s += `<line class="rangeline" x1="${ax[0]}" x2="${ax[1]}" y1="${ay[0]}" y2="${ay[1]}"/>`;
    const marks = ranged ? [[ax[0], ay[0]], [ax[1], ay[1]]] : [[ax[0], ay[0]]];
    for (const [cx, cy] of marks) s += `<circle class="dot${p.hollow ? ' hollow' : ''}" cx="${cx}" cy="${cy}" r="5.5"/>`;
    const lx = Math.max(...marks.map(mk => mk[0])), ly = Math.min(...marks.map(mk => mk[1]));
    const right = lx < w - m.r - 30;
    s += `<text class="lbl" x="${right ? lx + 9 : lx - 9}" y="${ly - 7}" text-anchor="${right ? 'start' : 'end'}">#${p.num}</text>`;
    for (const [cx, cy] of marks) s += `<circle class="hit" cx="${cx}" cy="${cy}" r="13" data-tip="${esc(p.tip)}" data-action="open" data-uid="${p.uid}" style="cursor:pointer"/>`;
  }
  return s + '</svg>';
}

/** Preis-Einordnung: Kaufpreis, Wertspannen und renditeabhängige Zahlungsgrenzen auf einer EUR-Achse. */
function svgPriceMap(w, rows, ref) {
  const rowH = 34, m = { l: Math.min(230, w * 0.38), r: w < 520 ? 84 : 128, t: 8, b: 34 };

  const [a, b] = pad(Math.min(...vals), Math.max(...vals), 0.08);

  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${fmtAxis(t)}</text>`;
  if (ref != null) s += `<line class="refline" x1="${sx(ref)}" x2="${sx(ref)}" y1="${m.t}" y2="${h - m.b}"/>`;
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="${r.style === 'subject' ? 'lbl' : 'lbl2'}" x="${m.l - 12}" y="${cy + 4}" text-anchor="end"${r.style === 'subject' ? ' font-weight="600"' : ''}>${esc(trunc(r.label, Math.max(16, Math.floor(m.l / 6.6))))}</text>`;
    const x0 = sx(r.min), x1 = sx(r.max);
    if (r.kind === 'range') s += `<rect class="range-bar" x="${x0}" y="${cy - 7}" width="${Math.max(4, x1 - x0)}" height="14" rx="4"/>`;
    else if (r.style === 'subject') s += `<rect class="subject" x="${x0 - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x0} ${cy})"/>`;
    else s += `<circle class="dot limit" cx="${x0}" cy="${cy}" r="5.5"/>`;
    const txt = r.kind === 'range' ? `${fmtAxis(r.min)}–${fmtAxis(r.max)}` : fmtNum(r.min, 'eur');
    s += `<text class="val" x="${x1 + 10}" y="${cy + 4}">${esc(txt)}</text>`;
    s += `<rect class="hit" x="${x0 - 10}" y="${cy - 13}" width="${Math.max(20, x1 - x0 + 20)}" height="26" data-tip="${esc(r.tip)}"/>`;
  });
  return s + '</svg>';
}

/** Punktdiagramm Preis pro m²: dieses Objekt und Vergleichsobjekte. */
function svgDots(w, rows) {
  const rowH = 30, m = { l: Math.min(190, w * 0.36), r: 70, t: 10, b: 34 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.flatMap(r => r.values);
  const [a, b] = pad(Math.min(...vals), Math.max(...vals), 0.1);
  const iw = w - m.l - m.r;
  const xt = niceTicks(a, b, tickCount(iw, 56));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${nf0.format(t)}</text>`;
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    s += `<text class="${r.style === 'subject' ? 'lbl' : 'lbl2'}" x="${m.l - 12}" y="${cy + 4}" text-anchor="end"${r.style === 'subject' ? ' font-weight="600"' : ''}>${esc(r.label)}</text>`;
    const xs = r.values.map(sx);
    if (xs.length > 1) s += `<line class="rangeline${r.style === 'subject' ? ' ink' : ''}" x1="${Math.min(...xs)}" x2="${Math.max(...xs)}" y1="${cy}" y2="${cy}"/>`;
    for (const x of xs) {
      if (r.style === 'subject') s += `<rect class="subject" x="${x - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x} ${cy})"/>`;
      else if (r.style === 'ausgeschlossen') s += `<path class="marker" d="M${x - 4},${cy - 4}L${x + 4},${cy + 4}M${x + 4},${cy - 4}L${x - 4},${cy + 4}" style="stroke:var(--muted);stroke-width:2"/>`;
      else s += `<circle class="dot${r.style === 'eingeschraenkt' ? ' hollow' : ''}" cx="${x}" cy="${cy}" r="5.5"/>`;
    }
    const maxX = Math.max(...xs);
    s += `<text class="val" x="${maxX + 10}" y="${cy + 4}">${esc(r.values.length > 1 ? nf0.format(Math.min(...r.values)) + '–' + nf0.format(Math.max(...r.values)) : nf0.format(r.values[0]))}</text>`;
    s += `<rect class="hit" x="${Math.min(...xs) - 10}" y="${cy - 12}" width="${maxX - Math.min(...xs) + 20}" height="24" data-tip="${esc(r.tip)}"/>`;
  });
  return s + '</svg>';
}

/** Cashflow je Szenario, divergierend um 0. */
function svgCashflow(w, rows) {
  const rowH = 36, bh = 16, m = { l: Math.min(240, w * 0.42), r: 74, t: 8, b: 32 };
  const h = m.t + rows.length * rowH + m.b;
  const vals = rows.map(r => r.value);
  const iw = w - m.l - m.r;
  const xt = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), tickCount(iw, 56));
  const sx = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * iw;
  let s = svgOpen(w, h);
  for (const t of xt.ticks) s += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${h - m.b}"/><text class="tick" x="${sx(t)}" y="${h - m.b + 18}" text-anchor="middle">${minus(nf0.format(t))}</text>`;
  rows.forEach((r, i) => {
    const y = m.t + i * rowH + (rowH - bh) / 2;
    s += `<text class="lbl2" x="${m.l - 12}" y="${y + 12}" text-anchor="end">${esc(trunc(r.label, Math.max(18, Math.floor(m.l / 7))))}</text>`;
    s += `<path class="${r.value < 0 ? 'bar-neg' : 'bar-pos'}" d="${hbarPath(sx(0), sx(r.value), y, bh)}"/>`;
    const x = sx(r.value), left = r.value < 0;
    s += `<text class="val" x="${left ? x - 8 : x + 8}" y="${y + 12}" text-anchor="${left ? 'end' : 'start'}">${esc(fmtNum(r.value, 'eur'))}</text>`;
    s += `<rect class="hit" x="${Math.min(sx(0), x) - 4}" y="${y - 8}" width="${Math.abs(x - sx(0)) + 8}" height="${bh + 16}" data-tip="${esc(r.tip)}"/>`;
  });
  s += `<line class="axis" x1="${sx(0)}" x2="${sx(0)}" y1="${m.t}" y2="${h - m.b}"/>`;
  return s + '</svg>';
}
const legendDot = (cls, shape = 'circle') => `<svg width="14" height="14" viewBox="0 0 14 14">${shape === 'diamond' ? '<rect x="3" y="3" width="8" height="8" transform="rotate(45 7 7)" style="fill:var(--ink)"/>' : shape === 'x' ? '<path d="M3,3L11,11M11,3L3,11" style="stroke:var(--muted);stroke-width:2"/>' : `<circle cx="7" cy="7" r="5" class="${cls}" style="${cls === 'hollow' ? 'fill:var(--surface);stroke:var(--c-blue);stroke-width:2' : 'fill:var(--c-blue)'}"/>`}</svg>`;

function tile(doc, path, label) {
  const key = lastKey(path);
  const r = resolvePointer(doc.data, path);
  const v = r.found ? r.value : null;
  let main, sub = '';
  if (v === null || v === undefined) {
    main = '<span class="null">—</span>';
    const w = doc.ctx.conflicts.get(path), sc = scenRange(doc, key);
    const na = doc.ctx.belege.get(path)?.status === 'nicht_anwendbar';
    sub = (w ? `<button class="tag tag-crit" data-action="ref" data-uid="${doc.uid}" data-id="${esc(w.id)}">strittig · ${esc(w.id)}</button>` : sc || na ? '' : '<span class="muted">nicht bestimmt</span>')
      + (sc ? ` <span class="scen" data-tip="${esc(sc.tip)}">Szenario: ${esc(sc.text)}</span>` : '');
  } else main = `<span class="${typeof v === 'number' && v < 0 ? 'neg' : ''}">${esc(fmtValue(key, v))}</span>`;
  return `<div class="tile"><div class="tile-label">${esc(label)}</div><div class="tile-value">${main}</div><div class="tile-foot">${sub}${belegChip(doc, path)}</div></div>`;
}

function energyScale(e, pruefdatum) {
